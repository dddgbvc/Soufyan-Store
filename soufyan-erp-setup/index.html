/* ==========================================================================
   14.a) Supabase — عميل مصغّر بلا SDK
   --------------------------------------------------------------------------
   لا مكتبة ولا خطوة بناء: ثلاثة مسارات فقط من واجهة Supabase العلنية —
   `rpc` لدوال قاعدة البيانات، و`fn` لدوال الحافة، و`auth` لتوثيق البريد.
   المفتاح المستعمل هو المفتاح العلني (anon) وحده؛ مفتاح الخدمة لا يوجد في
   الواجهة ولا يجوز أن يوجد.
   ========================================================================== */
const Sb = {
  ready(){ return !!(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey); },
  _base(){ return String(CONFIG.supabaseUrl || "").replace(/\/+$/, ""); },
  _headers(token, extra){
    return Object.assign({
      "Content-Type"  : "application/json",
      "apikey"        : CONFIG.supabaseAnonKey,
      "Authorization" : "Bearer " + (token || CONFIG.supabaseAnonKey),
      // يقرأه `request_client_info()` على الخادم فيُنسب الطلب إلى هذا الجهاز.
      "x-terminal-id" : Terminal.id()
    }, extra || {});
  },
  /** خطأ موحّد: code واحد تقرؤه الواجهة، بلا تسريب تفاصيل الخادم للمستخدم. */
  _err(code, status, detail){
    const e = new Error(code); e.code = code; e.status = status || 0; e.detail = detail || ""; return e;
  },
  /** رسالة الخادم التقنية تُلتقط للترجمة، ولا تُعرض للمستخدم كما هي. */
  _detail(data){
    if(!data) return "";
    return String(data.error_code || data.msg || data.error_description || data.message || data.error || "");
  },
  async send(method, path, body, token){
    if(!this.ready()) throw this._err("config");
    const url = /^https?:/.test(path) ? path : this._base() + path;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.requestTimeout);
    let res;
    try{
      res = await fetch(url, { method, headers:this._headers(token),
        body: body === undefined ? undefined : JSON.stringify(body), signal:ctrl.signal });
    }catch(_){
      throw this._err("offline");            // شبكة مقطوعة أو مهلة — ليست رفضًا من الخادم
    }finally{ clearTimeout(timer); }
    let data = null;
    try{ data = await res.json(); }catch(_){ }
    if(res.status === 429) throw this._err("rate", 429, this._detail(data));
    if(res.status === 401 || res.status === 403) throw this._err("unauthorized", res.status, this._detail(data));
    if(!res.ok) throw this._err("server", res.status, this._detail(data));
    return data;
  },
  _send(url, body, token){ return this.send("POST", url, body, token); },
  /** دالة قاعدة بيانات عبر PostgREST. */
  rpc(fn, args, token){ return this._send(this._base() + "/rest/v1/rpc/" + fn, args || {}, token); },
  /** دالة حافة. */
  fn(slug, body, token){ return this._send(this._base() + "/functions/v1/" + slug, body || {}, token); },
  /** توثيق البريد (GoTrue). */
  auth(path, body){ return this._send(this._base() + "/auth/v1/" + path, body || {}); },
  /** قراءة صف واحد للمستخدم الموثَّق نفسه — تحكمها سياسات RLS لا الواجهة. */
  async select(path, token){
    if(!this.ready()) throw this._err("config");
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.requestTimeout);
    let res;
    try{ res = await fetch(this._base() + "/rest/v1/" + path, { headers:this._headers(token), signal:ctrl.signal }); }
    catch(_){ throw this._err("offline"); }
    finally{ clearTimeout(timer); }
    if(res.status === 401 || res.status === 403) throw this._err("unauthorized", res.status);
    if(!res.ok) throw this._err("server", res.status);
    return res.json().catch(() => null);
  }
};

/* ==========================================================================
   14.b) Terminal — هوية الجهاز (لا هوية المستخدم)
   --------------------------------------------------------------------------
   الخادم يسجّل جلسات التشغيل لكل جهاز ويحدّ المحاولات به.
   لذلك يحتاج معرّفًا ثابتًا للجهاز — وهو ليس سرًّا ولا يمنح أي صلاحية.
   ========================================================================== */
const Terminal = {
  key:"soufyan.erp.terminal.v1",
  _id:null,
  id(){
    if(this._id) return this._id;
    let v = null;
    try{ v = localStorage.getItem(this.key); }catch(_){ }
    if(!v || v.length < 8){
      v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : "t-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try{ localStorage.setItem(this.key, v); }catch(_){ }
    }
    this._id = v; return v;
  },
  os(){
    const u = navigator.userAgent;
    if(/Windows NT 10/.test(u)) return "Windows 10/11";
    if(/Windows/.test(u)) return "Windows";
    if(/Android/.test(u)) return "Android";
    if(/iPhone|iPad|iPod/.test(u)) return "iOS";
    if(/Mac OS X/.test(u)) return "macOS";
    if(/Linux/.test(u)) return "Linux";
    return "";
  },
  browser(){
    const u = navigator.userAgent;
    if(/Edg\//.test(u)) return "Edge";
    if(/OPR\//.test(u)) return "Opera";
    if(/Chrome\//.test(u)) return "Chrome";
    if(/Firefox\//.test(u)) return "Firefox";
    if(/Safari\//.test(u)) return "Safari";
    return "";
  },
  name(){ return [this.browser(), this.os()].filter(Boolean).join(" · ") || t("deviceUnknown"); },
  /** جهاز جديد = لم يسبق أن نجحت عليه جلسة. يُستعمل للنبرة لا للحماية. */
  isNew(){ try{ return !localStorage.getItem("soufyan.erp.terminal.seen"); }catch(_){ return true; } },
  markSeen(){ try{ localStorage.setItem("soufyan.erp.terminal.seen", nowISO()); }catch(_){ } }
};

/* ==========================================================================
   14.c) AuthService — توثيق حقيقي عبر Supabase Auth
   --------------------------------------------------------------------------
   طريق واحد للدخول: **بريد وكلمة مرور**، ومعه استرجاعها حين تُنسى. لا مقارنة
   في المتصفح ولا `isLoggedIn = true`؛ كل سؤال يُطرح على الخادم وحده:

     الدخول        →  POST /auth/v1/token?grant_type=password
     نسيت كلمتي    →  POST /auth/v1/recover      (الرسالة عبر خطّاف auth-email)
     كلمة مرور جديدة→ PUT  /auth/v1/user         (برمز الاسترجاع الذي عاد بالرابط)
     الهوية والدور →  GET  /rest/v1/profiles     (تحكمها RLS بجلسة المستخدم نفسه)

   جلسة التشغيل على هذا الجهاز تُفتح بعدها في `app_sessions` لتُسجَّل مثل غيرها.
   ========================================================================== */
const AuthService = {
  /** ما تدعمه هذه البيئة فعلًا — يُسأل عنه ولا يُفترض. */
  caps(){
    return {
      configured : Sb.ready(),
      reason     : !Sb.ready() ? "config" : ""
    };
  },

  /* ---- الدخول ---- */
  async passwordLogin(email, password){
    let r;
    try{
      r = await Sb.auth("token?grant_type=password",
        { email: String(email).trim().toLowerCase(), password: String(password) });
    }catch(e){
      throw Sb._err(this._loginCode(e), e.status, e.detail);
    }
    if(!r || !r.access_token || !r.user) throw Sb._err("badLogin");
    return this._identify(r);
  },
  /** رسائل GoTrue تُترجَم إلى سبب واحد تعرفه الواجهة — بلا تسريب نصّ الخادم. */
  _loginCode(e){
    const d = String(e.detail || "").toLowerCase();
    if(e.code === "rate") return "rate";
    if(d.includes("email_not_confirmed") || d.includes("not confirmed")) return "unconfirmed";
    if(d.includes("invalid_credentials") || d.includes("invalid login") || d.includes("invalid_grant")) return "badLogin";
    if(e.code === "unauthorized" || e.status === 400) return "badLogin";
    return e.code || "server";
  },

  /**
   * الهوية بعد التوثيق تُقرأ من قاعدة البيانات بجلسة المستخدم نفسه، فتحكمها RLS.
   * الدور مصدره الخادم، وما في الواجهة مرآة لعرض الأقسام لا لمنعها.
   */
  async _identify(r){
    let profile = null;
    try{
      const rows = await Sb.select(
        "profiles?select=id,display_name,full_name,role,status&id=eq." + encodeURIComponent(r.user.id) + "&limit=1",
        r.access_token);
      profile = Array.isArray(rows) ? rows[0] : null;
    }catch(_){ }
    if(profile && profile.status && profile.status !== "active") throw Sb._err("disabled");
    const role = (profile && profile.role) || "";
    // جلسة تشغيل على هذا الجهاز — تُسجَّل ويُنبَض عليها، وهي ما يُستأنف بعد التحديث.
    let sessionId = null;
    try{
      sessionId = await Sb.rpc("app_session_start", {
        p_terminal_id: Terminal.id(), p_platform:"web", p_app_version: CONFIG.appVersion,
        p_device_name: Terminal.name(), p_os: Terminal.os(), p_meta:{ source:"password" }
      });
    }catch(_){ }
    return {
      method:"password",
      sessionId: typeof sessionId === "string" ? sessionId : null,
      token: r.access_token,
      employee:{
        id: r.user.id,
        name: (profile && (profile.display_name || profile.full_name)) || r.user.email || "",
        role, email: r.user.email || ""
      },
      permissions: PERMISSIONS_FOR(role)
    };
  },

  /* ---- نسيت كلمة المرور ---- */
  /**
   * الردّ محايد دائمًا ولا يقول إن كان البريد مسجّلًا أو لا: كشف ذلك يمنح من
   * يجرّب عناوين قائمةً بمن يملك حسابًا. وهذا ما يفعله الخادم أصلًا (200 دائمًا).
   */
  async recover(email){
    const to = CONFIG.recoveryRedirect || (location.origin + location.pathname);
    await Sb.auth("recover?redirect_to=" + encodeURIComponent(to),
      { email: String(email).trim().toLowerCase() });
    return { ok:true };
  },
  /** رمز الاسترجاع الذي عاد مع الرابط هو ما يأذن بتغيير كلمة المرور. */
  async updatePassword(token, password){
    const r = await Sb.send("PUT", "/auth/v1/user", { password: String(password) }, token);
    if(!r || !r.id) throw Sb._err("server");
    return { user:r };
  },
  /** بعد تغيير كلمة المرور نملك رمزًا صالحًا، فالدخول يكتمل بلا طلب ثانٍ. */
  async sessionFromToken(token, user){
    return this._identify({ access_token: token, user });
  },

  /** من صاحب رمز الاسترجاع؟ يُسأل الخادم قبل عرض شاشة كلمة المرور الجديدة. */
  async me(token){ return Sb.send("GET", "/auth/v1/user", undefined, token); },

  /* ---- إنهاء الجلسة على الخادم ---- */
  async endSession(sessionId, reason){
    if(!sessionId) return;
    try{ await Sb.rpc("app_session_end", { p_session_id: sessionId, p_reason: reason || "logout" }); }catch(_){ }
  },
  async ping(sessionId){
    const r = await Sb.rpc("app_session_ping", { p_session_id: sessionId });
    return !!(r && r.ok === true);
  }
};

/**
 * مرآة `permissions_for(role)` في قاعدة البيانات — تُستعمل لعرض الأقسام فقط.
 * مصدر الحقيقة هو الخادم: RLS والدوال هي التي تمنع أو تسمح، والواجهة تُخفي
 * ما لا يخصّ المستخدم لتريحه لا لتحميه.
 */
const PERMISSION_MATRIX = {
  ADMIN  : ["dashboard","pos","returns","inventory","shortages","vaults","customers","analytics","settings","repairs","expenses","purchases"],
  MANAGER: ["dashboard","pos","returns","customers","inventory","shortages","analytics","purchases"],
  CASHIER: ["pos"]
};
const PERMISSIONS_FOR = role => PERMISSION_MATRIX[String(role || "").toUpperCase()] || PERMISSION_MATRIX.CASHIER;

/* ==========================================================================
   14.d) AuthSession — «موثَّق» حالة مستقلة عن «الإعداد مكتمل»
   --------------------------------------------------------------------------
   لا يُحفظ في المتصفح رمز وصول ولا رمز تحديث ولا رمز دخول ولا كلمة سر.
   المحفوظ مؤشّر جلسة (`app_sessions.id`) والهوية التي أصدرها الخادم معها؛
   وعند كل إقلاع يسأل البرنامج الخادم إن كانت الجلسة ما تزال حيّة، فإن قال
   لا — رجع المستخدم إلى البوابة. التخزين ذاكرة راحة، لا مصدر صلاحية.
   ========================================================================== */
const AuthSession = {
  key:"soufyan.erp.session.v1",
  data:null,          // { sessionId, method, at, employee, permissions, offline }
  token:null,         // رمز وصول توثيق البريد — في الذاكرة وحدها، لا يُكتب أبدًا
  _subs:[],
  subscribe(fn){ this._subs.push(fn); },
  _emit(){ this._subs.forEach(f => { try{ f(this.data); }catch(_){ } }); },

  isAuthenticated(){ return !!(this.data && this.data.employee); },
  employee(){ return this.data ? this.data.employee : null; },
  permissions(){ return (this.data && this.data.permissions) || []; },
  can(mod){ return this.permissions().includes(mod); },

  begin(result){
    this.token = result.token || null;
    this.data = {
      sessionId  : result.sessionId || null,
      method     : result.method,
      at         : nowISO(),
      employee   : result.employee,
      permissions: (result.permissions && result.permissions.length)
        ? result.permissions : PERMISSIONS_FOR(result.employee && result.employee.role),
      offline    : false
    };
    Terminal.markSeen();
    this._persist();
    this._emit();
    window.dispatchEvent(new CustomEvent("erp:session-start", { detail:this.snapshot() }));
    return this.data;
  },
  _persist(){
    // ما يُكتب: مؤشّر ودور. ما لا يُكتب أبدًا: رمز وصول، رمز تحديث، PIN، كلمة سر.
    if(!this.data || !this.data.sessionId){ this._forget(); return; }
    try{
      localStorage.setItem(this.key, JSON.stringify({
        v:1, sessionId:this.data.sessionId, method:this.data.method, at:this.data.at,
        employee:{ id:this.data.employee.id, name:this.data.employee.name, role:this.data.employee.role || "" },
        permissions:this.data.permissions, terminal:Terminal.id()
      }));
    }catch(_){ }
  },
  _forget(){ try{ localStorage.removeItem(this.key); }catch(_){ } },
  _read(){
    try{
      const raw = JSON.parse(localStorage.getItem(this.key) || "null");
      if(!raw || raw.v !== 1 || !raw.sessionId || !raw.employee) return null;
      if(raw.terminal && raw.terminal !== Terminal.id()) return null;   // نُقلت الحالة إلى جهاز آخر
      return raw;
    }catch(_){ return null; }
  },

  /**
   * استئناف جلسة عند الإقلاع. الخادم هو الحَكَم:
   *  • قال «مغلقة/مجهولة»  ⇒ تُمسح الجلسة ويعود المستخدم إلى الدخول.
   *  • لم يُجب (بلا اتصال) ⇒ مهلة سماح قصيرة وحالة «بلا اتصال» ظاهرة، ثم يُعاد السؤال.
   *  • أجاب ومعه هوية      ⇒ تُعتمد هويته هو لا المحفوظة محليًا.
   */
  async restore(){
    const raw = this._read();
    if(!raw) return null;
    const age = Date.now() - new Date(raw.at).getTime();
    if(!(age >= 0) || age > CONFIG.sessionMaxHours * 3600e3){ this._forget(); return null; }
    let alive = false, offline = false;
    try{ alive = await AuthService.ping(raw.sessionId); }
    catch(e){
      if(e.code !== "offline") { this._forget(); return null; }
      offline = true;
      if(age > CONFIG.offlineGraceMinutes * 60e3){ this._forget(); return null; }
    }
    if(!offline && !alive){ this._forget(); return null; }
    this.data = {
      sessionId : raw.sessionId, method: raw.method, at: raw.at,
      employee : raw.employee, permissions: raw.permissions, offline
    };
    this._emit();
    return this.data;
  },

  /** نبضة دورية: الخادم يعرف أن الجهاز ما يزال مفتوحًا، ونعرف أن الجلسة ما تزال صالحة. */
  startHeartbeat(){
    this.stopHeartbeat();
    if(!this.data || !this.data.sessionId) return;
    this._hb = setInterval(async () => {
      if(!this.data || !this.data.sessionId) return this.stopHeartbeat();
      try{
        const ok = await AuthService.ping(this.data.sessionId);
        if(!ok){ this.stopHeartbeat(); Router.sessionLost(); return; }
        if(this.data.offline){ this.data.offline = false; this._emit(); Chrome.actions(); }
      }catch(e){
        if(e.code === "offline" && this.data && !this.data.offline){ this.data.offline = true; this._emit(); Chrome.actions(); }
      }
    }, CONFIG.heartbeatSeconds * 1000);
  },
  stopHeartbeat(){ clearInterval(this._hb); this._hb = null; },

  /** خروج: تُنهى الجلسة على الخادم وتُمحى من المتصفح — ولا يُمَسّ أي إعداد أو بيانات. */
  async end(reason){
    const id = this.data && this.data.sessionId;
    this.stopHeartbeat();
    this.data = null; this.token = null;
    this._forget();
    this._emit();
    window.dispatchEvent(new CustomEvent("erp:session-end", { detail:{ reason: reason || "logout" } }));
    await AuthService.endSession(id, reason);
  },
  snapshot(){
    if(!this.data) return null;
    return { method:this.data.method, at:this.data.at, offline:!!this.data.offline,
      employee:Object.assign({}, this.data.employee), permissions:this.data.permissions.slice() };
  }
};

/* ==========================================================================
   14.e) حقل كلمة المرور — إظهار وإخفاء
   --------------------------------------------------------------------------
   الإخفاء الافتراضي يحمي من النظرة العابرة، والإظهار يمنع الخطأ الصامت.
   الزر يعلن حالته (`aria-pressed`) فيعرف قارئ الشاشة إن كانت ظاهرة أم لا.
   ========================================================================== */
/**
 * حقول شاشة الدخول بلا وسم «مطلوب» ولا «(اختياري)»: كلّها مطلوبة بداهةً، والنجمة
 * هنا ضجيج لا معلومة. (حقول الإعداد تبقى على وسومها لأن فيها ما هو اختياري فعلًا.)
 */
function authField(o){
  const peek = o.type === "password";
  const input = `<input class="control" id="f_${o.name}" name="${o.name}" type="${o.type || "text"}"
        autocomplete="${o.autocomplete || "off"}" dir="ltr" enterkeyhint="go"
        ${o.inputmode ? `inputmode="${o.inputmode}"` : ""}
        ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ""}
        ${o.hint ? `aria-describedby="h_${o.name}"` : ""}>`;
  // الرابط الثانوي يجلس في سطر التسمية نفسه — مقترنًا بالحقل الذي يخصّه، وبلا سطر زائد.
  const label = o.aside
    ? `<div class="lbl-row"><label for="f_${o.name}">${esc(o.label)}</label>${o.aside}</div>`
    : `<label for="f_${o.name}">${esc(o.label)}</label>`;
  return `<div class="field" data-fw="${o.name}">
    ${label}
    ${peek ? `<div class="pwd-row">${input}
      <button type="button" class="pwd-peek" data-peek="${o.name}"
        aria-pressed="false" aria-label="${esc(t("pwdShow"))}">${ico("eye")}</button></div>` : input}
    ${o.hint ? `<p class="hint" id="h_${o.name}">${esc(o.hint)}</p>` : ""}
    <p class="err-msg" data-err="${o.name}" hidden>${ico("alert")}<span></span></p>
  </div>`;
}
const passwordField = o => authField(Object.assign({ type:"password", autocomplete:"current-password" }, o));
/** يربط أزرار الإظهار داخل جذر ما — يُستدعى بعد رسم أي شاشة فيها كلمة مرور. */
function bindPeek(root){
  $$("[data-peek]", root).forEach(b => b.addEventListener("click", () => {
    const el = $("#f_" + b.dataset.peek, root);
    if(!el) return;
    const show = el.type === "password";
    el.type = show ? "text" : "password";
    b.setAttribute("aria-pressed", show ? "true" : "false");
    b.setAttribute("aria-label", t(show ? "pwdHide" : "pwdShow"));
    el.focus();
  }));
}

/* ==========================================================================
   14.f) Screen — مسرح واحد لكل الشاشات
   --------------------------------------------------------------------------
   البوابة والدخول يُرسمان في مسرح الإعداد نفسه: العنوان والشرح والرسمة
   والحركة والتركيز والإعلان كما هي، فلا تخطيط ثانٍ ولا حركة ثانية ولا هوية
   بصرية ثانية. ما يخصّ الإعداد وحده — شريط المراحل وشريط التنقّل — يختفي.
   ========================================================================== */
const Screen = {
  cleanups:[], _first:true,
  registerCleanup(fn){ this.cleanups.push(fn); },
  _runCleanups(){ this.cleanups.forEach(f => { try{ f(); }catch(_){ } }); this.cleanups = []; },
  /** اسم المحل إن عرفناه — يعطي الشاشة إحساس المكان قبل أن يكتب المستخدم شيئًا. */
  brandName(){
    const d = SetupState.data.storeData;
    return (d.storeName || d.shopName || "").trim();
  },
  render(o){
    this._runCleanups();
    const host = $("#stepHost");
    const useGsap = HAS_GSAP && !reducedMotion();
    if(o.layout === "auth"){
      const shop = this.brandName();
      host.innerHTML = `<section class="step auth-stage" data-step="${o.id}"${!useGsap ? ' data-enter="1"' : ""} aria-labelledby="stepTitle">
        <div class="auth-brand">
          <span class="mark" aria-hidden="true">${ico("phone")}</span>
          <b>${esc(shop || t("appName"))}</b>
          <span>${esc(shop ? t("appName") : t("appSub"))}</span>
        </div>
        <div class="auth-card">
          <h1 id="stepTitle" tabindex="-1">${esc(o.title)}</h1>
          ${o.lede ? `<p class="lede">${esc(o.lede)}</p>` : ""}
          <div class="step-body">${o.body}</div>
        </div>
        ${o.alt || ""}
        ${o.back || ""}
      </section>`;
    }else{
      host.innerHTML = `<section class="step" data-step="${o.id}"${!useGsap ? ' data-enter="1"' : ""} aria-labelledby="stepTitle">
        ${o.eyebrow ? `<span class="step-eyebrow">${ico(o.icon || "shield")}<span>${esc(o.eyebrow)}</span></span>` : ""}
        <h1 id="stepTitle" tabindex="-1">${esc(o.title)}</h1>
        ${o.lede ? `<p class="lede">${esc(o.lede)}</p>` : ""}
        <div class="step-body step-scroll">${o.body}</div>
      </section>`;
    }
    const root = $(".step", host);
    if(o.mount) o.mount(root);
    // البطاقة تدخل ككتلة واحدة: حركة واحدة لشاشة واحدة، بلا تتابع على العناصر.
    if(useGsap && o.layout === "auth"){
      gsap.killTweensOf(root.children);
      gsap.fromTo(root.children, { y:14, opacity:0 },
        { y:0, opacity:1, duration:.5, ease:"clay", stagger:.05, clearProps:"transform,opacity" });
    }else if(useGsap){ Wizard.root = root; Wizard.animateIn(); }
    if(o.layout !== "auth") SetupIllustration.show(o.svg, o.title);
    // أول رسم بعد فتح الصفحة لا يخطف التركيز، فيبقى رابط «تخطّي إلى المحتوى»
    // أول ما يصله Tab. ما بعده تغييرُ شاشةٍ داخل التطبيق، فينتقل التركيز مع الشاشة.
    if(!Screen._first) setTimeout(() => { const h = $("#stepTitle"); if(h) h.focus({ preventScroll:true }); }, 120);
    Screen._first = false;
    announce(o.announce || o.title);
    window.scrollTo({ top:0, behavior: reducedMotion() ? "auto" : "smooth" });
    return root;
  }
};

/* ==========================================================================
   14.g) Chrome — رأس الصفحة بحسب السطح
   ========================================================================== */
const Chrome = {
  render(){
    $("#brandName").textContent = t("appName");
    $("#brandSub").textContent  = t(Router.surface === "setup" ? "appSub"
      : Router.surface === "erp" ? "appErp" : "appGate");
    const skip = $(".skip-link"); if(skip) skip.textContent = t("skipToContent");
    document.title = t("appName") + " — " + $("#brandSub").textContent;
    this.actions();
  },
  /** شارة الوضع + الجلسة + اللغة والمظهر. الإجراءات الخطرة تظهر حيث تعني فقط. */
  actions(){
    const host = $("#hActions"); if(!host) return;
    const s = AuthSession.data;
    const connected = Sb.ready();
    const offline = !!(s && s.offline);
    // شارة «متصل بالخادم» الخضراء ضجيج للمستخدم: الاتصال هو المتوقَّع. الشارة
    // تظهر حين تحمل خبرًا فعلًا — انقطاع، أو وضع محلي بلا خادم.
    const warn = offline ? { key:"offlineMode", tip:"offlineModeTip" }
      : !connected ? { key:"localMode", tip:"localModeTip" } : null;
    host.innerHTML = `
      ${s ? `<div class="sess" title="${esc(s.employee.name)}">
        <span class="avatar" aria-hidden="true">${esc(initials(s.employee.name))}</span>
        <span class="s-who"><b>${esc(s.employee.name)}</b><span>${esc(roleName(s.employee.role))}</span></span>
      </div>` : ""}
      ${warn ? `<span class="mode-flag" data-mode="local" title="${esc(t(warn.tip))}">${ico("alert")}${esc(t(warn.key))}</span>` : ""}
      ${s ? `<button class="icon-btn" id="switchBtn" aria-label="${esc(t("switchUser"))}" title="${esc(t("switchUser"))}">${ico("swap")}</button>
             <button class="icon-btn" id="logoutBtn" aria-label="${esc(t("logout"))}" title="${esc(t("logout"))}">${ico("lock")}</button>` : ""}
      <button class="icon-btn lang-btn" id="langBtn" aria-label="${esc(t("langToggle"))}">${LANG === "ar" ? "EN" : "ع"}</button>
      <button class="icon-btn" id="themeBtn" aria-label="${esc(t("themeToggle"))}"></button>
      ${Router.surface === "setup" ? `<button class="icon-btn" id="resetBtn" aria-label="${esc(t("resetSetup"))}" title="${esc(t("resetSetup"))}">${ico("reset")}</button>` : ""}`;
    $("#langBtn").addEventListener("click", () => Lang.toggle());
    $("#themeBtn").addEventListener("click", () => Theme.cycle());
    const rb = $("#resetBtn");   if(rb) rb.addEventListener("click", () => Wizard.confirmReset());
    const lb = $("#logoutBtn");  if(lb) lb.addEventListener("click", () => Router.confirmLogout());
    const sb = $("#switchBtn");  if(sb) sb.addEventListener("click", () => Router.switchUser());
    Theme.apply(SetupState.data.preferences.theme);
  }
};

const roleName = r => {
  const k = String(r || "").toUpperCase();
  return L["role_" + k] ? t("role_" + k) : (r || t("role_MEMBER"));
};

/* ==========================================================================
   14.h) رسائل الخطأ — ماذا حدث، ولماذا، وماذا أفعل
   ========================================================================== */
const authError = (code, detail) => {
  const map = {
    offline      : ["errOfflineT","errOfflineB"],
    config       : ["errConfigT","errConfigB"],
    badLogin     : ["errBadLoginT","errBadLoginB"],
    unconfirmed  : ["errUnconfirmedT","errUnconfirmedB"],
    disabled     : ["errDisabledT","errDisabledB"],
    recExpired   : ["errRecExpiredT","errRecExpiredB"],
    "recover-failed": ["errRecoverFailedT","errRecoverFailedB"],
    "expired-session": ["errExpired-sessionT","errExpired-sessionB"],
    rate         : ["errRateT","errRateB"],
    unauthorized : ["errAuthT","errAuthB"],
    server       : ["errServerT","errServerB"]
  };
  const pair = map[code] || map.server;
  return { title: t(pair[0], { d: detail || "" }), body: t(pair[1], { d: detail || "" }) };
};
const errBox = (code, detail) => {
  const e = authError(code, detail);
  return `<div class="note err" role="alert">${ico("alert")}<div><b>${esc(e.title)}</b><br>${esc(e.body)}</div></div>`;
};

/* ==========================================================================
   14.i) AuthUI — البوابة، والدخول، وتسليم النظام
   --------------------------------------------------------------------------
   ثلاث تجارب لا تُخلط: البوابة تسأل سؤالًا واحدًا، والدخول يطلب إثباتًا،
   والإعداد يبني النظام لأول مرة. لا خطوات إعداد في البوابة ولا العكس.
   ========================================================================== */
const AuthUI = {

  /* ---------- البوابة ---------- */
  gate(){
    const done = Router.setupCompleted();
    const back = SetupState.data.completedSteps.length > 0 && !done;
    const door = (id, tone, icon, title, desc, cta) => `<button type="button" class="door" data-door="${id}"${tone ? ' data-tone="primary"' : ""}>
      <span class="d-ico">${ico(icon)}</span>
      <span class="d-txt"><b>${esc(title)}</b><span class="d-desc">${esc(desc)}</span></span>
      <span class="d-go" aria-hidden="true">${ico("next", "i-dir")}</span>
      <span class="sr-only">${esc(cta)}</span>
    </button>`;
    Screen.render({
      id:"gate", layout:"auth", icon:"phone",
      title:t("gateTitle"), lede:t(done ? "gateLedeDone" : "gateLede"),
      body:`<div class="doors">
        ${door("login", done, "lock", t("gateHaveT"), t("gateHaveD"), t("gateHaveCta"))}
        ${door("setup", !done, "rocket", t(done ? "gateNewTDone" : "gateNewT"),
          t(done ? "gateNewDDone" : back ? "gateNewDBack" : "gateNewD"), t(back ? "gateNewCtaBack" : "gateNewCta"))}
      </div>
      ${Sb.ready() ? "" : F.note(esc(t("gateLocalNote")), "warn")}`,
      mount(root){
        $("[data-door='login']", root).addEventListener("click", () => Router.go("login"));
        $("[data-door='setup']", root).addEventListener("click", () => Router.startSetup(done));
      }
    });
  },

  /* ---------- الدخول: بريد وكلمة مرور ---------- */
  login(opts){
    opts = opts || {};
    const caps = AuthService.caps();
    Screen.render({
      id:"login", layout:"auth", icon: opts.mode === "switch" ? "swap" : "lock",
      title:t(!caps.configured ? "loginTitleOff" : opts.mode === "switch" ? "switchTitle" : "loginTitle"),
      lede:t(!caps.configured ? "loginLedeOff"
        : opts.reason === "expired" ? "loginLedeExpired"
        : opts.reason === "after-setup" ? "loginLedeAfterSetup"
        : opts.reason === "recover-failed" ? "loginLedeRecoverFailed"
        : opts.mode === "switch" ? "switchLede" : "loginLede"),
      body:`
        ${opts.reason === "expired" ? errBox("expired-session")
          : opts.reason === "recover-failed" ? errBox("recover-failed")
          : opts.reason === "after-setup" ? `<div class="note ok">${ico("shieldCheck")}<div>${esc(t("afterSetupNote"))}</div></div>` : ""}
        ${caps.configured ? `
          ${authField({ name:"loginEmail", label:t("emField"), type:"email",
              autocomplete:"username", inputmode:"email", placeholder:"name@example.com" })}
          ${authField({ name:"loginPassword", label:t("pwdField"), type:"password",
              autocomplete:"current-password",
              aside:`<button type="button" class="link" data-forgot>${esc(t("forgotCta"))}</button>` })}
          <div data-login-err id="loginErr"></div>
          <button type="button" class="btn btn-primary btn-lg btn-block" data-go>
            <span class="btn-label">${esc(t("loginCta"))}</span>${ico("next", "i-dir")}</button>`
        : `<div class="note warn">${ico("alert")}<div><b>${esc(authError(caps.reason).title)}</b><br>${esc(authError(caps.reason).body)}</div></div>
           <div data-login-err id="loginErr"></div>`}`,
      alt:`<p class="auth-alt">${esc(t("noAccountYet"))}
        <button type="button" class="link" data-start>${esc(t("startNow"))}</button></p>`,
      back:`<div class="auth-back"><button type="button" class="btn btn-quiet btn-sm" data-back-gate>
        ${ico("prev", "i-dir")}<span class="btn-label">${esc(t("backToGate"))}</span></button></div>`,
      mount(root){
        const errHost = $("[data-login-err]", root);
        $("[data-back-gate]", root).addEventListener("click", () => Router.go("gate"));
        $("[data-start]", root).addEventListener("click", () => Router.startSetup(Router.setupCompleted()));
        if(!caps.configured) return;
        bindPeek(root);
        const mail = $("#f_loginEmail", root), pwd = $("#f_loginPassword", root), go = $("[data-go]", root);
        mail.value = opts.email || "";
        setTimeout(() => (mail.value ? pwd : mail).focus(), 260);
        $("[data-forgot]", root).addEventListener("click", () => AuthUI.recover(mail.value.trim()));
        [mail, pwd].forEach(el => {
          el.addEventListener("input", () => { clearError(root, el.name); errHost.innerHTML = ""; el.removeAttribute("aria-invalid"); });
          el.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } });
        });
        go.addEventListener("click", submit);

        async function submit(){
          if(go.dataset.busy === "1") return;
          // التحقّق عند الضغط لا قبله: الزر يبقى مفعّلًا ويشرح ما ينقص.
          const errs = {};
          if(!RX.email.test(mail.value.trim())) errs.loginEmail = t("errEmail");
          if(!pwd.value) errs.loginPassword = t("errPwdEmpty");
          if(!paintErrors(root, errs)) return;
          go.dataset.busy = "1"; go.disabled = true; errHost.innerHTML = "";
          try{
            const r = await AuthService.passwordLogin(mail.value.trim(), pwd.value);
            pwd.value = "";                      // لا تبقى كلمة المرور في الحقل بعد نجاحها
            await AuthUI.succeed(r);
          }catch(e){
            errHost.innerHTML = errBox(e.code, e.detail);
            pwd.setAttribute("aria-invalid", "true");
            pwd.setAttribute("aria-describedby", "loginErr");
            pwd.value = ""; pwd.focus();
            announce(authError(e.code, e.detail).title);
          }finally{ go.dataset.busy = ""; go.disabled = false; }
        }
      }
    });
  },

  /* ---------- نسيت كلمة المرور ---------- */
  recover(prefill){
    let sent = false, address = prefill || "";
    const render = () => Screen.render({
      id:"recover", layout:"auth", icon:"mail",
      title:t(sent ? "recSentTitle" : "recTitle"), lede:t(sent ? "recSentLede" : "recLede"),
      body: sent
        ? `<div class="note ok">${ico("mail")}<div>${esc(t("recSentBody", { e: address }))}</div></div>
           ${F.note(esc(t("recSpam")), "")}
           <button type="button" class="btn btn-primary btn-block" data-back>
             ${ico("prev", "i-dir")}<span class="btn-label">${esc(t("backToLogin"))}</span></button>`
        : `${authField({ name:"recEmail", label:t("emField"), type:"email", autocomplete:"username",
              inputmode:"email", placeholder:"name@example.com", hint:t("recHint") })}
           <div data-rec-err></div>
           <button type="button" class="btn btn-primary btn-lg btn-block" data-send>
             ${ico("mail")}<span class="btn-label">${esc(t("recSend"))}</span></button>`,
      alt: sent
        ? `<p class="auth-alt">${esc(t("recNothing"))}
             <button type="button" class="link" data-again>${esc(t("recAgain"))}</button></p>`
        : `<p class="auth-alt">${esc(t("recRemembered"))}
             <button type="button" class="link" data-back>${esc(t("backToLogin"))}</button></p>`,
      mount(root){
        $$("[data-back]", root).forEach(x => x.addEventListener("click", () => Router.go("login", { email: address })));
        const again = $("[data-again]", root);
        if(again) again.addEventListener("click", () => { sent = false; render(); });
        const send = $("[data-send]", root);
        if(!send) return;
        const field = $("#f_recEmail", root), errHost = $("[data-rec-err]", root);
        field.value = address;
        setTimeout(() => field.focus(), 260);
        field.addEventListener("input", () => { clearError(root, "recEmail"); errHost.innerHTML = ""; });
        field.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); run(); } });
        send.addEventListener("click", run);
        async function run(){
          const v = field.value.trim();
          if(!RX.email.test(v)){ showError(root, "recEmail", t("errEmail")); return; }
          send.dataset.busy = "1"; send.disabled = true; errHost.innerHTML = "";
          try{
            await AuthService.recover(v);
            address = v; sent = true; render();
          }catch(e){
            send.dataset.busy = ""; send.disabled = false;
            errHost.innerHTML = errBox(e.code, e.detail);
            announce(authError(e.code).title);
          }
        }
      }
    });
    render();
  },

  /* ---------- كلمة مرور جديدة (من رابط الاسترجاع) ---------- */
  resetPassword(token, user){
    Screen.render({
      id:"reset", layout:"auth", icon:"key",
      title:t("resetTitle"), lede:t("resetLede", { e: (user && user.email) || "" }),
      body:`
        ${authField({ name:"newPwd", label:t("newPwdField"), type:"password",
          autocomplete:"new-password", hint:t("newPwdHint") })}
        <div class="pwd-meter" data-meter aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span data-meter-label></span></div>
        ${authField({ name:"newPwd2", label:t("newPwd2Field"), type:"password",
          autocomplete:"new-password" })}
        <div data-reset-err></div>
        <button type="button" class="btn btn-primary btn-lg btn-block" data-save>
          ${ico("shieldCheck")}<span class="btn-label">${esc(t("resetCta"))}</span></button>`,
      mount(root){
        bindPeek(root);
        const p1 = $("#f_newPwd", root), p2 = $("#f_newPwd2", root);
        const save = $("[data-save]", root), errHost = $("[data-reset-err]", root);
        const meter = $("[data-meter]", root);
        setTimeout(() => p1.focus(), 260);
        const paint = () => {
          const sc = pwdScore(p1.value);
          $$("i", meter).forEach((b, i) => b.dataset.on = i < sc ? "1" : "");
          meter.dataset.level = sc;
          $("[data-meter-label]", meter).textContent = p1.value ? t("pwd_" + clamp(Math.ceil(sc / 2), 1, 3)) : "";
        };
        p1.addEventListener("input", () => { paint(); clearError(root, "newPwd"); errHost.innerHTML = ""; });
        p2.addEventListener("input", () => clearError(root, "newPwd2"));
        [p1, p2].forEach(el => el.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); run(); } }));
        save.addEventListener("click", run);
        async function run(){
          if(save.dataset.busy === "1") return;
          const errs = {};
          if(p1.value.length < 8) errs.newPwd = t("errPwdShort");
          else if(p1.value !== p2.value) errs.newPwd2 = t("errPwdMatch");
          if(!paintErrors(root, errs)) return;
          save.dataset.busy = "1"; save.disabled = true; errHost.innerHTML = "";
          try{
            const r = await AuthService.updatePassword(token, p1.value);
            // الرمز الذي أذن بالتغيير يصلح للدخول، فلا نطلب كتابتها من جديد.
            const session = await AuthService.sessionFromToken(token, r.user);
            p1.value = p2.value = "";
            Toast.show(t("resetDone"), "ok");
            await AuthUI.succeed(session);
          }catch(e){
            save.dataset.busy = ""; save.disabled = false;
            errHost.innerHTML = errBox(e.code === "unauthorized" ? "recExpired" : e.code, e.detail);
            announce(authError(e.code).title);
          }
        }
      }
    });
  },

  /* ---------- بعد نجاح التوثيق ---------- */
  async succeed(result){
    AuthSession.begin(result);
    AuthSession.startHeartbeat();
    Chrome.actions();
    await wait(reducedMotion() ? 0 : 420);
    Router.go("erp");
  },

  /* ---------- تسليم النظام ---------- */
  erp(){
    const s = AuthSession.data;
    if(!s) return Router.go("gate");
    if(CONFIG.appEntryUrl){
      window.dispatchEvent(new CustomEvent("erp:enter", { detail:AuthSession.snapshot() }));
      location.href = CONFIG.appEntryUrl;
      return;
    }
    const mods = s.permissions.length ? s.permissions : PERMISSIONS_FOR(s.employee.role);
    const setupDone = Router.setupCompleted();
    Screen.render({
      id:"erp", svg:"complete", icon:"rocket", eyebrow:t("erpEyebrow"),
      title:t("erpTitle", { n: s.employee.name || "" }), lede:t("erpLede"),
      body:`
        <div class="who">
          <span class="avatar" aria-hidden="true">${esc(initials(s.employee.name))}</span>
          <span class="w-txt"><b>${esc(roleName(s.employee.role))}</b>
            <span>${esc(t("viaMethod_" + s.method))} · ${esc(Terminal.name())}</span></span>
        </div>
        <div class="perm-block">
          <b id="permsT">${esc(t("permsTitle"))}</b>
          <ul class="perm-list" aria-labelledby="permsT">${mods.map(m => `<li>${esc(moduleName(m))}</li>`).join("")}</ul>
        </div>
        ${s.offline ? F.note(esc(t("offlineNote")), "warn") : ""}
        ${setupDone ? `<div data-prog-host></div>` : F.note(esc(t("erpSetupPending")), "warn")}
        <div class="hand-grid">
          <div class="hand-card"><b>${esc(t("handAuthT"))}</b><span>${esc(t("handAuthD"))}</span></div>
          <div class="hand-card"><b>${esc(t("handRlsT"))}</b><span>${esc(t("handRlsD"))}</span></div>
        </div>
        ${F.note(esc(t("erpHandoffNote")), "")}
        <pre class="code-box mono">window.SETUP_CONFIG = { appEntryUrl: "/app" };</pre>
        <div class="auth-foot">
          <button type="button" class="btn btn-ghost" data-switch>${ico("swap")}<span class="btn-label">${esc(t("switchUser"))}</span></button>
          <button type="button" class="btn btn-quiet" data-logout>${ico("lock")}<span class="btn-label">${esc(t("logout"))}</span></button>
          ${setupDone ? "" : `<span class="sep"></span><button type="button" class="btn btn-primary" data-finish>${ico("sliders")}<span class="btn-label">${esc(t("finishSetup"))}</span></button>`}
        </div>`,
      mount(root){
        const ph = $("[data-prog-host]", root);
        if(ph) renderProgressCard(ph, { cta:"primary" });
        $("[data-switch]", root).addEventListener("click", () => Router.switchUser());
        $("[data-logout]", root).addEventListener("click", () => Router.confirmLogout());
        const f = $("[data-finish]", root);
        if(f) f.addEventListener("click", () => Router.startSetup(false));
        window.dispatchEvent(new CustomEvent("erp:enter", { detail:AuthSession.snapshot() }));
      }
    });
  }
};

const moduleName = m => L["mod_" + m] ? t("mod_" + m) : m;

/* ==========================================================================
   14.j) Router — جلسة صالحة؟ إعداد مكتمل؟ ثم القرار
   --------------------------------------------------------------------------
                       تشغيل البرنامج
                             ↓
                      جلسة صالحة؟ ── نعم ──▶ النظام
                             │
                             لا
                             ↓
                   الإعداد مكتمل؟ ── نعم ──▶ الدخول
                             │
                             لا
                             ↓
                          البوابة
   ========================================================================== */
const Router = {
  surface:null,
  _setupStarted:false,

  /** «الإعداد مكتمل» حالة مستقلة تمامًا عن «موثَّق». */
  setupCompleted(){
    return !!(SetupState.data.setupStatus.completed || LocalDB.get("setup_completed"));
  },

  /**
   * رابط «نسيت كلمة المرور» يعود بالرمز داخل hash العنوان. يُلتقط ويُمحى من
   * الشريط ومن سجلّ التصفّح فورًا، فلا يبقى رمز صالح معروضًا على الشاشة.
   */
  _recovery(){
    const raw = String(location.hash || "").replace(/^#/, "");
    if(!raw) return null;
    const q = new URLSearchParams(raw);
    const type = q.get("type"), token = q.get("access_token");
    const err = q.get("error_description") || q.get("error_code") || q.get("error");
    if(!type && !err) return null;
    history.replaceState(null, "", location.pathname + location.search);
    if(err) return { error:String(err) };
    return (type === "recovery" && token) ? { token } : null;
  },

  async boot(){
    document.body.dataset.surface = "auth";
    const rec = this._recovery();
    if(rec){
      this.surface = "login"; Chrome.render();
      if(rec.error) return this.go("login", { reason:"recover-failed" });
      Screen.render({ id:"resume", layout:"auth", icon:"key", title:t("resumeTitle"),
        lede:t("recCheckLede"), body:`<p class="otp-status" data-tone="busy"><span class="spin"></span>${esc(t("resumeWait"))}</p>` });
      let user = null;
      try{ user = await AuthService.me(rec.token); }catch(_){ }
      if(!user || !user.id) return this.go("login", { reason:"recover-failed" });
      return AuthUI.resetPassword(rec.token, user);
    }
    // شاشة انتظار قصيرة بدل وميض البوابة قبل أن يجيب الخادم عن الجلسة.
    if(AuthSession._read()){
      Screen.render({ id:"resume", layout:"auth", icon:"shield", title:t("resumeTitle"), lede:t("resumeLede"),
        body:`<p class="otp-status" data-tone="busy"><span class="spin"></span>${esc(t("resumeWait"))}</p>` });
      Chrome.render();
      const s = await AuthSession.restore();
      if(s){ AuthSession.startHeartbeat(); return this.go("erp"); }
      // كانت هنا جلسة ورفضها الخادم: صاحبها له حساب بالفعل، فالوجهة الدخول
      // لا البوابة — والبوابة تبقى على بعد ضغطة من شاشة الدخول.
      return this.go("login", { reason:"expired" });
    }
    if(this.setupCompleted() && Sb.ready()) return this.go("login");
    return this.go("gate");
  },

  go(surface, opts){
    Screen._runCleanups();
    if(this.surface === "setup" && surface !== "setup") Wizard._runCleanups();
    this.surface = surface;
    document.body.dataset.surface = surface === "setup" ? "setup" : surface === "erp" ? "erp" : "auth";
    Chrome.render();
    if(surface === "setup") return this.showSetup();
    if(surface === "login") return AuthUI.login(opts || {});
    if(surface === "erp")   return AuthUI.erp();
    return AuthUI.gate();
  },

  showSetup(){
    if(!this._setupStarted){ this._setupStarted = true; Wizard.init(); }
    else Wizard.renderStep(true);
    Wizard.renderPhases();
  },

  /** «مستخدم جديد» على نظام مُعدّ سلفًا قرار يستحق سؤالًا صريحًا. */
  async startSetup(alreadyDone){
    if(alreadyDone){
      const ok = await Modal.confirm({ title:t("reSetupT"), body:t("reSetupB"), confirmLabel:t("reSetupCta") });
      if(!ok) return;
    }
    this.go("setup");
  },

  async confirmLogout(){
    const ok = await Modal.confirm({ title:t("logoutT"), body:t("logoutB"), confirmLabel:t("logout") });
    if(!ok) return;
    await AuthSession.end("logout");
    Toast.show(t("logoutDone"), "info");
    this.go("gate");
  },

  async switchUser(){
    await AuthSession.end("logout");
    this.go("login", { mode:"switch" });
  },

  /**
   * نهاية الإعداد. الإعداد يبني النظام، والدخول يفتحه — ولا يُخلط الاثنان:
   * من أنهى الإعداد للتوّ وهو موثَّق يدخل مباشرة؛ ومن ليس موثَّقًا يُطلب منه
   * تسجيل الدخول لأول مرة بدل أن يُمنح جلسة لم يصدرها خادم.
   */
  enterErp(){
    SetupState.data.setupStatus.completed = true;
    SetupState.data.setupStatus.completedAt = SetupState.data.setupStatus.completedAt || nowISO();
    SetupState.saveNow();
    LocalDB.put("setup_completed", true);
    window.dispatchEvent(new CustomEvent("erp:setup-complete", { detail: SetupState.exportConfig() }));
    if(AuthSession.isAuthenticated()) return this.go("erp");
    if(Sb.ready()) return this.go("login", { reason:"after-setup" });
    return false;                       // وضع محلي بلا خادم: يبقى شرح V4 كما هو
  },

  /** الخادم أنهى الجلسة ونحن نعمل — لا نُبقي المستخدم داخل شاشة لا يملكها. */
  sessionLost(){
    AuthSession.data = null; AuthSession.token = null; AuthSession._forget();
    Toast.show(t("sessionLost"), "err", 6000);
    this.go("login", { reason:"expired" });
  }
};

/* ==========================================================================
   16) الإقلاع
   ========================================================================== */
(function boot(){
  const restored = SetupState.load();
  LANG = (SetupState.data.preferences.language === "en") ? "en" : "ar";
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "en" ? "ltr" : "rtl";
  Theme.apply(SetupState.data.preferences.theme || "light");
  if(restored) Secrets.rehydrate();

  window.ERPSetup = { state:SetupState, wizard:Wizard, employees:Employees, permissions:Permissions,
    services:{ OtpService, SetupService, InvoiceTemplate, AuthService }, config:CONFIG,
    flow:Flow, progress:() => Flow.snapshot(), progressCard:renderProgressCard,
    // الجلسة والتوجيه — يقرؤهما النظام بعد الدخول ليعرف من الموجود وما صلاحياته.
    auth:{ session:AuthSession, service:AuthService, router:Router, terminal:Terminal,
      isAuthenticated:() => AuthSession.isAuthenticated(), user:() => AuthSession.snapshot(),
      can:m => AuthSession.can(m), logout:() => Router.confirmLogout(), switchUser:() => Router.switchUser() },
    illustration:{ el:SetupIllustration, live:LiveSVG,
      setIllustrationState, triggerShake, triggerSuccess, triggerProcessing, triggerAttention } };

  const start = () => {
    SetupIllustration.init($("#illus"));
    // جلسة صالحة ⇒ النظام. إعداد مكتمل بلا جلسة ⇒ الدخول. غير ذلك ⇒ البوابة.
    Router.boot();
    if(restored && SetupState.data.completedSteps.length && !Router.setupCompleted())
      setTimeout(() => Toast.show(t("restored"), "info"), 900);
  };
  /* المسرح ثلاثي الأبعاد ٥٩٦ كيلوبايت — أكثر من نصف وزن الصفحة — والوضع
     الافتراضي لا يستعمله. فيُحمَّل عند الطلب وحده، وفشل تحميله يعني الرسوم
     الحيّة لا شاشة فارغة. */
  if((CONFIG.illustration || "svg") === "svg") start();
  else{
    const tag = document.createElement("script");
    tag.src = CONFIG.threeUrl;
    tag.onload = () => { window.Stage3D = window.buildStage3D(); start(); };
    tag.onerror = start;
    document.head.appendChild(tag);
  }

  // إغلاق التبويب يُنهي جلسة التشغيل على الخادم بدل تركها مفتوحة إلى أن تُكنس.
  window.addEventListener("pagehide", () => {
    const id = AuthSession.data && AuthSession.data.sessionId;
    if(!id || !navigator.sendBeacon || !Sb.ready()) return;
    try{
      navigator.sendBeacon(Sb._base() + "/rest/v1/rpc/app_session_end?apikey=" +
        encodeURIComponent(CONFIG.supabaseAnonKey),
        new Blob([JSON.stringify({ p_session_id:id, p_reason:"normal" })], { type:"application/json" }));
    }catch(_){ }
  });
})();
</script>
