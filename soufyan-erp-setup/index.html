        <div class="note">${ico("info")}<div>${esc(t("s5_noStore"))}</div></div>`,
      onMount(m){ $$("#e_pin1,#e_pin2", m).forEach(i => i.addEventListener("input", () => i.value = i.value.replace(/\D/g, ""))); },
      actions:[
        { label:t("cancel"), variant:"btn-ghost" },
        { label:t("save"), variant:"btn-primary", icon:"check", onClick:(m) => {
            const a = $("#e_pin1", m).value, b = $("#e_pin2", m).value, errs = {};
            if(!a) errs.pin1 = t("errRequired"); else if(!RX.pin.test(a)) errs.pin1 = t("errPin");
            if(!b) errs.pin2 = t("errRequired"); else if(a !== b) errs.pin2 = t("errPinMatch");
            if(!paintErrors(m, errs)) return;
            Secrets.empPin[emp.id] = a;
            Employees.update(emp.id, { pinSet:true, needsPin:false });
            Toast.show(t("e_pinOk"), "ok"); Modal.close(); Wizard.renderStep(false);
          } }
      ]
    });
  },
  /** PermissionSelector + PermissionMatrix */
  perms(emp){
    const draft = { role:emp.role, matrix: JSON.parse(JSON.stringify(Permissions.effective(emp))) };
    const matrixHtml = () => MODULES.map(m => `<div class="perm-mod">
        <div class="perm-head"><span class="c-ico">${ico(m.icon)}</span><b>${esc(t("mod_" + m.id))}</b>
          <span class="perm-count" data-count="${m.id}">${(draft.matrix[m.id] || []).length}/${m.actions.length}</span></div>
        <div class="perm-body">${m.actions.map(a =>
          `<button type="button" class="perm-chip" data-mod="${m.id}" data-actn="${a}"
            aria-pressed="${Permissions.has(draft.matrix, m.id, a) ? "true" : "false"}">${esc(t("act_" + a))}</button>`).join("")}</div>
      </div>`).join("");
    Modal.open({
      title:t("e_permTitle", { n:emp.name }), desc:t("e_permDesc"),
      body:`<div class="field"><label>${esc(t("e_role"))}</label>
          <div class="role-grid" role="radiogroup" aria-label="${esc(t("e_role"))}">${ROLE_IDS.map(r =>
            `<button type="button" class="choice" data-compact="1" role="radio" data-role="${r}"
              aria-checked="${draft.role === r ? "true" : "false"}">
              <span class="c-txt"><b>${esc(t("role_" + r))}</b><span>${esc(t("role_" + r + "_d"))}</span></span>
              <span class="c-mark">${ico("check")}</span></button>`).join("")}</div></div>
        <div class="perm-wrap" data-matrix>${matrixHtml()}</div>
        <div class="note">${ico("info")}<div>${esc(t("e_permNote"))}</div></div>`,
      onMount(m){
        const repaint = () => {
          $("[data-matrix]", m).innerHTML = matrixHtml();
          bindMatrix();
        };
        const bindMatrix = () => {
          $$("[data-mod]", m).forEach(b => b.addEventListener("click", () => {
            draft.matrix = Permissions.toggle(draft.matrix, b.dataset.mod, b.dataset.actn);
            b.setAttribute("aria-pressed", Permissions.has(draft.matrix, b.dataset.mod, b.dataset.actn) ? "true" : "false");
            const mod = MODULES.find(x => x.id === b.dataset.mod);
            $(`[data-count="${b.dataset.mod}"]`, m).textContent = (draft.matrix[b.dataset.mod] || []).length + "/" + mod.actions.length;
            if(draft.role !== "custom"){
              draft.role = "custom";
              $$("[data-role]", m).forEach(r => r.setAttribute("aria-checked", r.dataset.role === "custom" ? "true" : "false"));
            }
            // صلاحية تُفتح ⇒ الدرع يستجيب؛ تُغلق ⇒ نبضة تفاعل هادئة.
            if(b.getAttribute("aria-pressed") === "true") SetupIllustration.triggerAttention("shield");
            else SetupIllustration.setState("interaction");
          }));
        };
        $$("[data-role]", m).forEach(b => b.addEventListener("click", () => {
          draft.role = b.dataset.role;
          $$("[data-role]", m).forEach(r => r.setAttribute("aria-checked", r === b ? "true" : "false"));
          if(b.dataset.role !== "custom") draft.matrix = Permissions.roleMatrix(b.dataset.role);
          repaint();
          SetupIllustration.triggerAttention("modules");
        }));
        bindMatrix();
      },
      actions:[
        { label:t("cancel"), variant:"btn-ghost" },
        { label:t("save"), variant:"btn-primary", icon:"check", onClick:() => {
            Employees.update(emp.id, { role:draft.role, permissions:draft.matrix });
            Toast.show(t("e_permOk"), "ok"); Modal.close(); Wizard.renderStep(false);
          } }
      ]
    });
  },
  async del(emp){
    const ok = await Modal.confirm({
      title:t("e_delTitle", { n:emp.name }), body:t("e_delBody"), confirmLabel:t("e_delConfirm"), danger:true
    });
    if(!ok) return;
    Employees.remove(emp.id);
    Toast.show(t("e_delOk"), "ok"); Wizard.renderStep(false);
  },
  bindList(root){
    $$("[data-emp]", root).forEach(li => {
      const emp = Employees.get(li.dataset.emp); if(!emp) return;
      $$("[data-act]", li).forEach(b => b.addEventListener("click", async () => {
        const a = b.dataset.act;
        if(a === "edit") this.form(emp);
        else if(a === "pin") this.pin(emp);
        else if(a === "perm") this.perms(emp);
        else if(a === "del") this.del(emp);
        else if(a === "toggle"){
          const dis = emp.status === "disabled";
          if(!dis){
            const ok = await Modal.confirm({ title:t("e_disTitle", { n:emp.name }), body:t("e_disBody"), confirmLabel:t("e_disable") });
            if(!ok) return;
          }
          Employees.setDisabled(emp.id, !dis);
          Toast.show(dis ? t("e_enabled") : t("e_disabled"), "ok");
          Wizard.renderStep(false);
        }
      }));
    });
  }
};

/** EmployeeVerification — دورة OTP كاملة للموظف */
const EmployeeVerification = {
  open(emp){
    let otp = null, timer = null, endAt = 0, sent = false;
    const body = `<div class="email-line"><div class="mono email-val">${esc(emp.email)}</div>
        <span class="badge" data-tone="pending">${esc(t("st_pending"))}</span></div>
      <div data-stage><button type="button" class="btn btn-primary" data-send>${ico("mail")}<span class="btn-label">${esc(t("s12_send"))}</span></button>
      <p class="hint" style="margin-top:10px">${esc(t("s12_sendHint"))}</p></div>`;
    const m = Modal.open({
      title:t("s12_title2", { n:emp.name }), desc:t("s12_desc"), body,
      actions:[{ label:t("close"), variant:"btn-ghost" }],
      onMount(mm){
        const stage = $("[data-stage]", mm);
        const status = (tone, msg, busy) => {
          const el = $("[data-status]", mm); if(!el) return;
          el.dataset.tone = tone;
          el.innerHTML = (busy ? `<span class="spin"></span>` : tone === "ok" ? ico("check") : tone === "err" ? ico("alert") : ico("clock")) + `<span>${esc(msg)}</span>`;
          announce(msg);
        };
        const tick = () => {
          const el = $("[data-count]", mm); if(!el) return;
          const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
          el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
          const rs = $("[data-resend]", mm);
          if(left <= 0){ clearInterval(timer); if(otp){ otp.setState("expired"); status("err", t("s4_expired")); } if(rs) rs.disabled = false; }
          else if(rs) rs.disabled = left > CONFIG.otpTtl - 20;
        };
        const verify = async () => {
          if(!otp || otp.value().length < 6) return;
          otp.setState("verifying"); status("busy", t("s4_verifying"), true);
          try{
            const res = await OtpService.verify(emp.email, otp.value(), "employee:" + emp.id);
            if(res.ok){
              clearInterval(timer); otp.setState("verified"); otp.disable(true);
              Employees.setVerification(emp.id, { status:"verified", method: res.mode === "server" ? "server" : "local-demo", verifiedAt:nowISO() });
              status("ok", t("s12_verified"));
              Toast.show(t("s12_verifiedFor", { n:emp.name }), "ok");
              setTimeout(() => { Modal.close(); Wizard.renderStep(false);
                if(!emp.pinSet) setTimeout(() => EmployeeUI.pin(Employees.get(emp.id)), 320); }, 800);
            }else{
              otp.setState(res.reason === "expired" ? "expired" : "invalid");
              status("err", res.reason === "expired" ? t("s4_expired") : t("s4_invalid"));
              otp.clear(); otp.focusFirst();
            }
          }catch(_){ otp.setState("invalid"); status("err", t("s4_netFail")); }
        };
        const send = async (again) => {
          const btn = $("[data-send]", mm) || $("[data-resend]", mm);
          if(btn){ btn.disabled = true; btn.dataset.busy = "1"; }
          try{
            const res = await OtpService.send(emp.email, "employee:" + emp.id);
            Employees.setVerification(emp.id, { status:"sent", sentAt:nowISO() });
            endAt = Date.now() + (res.expiresIn || CONFIG.otpTtl) * 1000;
            stage.innerHTML = `${res.mode === "local" ? `<div class="demo-code">${ico("alert")}<div><b>${esc(t("s4_demoTitle"))}</b>
                <span class="mono demo-val">${esc(res.demoCode)}</span><p>${esc(t("s4_demoBody"))}</p></div></div>` : ""}
              <div data-otp-mount></div>
              <div class="otp-status" data-status data-tone="busy"></div>
              <div class="otp-meta"><span>${ico("clock")} ${esc(t("s4_expiresIn"))} <b class="countdown" data-count>--:--</b></span>
                <button type="button" class="btn btn-quiet btn-sm" data-resend disabled>${ico("refresh")}<span class="btn-label">${esc(t("s4_resend"))}</span></button></div>
              <button type="button" class="btn btn-primary" data-verify disabled>${ico("shieldCheck")}<span class="btn-label">${esc(t("s4_verify"))}</span></button>`;
            otp = new OtpInput({ mount:$("[data-otp-mount]", mm),
              onChange:v => { $("[data-verify]", mm).disabled = v.length < 6; }, onComplete:verify });
            status("busy", t("s4_waiting")); otp.focusFirst();
            clearInterval(timer); tick(); timer = setInterval(tick, 500);
            $("[data-verify]", mm).addEventListener("click", verify);
            $("[data-resend]", mm).addEventListener("click", () => send(true));
            if(again) Toast.show(t("s4_resent"), "ok");
          }catch(_){
            Toast.show(t("s4_sendFail"), "err");
            if(btn){ btn.disabled = false; btn.dataset.busy = ""; }
          }
        };
        $("[data-send]", mm).addEventListener("click", () => send(false));
      }
    });
    Modal._onClose = () => clearInterval(timer);
    return m;
  }
};

const TASKS = ["workspace", "store", "permissions", "inventory", "products", "defaults", "finalize"];
STEPS.push({
  id:"preparing", phase:3, svg:"preparing", hideBack:true, hideNext:true, kind:"system",
  title:() => t("s17_title"), lede:() => t("s17_lede"), eyebrow:() => t("s17_eyebrow"),
  body(){
    const st = SetupState.data.setupStatus.tasks || {};
    return `<div class="progress-line" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-bar><i></i></div>
      <p class="hint" data-prog-txt>${esc(t("s17_wait"))}</p>
      <ul class="tasks" data-tasks>${TASKS.map(k => `<li class="task" data-task="${k}" data-state="${st[k] || "pending"}">
        <span class="t-ico">${ico("clock")}</span><b>${esc(t("tk_" + k))}</b>
        <span class="t-tail"></span></li>`).join("")}</ul>
      <div data-fail hidden>${F.note(`<b data-fail-title></b><br><span data-fail-msg></span>`, "err")}
        <button type="button" class="btn btn-primary" data-retry style="margin-top:12px">${ico("refresh")}<span class="btn-label">${esc(t("retry"))}</span></button></div>`;
  },
  mount(root){
    const bar = $("[data-bar] i", root), barBox = $("[data-bar]", root), txt = $("[data-prog-txt]", root);
    const failBox = $("[data-fail]", root);
    const setTask = (k, s) => {
      const li = $(`[data-task="${k}"]`, root); if(!li) return;
      li.dataset.state = s;
      $(".t-ico", li).innerHTML = s === "complete" ? ico("check") : s === "processing" ? `<span class="spin"></span>`
        : s === "error" ? ico("alert") : ico("clock");
      if(s === "complete") Spring.pop($(".t-ico", li), .45);
      if(s === "processing" && HAS_GSAP && !reducedMotion())
        gsap.fromTo(li, { x:-8, opacity:.75 }, { x:0, opacity:1, duration:.45, ease:"clay", clearProps:"all" });
      const tasks = SetupState.data.setupStatus.tasks || {};
      tasks[k] = s; SetupState.data.setupStatus.tasks = tasks; SetupState.save();
    };
    const progress = () => {
      const done = TASKS.filter(k => (SetupState.data.setupStatus.tasks || {})[k] === "complete").length;
      const pct = Math.round(done / TASKS.length * 100);
      if(HAS_GSAP && !reducedMotion()) gsap.to(bar, { width:pct + "%", duration:.7, ease:"power3.out" });
      else bar.style.width = pct + "%";
      SetupIllustration.progress(done / TASKS.length);     // الرسمة تعرض التقدّم نفسه
      barBox.setAttribute("aria-valuenow", String(pct));
      txt.textContent = t("s17_prog", { d: fmtNum(done), n: fmtNum(TASKS.length) });
    };
    const run = async () => {
      failBox.hidden = true;
      SetupIllustration.setState("processing");
      for(const k of TASKS){
        if((SetupState.data.setupStatus.tasks || {})[k] === "complete") continue;
        setTask(k, "processing"); announce(t("tk_" + k));
        try{
          await SetupService.run(k, SetupState.data);
          setTask(k, "complete"); progress();
        }catch(err){
          setTask(k, "error");
          failBox.hidden = false;
          $("[data-fail-title]", failBox).textContent = t("s17_failT", { s: t("tk_" + k) });
          $("[data-fail-msg]", failBox).textContent = err && err.code === "no-server" ? t("s17_failNet")
            : (err && err.status ? t("s17_failHttp", { c: err.status }) : t("s17_failGen"));
          SetupIllustration.setState("error");
          announce(t("s17_failT", { s: t("tk_" + k) }));
          $("[data-retry]", failBox).focus();
          return;
        }
      }
      SetupState.data.setupStatus.completed = true;
      SetupState.data.setupStatus.completedAt = nowISO();
      SetupState.markComplete("preparing"); SetupState.saveNow();
      SetupIllustration.setState("success");
      await wait(reducedMotion() ? 100 : 700);
      Wizard.goTo(Wizard.indexOf("complete"), true);
    };
    $("[data-retry]", root).addEventListener("click", run);
    // لا تتابع دخول هنا: الكتلة دخلت مع الخطوة، والحركة البطلة لهذه الشاشة
    // هي تقدّم المهام نفسه — مهمة واحدة تتحرّك في كل لحظة.
    progress();
    setTimeout(run, reducedMotion() ? 60 : 420);
  }
});

   --------------------------------------------------------------------------
   الخطوات الثماني عشرة تبقى كما هي: منطق العمل والتحقق لم يتغيّر. ما تغيّر هو
   طريقة تقديمها: المستخدم يرى أربع مراحل، ويرى داخل مرحلته موقعه منها فقط.
   كما يقرّر Flow أي خطوة تظهر أصلًا (`when`)، وأيها إلزامية وأيها يمكن تأجيلها.
   ========================================================================== */
const Flow = {
  /** الخطوات الظاهرة فعلًا لهذا المستخدم — الإعداد يتكيّف مع إجاباته. */
  visible(){ return STEPS.filter(s => !s.when || s.when()); },
  /** خطوات المحتوى: ما عدا الترحيب والمراجعة والتهيئة والاكتمال. */
  isContent(s){ return !s.kind; },
  content(){ return this.visible().filter(s => this.isContent(s)); },
  stageSteps(phase){ return this.content().filter(s => s.phase === phase); },

  /** اسم قصير للقوائم: «المخزون» بدل «كيف تتابع أجهزتك؟». */
  label(s){ try{ return s.eyebrow ? s.eyebrow() : s.title(); }catch(_){ return s.title(); } },

  isDone(s){ return SetupState.data.completedSteps.includes(s.id); },
  isSkipped(s){ return (SetupState.data.skippedSteps || []).includes(s.id); },
  isSettled(s){ return this.isDone(s) || this.isSkipped(s); },

  /** موقع الخطوة داخل مرحلتها — «الخطوة ٢ من ٥» بدل «٧ من ١٨». */
  positionInStage(step){
    const list = this.stageSteps(step.phase);
    const n = list.findIndex(s => s.id === step.id);
    return { n: n + 1, of: list.length, inStage: n >= 0 };
  },

  /** نسبة إنجاز مرحلة: المكتمل وحده يُحتسب، والمؤجَّل لا يُحتسب مكتملًا. */
  stagePct(phase){
    const list = this.stageSteps(phase);
    if(!list.length) return 100;
    return Math.round(list.filter(s => this.isDone(s)).length / list.length * 100);
  },
  stageState(phase, curPhase){
    const list = this.stageSteps(phase);
    if(list.length && list.every(s => this.isDone(s))) return "done";
    if(phase === curPhase) return "current";
    return phase < curPhase ? "partial" : "todo";
  },

  /** نسبة الإعداد كاملًا — هي الرقم الذي تعرضه بطاقة «إكمال الإعداد». */
  percent(){
    const list = this.content();
    if(!list.length) return 100;
    return Math.round(list.filter(s => this.isDone(s)).length / list.length * 100);
  },

  /** خطوات إلزامية لم تُنجَز بعد — هذه وحدها تمنع الدخول إلى النظام. */
  requiredPending(){ return this.content().filter(s => s.required && !this.isDone(s)); },
  /** خطوات اختيارية مؤجَّلة أو لم تُفتح — تُعرض كـ«بقي» بعد الدخول. */
  optionalPending(){ return this.content().filter(s => !s.required && !this.isDone(s)); },
  canFinish(){ return this.requiredPending().length === 0; },

  /** بقية الخطوات الاختيارية في المرحلة الحالية — زر «إكمال لاحقًا». */
  restOfStage(step){
    const list = this.stageSteps(step.phase);
    const from = list.findIndex(s => s.id === step.id);
    return from < 0 ? [] : list.slice(from).filter(s => !s.required && !this.isDone(s));
  },

  /** أول خطوة غير منجَزة — وجهة زر «إكمال الإعداد». */
  nextPending(){
    return this.requiredPending()[0] || this.optionalPending()[0] || null;
  },

  /** ملخّص يُسلَّم إلى النظام بعد الدخول ليعرض بطاقة الإكمال بنفسه. */
  snapshot(){
    return {
      percent: this.percent(),
      complete: this.optionalPending().length === 0 && this.canFinish(),
      remaining: this.optionalPending().map(s => ({ id:s.id, title:this.label(s), stage: PHASES[s.phase].id })),
      stages: PHASES.map((p, i) => ({
        id: p.id, name: t(p.name), percent: this.stagePct(i),
        steps: this.stageSteps(i).map(s => ({ id:s.id, title:this.label(s), done:this.isDone(s), skipped:this.isSkipped(s) }))
      }))
    };
  },

  /** IMEI ليس إلزاميًا لكل نشاط: محل إكسسوارات فقط لا يحتاجه. */
  needsImei(){
    const a = SetupState.data.businessSettings.activities || [];
    return ["sell_phones", "buy_phones", "exchange"].some(k => a.includes(k));
  },
  hasTeam(){ return SetupState.data.employees.length > 0; }
};


/**
 * بطاقة «إعداد متجرك» — حلقة النسبة وما تبقّى من خطوات اختيارية.
 * تُعرض على شاشة الاكتمال، وتُصدَّر عبر ERPSetup.progressCard ليعرضها النظام
 * نفسه بعد الدخول دون إعادة بنائها هناك.
 */
function renderProgressCard(host, opts){
  opts = opts || {};
  if(!host) return null;
  const pct = Flow.percent();
  const rest = Flow.optionalPending();
  const R = 28, C = 2 * Math.PI * R;
  const draw = () => {
    host.innerHTML = `<section class="prog-card">
      <div class="prog-top">
        <div class="prog-ring" role="img" aria-label="${esc(t("stagePct", { p: fmtNum(pct) }))}">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="${R}"></circle>
            <circle class="fill" cx="32" cy="32" r="${R}"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}"></circle>
          </svg>
          <b>${esc(fmtNum(pct))}%</b>
        </div>
        <div class="prog-head">
          <b>${esc(t("progT"))}</b>
          <span>${esc(rest.length ? t("stagePct", { p: fmtNum(pct) }) : t("progDoneD"))}</span>
        </div>
      </div>
      ${rest.length ? `<ul class="prog-remain">
        <b>${esc(t("progRemain"))}</b>
        ${rest.map(s => {
          const label = Flow.label(s), stage = t(PHASES[s.phase].name);
          return `<li>${esc(label)}${label === stage ? "" : `<span class="st">${esc(stage)}</span>`}</li>`;
        }).join("")}
      </ul>
      <button type="button" class="btn ${opts.cta === "primary" ? "btn-primary" : "btn-ghost"}" data-prog-go>${ico("next")}<span class="btn-label">${esc(t("progCta"))}</span></button>`
      : `<p class="hint">${esc(t("progDone"))}</p>`}
    </section>`;
    const go = $("[data-prog-go]", host);
    if(go) go.addEventListener("click", () => {
      const target = Flow.nextPending();
      if(!target) return;
      const idx = Wizard.indexOf(target.id);
      if(idx >= 0) Wizard.goTo(idx, true);
    });
  };
  draw();
  return { refresh: draw, percent: pct, remaining: rest.map(s => s.id) };
}

/** قائمة المراحل على شاشة الاكتمال: ما اكتمل فعلًا، وما بقي ناقصًا. */
function stageChecklist(){
  return `<ul class="done-list">${PHASES.map((p, i) => {
    const list = Flow.stageSteps(i);
    if(!list.length) return "";
    const done = list.filter(s => Flow.isDone(s)).length;
    const full = done === list.length;
    return `<li data-state="${full ? "done" : "partial"}">
      <span class="d-ico" aria-hidden="true">${full ? ico("check") : ico("clock")}</span>
      <b>${esc(t(p.name))}</b>
      <span class="d-tag">${esc(full ? t("stageDone") : done ? t("stageOf", { a: fmtNum(done), b: fmtNum(list.length) }) : t("stageNone"))}</span>
    </li>`;
  }).join("")}</ul>`;
}

  s18_doneBody:["أُطلق الحدث erp:setup-complete ومعه ملف الإعداد الكامل، ويمكنك الاستماع له في تطبيقك.","The erp:setup-complete event was dispatched with the full config; your app can listen for it."]
});

/* ==========================================================================
   14) WebAuthn — أدوات ترميز فقط (التسجيل الحقيقي يتم عبر الخادم)
   ========================================================================== */
const PasskeyUtil = {
  b64uToBuf(s){
    const p = s.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(p + "=".repeat((4 - p.length % 4) % 4));
    const b = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b.buffer;
  },
  bufToB64u(b){
    const bytes = new Uint8Array(b); let s = "";
    for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  },
  decode(payload){
    const o = JSON.parse(JSON.stringify(payload.publicKey || payload));
    o.challenge = this.b64uToBuf(o.challenge);
    if(o.user && o.user.id) o.user.id = this.b64uToBuf(o.user.id);
    if(Array.isArray(o.excludeCredentials))
      o.excludeCredentials = o.excludeCredentials.map(c => Object.assign({}, c, { id:this.b64uToBuf(c.id) }));
    return o;
  },
  encode(cred){
    return { id:cred.id, type:cred.type, rawId:this.bufToB64u(cred.rawId), response:{
      clientDataJSON:this.bufToB64u(cred.response.clientDataJSON),
      attestationObject:this.bufToB64u(cred.response.attestationObject) } };
  }
};

/* ==========================================================================
   15) Wizard — التحكم بالتنقل والعرض
   ========================================================================== */
const Wizard = {
  i:0, cleanups:[], root:null, _pct:{},
  /** التنقّل يجري على الخطوات الظاهرة فقط — الإعداد يتكيّف مع إجابات المستخدم. */
  list(){ return Flow.visible(); },
  indexOf(id){ return this.list().findIndex(s => s.id === id); },
  step(){ const l = this.list(); return l[clamp(this.i, 0, l.length - 1)]; },
  /** الخطوة التالية/السابقة تتخطّى ما أجّله المستخدم — لا يُعاد إليه ما رفضه للتوّ. */
  seek(from, dir){
    const l = this.list();
    for(let k = from; k >= 0 && k < l.length; k += dir) if(!Flow.isSkipped(l[k])) return k;
    return clamp(from, 0, l.length - 1);
  },
  registerCleanup(fn){ this.cleanups.push(fn); },
  _runCleanups(){ this.cleanups.forEach(f => { try{ f(); }catch(_){ } }); this.cleanups = []; },

  init(){
    const l = this.list();
    const saved = SetupState.data.currentStepId;
    let idx = saved ? l.findIndex(s => s.id === saved) : -1;
    if(idx < 0) idx = clamp(SetupState.data.currentStep || 0, 0, l.length - 1);
    this.i = idx;
    if(this.step().id === "preparing") this.i = this.indexOf("review");   // لا نستأنف داخل التهيئة
    this.renderChrome();
    this.renderStep(false);
    document.addEventListener("keydown", e => {
      if(e.key === "Enter" && !e.shiftKey){
        const el = e.target;
        if(el && el.tagName === "INPUT" && el.type !== "file" && !el.closest("[data-tokens]") && !el.closest(".otp") && $("#modal").hidden){
          const nb = $("[data-next]"); if(nb && !nb.disabled){ e.preventDefault(); this.next(); }
        }
      }
    });
  },

  /** الرأس صار مشتركًا بين الإعداد والبوابة، فيرسمه Chrome بحسب السطح. */
  renderChrome(){
    Chrome.render();
    this.renderPhases();
  },

  /** شريط المراحل: أربع مراحل، لا ثماني عشرة خطوة. */
  renderPhases(){
    const s = this.step();
    const cur = s.phase;
    const pos = Flow.positionInStage(s);
    const host = $("#phases");
    const next = {};
    const rail = PHASES.map((p, idx) => {
      const state = Flow.stageState(idx, cur);
      const pct = state === "current" || state === "todo" ? Flow.stagePct(idx)
        : state === "done" ? 100 : Flow.stagePct(idx);
      next[idx] = pct;
      const reachable = idx <= cur || Flow.stageSteps(idx).some(x => Flow.isSettled(x));
      const label = `${t(p.name)} — ${t("stagePct", { p: fmtNum(pct) })}`;
      return `<li class="phase" data-state="${state}"${idx === cur ? ' aria-current="step"' : ""}>
        <button type="button" class="phase-btn" data-stage="${idx}"${reachable ? "" : " disabled"} aria-label="${esc(label)}">
          <span class="phase-dot" aria-hidden="true">${state === "done" ? ico("check") : pad2(idx + 1)}</span>
          <span class="phase-name">${esc(t(p.name))}</span>
        </button>
        <span class="phase-bar"><i class="phase-fill" style="width:${this._pct[idx] === undefined ? pct : this._pct[idx]}%"></i></span>
      </li>`;
    }).join("");

    host.innerHTML = `<ol class="phase-rail">${rail}</ol>
      <p class="phase-now">
        <b>${esc(t(PHASES[cur].name))}</b>
        <span>${pos.inStage ? esc(t("stageStep", { a: fmtNum(pos.n), b: fmtNum(pos.of) })) : esc(t(s.kind === "review" ? "s16_eyebrow" : s.kind === "intro" ? "w_eyebrow" : "s17_eyebrow"))}</span>
      </p>`;

    // الشريط يتحرّك فقط حين تتغيّر قيمته — لا حركة تُعاد مع كل رسم.
    $$(".phase-fill", host).forEach((f, idx) => {
      const to = next[idx], from = this._pct[idx];
      if(from === to) return;
      if(HAS_GSAP && !reducedMotion() && from !== undefined)
        gsap.fromTo(f, { width: from + "%" }, { width: to + "%", duration:.6, ease:"power3.out" });
      else f.style.width = to + "%";
    });
    this._pct = next;
    $$("[data-stage]", host).forEach(b => b.addEventListener("click", () => this.goToStage(+b.dataset.stage)));
  },

  /** الانتقال إلى مرحلة: أول خطوة غير منجَزة فيها، وإلا أوّلها. */
  goToStage(phase){
    const steps = Flow.stageSteps(phase);
    if(!steps.length) return;
    const target = steps.find(x => !Flow.isSettled(x)) || steps[0];
    const idx = this.indexOf(target.id);
    if(idx >= 0) this.goTo(idx, phase <= this.step().phase);
  },

  renderNav(){
    const s = this.step();
    const canBack = !s.hideBack && this.i > 0;
    const canSkip = !!s.optional && !s.hideNext;
    const pos = Flow.positionInStage(s);
    $("#navRow").innerHTML = `
      ${canBack ? `<button class="btn btn-ghost" data-back>${ico("prev")}<span class="btn-label">${esc(t("back"))}</span></button>` : ""}
      <span class="nav-spacer"></span>
      ${pos.inStage ? `<span class="step-count">${t("stageStep", { a: fmtNum(pos.n), b: fmtNum(pos.of) })}</span>` : ""}
      ${canSkip ? `<button class="btn btn-quiet" data-skip>${esc(t("skipStep"))}</button>` : ""}
      ${s.hideNext ? "" : `<button class="btn btn-primary${s.kind === "intro" || s.kind === "review" ? " btn-lg" : ""}" data-next>
        <span class="btn-label">${esc(t(s.nextLabel || "next"))}</span>${ico(s.nextIcon || "next")}</button>`}`;
    const b = $("[data-back]"), n = $("[data-next]"), sk = $("[data-skip]");
    if(b) b.addEventListener("click", () => this.back());
    if(n) n.addEventListener("click", () => this.next());
    if(sk) sk.addEventListener("click", () => this.skip());
  },
  refreshNav(){ this.renderNav(); },

  /** لافتة «إكمال لاحقًا» — تظهر مرة واحدة عند أول خطوة اختيارية في المرحلة. */
  laterBanner(s){
    if(!s.optional) return "";
    const rest = Flow.restOfStage(s);
    if(rest.length < 2) return "";
    return `<div class="later-card">
      <span class="c-ico" aria-hidden="true">${ico("clock")}</span>
      <div class="later-txt">
        <b>${esc(t("laterTitle"))}</b>
        <span>${esc(t("laterBody", { n: nSteps(rest.length), s: t(PHASES[s.phase].name) }))}</span>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" data-later>${esc(t("laterCta"))}</button>
    </div>`;
  },

  async renderStep(animate = true){
    this._runCleanups();
    const s = this.step();
    const host = $("#stepHost");
    const useGsap = HAS_GSAP && !reducedMotion();
    const pos = Flow.positionInStage(s);
    const eyebrow = `${ico(PHASES[s.phase].icon)}<span>${esc(t(PHASES[s.phase].name))}</span>${
      pos.inStage ? `<i aria-hidden="true">·</i><span>${esc(t("stageStep", { a: fmtNum(pos.n), b: fmtNum(pos.of) }))}</span>` : ""}${
      s.optional ? `<em class="opt-flag">${esc(t("optional"))}</em>` : ""}`;
    const html = `<section class="step" data-step="${s.id}"${animate && !useGsap ? ' data-enter="1"' : ""} aria-labelledby="stepTitle">
      <span class="step-eyebrow">${eyebrow}</span>
      <h1 id="stepTitle" tabindex="-1">${esc(s.title())}</h1>
      <p class="lede">${esc(s.lede())}</p>
      ${this.laterBanner(s)}
      <div class="step-body step-scroll">${s.body()}</div>
    </section>`;
    host.innerHTML = html;
    this.root = $(".step", host);
    if(s.section) bindFields(this.root, s.section);
    else bindFields(this.root, "preferences");
    const later = $("[data-later]", this.root);
    if(later) later.addEventListener("click", () => this.finishStageLater());
    if(s.mount) s.mount.call(s, this.root);
    this.renderNav(); this.renderPhases();
    if(animate && useGsap) this.animateIn();
    SetupIllustration.show(s.svg, s.title());
    SetupState.data.currentStep = this.i;
    SetupState.data.currentStepId = s.id;
    SetupState.data.maxStep = Math.max(SetupState.data.maxStep || 0, this.i);
    SetupState.save();
    if(animate) setTimeout(() => { const h = $("#stepTitle"); if(h) h.focus({ preventScroll:true }); }, 120);
    announce(`${t(PHASES[s.phase].name)} — ${s.title()}`);
  },

  /** حركة بطلة واحدة: العنوان والشرح يدخلان بتتابع، والجسم يدخل ككتلة واحدة. */
  animateIn(){
    const el = this.root; if(!el) return;
    const head = [$(".step-eyebrow", el), $("#stepTitle", el), $(".lede", el)].filter(Boolean);
    const body = $(".step-body", el);
    gsap.killTweensOf([...head, body].filter(Boolean));
    const tl = gsap.timeline({ defaults:{ ease:"clay", duration:.56 } });
    tl.fromTo(head, { y:20, opacity:0 }, { y:0, opacity:1, stagger:.06, clearProps:"transform,opacity" }, 0);
    if(body) tl.fromTo(body, { y:22, opacity:0 }, { y:0, opacity:1, clearProps:"transform,opacity" }, .14);
    setTimeout(() => { if(tl.isActive() || tl.progress() < 1) tl.progress(1); }, 1400);
    return tl;
  },

  async next(){
    const s = this.step();
    const errs = s.validate ? s.validate.call(s, this.root) : {};
    if(!paintErrors(this.root, errs)){
      // العنصر المعنيّ وحده يهتزّ — لا الصفحة ولا الرسمة كاملة.
      SetupIllustration.triggerShake(typeof s.errLayer === "function" ? s.errLayer(errs) : s.errLayer);
      return;
    }
    if(s.onNext){ const ok = await s.onNext.call(s, this.root); if(ok === false) return; }
    SetupState.markComplete(s.id);
    if(this.i < this.list().length - 1) this.goTo(this.seek(this.i + 1, 1));
  },

  /** تخطّي خطوة اختيارية — تُسجَّل «مؤجَّلة» وتبقى في قائمة ما تبقّى. */
  skip(){
    const s = this.step();
    if(!s.optional) return;
    SetupState.markSkipped(s.id);
    Toast.show(t("skipped", { s: Flow.label(s) }), "info");
    if(this.i < this.list().length - 1) this.goTo(this.seek(this.i + 1, 1));
  },

  /** «إكمال لاحقًا» — تأجيل بقية الخطوات الاختيارية في هذه المرحلة دفعة واحدة. */
  finishStageLater(){
    const s = this.step();
    const rest = Flow.restOfStage(s);
    if(!rest.length) return;
    rest.forEach(x => SetupState.markSkipped(x.id));
    const l = this.list();
    const after = l.findIndex((x, i) => i > this.i && !rest.some(r => r.id === x.id));
    Toast.show(t("laterDone", { n: nSteps(rest.length) }), "info");
    this.goTo(after < 0 ? l.length - 1 : after, true);
  },

  back(){ if(this.i > 0) this.goTo(this.seek(this.i - 1, -1)); },

  goTo(idx, force){
    const l = this.list();
    if(idx < 0) return;
    idx = clamp(idx, 0, l.length - 1);
    if(idx === this.i) return;
    // الخطوات الإلزامية وحدها تمنع التقدّم؛ الاختيارية لا تحجز الطريق.
    if(!force && idx > this.i){
      for(let k = this.i; k < idx; k++){
        const st = l[k];
        if(st.kind || !st.required) continue;          // الاختيارية والمقدّمة والمراجعة لا تحجز الطريق
        if(!Flow.isDone(st)){ Toast.show(t("errBlocked"), "err"); return; }
      }
    }
    const stepEl = $(".step");
    const go = () => { this.i = idx; this.renderStep(true); window.scrollTo({ top:0, behavior: reducedMotion() ? "auto" : "smooth" }); };
    if(stepEl && HAS_GSAP && !reducedMotion()){
      let fired = false;
      const once = () => { if(fired) return; fired = true; go(); };
      const kids = [$(".step-eyebrow", stepEl), $("#stepTitle", stepEl), $(".lede", stepEl), $(".step-body", stepEl)].filter(Boolean);
      gsap.killTweensOf(kids);
      gsap.to(kids, { y:-14, opacity:0, duration:.22, ease:"power2.in",
        stagger:{ amount:.08, from: idx > this.i ? "start" : "end" }, onComplete: once });
      setTimeout(once, 420);        // الانتقال مضمون حتى لو توقّف إطار الرسم (تبويب مخفي مثلًا)
    }else if(stepEl && !reducedMotion()){ stepEl.dataset.leave = "1"; setTimeout(go, 180); }
    else go();
  },

  async confirmReset(){
    const ok = await Modal.confirm({ title:t("resetTitle"), body:t("resetBody"), confirmLabel:t("resetSetup"), danger:true });
    if(!ok) return;
    Secrets.ownerPassword = ""; Secrets.ownerPin = ""; Secrets.empPin = {};
    ["workspace","store","permissions","inventory","catalog","defaults","config","setup_completed"].forEach(k => LocalDB.del(k));
    SetupState.reset();
    this.i = 0; this._pct = {}; LANG = "ar"; Lang.set("ar"); Theme.apply("light");
    this.renderChrome(); this.renderStep(true);
    Toast.show(t("resetDone"), "ok");
  }
};
