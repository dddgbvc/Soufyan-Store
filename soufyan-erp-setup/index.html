/* ==========================================================================
   4) طبقة الخدمات — نقاط ربط نظيفة بالخادم (بلا توثيق وهمي)
   ========================================================================== */
const Api = {
  base(){ return CONFIG.apiBaseUrl.replace(/\/+$/, ""); },
  async post(path, body){
    if(!HAS_SERVER){ const e = new Error("no-server"); e.code = "no-server"; throw e; }
    const res = await fetch(this.base() + path, {
      method:"POST", headers:{ "Content-Type":"application/json" },
      credentials:"include", body: JSON.stringify(body)
    });
    let data = null; try{ data = await res.json(); }catch(_){}
    if(!res.ok){ const e = new Error("http-" + res.status); e.code = "http"; e.status = res.status; e.data = data; throw e; }
    return data || {};
  }
};

/**
 * OtpService
 *  - مع خادم: كل شيء يجري على الخادم، ولا يُعرض الرمز ولا يُسجَّل أبدًا.
 *  - بلا خادم: وضع محلي معلَن بوضوح — تجربة الواجهة فقط، ويُسجَّل في الملخّص أنه ليس توثيقًا حقيقيًا.
 */
const OtpService = {
  mode: HAS_SERVER ? "server" : "local",
  _local: new Map(),
  _key(scope, email){ return scope + "|" + String(email).toLowerCase().trim(); },
  async send(email, scope = "owner"){
    if(HAS_SERVER){
      const r = await Api.post("/setup/otp/send", { email, scope });
      return { ok:true, mode:"server", expiresIn: r.expiresIn || CONFIG.otpTtl };
    }
    await wait(600);
    let n;
    if(window.crypto && window.crypto.getRandomValues){ const b = new Uint32Array(1); window.crypto.getRandomValues(b); n = b[0]; }
    else n = Math.floor(Math.random() * 4294967295);
    const code = String(n % 1000000).padStart(6, "0");
    this._local.set(this._key(scope, email), { code, exp: Date.now() + CONFIG.otpTtl * 1000, tries:0 });
    return { ok:true, mode:"local", expiresIn: CONFIG.otpTtl, demoCode: code };
  },
  async verify(email, code, scope = "owner"){
    if(HAS_SERVER){
      try{
        const r = await Api.post("/setup/otp/verify", { email, code, scope });
        return r.verified ? { ok:true, mode:"server" } : { ok:false, mode:"server", reason: r.reason || "invalid" };
      }catch(e){
        if(e.status === 410) return { ok:false, mode:"server", reason:"expired" };
        if(e.status === 400 || e.status === 401) return { ok:false, mode:"server", reason:"invalid" };
        throw e;
      }
    }
    await wait(700);
    const rec = this._local.get(this._key(scope, email));
    if(!rec) return { ok:false, mode:"local", reason:"expired" };
    if(Date.now() > rec.exp){ this._local.delete(this._key(scope, email)); return { ok:false, mode:"local", reason:"expired" }; }
    if(rec.code !== String(code)){ rec.tries++; return { ok:false, mode:"local", reason:"invalid" }; }
    this._local.delete(this._key(scope, email));
    return { ok:true, mode:"local" };
  }
};

/** SetupService — تنفيذ عمليات التهيئة (عمل حقيقي محليًا، أو استدعاء الخادم إن وُجد) */
const SetupService = {
  async run(taskId, state){
    if(HAS_SERVER){
      const r = await Api.post("/setup/provision", { task: taskId, payload: SetupState.exportConfig() });
      return r || { ok:true };
    }
    await wait(420 + Math.random() * 380);
    const d = state;
    switch(taskId){
      case "workspace": {
        const ws = { id:"ws_" + uid(), createdAt: nowISO(), name: d.storeData.storeName || d.storeData.shopName || "workspace",
          locale: d.preferences.language, timezone: d.preferences.timezone };
        LocalDB.put("workspace", ws); return { ok:true, id: ws.id };
      }
      case "store": LocalDB.put("store", Object.assign({}, d.storeData, { branches: d.storeData.branch ? [d.storeData.branch] : [] })); return { ok:true };
      case "permissions": {
        const map = {};
        d.employees.forEach(e => { map[e.id] = Permissions.effective(e); });
        map.__owner = Permissions.roleMatrix("manager");
        LocalDB.put("permissions", map); return { ok:true, count: Object.keys(map).length };
      }
      case "inventory": LocalDB.put("inventory", Object.assign({}, d.inventorySettings, {
        schema:{ device:["imei","serial","condition","brand","model","storage","color","cost","price"] } })); return { ok:true };
      case "products": LocalDB.put("catalog", { brands:d.productSettings.brands, storages:d.productSettings.storages,
        colors:d.productSettings.colors, categories:d.productSettings.categories,
        tree:"brand>model>storage>color>device>imei>condition" }); return { ok:true };
      case "defaults": LocalDB.put("defaults", { sales:d.salesSettings, customers:d.customerSettings,
        invoices:d.invoiceSettings, preferences:d.preferences, business:d.businessSettings }); return { ok:true };
      case "finalize": {
        const cfg = SetupState.exportConfig();
        LocalDB.put("config", cfg); LocalDB.put("setup_completed", true);
        return { ok:true };
      }
      default: return { ok:true };
    }
  }
};

/** تخزين محلي منفصل عن حالة المعالج — يمثّل "قاعدة بيانات" النظام في الوضع المحلي */
const LocalDB = {
  ns:"soufyan.erp.",
  put(k, v){ try{ localStorage.setItem(this.ns + k, JSON.stringify(v)); }catch(_){ } },
  get(k){ try{ return JSON.parse(localStorage.getItem(this.ns + k)); }catch(_){ return null; } },
  del(k){ try{ localStorage.removeItem(this.ns + k); }catch(_){ } }
};


/* ==========================================================================
   4.b) InvoiceTemplate — قالب الفاتورة الموجود في Supabase
   --------------------------------------------------------------------------
   القالب ليس مصمَّمًا هنا ولا مُعادًا رسمه. هو نفسه القالب الذي يطبع فواتير
   المحل في الإنتاج (`buildInvoice` + `buildDocumentPdf` داخل docgen)، وتستدعيه
   دالة `setup-invoice` على مشروع Supabase نفسه فتعيده PDF مملوءًا بما أدخله
   المستخدم في هذا المعالج. إن تعذّر الوصول تظهر حالة خطأ صريحة مع إعادة
   محاولة — ولا تُستبدل الفاتورة بتصميم بديل إطلاقًا.
   ========================================================================== */
const InvoiceTemplate = {
  _cache:null,          // { key, url, bytes }
  _inflight:null,

  configured(){ return !!(CONFIG.supabaseUrl && CONFIG.invoiceFunction); },
  endpoint(){ return CONFIG.supabaseUrl.replace(/\/+$/, "") + "/functions/v1/" + CONFIG.invoiceFunction; },

  /** يعرض المتصفّح ملفات PDF مضمّنة؟ الهواتف غالبًا لا، فنفتح الملف بدل كسر التخطيط. */
  canEmbed(){
    if(typeof navigator.pdfViewerEnabled === "boolean") return navigator.pdfViewerEnabled;
    return !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  },

  /** سلّة عرض من إعدادات المتجر نفسها: العلامات المختارة، وIMEI إن كان مفعّلًا. */
  _basket(){
    const d = SetupState.data;
    const brands = (d.productSettings.brands || []).filter(Boolean);
    const storage = (d.productSettings.storages || ["128GB"])[Math.min(2, (d.productSettings.storages || []).length - 1)] || "128GB";
    const withImei = !!(d.invoiceSettings.showImei && d.inventorySettings.trackImei);
    const maxDisc = Math.max(0, Math.min(90, +d.salesSettings.maxDiscount || 0));
    const models = {
      Apple:["iPhone 15 Pro Max", 1850000], Samsung:["Samsung Galaxy A55", 565000],
      Xiaomi:["Redmi Note 13 Pro", 420000], Infinix:["Infinix Note 40 Pro", 310000],
      Realme:["Realme 12 Pro", 395000], Honor:["Honor X9b", 445000],
      Oppo:["Oppo A98", 380000], Huawei:["Huawei nova 12", 520000], Nokia:["Nokia G42", 210000]
    };
    const devices = (brands.length ? brands : ["Samsung"]).slice(0, 2).map((b, i) => {
      const m = models[b] || [b + " " + storage, 350000];
      const price = m[1];
      const discount = i === 0 ? Math.round(price * maxDisc / 100 / 1000) * 1000 : 0;
      return {
        name: `${m[0]} ${storage}`,
        serials: withImei ? "35" + String(6789012345678 + i * 137) : "",
        qty:1, unit_price:price, discount, total: price - discount
      };
    });
    const accessories = (d.productSettings.categories || []).some(c => /إكسسوار|accessor/i.test(c))
      ? [{ name:"شاحن سريع 33W", serials:"", qty:2, unit_price:25000, discount:0, total:50000 }] : [];
    return devices.concat(accessories);
  },

  /** كل ما يُرسَل يأتي من حالة الإعداد الحيّة — لا قيم مخترعة. */
  payload(){
    const d = SetupState.data;
    const st = d.storeData, inv = d.invoiceSettings, pref = d.preferences;
    const items = this._basket();
    const total = items.reduce((s, x) => s + x.total, 0);
    const credit = !!d.salesSettings.credit;
    const paid = credit ? Math.round(total * .6 / 1000) * 1000 : total;
    const subtitle = [st.shopName, st.branch].filter(Boolean).join(" — ");
    const notes = [
      pref.currency !== "IQD" ? t("iv_curNote", { c: pref.currency }) : "",
      // أرقام لاتينية: القالب يطبع الأرقام هكذا، فلا نُدخل عليه صيغة أخرى.
      d.businessSettings.warrantyDays ? t("iv_warrantyNote", { d: String(d.businessSettings.warrantyDays) }) : ""
    ].filter(Boolean).join(" · ");
    return {
      store: {
        name: st.storeName || t("iv_storeFallback"),
        subtitle: subtitle || t("iv_subFallback"),
        // المدينة تُضاف فقط إن لم يكتبها المستخدم داخل العنوان أصلًا.
        address: [st.address, (st.city && st.address.indexOf(st.city) === -1) ? st.city : ""].filter(Boolean).join(" — "),
        phones: [st.phone, st.whatsapp].filter(Boolean),
        footer: inv.footer || st.storeName || ""
      },
      invoice: {
        number: (inv.prefix || "") + String(inv.start || 1).padStart(5, "0"),
        customer_name: inv.showCustomer ? t("iv_customer") : "",
        customer_phone: inv.showCustomer ? "07700000000" : "",
        payment_type: credit ? "DEBT" : "CASH",
        province: st.city || "",
        actor: d.ownerData.name || "",
        notes,
        created_at: nowISO(), created_time: nowISO(),
        total, paid, delivery: 0
      },
      items,
      meta: { actor: d.ownerData.name || "" }
    };
  },

  _key(payload){ return JSON.stringify(payload).replace(/"created_a?t?i?m?e?":"[^"]*"/g, ""); },

  /** الرابط المحفوظ إن كانت بيانات الإعداد لم تتغيّر — يمنع وميض تحميل بلا سبب. */
  cachedUrl(){
    if(!this._cache || !this.configured()) return null;
    return this._cache.key === this._key(this.payload()) ? this._cache.url : null;
  },

  /** يعيد { url, fresh } أو يرمي خطأ واضح — بلا بديل صامت. */
  async render(force){
    if(!this.configured()){ const e = new Error("not-configured"); e.code = "not-configured"; throw e; }
    const payload = this.payload();
    const key = this._key(payload);
    if(!force && this._cache && this._cache.key === key) return { url:this._cache.url, fresh:false };
    if(this._inflight && this._inflight.key === key && !force) return this._inflight.promise;

    const promise = (async () => {
      const headers = { "Content-Type":"application/json" };
      if(CONFIG.supabaseAnonKey){
        headers.Authorization = "Bearer " + CONFIG.supabaseAnonKey;
        headers.apikey = CONFIG.supabaseAnonKey;
      }
      const res = await fetch(this.endpoint(), { method:"POST", headers, body: JSON.stringify(payload) });
      if(!res.ok){
        let detail = "";
        try{ detail = (await res.json()).detail || ""; }catch(_){ }
        const e = new Error("http-" + res.status);
        e.code = "http"; e.status = res.status; e.detail = detail;
        throw e;
      }
      const blob = await res.blob();
      if(blob.type.indexOf("pdf") === -1 && blob.size < 1000){
        const e = new Error("bad-payload"); e.code = "bad-payload"; throw e;
      }
      if(this._cache && this._cache.url) URL.revokeObjectURL(this._cache.url);
      this._cache = { key, url: URL.createObjectURL(blob), bytes: blob.size };
      return { url:this._cache.url, fresh:true };
    })();

    this._inflight = { key, promise };
    try{ return await promise; }
    finally{ if(this._inflight && this._inflight.promise === promise) this._inflight = null; }
  }
};

/**
 * يرسم معاينة القالب داخل أي حاوية، مع حالات: تحميل · جاهز · فتح خارجي · خطأ.
 * تُستعمل في خطوة الفواتير وفي المراجعة معًا حتى لا يتكرّر التنفيذ.
 */
function renderInvoicePreview(host, opts){
  opts = opts || {};
  if(!host) return;
  const d = SetupState.data, inv = d.invoiceSettings;
  const chips = [
    ["store", t("iv_chStore"), !!d.storeData.storeName],
    ["phone", t("iv_chPhone"), !!d.storeData.phone],
    ["box", "IMEI", !!(inv.showImei && d.inventorySettings.trackImei)],
    ["users", t("iv_chCust"), !!inv.showCustomer],
    ["file", t("iv_chNo") + " " + (inv.prefix || "") + String(inv.start || 1).padStart(5, "0"), true],
    ["printer", t("iv_chFoot"), !!inv.footer]
  ];
  host.innerHTML = `<figure class="docpv">
      <figcaption class="docpv-head">
        <span class="c-ico">${ico("file")}</span>
        <span class="docpv-titles"><b>${esc(t("iv_title"))}</b><span>${esc(t("iv_sub"))}</span></span>
        <button type="button" class="btn btn-quiet btn-sm" data-doc-refresh>${ico("refresh")}<span class="btn-label">${esc(t("iv_refresh"))}</span></button>
      </figcaption>
      <div class="docpv-stage" data-doc-stage></div>
      <div class="docpv-foot">${chips.map(c =>
        `<span class="docpv-chip" data-on="${c[2] ? 1 : 0}">${ico(c[0])}${esc(c[1])}</span>`).join("")}</div>
    </figure>`;

  const stage = $("[data-doc-stage]", host);
  const msg = (tone, icon, title, body, action) => {
    stage.innerHTML = `<div class="docpv-msg" data-tone="${tone}">
      <span class="c-ico">${icon}</span><b>${esc(title)}</b><span>${body}</span>
      ${action || ""}</div>`;
  };

  const show = url => {
    if(InvoiceTemplate.canEmbed()){
      stage.innerHTML = `<iframe class="docpv-frame" src="${url}#toolbar=0&navpanes=0&view=FitH"
        title="${esc(t("iv_title"))}" loading="lazy"></iframe>`;
    }else{
      msg("ok", ico("file"), t("iv_openT"), esc(t("iv_openB")),
        `<a class="btn btn-primary btn-sm" href="${url}" target="_blank" rel="noopener">${ico("next")}<span class="btn-label">${esc(t("iv_openCta"))}</span></a>`);
    }
  };

  const paint = async force => {
    if(!InvoiceTemplate.configured()){
      msg("warn", ico("alert"), t("iv_offT"), esc(t("iv_offB")));
      return;
    }
    const hit = force ? null : InvoiceTemplate.cachedUrl();
    if(hit){ show(hit); return; }
    msg("busy", `<span class="spin"></span>`, t("iv_loadT"), esc(t("iv_loadB")));
    if(opts.illustration) SetupIllustration.setState("processing");
    try{
      const { url } = await InvoiceTemplate.render(force);
      show(url);
      if(opts.illustration) SetupIllustration.setState("success");
      announce(t("iv_ready"));
    }catch(err){
      const detail = err.code === "http" ? `HTTP ${err.status}${err.detail ? " — " + err.detail : ""}`
        : err.code === "not-configured" ? "CONFIG.supabaseUrl" : String(err.message || err);
      msg("err", ico("alert"), t("iv_errT"), esc(t("iv_errB")) + `<code>${esc(detail)}</code>`,
        `<button type="button" class="btn btn-primary btn-sm" data-doc-retry>${ico("refresh")}<span class="btn-label">${esc(t("retry"))}</span></button>`);
      const retry = $("[data-doc-retry]", stage);
      if(retry) retry.addEventListener("click", () => paint(true));
      if(opts.illustration) SetupIllustration.triggerShake("paper");
      announce(t("iv_errT"));
    }
  };

  $("[data-doc-refresh]", host).addEventListener("click", () => paint(true));
  paint(false);
  return { refresh: () => paint(true) };
}

const announce = msg => { const el = $("#live"); el.textContent = ""; setTimeout(() => { el.textContent = msg; }, 60); };

const Toast = {
  show(msg, tone = "info", ms = 4200){
    const host = $("#toasts");
    const el = document.createElement("div");
    el.className = "toast"; el.dataset.tone = tone;
    el.innerHTML = ico(tone === "ok" ? "check" : tone === "err" ? "alert" : "info") + "<div>" + esc(msg) + "</div>";
    host.appendChild(el);
    if(HAS_MOTION && !reducedMotion()){
      el.style.animation = "none";
      Motion.animate(el, { opacity:[0,1], transform:["translateY(20px) scale(.94)","none"] }, { easing:Spring.soft() });
    }
    setTimeout(() => {
      if(HAS_MOTION && !reducedMotion()){
        el.style.animation = "none";
        const a = Motion.animate(el, { opacity:[1,0], transform:["none","translateY(10px) scale(.97)"] }, { duration:.22, easing:"ease-in" });
        if(a && a.finished) a.finished.then(() => el.remove()).catch(() => el.remove());
        else el.remove();
      }else{ el.dataset.closing = "1"; setTimeout(() => el.remove(), 280); }
    }, ms);
    announce(msg);
  }
};

const Modal = {
  _last:null, _onClose:null,
  _gen:0,
  open({ title, desc, body, actions = [], size, onMount }){
    const m = $("#modal"), w = $("#modalWrap"), s = $("#scrim");
    this._gen++;                       // يُبطل أي منهي إغلاق معلّق من حوار سابق
    this._last = document.activeElement;
    m.innerHTML =
      `<div class="modal-head"><div style="flex:1"><h2 id="modalTitle">${esc(title)}</h2>${desc ? `<p>${esc(desc)}</p>` : ""}</div>
        <button class="icon-btn" data-modal-close aria-label="${esc(t("close"))}">${ico("x")}</button></div>
       <div class="modal-body">${body}</div>
       <div class="modal-foot">${actions.map((a, i) =>
          `<button class="btn ${a.variant || "btn-ghost"}" data-act="${i}"${a.disabled ? " disabled" : ""}>${a.icon ? ico(a.icon) : ""}<span class="btn-label">${esc(a.label)}</span></button>`).join("")}</div>`;
    if(size) m.style.width = size;
    w.hidden = false; s.hidden = false;
    // الخلفية تخرج من شجرة الوصول كاملة، فلا يتجوّل قارئ الشاشة خلف الحوار.
    const shell = $(".shell"); if(shell) shell.inert = true;
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => {
      m.dataset.open = "1"; s.dataset.open = "1";
      if(HAS_MOTION && !reducedMotion())
        Motion.animate(m, { opacity:[0,1], transform:["scale(.93) translateY(14px)","scale(1) translateY(0px)"] },
          { easing:Spring.soft() });
    });
    m.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
      const a = actions[+b.dataset.act]; if(a && a.onClick) a.onClick(m, b); else this.close();
    }));
    m.querySelectorAll("[data-modal-close]").forEach(b => b.addEventListener("click", () => this.close()));
    s.onclick = () => this.close();
    document.addEventListener("keydown", this._key);
    if(onMount) onMount(m);
    const f = m.querySelector("input,select,textarea,button:not([data-modal-close])");
    setTimeout(() => { (f || m.querySelector("[data-modal-close]")).focus(); }, 120);
    return m;
  },
  _key(e){
    const m = $("#modal");
    if(e.key === "Escape"){ e.preventDefault(); Modal.close(); return; }
    if(e.key !== "Tab") return;
    const f = $$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', m)
      .filter(el => el.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  },
  close(){
    const m = $("#modal"), w = $("#modalWrap"), s = $("#scrim");
    m.dataset.open = ""; s.dataset.open = "";
    document.removeEventListener("keydown", this._key);
    const shell = $(".shell"); if(shell) shell.inert = false;
    document.body.style.overflow = "";
    const gen = ++this._gen;
    const done = () => {
      if(this._gen !== gen) return;    // فُتح حوار آخر بعده — لا نمسح محتواه
      w.hidden = true; s.hidden = true; m.innerHTML = ""; m.style.cssText = "";
    };
    if(HAS_MOTION && !reducedMotion()){
      const a = Motion.animate(m, { opacity:[1,0], transform:["scale(1)","scale(.95) translateY(10px)"] },
        { duration:.2, easing:"ease-in" });
      if(a && a.finished) a.finished.then(done).catch(done);
      setTimeout(done, 340);           // ضمان الإنهاء حتى لو تجمّد إطار الرسم
    }else setTimeout(done, 260);
    if(this._last && this._last.isConnected) this._last.focus();
    if(this._onClose){ const f = this._onClose; this._onClose = null; f(); }
  },
  confirm({ title, body, confirmLabel, danger }){
    return new Promise(resolve => {
      let done = false;
      this._onClose = () => { if(!done) resolve(false); };
      this.open({
        title, body:`<p style="font-size:.9rem;line-height:1.75;color:var(--text-2)">${body}</p>`,
        actions:[
          { label:t("cancel"), variant:"btn-ghost", onClick:() => { done = true; resolve(false); this.close(); } },
          { label:confirmLabel || t("confirm"), variant: danger ? "btn-danger" : "btn-primary",
            onClick:() => { done = true; resolve(true); this.close(); } }
        ]
      });
    });
  }
};

/* ==========================================================================
   6) LiveSVG — نظام الرسوم الحيّة
   --------------------------------------------------------------------------
   الرسمة ليست صورة: كل ملف SVG يحمل طبقات معنونة بـ data-layer، وهذا المتحكّم
   الواحد يقودها جميعًا بدل ثمانية عشر نظام حركة منفصل.

     mount(svg) → فهرسة الطبقات · تهيئة نقاط OTP · بناء الخط الزمني المحيط
     setState(idle · enter · active · interaction · processing · success · error · exit)
     shake(layer) · success() · attention(layer) · otp(n, total) · progress(r) · scan(layer)

   الدوران المستمر يعيش على خط زمني دائم لا يُقتل عند تبديل الحالة، ويُعدَّل
   بسرعته فقط (timeScale). لذلك تكتمل الدورة 0° → 360° وتعود بلا قفزة ولا وقفة.
   ========================================================================== */
const SVG_NS = "http://www.w3.org/2000/svg";

/** طبقات الخلفية — تُحرَّك كإطار للمشهد لا كبطل له. */
const CHROME_LAYERS = ["scene", "abstract-shapes", "shadow", "sparkles"];

/** الدوران المستمر الافتراضي: الاسم ⇒ زمن الدورة الكاملة بالثواني. */
const SPIN_DEFAULTS = { orbit: 16, coin: 26 };

const LiveSVG = {
  svg:null, live:false, layers:new Map(), state:"idle",
  amb:null, spins:[], fx:[], otpCells:[], _bar:null, _scan:null, _ring:null,

  /* ---------------------------------------------------------------- الفهرسة */
  one(name){ return (this.layers.get(name) || [])[0] || null; },

  /** أول طبقة ليست خلفية ولا دوّارة — بطل المشهد. */
  hero(){
    for(const [name, els] of this.layers){
      if(CHROME_LAYERS.includes(name)) continue;
      if(this._spinDur(els[0], name)) continue;
      return els[0];
    }
    return this.one("scene");
  },

  _spinDur(el, name){
    const attr = el && el.getAttribute("data-spin");
    if(attr) return parseFloat(attr) || 0;
    return SPIN_DEFAULTS[name] || 0;
  },

  /** يعيد true إذا كان سيقود الحركة فعلًا؛ عندها فقط تُلغى قواعد CSS الاحتياطية. */
  mount(svg){
    this.unmount();
    if(!svg) return false;
    this.svg = svg;
    svg.querySelectorAll("[data-layer]").forEach(el => {
      const name = el.getAttribute("data-layer");
      if(!this.layers.has(name)) this.layers.set(name, []);
      this.layers.get(name).push(el);
    });
    this._prepOtp();
    this._prepBar();
    this.live = HAS_GSAP && !reducedMotion();     // بغيرها يتولّى احتياط CSS
    if(this.live){
      this._buildSpins();
      this._buildAmbient();
    }
    this.state = "idle";
    return this.live;
  },

  unmount(){
    if(HAS_GSAP){
      if(this.amb) this.amb.kill();
      this.spins.forEach(t => t.kill());
      this.fx.forEach(t => { try{ t.kill(); }catch(_){ } });
      if(this.svg) gsap.killTweensOf(this.svg.querySelectorAll("*"));
    }
    if(this._ring && this._ring.parentNode) this._ring.remove();
    if(this._scan && this._scan.parentNode) this._scan.remove();
    this.amb = null; this.spins = []; this.fx = []; this.otpCells = [];
    this._bar = null; this._scan = null; this._ring = null;
    this.layers = new Map(); this.svg = null;
  },

  /* ------------------------------------------------- تهيئة الطبقات الخاصّة */

  /** نقاط OTP: كل خانة = مستطيل + نقطة. تُستكمل النقاط الناقصة وقت التركيب. */
  _prepOtp(){
    const g = this.one("otp-dots"); if(!g) return;
    const rects = [...g.querySelectorAll("rect")];
    if(!rects.length) return;
    // الملفّات ترسم الخانات الممتلئة أولًا والفارغة آخرًا، فنشتقّ اللونين منها.
    const activeFill = rects[0].getAttribute("fill") || "#5B7BF0";
    let idleFill = rects[rects.length - 1].getAttribute("fill") || "#F8FBFF";
    if(idleFill === activeFill) idleFill = "#F8FBFF";     // كلّها ممتلئة في الملف
    this.otpCells = rects.map(rect => {
      const cx = +rect.getAttribute("x") + +rect.getAttribute("width") / 2;
      const cy = +rect.getAttribute("y") + +rect.getAttribute("height") / 2;
      // النقطة التالية للمستطيل إن وُجدت في الملف، وإلا نُنشئها بنفس الأسلوب.
      let dot = rect.nextElementSibling;
      if(!dot || dot.tagName.toLowerCase() !== "circle"){
        dot = document.createElementNS(SVG_NS, "circle");
        dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
        dot.setAttribute("r", 4); dot.setAttribute("fill", "#FFFFFF");
        dot.setAttribute("opacity", "0");
        rect.after(dot);
      }
      // المظهر المرسوم في الملف يبقى كما هو حتى يوجد إدخال رمز فعلي على الشاشة،
      // فرسمة الحماية مثلًا تستعمل الخانات زينةً لا مؤشّر تقدّم.
      return { rect, dot, cx, cy, activeFill, idleFill };
    });
  },

  /** شريط التقدّم داخل رسمة التهيئة: مستطيل خلفية ومستطيل تعبئة. */
  _prepBar(){
    const g = this.one("progress"); if(!g) return;
    const rects = [...g.querySelectorAll("rect")];
    if(rects.length < 2) return;
    this._bar = { track:rects[0], fill:rects[1], max:+rects[0].getAttribute("width") };
    this._bar.fill.setAttribute("width", "0");
  },

  /* ------------------------------------------------------- الحركة المحيطة */

  /** دوران دائم لا يتوقّف: 0° → 360° بتوقيت خطّي، ثم يستأنف من البداية بلا قفزة. */
  _buildSpins(){
    this.layers.forEach((els, name) => els.forEach(el => {
      const dur = this._spinDur(el, name);
      if(!dur) return;
      const origin = el.getAttribute("data-spin-origin");
      const cfg = { rotation:360, duration:dur, ease:"none", repeat:-1, transformOrigin:"50% 50%" };
      if(origin) { delete cfg.transformOrigin; cfg.svgOrigin = origin; }
      gsap.set(el, { rotation:0, transformOrigin: origin ? undefined : "50% 50%", svgOrigin: origin || undefined });
      this.spins.push(gsap.to(el, cfg));
    }));
  },

  /** تنفّس هادئ: المشهد يطفو، الظل يجاريه، البطل يتأخّر قليلًا فيتولّد عمق. */
  _buildAmbient(){
    const tl = gsap.timeline({ repeat:-1, defaults:{ ease:"sine.inOut" } });
    const scene = this.one("scene"), shadow = this.one("shadow");
    const shapes = this.one("abstract-shapes"), hero = this.hero();

    if(scene) tl.to(scene, { y:-8, duration:3.5 }, 0).to(scene, { y:0, duration:3.5 }, 3.5);
    if(shadow) tl.to(shadow, { scaleX:.9, opacity:.6, duration:3.5, transformOrigin:"50% 50%" }, 0)
                 .to(shadow, { scaleX:1, opacity:1, duration:3.5, transformOrigin:"50% 50%" }, 3.5);
    if(shapes) tl.to(shapes, { y:6, x:-4, duration:5 }, 0).to(shapes, { y:0, x:0, duration:5 }, 5);
    if(hero && hero !== scene)
      tl.to(hero, { y:-5, duration:2.6 }, 0).to(hero, { y:0, duration:2.9 }, 2.6).to(hero, { y:-3, duration:2.5 }, 5.5);

    const sparkles = this.one("sparkles");
    if(sparkles){
      [...sparkles.children].forEach((s, i) => {
        gsap.set(s, { transformOrigin:"50% 50%" });
        tl.to(s, { opacity:.35, scale:.82, duration:1.4 + i * .25 }, i * .4)
          .to(s, { opacity:1, scale:1.08, duration:1.6 + i * .2 }, 1.4 + i * .45)
          .to(s, { opacity:.75, scale:1, duration:1.5 }, 3.4 + i * .3);
      });
    }
    this.amb = tl;
  },

  /* ------------------------------------------------------------- الحالات */

  /** idle · enter · active · interaction · processing · success · error · exit */
  setState(s){
    const prev = this.state;
    this.state = s;
    if(!this.svg) return;
    if(!HAS_GSAP || reducedMotion()){ this._staticState(s); return; }

    const speed = s === "processing" ? 2.6 : s === "active" ? 1.25 : s === "exit" ? .6 : 1;
    this.spins.forEach(t => gsap.to(t, { timeScale:speed, duration:.6, ease:"power2.out", overwrite:true }));
    if(this.amb) gsap.to(this.amb, { timeScale: s === "processing" ? 1.5 : 1, duration:.5, overwrite:true });

    switch(s){
      case "enter":       this._enter(); break;
      case "exit":        this._exit(); break;
      case "processing":  this._processing(); break;
      case "success":     this.success(); break;
      case "error":       this.shake(); break;
      case "active":      this._active(true); break;
      case "interaction": this._pulse(); break;
      default:
        if(prev === "processing" || prev === "active") this._active(false);
    }
  },

  /** بلا GSAP أو مع تقليل الحركة: الحالة تبقى مقروءة بلا أي حركة. */
  _staticState(s){
    const hero = this.hero();
    if(!hero) return;
    hero.style.opacity = s === "exit" ? "0" : "1";
    if(s === "success") this._drawCheck(true);
  },

  _enter(){
    const scene = this.one("scene") || this.svg;
    const targets = [...this.layers.entries()]
      .filter(([n]) => !CHROME_LAYERS.includes(n)).map(([, els]) => els[0]);
    gsap.killTweensOf(scene);
    const tl = gsap.timeline();
    tl.fromTo(scene, { opacity:0, y:26, scale:.94 },
      { opacity:1, y:0, scale:1, duration:.72, ease:"clay", clearProps:"scale" }, 0);
    if(targets.length)
      tl.fromTo(targets, { opacity:0, y:18 },
        { opacity:1, y:0, duration:.55, ease:"clay", stagger:.06, clearProps:"opacity,transform" }, .1);
    const shadow = this.one("shadow");
    if(shadow) tl.fromTo(shadow, { scaleX:.5, opacity:0 },
      { scaleX:1, opacity:1, duration:.7, ease:"power2.out", transformOrigin:"50% 50%" }, .05);
    this.fx.push(tl);
  },

  _exit(){
    const scene = this.one("scene") || this.svg;
    gsap.killTweensOf(scene);
    this.fx.push(gsap.to(scene, { opacity:0, y:-18, scale:.97, duration:.22, ease:"power2.in" }));
  },

  /** تركيز: البطل يرتفع قليلًا ويكبر — استجابة لتفاعل المستخدم لا زينة. */
  _active(on){
    const hero = this.hero(); if(!hero) return;
    this.fx.push(gsap.to(hero, { scale: on ? 1.045 : 1, duration:.5, ease:"clay",
      transformOrigin:"50% 50%", overwrite:"auto" }));
  },

  _pulse(){
    const hero = this.hero(); if(!hero) return;
    this.fx.push(gsap.fromTo(hero, { scale:1.045 },
      { scale:1.075, duration:.14, yoyo:true, repeat:1, ease:"power2.out", transformOrigin:"50% 50%" }));
  },

  _processing(){
    const hero = this.hero(); if(!hero) return;
    gsap.killTweensOf(hero, "scale");
    this.fx.push(gsap.to(hero, { scale:1.035, duration:.85, yoyo:true, repeat:-1,
      ease:"sine.inOut", transformOrigin:"50% 50%" }));
  },

  /* -------------------------------------------------------------- النجاح */

  /** معالجة ⇒ حلقة تكتمل 360° ⇒ علامة تُرسم ⇒ نبضة ⇒ سكون. */
  success(){
    const check = this.one("check");
    const target = check || this.hero();
    if(!target) return;
    if(!HAS_GSAP || reducedMotion()){ this._drawCheck(true); return; }

    gsap.killTweensOf(this.hero(), "scale");
    const tl = gsap.timeline();
    const ring = this._makeRing(target, !!check);
    if(ring){
      const len = ring._len;
      tl.fromTo(ring, { attr:{ "stroke-dashoffset": len } },
        { attr:{ "stroke-dashoffset": 0 }, duration:.62, ease:"power2.inOut" }, 0)
        .to(ring, { opacity:0, duration:.35, ease:"power1.out",
          onComplete(){ if(ring.parentNode) ring.remove(); } }, .66);
    }
    if(check){
      tl.fromTo(check, { scale:.35, opacity:0 },
        { scale:1, opacity:1, duration:.5, ease:"back.out(2)", transformOrigin:"50% 50%" }, .18);
      const draw = this._drawCheck(false);
      if(draw) tl.add(draw, .38);
    }
    tl.to(this.hero(), { scale:1.06, duration:.22, ease:"power2.out", transformOrigin:"50% 50%" }, .55)
      .to(this.hero(), { scale:1, duration:.5, ease:"elastic.out(1, .55)", transformOrigin:"50% 50%" }, .77);
    const sparkles = this.one("sparkles");
    if(sparkles) tl.fromTo([...sparkles.children], { scale:.3, opacity:0 },
      { scale:1, opacity:1, duration:.5, stagger:.07, ease:"back.out(2.4)", transformOrigin:"50% 50%" }, .5);
    this.fx.push(tl);
  },

  /** رسم علامة الصح بطول المسار نفسه — يراها المستخدم وهي تُكتب. */
  _drawCheck(instant){
    const g = this.one("check"); if(!g) return null;
    const path = [...g.querySelectorAll("path")]
      .find(p => p.getAttribute("fill") === "none" && p.getAttribute("stroke"));
    if(!path) return null;
    let len = 0;
    try{ len = path.getTotalLength(); }catch(_){ return null; }
    if(!len) return null;
    if(instant || !HAS_GSAP){ path.style.strokeDasharray = ""; path.style.strokeDashoffset = ""; return null; }
    return gsap.fromTo(path,
      { strokeDasharray:len, strokeDashoffset:len },
      { strokeDashoffset:0, duration:.45, ease:"power2.out",
        onComplete(){ path.style.strokeDasharray = ""; path.style.strokeDashoffset = ""; } });
  },

  /** حلقة نجاح تُرسم حول العلامة (أو حول البطل إن لم تكن في الملف علامة). */
  _makeRing(target, tight){
    let cx, cy, r;
    const circle = tight ? target.querySelector("circle") : null;
    if(circle){
      cx = +circle.getAttribute("cx"); cy = +circle.getAttribute("cy");
      r = +circle.getAttribute("r") + 10;
    }else{
      let bb; try{ bb = target.getBBox(); }catch(_){ return null; }
      if(!bb || !bb.width) return null;
      cx = bb.x + bb.width / 2; cy = bb.y + bb.height / 2;
      r = Math.max(bb.width, bb.height) / 2 + 14;
    }
    const ring = document.createElementNS(SVG_NS, "circle");
    const len = 2 * Math.PI * r;
    ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.setAttribute("r", r);
    ring.setAttribute("fill", "none");
    ring.setAttribute("stroke", "#7E9BF6");
    ring.setAttribute("stroke-width", "5");
    ring.setAttribute("stroke-linecap", "round");
    ring.setAttribute("stroke-dasharray", len);
    ring.setAttribute("stroke-dashoffset", len);
    ring.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);
    ring._len = len;
    (this.one("scene") || this.svg).appendChild(ring);
    this._ring = ring;
    return ring;
  },

  /* --------------------------------------------------------------- الخطأ */

  /** ‎-8 +8 -6 +6 -3 +3 0 — على الطبقة المعنيّة وحدها، لا على الصفحة. */
  shake(layerName){
    const el = (layerName && this.one(layerName)) || this.one("check") || this.hero();
    if(!el) return;
    if(!HAS_GSAP || reducedMotion()){
      el.style.opacity = ".45";
      setTimeout(() => { el.style.opacity = ""; }, 180);
      return;
    }
    gsap.killTweensOf(el, "x");
    this.fx.push(gsap.timeline()
      .to(el, { keyframes:{ x:[-8, 8, -6, 6, -3, 3, 0] }, duration:.5, ease:"none" }, 0)
      .fromTo(el, { filter:"drop-shadow(0 0 0 rgba(198,58,58,0))" },
        { filter:"drop-shadow(0 0 12px rgba(198,58,58,.55))", duration:.16, yoyo:true, repeat:1 }, 0)
      .set(el, { clearProps:"filter,x" }));
  },

  /** لفت انتباه هادئ — لا يعني خطأ. */
  attention(layerName){
    const el = (layerName && this.one(layerName)) || this.hero();
    if(!el || !HAS_GSAP || reducedMotion()) return;
    this.fx.push(gsap.timeline()
      .to(el, { keyframes:{ rotation:[-2.5, 2.5, -1.5, 0] }, duration:.5,
        ease:"sine.inOut", transformOrigin:"50% 100%" })
      .set(el, { clearProps:"rotation" }));
  },

  /* --------------------------------------------------------- ربط بالمدخل */

  /** تقدّم إدخال الرمز: كل خانة تمتلئ مع رقمها، والخانة التالية تنبض بانتظار. */
  otp(filled, total){
    const cells = this.otpCells;
    if(!cells.length) return;
    const n = Math.round(filled / Math.max(1, total) * cells.length);
    cells.forEach((c, i) => {
      const on = i < n;
      c.rect.setAttribute("fill", on ? c.activeFill : c.idleFill);
      if(HAS_GSAP && !reducedMotion()){
        gsap.to(c.dot, { attr:{ opacity: on ? .95 : 0 }, duration:.22, ease:"power2.out", overwrite:true });
        if(on) gsap.fromTo(c.rect, { scale:.82 },
          { scale:1, duration:.42, ease:"back.out(3)", transformOrigin:"50% 50%", overwrite:"auto" });
      }else{
        c.dot.setAttribute("opacity", on ? ".95" : "0");
      }
    });
  },

  /** شريط التقدّم داخل الرسمة يتبع تقدّم مهام التهيئة الحقيقي. */
  progress(ratio){
    if(!this._bar) return;
    const w = Math.max(0, Math.min(1, ratio)) * this._bar.max;
    if(HAS_GSAP && !reducedMotion())
      this.fx.push(gsap.to(this._bar.fill, { attr:{ width:w }, duration:.7, ease:"power3.out", overwrite:true }));
    else this._bar.fill.setAttribute("width", w);
  },

  /** مسح ضوئي فوق طبقة — لغة بصرية لقراءة IMEI والسيريال. */
  scan(layerName, on){
    if(this._scan){ gsap.killTweensOf(this._scan); this._scan.remove(); this._scan = null; }
    if(!on || !HAS_GSAP || reducedMotion()) return;
    const el = this.one(layerName) || this.hero(); if(!el) return;
    let bb; try{ bb = el.getBBox(); }catch(_){ return; }
    if(!bb || !bb.height) return;

    const id = "scanGrad" + Math.random().toString(36).slice(2, 8);
    const defs = this.svg.querySelector("defs") || this.svg.insertBefore(
      document.createElementNS(SVG_NS, "defs"), this.svg.firstChild);
    const grad = document.createElementNS(SVG_NS, "linearGradient");
    grad.setAttribute("id", id); grad.setAttribute("x1", "0"); grad.setAttribute("x2", "1");
    grad.innerHTML = `<stop offset="0" stop-color="#5B7BF0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5B7BF0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5B7BF0" stop-opacity="0"/>`;
    defs.appendChild(grad);

    const bar = document.createElementNS(SVG_NS, "rect");
    bar.setAttribute("x", bb.x - 6); bar.setAttribute("width", bb.width + 12);
    bar.setAttribute("height", 5); bar.setAttribute("rx", 2.5);
    bar.setAttribute("fill", `url(#${id})`);
    bar.setAttribute("y", bb.y);
    (this.one("scene") || this.svg).appendChild(bar);
    this._scan = bar;
    this.fx.push(gsap.fromTo(bar, { attr:{ y: bb.y }, opacity:0 },
      { attr:{ y: bb.y + bb.height - 5 }, opacity:1, duration:1.5, ease:"sine.inOut",
        yoyo:true, repeat:-1 }));
  }
};

/* ==========================================================================
   6.b) SetupIllustration — حاوية ثابتة الأبعاد + جسر إلى LiveSVG أو المشهد 3D
   ========================================================================== */
const SetupIllustration = {
  el:null, cache:new Map(), current:null, _timer:null, _token:0,
  _swapping:false, _pending:null,
  mode:"svg",
  init(el){
    this.el = el;
    try{ this.fallback = JSON.parse($("#illus-fallback").textContent || "{}"); }catch(_){ this.fallback = {}; }
    const want = CONFIG.illustration || "svg";
    if(want !== "svg" && has3D() && (want === "3d" || !reducedMotion())){
      if(window.Stage3D.init(el)){ this.mode = "3d"; el.dataset.mode = "3d"; }
    }
    if(this.mode === "3d") window.Stage3D.theme(document.documentElement.dataset.theme === "dark");
  },
  _clean(svg){
    return String(svg).replace(/<script[\s\S]*?<\/script>/gi, "").replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "");
  },
  /**
   * الملف الخارجي في assets/setup هو المصدر، ويبقى قابلًا للاستبدال. نُدرجه
   * داخل الصفحة (لا كصورة) لأن الطبقات لا تُحرَّك إلا وهي جزء من المستند؛
   * وعلى بروتوكول file: — حيث fetch محظور — تُستعمل النسخة المضمّنة.
   */
  async _fetchExternal(name){
    if(location.protocol !== "http:" && location.protocol !== "https:") return null;
    try{
      const r = await fetch(CONFIG.assetsBase + name + ".svg", { cache:"force-cache" });
      if(r.ok){ const txt = await r.text(); if(txt.indexOf("<svg") > -1) return { kind:"inline", svg:this._clean(txt) }; }
    }catch(_){ }
    return null;
  },
  async show(name, alt){
    if(this.current === name){ this.setState("enter"); return; }
    const token = ++this._token;
    const first = this.current === null;
    this.current = name;
    this._swapping = true; this._pending = null;
    this.el.setAttribute("aria-label", alt || "");
    if(this.mode === "3d"){
      if(window.Stage3D.show(name)){ this._swapping = false; return; }
      this.mode = "svg"; this.el.dataset.mode = "";     // تعذّر المشهد: عودة نظيفة إلى SVG
    }
    if(!first && !reducedMotion()){                     // خروج الرسمة السابقة قبل استبدالها
      this._swapping = false; this.setState("exit"); this._swapping = true;
      await wait(HAS_GSAP ? 230 : 180);
      if(token !== this._token) return;
    }
    let asset = this.cache.get(name);
    if(!asset){
      asset = await this._fetchExternal(name);
      if(!asset && this.fallback[name]) asset = { kind:"inline", svg:this.fallback[name] };
      this.cache.set(name, asset || { kind:"none" });
    }
    if(token !== this._token) return;                   // تغيّرت الخطوة أثناء التحميل
    LiveSVG.unmount();
    if(asset.kind === "inline"){
      this.el.innerHTML = `<div class="illus-media">${asset.svg.replace(/<svg([^>]*)\swidth="[^"]*"/, "<svg$1").replace(/<svg([^>]*)\sheight="[^"]*"/, "<svg$1")}</div>`;
      const svg = $(".illus-media svg", this.el);
      this.el.dataset.live = (svg && LiveSVG.mount(svg)) ? "1" : "";
    }else{
      this.el.dataset.live = "";
      this.el.innerHTML = `<div class="illus-ph"><span><b>${esc(t("assetSlot"))}</b>${esc(CONFIG.assetsBase + name + ".svg")}</span></div>`;
    }
    this._swapping = false;
    this.setState("enter");
    // حالة طلبتها الخطوة أثناء التبديل (معالجة مثلًا) تُستأنف بعد الدخول.
    if(this._pending){
      const p = this._pending; this._pending = null;
      setTimeout(() => { if(token === this._token) this.setState(p); }, reducedMotion() ? 10 : 300);
    }
  },

  /** idle · enter · active · interaction · processing · success · error · exit */
  setState(s){
    if(!this.el) return;
    if(this._swapping){ if(s !== "idle" && s !== "enter") this._pending = s; return; }
    clearTimeout(this._timer);
    this.el.dataset.anim = s;
    if(this.mode === "3d"){ window.Stage3D.setState(s === "enter" ? "idle" : s); return; }
    LiveSVG.setState(s);
    if(s === "enter" || s === "success" || s === "interaction"){
      const back = s === "enter" ? 800 : s === "success" ? 1400 : 320;
      this._timer = setTimeout(() => {
        if(this.el.dataset.anim === s){ this.el.dataset.anim = "idle"; LiveSVG.setState("idle"); }
      }, reducedMotion() ? 10 : back);
    }
  },

  /* واجهة الحركة التي تستدعيها الخطوات */
  /** خطأ: تهتزّ الطبقة المعنيّة، ثم يعود المشهد إلى السكون — لا يبقى معلّقًا في المعالجة. */
  triggerShake(layer){
    if(this.mode === "3d"){ this.setState("error"); return; }
    clearTimeout(this._timer);
    this.el.dataset.anim = "error";
    LiveSVG.shake(layer);
    this._timer = setTimeout(() => {
      if(this.el.dataset.anim !== "error") return;
      this.el.dataset.anim = "idle";
      LiveSVG.setState("idle");
    }, reducedMotion() ? 10 : 760);
  },
  triggerSuccess(){ this.setState("success"); },
  triggerProcessing(){ this.setState("processing"); },
  triggerAttention(layer){ if(this.mode === "3d") return; LiveSVG.attention(layer); },
  otp(filled, total){ if(this.mode !== "3d") LiveSVG.otp(filled, total); },
  progress(ratio){ if(this.mode !== "3d") LiveSVG.progress(ratio); },
  scan(layer, on){ if(this.mode !== "3d") LiveSVG.scan(layer, on); },
  focus(on){ this.setState(on ? "active" : "idle"); }
};

/** الواجهة المختصرة المذكورة في مواصفة النظام. */
const setIllustrationState = s => SetupIllustration.setState(s);
const triggerShake = l => SetupIllustration.triggerShake(l);
const triggerSuccess = () => SetupIllustration.triggerSuccess();
const triggerProcessing = () => SetupIllustration.triggerProcessing();
const triggerAttention = l => SetupIllustration.triggerAttention(l);

Object.assign(L, { assetSlot:["موضع رسم SVG","SVG asset slot"] });

/* ==========================================================================
   7) OtpInput — ستة حقول، تنقّل تلقائي، لصق، عدّاد، حالات
   ========================================================================== */
class OtpInput {
  constructor({ mount, length = 6, onComplete, onChange }){
    this.len = length; this.onComplete = onComplete; this.onChange = onChange;
    this.root = mount; this.state = "waiting";
    this.root.className = "otp"; this.root.dataset.state = "waiting";
    this.root.setAttribute("role", "group");
    this.root.setAttribute("aria-label", t("otpGroup"));
    this.root.innerHTML = Array.from({ length }, (_, i) =>
      `<input type="text" inputmode="numeric" autocomplete="${i === 0 ? "one-time-code" : "off"}" maxlength="1"
        aria-label="${esc(t("otpDigit", { n: i + 1 }))}" data-i="${i}">`).join("");
    this.inputs = $$("input", this.root);
    SetupIllustration.otp(0, this.len);          // خانات الرسمة تبدأ فارغة مع الحقول
    this.inputs.forEach((el, i) => {
      el.addEventListener("input", e => {
        const v = e.target.value.replace(/\D/g, "");
        e.target.value = v.slice(-1);
        if(v && i < this.len - 1) this.inputs[i + 1].focus();
        this._changed();
      });
      el.addEventListener("keydown", e => {
        if(e.key === "Backspace" && !el.value && i > 0){ e.preventDefault(); this.inputs[i - 1].focus(); this.inputs[i - 1].value = ""; this._changed(); }
        else if(e.key === "ArrowLeft" && i > 0){ e.preventDefault(); this.inputs[i - 1].focus(); }
        else if(e.key === "ArrowRight" && i < this.len - 1){ e.preventDefault(); this.inputs[i + 1].focus(); }
        else if(e.key === "Enter"){ e.preventDefault(); if(this.value().length === this.len && this.onComplete) this.onComplete(this.value()); }
      });
      el.addEventListener("paste", e => {
        e.preventDefault();
        const txt = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, this.len);
        if(!txt) return;
        txt.split("").forEach((c, k) => { if(this.inputs[k]) this.inputs[k].value = c; });
        this.inputs[Math.min(txt.length, this.len - 1)].focus();
        this._changed();
      });
      el.addEventListener("focus", () => el.select());
    });
  }
  _changed(){
    const v = this.value();
    if(this.state === "invalid" || this.state === "expired") this.setState("waiting");
    // الرسمة تعكس تقدّم الإدخال رقمًا برقم — لا مؤشّر منفصل.
    SetupIllustration.otp(v.length, this.len);
    if(v.length && v.length < this.len) SetupIllustration.setState("interaction");
    if(this.onChange) this.onChange(v);
    if(v.length === this.len && this.onComplete) this.onComplete(v);
  }
  value(){ return this.inputs.map(i => i.value).join(""); }
  clear(){ this.inputs.forEach(i => i.value = ""); }
  focusFirst(){ const e = this.inputs.find(i => !i.value) || this.inputs[0]; e.focus(); }
  /** idle · waiting · verifying · verified · invalid · expired */
  setState(s){
    this.state = s; this.root.dataset.state = s;
    if(s === "verifying") SetupIllustration.triggerProcessing();
    if(s === "verified"){
      SetupIllustration.otp(this.len, this.len);
      SetupIllustration.triggerSuccess();
      if(HAS_GSAP && !reducedMotion())
        gsap.fromTo(this.inputs, { scale:.84 },
          { scale:1, duration:.55, stagger:.055, ease:"back.out(2.6)", clearProps:"scale" });
    }
    if(s === "invalid" || s === "expired"){
      // يهتزّ عنصر الرمز وحده — في الرسمة وفي الحقول — لا الصفحة كلها.
      SetupIllustration.triggerShake("otp-dots");
      if(HAS_GSAP && !reducedMotion())
        gsap.timeline()
          .to(this.root, { keyframes:{ x:[-8, 8, -6, 6, -3, 3, 0] }, duration:.5, ease:"none" })
          .set(this.root, { clearProps:"x" });
    }
  }
  disable(v){ this.inputs.forEach(i => i.disabled = !!v); }
}

});

/** نبضة تفاعل واحدة على الأكثر كل 180ms — الكتابة لا تُغرق الرسمة. */
let _reactAt = 0;
const reactToTyping = () => {
  const now = Date.now();
  if(now - _reactAt < 180) return;
  _reactAt = now;
  SetupIllustration.setState("interaction");
};

function bindFields(root, section){
  const S = SetupState.data;
  $$("[data-field]", root).forEach(el => {
    const sec = el.dataset.sec || section, key = el.dataset.field, cur = S[sec][key];
    if(cur !== undefined && cur !== null) el.value = cur;
    let wasValid = false;
    el.addEventListener("focus", () => SetupIllustration.setState("active"));
    el.addEventListener("blur", () => {
      const cur = SetupIllustration.el && SetupIllustration.el.dataset.anim;
      if(cur === "active" || cur === "interaction") SetupIllustration.setState("idle");
    });
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      const v = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
      SetupState.set(sec, key, v); clearError(root, key);
      reactToTyping();
      // البريد الصحيح حدث بحدّ ذاته: الرسمة تنتقل إلى حالة الجاهزية مرّة واحدة.
      if(el.type === "email"){
        const ok = RX.email.test(String(v).trim());
        if(ok && !wasValid){ SetupIllustration.triggerSuccess(); SetupIllustration.triggerAttention("envelope"); }
        wasValid = ok;
      }
    });
  });
  $$("[data-toggle]", root).forEach(el => {
    const sec = el.dataset.sec || section, key = el.dataset.toggle;
    const knob = $(".knob", el);
    const travel = () => 21 * (document.documentElement.dir === "rtl" ? -1 : 1);
    const paint = (v, animate) => {
      el.setAttribute("aria-checked", v ? "true" : "false");
      const row = el.closest("[data-row]"); if(row) row.dataset.on = v ? "1" : "";
      if(!knob) return;
      const x = v ? travel() : 0;
      if(animate && HAS_MOTION && !reducedMotion()) Motion.animate(knob, { x:[null, x] }, { easing:Spring.snap() });
      else knob.style.transform = `translateX(${x}px)`;
    };
    paint(!!S[sec][key], false);
    el.addEventListener("click", () => {
      const v = !(el.getAttribute("aria-checked") === "true");
      SetupState.set(sec, key, v); paint(v, true);
      if(v) SetupIllustration.triggerAttention(FIELD_LAYER[key]);
      else SetupIllustration.setState("interaction");
    });
  });
  $$("[data-multi]", root).forEach(el => {
    const sec = el.dataset.sec || section, key = el.dataset.multi, val = el.dataset.value;
    const has = () => (SetupState.data[sec][key] || []).includes(val);
    el.setAttribute("aria-checked", has() ? "true" : "false");
    el.addEventListener("click", () => {
      const arr = (SetupState.data[sec][key] || []).slice();
      const i = arr.indexOf(val);
      if(i > -1) arr.splice(i, 1); else arr.push(val);
      SetupState.set(sec, key, arr);
      el.setAttribute("aria-checked", i > -1 ? "false" : "true");
      if(i === -1){ Spring.pop($(".c-mark", el), .45); SetupIllustration.triggerAttention(FIELD_LAYER[key]); }
      else SetupIllustration.setState("interaction");
      clearError(root, key);
    });
  });
  $$("[data-radio]", root).forEach(el => {
    const sec = el.dataset.sec || section, key = el.dataset.radio, val = el.dataset.value;
    el.setAttribute("aria-checked", String(SetupState.data[sec][key]) === val ? "true" : "false");
    el.addEventListener("click", () => {
      SetupState.set(sec, key, val);
      $$(`[data-radio="${key}"]`, root).forEach(o => o.setAttribute("aria-checked", o === el ? "true" : "false"));
      Spring.pop($(".c-mark", el), .45);
      SetupIllustration.triggerAttention(FIELD_LAYER[key]);
      clearError(root, key);
      if(key === "theme") Theme.apply(val);
      if(key === "language") Lang.set(val);
    });
  });
  $$("[data-tokens]", root).forEach(box => {
    const sec = box.dataset.sec || section, key = box.dataset.tokens;
    const list = $("[data-token-list]", box), input = $("[data-token-input]", box);
    const paint = () => {
      const arr = SetupState.data[sec][key] || [];
      list.innerHTML = arr.length ? arr.map((v, i) =>
        `<span class="tok">${esc(v)}<button type="button" class="tok-x" data-token-del="${i}"
          aria-label="${esc(t("removeItem", { v }))}">${ico("x")}</button></span>`).join("")
        : `<span class="hint">${esc(t("emptyList"))}</span>`;
    };
    const add = () => {
      const v = input.value.trim(); if(!v) return;
      const arr = (SetupState.data[sec][key] || []).slice();
      if(arr.some(x => x.toLowerCase() === v.toLowerCase())){ input.value = ""; return; }
      arr.push(v); SetupState.set(sec, key, arr); input.value = ""; paint(); clearError(root, key); input.focus();
      SetupIllustration.triggerAttention(FIELD_LAYER[key]);
    };
    $("[data-token-add]", box).addEventListener("click", add);
    input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); add(); } });
    list.addEventListener("click", e => {
      const b = e.target.closest("[data-token-del]"); if(!b) return;
      const arr = (SetupState.data[sec][key] || []).slice();
      arr.splice(+b.dataset.tokenDel, 1); SetupState.set(sec, key, arr); paint();
    });
    paint();
  });
}
function showError(root, key, msg){
  const p = $(`[data-err="${key}"]`, root); if(!p) return;
  $("span", p).textContent = msg; p.hidden = false;
  const fw = p.closest("[data-fw],[data-tokens],.field"); if(fw) fw.dataset.invalid = "1";
  const ctl = $(`#f_${key}`, root); if(ctl){ ctl.setAttribute("aria-invalid", "true"); ctl.setAttribute("aria-describedby", `e_${key}`); p.id = `e_${key}`; }
}
function clearError(root, key){
  const p = $(`[data-err="${key}"]`, root); if(!p) return;
  p.hidden = true;
  const fw = p.closest("[data-fw],[data-tokens],.field"); if(fw) fw.dataset.invalid = "";
  const ctl = $(`#f_${key}`, root); if(ctl) ctl.removeAttribute("aria-invalid");
}
function paintErrors(root, errors){
  $$("[data-err]", root).forEach(p => { p.hidden = true;
    const fw = p.closest("[data-fw],[data-tokens],.field"); if(fw) fw.dataset.invalid = ""; });
  const keys = Object.keys(errors);
  keys.forEach(k => { if($(`[data-err="${k}"]`, root)) showError(root, k, errors[k]); else Toast.show(errors[k], "err"); });
  if(keys.length){
    const first = $(`[data-err="${keys[0]}"]`, root);
    const target = first && (first.closest(".field") || first.parentElement);
    const focusable = target && $("input,select,textarea,button", target);
    if(focusable) focusable.focus({ preventScroll:false });
    else if(target) target.scrollIntoView({ block:"center", behavior: reducedMotion() ? "auto" : "smooth" });
    announce(t("errFix"));
  }
  return keys.length === 0;
}

const Theme = {
  mq: window.matchMedia("(prefers-color-scheme: dark)"),
  apply(pref){
    const eff = pref === "system" ? (this.mq.matches ? "dark" : "light") : (pref || "light");
    const root = document.documentElement;
    if(root.dataset.theme && root.dataset.theme !== eff){
      root.dataset.themeSwap = "1";
      void root.offsetWidth;                       // إعادة تدفّق واحدة تثبّت الحالة
      requestAnimationFrame(() => { delete root.dataset.themeSwap; });
    }
    root.dataset.theme = eff;
    if(window.Stage3D && SetupIllustration.mode === "3d") window.Stage3D.theme(eff === "dark");
    const btn = $("#themeBtn");
    if(btn){ btn.innerHTML = ico(eff === "dark" ? "sun" : "moon"); btn.title = t("themeToggle") + " — " + t("theme_" + (pref || "light")); }
  },
  cycle(){
    const order = ["light", "dark", "system"];
    const cur = SetupState.data.preferences.theme || "light";
    const nxt = order[(order.indexOf(cur) + 1) % order.length];
    SetupState.set("preferences", "theme", nxt); this.apply(nxt);
    $$('[data-radio="theme"]').forEach(o => o.setAttribute("aria-checked", o.dataset.value === nxt ? "true" : "false"));
    Toast.show(t("theme_" + nxt), "info", 1800);
  }
};

  manager: "*",
  cashier:   { sales:["view","create"], invoices:["view","create"], customers:["view","create"], debts:["view"], devices:["view"] },
  inventory: { inventory:["view","create","edit","delete"], devices:["view","create","edit","delete"], purchases:["view","create"], reports:["view"] },
  sales:     { sales:["view","create","edit"], invoices:["view","create"], customers:["view","create","edit"], devices:["view"], debts:["view","create"], reports:["view"] },
  accountant:{ invoices:["view","edit","approve"], debts:["view","create","edit","approve"], expenses:["view","create","edit","approve"], reports:["view"], customers:["view"], sales:["view"] },
  custom:    {}
};
const Permissions = {
  modules: MODULES,
  roleMatrix(role){
    const p = ROLE_PRESETS[role];
    if(p === "*"){ const m = {}; MODULES.forEach(x => m[x.id] = x.actions.slice()); return m; }
    const m = {}; Object.keys(p || {}).forEach(k => m[k] = (p[k] || []).slice()); return m;
  },
  effective(emp){ return (emp && emp.permissions) ? emp.permissions : this.roleMatrix(emp ? emp.role : "custom"); },
  count(matrix){ return Object.keys(matrix || {}).reduce((n, k) => n + (matrix[k] || []).length, 0); },
  modCount(matrix){ return Object.keys(matrix || {}).filter(k => (matrix[k] || []).length).length; },
  has(matrix, mod, act){ return !!(matrix && matrix[mod] && matrix[mod].includes(act)); },
  toggle(matrix, mod, act){
    const m = Object.assign({}, matrix);
    const arr = (m[mod] || []).slice();
    const i = arr.indexOf(act);
    if(i > -1) arr.splice(i, 1); else arr.push(act);
    m[mod] = arr; return m;
  }
};

   ========================================================================== */
const Employees = {
  all(){ return SetupState.data.employees; },
  active(){ return this.all().filter(e => e.status === "active"); },
  get(id){ return this.all().find(e => e.id === id) || null; },
  add(data){
    const emp = Object.assign({
      id:"emp_" + uid(), name:"", email:"", phone:"", role:"cashier", pinSet:false,
      permissions:null, status:"pending", createdAt:nowISO(), updatedAt:nowISO()
    }, data);
    if(!emp.permissions) emp.permissions = Permissions.roleMatrix(emp.role);
    SetupState.data.employees.push(emp);
    SetupState.data.employeeVerification[emp.id] = { status:"pending", method:null, sentAt:null, verifiedAt:null };
    SetupState.save(); this.recompute(emp.id);
    return emp;
  },
  update(id, patch){
    const e = this.get(id); if(!e) return null;
    Object.assign(e, patch, { updatedAt:nowISO() });
    SetupState.save(); this.recompute(id); return e;
  },
  /** حذف آمن: أرشفة المرجع بدل إتلاف السجل */
  remove(id){
    const e = this.get(id); if(!e) return;
    const arch = SetupState.data.setupStatus.archivedEmployees || [];
    arch.push({ id:e.id, name:e.name, email:e.email, removedAt:nowISO(), reason:"removed-during-setup" });
    SetupState.data.setupStatus.archivedEmployees = arch;
    SetupState.data.employees = this.all().filter(x => x.id !== id);
    delete SetupState.data.employeeVerification[id];
    SetupState.save();
  },
  verification(id){ return SetupState.data.employeeVerification[id] || { status:"pending", method:null }; },
  setVerification(id, patch){
    const v = Object.assign(this.verification(id), patch);
    SetupState.data.employeeVerification[id] = v; SetupState.save(); this.recompute(id);
  },
  /** الحالة تُشتق ولا تُزوَّر: لا تفعيل قبل التحقق */
  recompute(id){
    const e = this.get(id); if(!e) return;
    if(e.status === "disabled"){ SetupState.save(); return; }
    const v = this.verification(id);
    if(v.status !== "verified") e.status = "pending";
    else if(e.pinSet && e.role) e.status = "active";
    else e.status = "verified";
    SetupState.save();
  },
  setDisabled(id, off){
    const e = this.get(id); if(!e) return;
    if(off){ e.status = "disabled"; SetupState.save(); }
    else { e.status = "pending"; this.recompute(id); }
  }
};

  let s = 0;
  if(p.length >= 8) s++; if(p.length >= 12) s++;
  if(/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;

STEPS.push({
  id:"email-otp", phase:0, svg:"email-otp", required:true,
  title:() => t("s4_title"), lede:() => t("s4_lede"), eyebrow:() => t("s4_eyebrow"),
  nextLabel:"next",
  body(){
    const ev = SetupState.data.emailVerification;
    const email = SetupState.data.ownerData.email;
    if(ev.status === "verified" && ev.email === email){
      return `<div class="verified-box">
          <span class="v-ico">${ico("shieldCheck")}</span>
          <div><b>${esc(t("s4_done"))}</b><span class="mono">${esc(email)}</span>
          <p class="hint">${esc(t("s4_doneAt", { d:new Date(ev.verifiedAt).toLocaleString(LANG === "en" ? "en-GB" : "ar-IQ") }))}</p></div>
        </div>
        ${ev.method === "local-demo" ? F.note(esc(t("s4_localRecord")), "warn") : ""}
        <div class="otp-actions"><button type="button" class="btn btn-quiet btn-sm" data-change-email>${ico("edit")}<span class="btn-label">${esc(t("s4_change"))}</span></button></div>`;
    }
    return `<div class="email-line">
        <div class="mono email-val">${esc(email)}</div>
        <button type="button" class="btn btn-quiet btn-sm" data-change-email>${ico("edit")}<span class="btn-label">${esc(t("s4_change"))}</span></button>
      </div>
      <div data-otp-stage>
        <button type="button" class="btn btn-primary" data-send>${ico("mail")}<span class="btn-label">${esc(t("s4_send"))}</span></button>
        <p class="hint" style="margin-top:10px">${esc(t("s4_sendHint"))}</p>
      </div>
      ${F.note(esc(HAS_SERVER ? t("s4_serverNote") : t("localModeTip")), HAS_SERVER ? "" : "warn")}`;
  },
  mount(root){
    const S = SetupState.data;
    const stage = $("[data-otp-stage]", root);
    const changeBtn = $("[data-change-email]", root);
    if(changeBtn) changeBtn.addEventListener("click", () => Wizard.goTo(Wizard.indexOf("owner")));
    if(!stage) return;
    let otp = null, timer = null, endAt = 0;

    const paintCountdown = () => {
      const el = $("[data-count]", root); if(!el) return;
      const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
      const resend = $("[data-resend]", root);
      if(left <= 0){
        clearInterval(timer);
        if(otp){ otp.setState("expired"); status("err", t("s4_expired")); }
        if(resend) resend.disabled = false;
      }else if(resend){ resend.disabled = left > CONFIG.otpTtl - 20; }
    };
    const status = (tone, msg, busy) => {
      const el = $("[data-status]", root); if(!el) return;
      el.dataset.tone = tone;
      el.innerHTML = (busy ? `<span class="spin"></span>` : tone === "ok" ? ico("check") : tone === "err" ? ico("alert") : ico("clock")) + `<span>${esc(msg)}</span>`;
      announce(msg);
    };

    const renderWaiting = res => {
      endAt = Date.now() + (res.expiresIn || CONFIG.otpTtl) * 1000;
      stage.innerHTML = `
        <p class="sent-to">${t("s4_sentTo", { e:`<b class="mono">${esc(S.ownerData.email)}</b>` })}</p>
        ${res.mode === "local" ? `<div class="demo-code">${ico("alert")}<div><b>${esc(t("s4_demoTitle"))}</b>
            <span class="mono demo-val">${esc(res.demoCode)}</span><p>${esc(t("s4_demoBody"))}</p></div></div>` : ""}
        <div data-otp-mount></div>
        <div class="otp-status" data-status data-tone="busy"></div>
        <div class="otp-meta">
          <span>${ico("clock")} ${esc(t("s4_expiresIn"))} <b class="countdown" data-count>--:--</b></span>
          <button type="button" class="btn btn-quiet btn-sm" data-resend disabled>${ico("refresh")}<span class="btn-label">${esc(t("s4_resend"))}</span></button>
        </div>
        <button type="button" class="btn btn-primary" data-verify disabled>${ico("shieldCheck")}<span class="btn-label">${esc(t("s4_verify"))}</span></button>`;
      otp = new OtpInput({
        mount:$("[data-otp-mount]", stage),
        onChange:v => { $("[data-verify]", root).disabled = v.length < 6; },
        onComplete:() => doVerify()
      });
      status("busy", t("s4_waiting"));
      otp.focusFirst();
      clearInterval(timer); paintCountdown(); timer = setInterval(paintCountdown, 500);
      Wizard.registerCleanup(() => clearInterval(timer));
      $("[data-verify]", root).addEventListener("click", () => doVerify());
      $("[data-resend]", root).addEventListener("click", () => doSend(true));
    };

    const doSend = async (again) => {
      const btn = $("[data-send]", root) || $("[data-resend]", root);
      if(btn){ btn.dataset.busy = "1"; btn.insertAdjacentHTML("afterbegin", '<span class="spin"></span>'); btn.disabled = true; }
      SetupIllustration.setState("processing");
      try{
        const res = await OtpService.send(S.ownerData.email, "owner");
        SetupState.set("emailVerification", null, { email:S.ownerData.email, status:"sent", verifiedAt:null, method:null });
        renderWaiting(res);
        if(again) Toast.show(t("s4_resent"), "ok");
        SetupIllustration.setState("idle");
        SetupIllustration.triggerAttention("envelope");
      }catch(err){
        SetupIllustration.triggerShake("envelope");
        if(btn){ btn.dataset.busy = ""; btn.disabled = false; const s = $(".spin", btn); if(s) s.remove(); }
        Toast.show(t("s4_sendFail"), "err");
      }
    };

    const doVerify = async () => {
      if(!otp || otp.value().length < 6) return;
      otp.setState("verifying"); status("busy", t("s4_verifying"), true);
      const vb = $("[data-verify]", root); if(vb) vb.disabled = true;
      SetupIllustration.setState("processing");
      try{
        const res = await OtpService.verify(S.ownerData.email, otp.value(), "owner");
        if(res.ok){
          clearInterval(timer);
          otp.setState("verified"); otp.disable(true);
          SetupState.set("emailVerification", null, { email:S.ownerData.email, status:"verified",
            verifiedAt:nowISO(), method: res.mode === "server" ? "server" : "local-demo" });
          status("ok", t("s4_ok"));
          Toast.show(t("s4_ok"), "ok");
          Wizard.refreshNav();
          setTimeout(() => Wizard.next(), 900);
        }else{
          otp.setState(res.reason === "expired" ? "expired" : "invalid");
          status("err", res.reason === "expired" ? t("s4_expired") : t("s4_invalid"));
          otp.clear(); otp.focusFirst();
          if(vb) vb.disabled = true;
        }
      }catch(err){
        otp.setState("invalid"); status("err", t("s4_netFail"));
        if(vb) vb.disabled = false;
      }
    };

    const sendBtn = $("[data-send]", root);
    if(sendBtn) sendBtn.addEventListener("click", () => doSend(false));
  },
  canLeave(){
    const ev = SetupState.data.emailVerification;
    return ev.status === "verified" && ev.email === SetupState.data.ownerData.email;
  },
  validate(){
    return this.canLeave() ? {} : { __block: t("s4_block") };
  }
});

STEPS.push({
  id:"security", phase:0, svg:"security", section:"securityData", required:true,
  // رمز PIN خاطئ ⇒ القفل يهتزّ. كلمة مرور ضعيفة ⇒ الدرع.
  errLayer: e => (e.pin1 || e.pin2) ? "lock" : "shield",
  title:() => t("s5_title"), lede:() => t("s5_lede"), eyebrow:() => t("s5_eyebrow"),
  body(){
    const d = SetupState.data.securityData;
    const passkeyReady = HAS_SERVER && PASSKEY_SUPPORTED;
    return `${d.needsReentry ? F.note(esc(t("s5_reentry")), "warn") : ""}
      <div class="grid-2">
        ${F.text({ name:"pwd1", label:t("f_pwd"), required:true, type:"password", autocomplete:"new-password", hint:t("f_pwdH"), nobind:true })}
        ${F.text({ name:"pwd2", label:t("f_pwd2"), required:true, type:"password", autocomplete:"new-password", nobind:true })}
      </div>
      <div class="pwd-meter" data-meter><i></i><i></i><i></i><i></i><i></i><span data-meter-label></span></div>
      <div class="grid-2">
        ${F.text({ name:"pin1", label:t("f_pin"), required:true, type:"password", inputmode:"numeric", maxlength:6, dir:"ltr", hint:t("f_pinH"), nobind:true })}
        ${F.text({ name:"pin2", label:t("f_pin2"), required:true, type:"password", inputmode:"numeric", maxlength:6, dir:"ltr", nobind:true })}
      </div>
      ${F.note(esc(t("s5_noStore")))}
      <h3 class="sub-h">${esc(t("s5_extra"))}</h3>
      <div class="choices">
        <button type="button" class="choice" role="checkbox" aria-checked="${d.passkey ? "true" : "false"}"
          data-passkey ${passkeyReady ? "" : "disabled aria-disabled=\"true\""}>
          <span class="c-ico">${ico("key")}</span>
          <span class="c-txt"><b>${esc(t("f_passkey"))}</b><span>${esc(passkeyReady ? t("f_passkeyD") : (PASSKEY_SUPPORTED ? t("f_needServer") : t("f_noPasskey")))}</span></span>
          <span class="c-mark">${ico("check")}</span></button>
        <button type="button" class="choice" role="checkbox" aria-checked="${d.qrLogin ? "true" : "false"}"
          data-qr ${HAS_SERVER ? "" : "disabled aria-disabled=\"true\""}>
          <span class="c-ico">${ico("qr")}</span>
          <span class="c-txt"><b>${esc(t("f_qr"))}</b><span>${esc(HAS_SERVER ? t("f_qrD") : t("f_needServer"))}</span></span>
          <span class="c-mark">${ico("check")}</span></button>
      </div>`;
  },
  mount(root){
    const p1 = $("#f_pwd1", root), p2 = $("#f_pwd2", root), n1 = $("#f_pin1", root), n2 = $("#f_pin2", root);
    p1.value = Secrets.ownerPassword; p2.value = Secrets.ownerPassword ? Secrets.ownerPassword : "";
    n1.value = Secrets.ownerPin; n2.value = Secrets.ownerPin;
    const meter = $("[data-meter]", root);
    const paint = () => {
      const sc = pwdScore(p1.value);
      $$("i", meter).forEach((b, i) => b.dataset.on = i < sc ? "1" : "");
      meter.dataset.level = sc;
      $("[data-meter-label]", meter).textContent = p1.value ? t("pwd_" + clamp(Math.ceil(sc / 2), 1, 3)) : "";
    };
    p1.addEventListener("input", () => { Secrets.ownerPassword = p1.value; paint(); clearError(root, "pwd1"); });
    p2.addEventListener("input", () => clearError(root, "pwd2"));
    [n1, n2].forEach(el => el.addEventListener("input", () => {
      el.value = el.value.replace(/\D/g, "").slice(0, 6);
      Secrets.ownerPin = n1.value; clearError(root, "pin1"); clearError(root, "pin2");
    }));
    paint();
    const pk = $("[data-passkey]", root), qr = $("[data-qr]", root);
    if(pk && !pk.disabled) pk.addEventListener("click", async () => {
      const on = pk.getAttribute("aria-checked") === "true";
      if(on){ SetupState.set("securityData", "passkey", false); pk.setAttribute("aria-checked", "false"); return; }
      try{
        pk.dataset.busy = "1";
        const chal = await Api.post("/setup/passkey/challenge", { email:SetupState.data.ownerData.email });
        const cred = await navigator.credentials.create({ publicKey: PasskeyUtil.decode(chal) });
        await Api.post("/setup/passkey/register", PasskeyUtil.encode(cred));
        SetupState.set("securityData", "passkey", true); pk.setAttribute("aria-checked", "true");
        Toast.show(t("f_passkeyOk"), "ok");
      }catch(err){ Toast.show(t("f_passkeyFail"), "err"); }
      finally{ pk.dataset.busy = ""; }
    });
    if(qr && !qr.disabled) qr.addEventListener("click", () => {
      const on = qr.getAttribute("aria-checked") === "true";
      SetupState.set("securityData", "qrLogin", !on); qr.setAttribute("aria-checked", on ? "false" : "true");
    });
  },
  validate(root){
    const e = {};
    const p1 = $("#f_pwd1", root).value, p2 = $("#f_pwd2", root).value;
    const n1 = $("#f_pin1", root).value, n2 = $("#f_pin2", root).value;
    if(!p1) e.pwd1 = t("errRequired");
    else if(p1.length < 8) e.pwd1 = t("errPwd");
    if(!p2) e.pwd2 = t("errRequired");
    else if(p1 !== p2) e.pwd2 = t("errPwdMatch");
    if(!n1) e.pin1 = t("errRequired");
    else if(!RX.pin.test(n1)) e.pin1 = t("errPin");
    if(!n2) e.pin2 = t("errRequired");
    else if(n1 !== n2) e.pin2 = t("errPinMatch");
    return e;
  },
  onNext(root){
    Secrets.ownerPassword = $("#f_pwd1", root).value;
    Secrets.ownerPin = $("#f_pin1", root).value;
    SetupState.patch("securityData", { passwordSet:true, pinSet:true, needsReentry:false,
      passwordStrength: pwdScore(Secrets.ownerPassword) });
    return true;
  }
});

  card(e, opts = {}){

      <span class="emp-tags">${this.statusBadge(e)}<span class="badge" data-tone="verified">${esc(t("role_" + e.role))}</span></span>
      ${opts.actions === false ? "" : `<span class="emp-actions">
        <button class="mini-btn" data-act="edit" title="${esc(t("edit"))}" aria-label="${esc(t("edit"))} — ${esc(e.name)}">${ico("edit")}</button>
        <button class="mini-btn" data-act="pin" title="${esc(t("e_pin"))}" aria-label="${esc(t("e_pin"))} — ${esc(e.name)}">${ico("pin")}</button>
        <button class="mini-btn" data-act="perm" title="${esc(t("e_perm"))}" aria-label="${esc(t("e_perm"))} — ${esc(e.name)}">${ico("shield")}</button>
        <button class="mini-btn" data-act="toggle" title="${esc(e.status === "disabled" ? t("e_enable") : t("e_disable"))}" aria-label="${esc(e.status === "disabled" ? t("e_enable") : t("e_disable"))} — ${esc(e.name)}">${ico(e.status === "disabled" ? "play" : "ban")}</button>
        <button class="mini-btn danger" data-act="del" title="${esc(t("del"))}" aria-label="${esc(t("del"))} — ${esc(e.name)}">${ico("trash")}</button>
      </span>`}

  },
  /** EmployeeForm — إضافة/تعديل */
  form(emp){
    const isNew = !emp;
    const e = emp || { name:"", email:"", phone:"", role:"cashier" };
    Modal.open({
      title: isNew ? t("e_addTitle") : t("e_editTitle"),
      desc: isNew ? t("e_addDesc") : "",
      body:`<div class="field" data-fw="name"><label for="e_name">${esc(t("f_empName"))} <span class="req">*</span></label>
          <input class="control" id="e_name" value="${esc(e.name)}" autocomplete="off">
          <p class="err-msg" data-err="name" hidden>${ico("alert")}<span></span></p></div>
        <div class="field" data-fw="email"><label for="e_email">${esc(t("f_email"))} <span class="req">*</span></label>
          <input class="control" id="e_email" type="email" dir="ltr" inputmode="email" value="${esc(e.email)}" autocomplete="off">
          <p class="hint">${esc(t("e_emailH"))}</p>
          <p class="err-msg" data-err="email" hidden>${ico("alert")}<span></span></p></div>
        <div class="field" data-fw="phone"><label for="e_phone">${esc(t("f_ownerPhone"))} <span class="opt">(${esc(t("optional"))})</span></label>
          <input class="control" id="e_phone" type="tel" dir="ltr" inputmode="tel" value="${esc(e.phone)}">
          <p class="err-msg" data-err="phone" hidden>${ico("alert")}<span></span></p></div>
        <div class="field"><label for="e_role">${esc(t("e_role"))}</label>
          <select class="control" id="e_role">${ROLE_IDS.map(r =>
            `<option value="${r}"${e.role === r ? " selected" : ""}>${esc(t("role_" + r))}</option>`).join("")}</select>
          <p class="hint">${esc(t("e_roleH"))}</p></div>`,
      actions:[
        { label:t("cancel"), variant:"btn-ghost" },
        { label:isNew ? t("e_addSave") : t("save"), variant:"btn-primary", icon:"check", onClick:(m) => {

            const role = $("#e_role", m).value;
            if(!name) errs.name = t("errRequired");
            if(!email) errs.email = t("errRequired");
            else if(!RX.email.test(email)) errs.email = t("errEmail");
            else if(Employees.all().some(x => x.email.toLowerCase() === email.toLowerCase() && (!emp || x.id !== emp.id))) errs.email = t("e_dupEmail");
            else if(email.toLowerCase() === SetupState.data.ownerData.email.toLowerCase()) errs.email = t("e_ownerEmail");
            if(phone && !RX.phone.test(phone)) errs.phone = t("errPhone");
            if(!paintErrors(root, errs)) return;
            if(isNew){
              const created = Employees.add({ name, email, phone, role, permissions:Permissions.roleMatrix(role) });
              Toast.show(t("e_added", { n:name }), "ok");
            }else{
              const changedRole = emp.role !== role;
              Employees.update(emp.id, { name, email, phone, role,
                permissions: changedRole ? Permissions.roleMatrix(role) : emp.permissions });
              if(emp.email.toLowerCase() !== email.toLowerCase())
                Employees.setVerification(emp.id, { status:"pending", method:null, sentAt:null, verifiedAt:null });
              Toast.show(t("e_saved"), "ok");
            }
            Modal.close(); Wizard.renderStep(false);
          } }
      ]

  },
  /** تعيين/تغيير رمز PIN — لا يُخزَّن في المتصفح */
  pin(emp){
    Modal.open({
      title:t("e_pinTitle", { n:emp.name }), desc:t("e_pinDesc"),
      body:`<div class="field" data-fw="pin1"><label for="e_pin1">${esc(t("f_pin"))} <span class="req">*</span></label>
          <input class="control mono" id="e_pin1" type="password" inputmode="numeric" maxlength="6" dir="ltr">
