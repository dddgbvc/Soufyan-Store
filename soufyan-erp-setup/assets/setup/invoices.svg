    <rect x="196" y="98" width="88" height="9" rx="4.5" fill="#C7D8FB"/>
    <rect x="196" y="118" width="60" height="9" rx="4.5" fill="#C7D8FB"/>
    <rect x="196" y="140" width="88" height="9" rx="4.5" fill="#7E9BF6" opacity=".7"/>
    <rect x="178" y="238" width="124" height="66" rx="14" fill="url(#gWhite)"/>
    <rect x="196" y="258" width="88" height="8" rx="4" fill="#C7D8FB"/>
    <rect x="196" y="274" width="52" height="8" rx="4" fill="#C7D8FB"/>
