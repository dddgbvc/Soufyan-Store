     <circle cx="418" cy="112" r="18" fill="#7E9BF6" opacity=".34"/></g>
  <g id="shadow" data-layer="shadow"><ellipse cx="240" cy="304" rx="122" ry="24" fill="url(#gShadow)"/></g>
  
