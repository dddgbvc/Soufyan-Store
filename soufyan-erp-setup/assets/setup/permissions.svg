<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" fill="none" role="img" aria-labelledby="ttl">
  <title id="ttl">الأدوار والصلاحيات</title>

  <defs>
    <linearGradient id="gClay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C9AFB"/><stop offset="1" stop-color="#2F4FD8"/>
    </linearGradient>
    <linearGradient id="gClayDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B58AE"/><stop offset="1" stop-color="#1B2E6B"/>
    </linearGradient>
    <linearGradient id="gPowder" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F2F6FE"/><stop offset="1" stop-color="#C7D8FB"/>
    </linearGradient>
    <linearGradient id="gScreen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E8F0FF"/><stop offset="1" stop-color="#B7CDFA"/>
    </linearGradient>
    <linearGradient id="gWhite" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F0FE"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8C0FF"/><stop offset="1" stop-color="#5B7BF0"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FAEFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8FAEFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B2E6B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1B2E6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="fTiny" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <g id="scene" data-layer="scene">
<g id="abstract-shapes" data-layer="abstract-shapes"><circle cx="86" cy="80" r="46" fill="url(#gGlow)"/><circle cx="404" cy="252" r="58" fill="url(#gGlow)"/>
     <rect x="366" y="52" width="46" height="46" rx="16" fill="#C7D8FB" opacity=".55"/>
     <circle cx="70" cy="272" r="17" fill="#7E9BF6" opacity=".38"/></g>
  <g id="shadow" data-layer="shadow"><ellipse cx="240" cy="302" rx="124" ry="24" fill="url(#gShadow)"/></g>
  
  <g id="shield" data-layer="shield">
    <path d="M193.2 84.4 q46.8 -20 93.6 0 v48.38399999999999 q0 50.687999999999995 -46.8 66.81599999999999 q-46.8 -16.128 -46.8 -66.81599999999999 z" fill="url(#gClay)"/>
    <path d="M202.2 90.4 q23.4 -14 46.8 -4 v57.599999999999994 q-23.4 8 -46.8 -6 z" fill="#FFFFFF" opacity="0.24"/>
  </g>
  <g id="keyhole" data-layer="keyhole">
    <circle cx="240" cy="120" r="12" fill="#FFFFFF" opacity=".95"/>
    <path d="M234 128 h12 l-3 22 h-6 z" fill="#FFFFFF" opacity=".95"/>
  </g>
  <g id="modules" data-layer="modules">
    <rect x="116" y="208" width="92" height="34" rx="12" fill="url(#gPowder)"/>
    <rect x="220" y="208" width="92" height="34" rx="12" fill="url(#gPowder)"/>
    <rect x="324" y="208" width="44" height="34" rx="12" fill="url(#gAccent)"/>
    <rect x="116" y="254" width="62" height="34" rx="12" fill="url(#gPowder)"/>
    <rect x="190" y="254" width="92" height="34" rx="12" fill="url(#gAccent)"/>
    <rect x="294" y="254" width="74" height="34" rx="12" fill="url(#gPowder)"/>
  </g>
  </g>
</svg>
