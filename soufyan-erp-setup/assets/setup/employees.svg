  <rect x="152" y="226" width="176" height="56" rx="20" fill="url(#gWhite)"/><rect x="172" y="252" width="136" height="9" rx="4.5" fill="#C7D8FB"/><rect x="172" y="272" width="110" height="9" rx="4.5" fill="#C7D8FB"/>
