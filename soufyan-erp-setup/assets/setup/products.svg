<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" fill="none" role="img" aria-labelledby="ttl">
  <title id="ttl">الماركات والموديلات</title>

  <defs>
    <linearGradient id="gClay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C9AFB"/><stop offset="1" stop-color="#2F4FD8"/>
    </linearGradient>
    <linearGradient id="gClayDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B58AE"/><stop offset="1" stop-color="#1B2E6B"/>
    </linearGradient>
    <linearGradient id="gPowder" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F2F6FE"/><stop offset="1" stop-color="#C7D8FB"/>
    </linearGradient>
    <linearGradient id="gScreen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E8F0FF"/><stop offset="1" stop-color="#B7CDFA"/>
    </linearGradient>
    <linearGradient id="gWhite" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F0FE"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8C0FF"/><stop offset="1" stop-color="#5B7BF0"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FAEFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8FAEFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B2E6B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1B2E6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="fTiny" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <g id="scene" data-layer="scene">
<g id="abstract-shapes" data-layer="abstract-shapes"><circle cx="240" cy="150" r="128" fill="url(#gGlow)"/>
     <rect x="52" y="188" width="34" height="34" rx="12" fill="#C7D8FB" opacity=".5"/>
     <circle cx="418" cy="112" r="18" fill="#7E9BF6" opacity=".34"/></g>
  <g id="shadow" data-layer="shadow"><ellipse cx="240" cy="302" rx="126" ry="24" fill="url(#gShadow)"/></g>
  
  <g id="phone" data-layer="phone" transform="rotate(0 244 163)">
    <g id="phone-body" data-layer="phone-body">
      <rect x="196" y="74" width="96" height="178" rx="28" fill="url(#gClay)"/>
      <path d="M208 236 V90 a22 22 0 0 1 22 -22 h36.480000000000004 a6 6 0 0 1 0 12 h-28.799999999999997 a10 10 0 0 0 -10 10 V236 a6 6 0 0 1 -12 0 z" fill="#FFFFFF" opacity="0.26"/>
    </g>
    <g id="phone-screen" data-layer="phone-screen">
      <rect x="205" y="85" width="78" height="156" rx="20" fill="url(#gScreen)"/>
      
    <circle cx="244" cy="128" r="26" fill="url(#gAccent)"/>
    <rect x="214" y="172" width="60" height="9" rx="4.5" fill="#C7D8FB"/>
    <rect x="226" y="190" width="36" height="9" rx="4.5" fill="#C7D8FB"/>
    </g>
    <g id="camera" data-layer="camera">
      <rect x="252" y="88" width="24" height="14" rx="7" fill="#1B2E6B" opacity=".22"/>
      <circle cx="264" cy="95" r="4.4" fill="#1B2E6B" opacity=".5"/>
    </g>
    <g id="buttons" data-layer="buttons">
      <rect x="290" y="126" width="4" height="26" rx="2" fill="#1B2E6B" opacity=".35"/>
      <rect x="290" y="160" width="4" height="16" rx="2" fill="#1B2E6B" opacity=".28"/>
    </g>
  </g>
  <g id="variants" data-layer="variants">
    <rect x="96" y="128" width="74" height="32" rx="16" fill="url(#gPowder)"/>
    <rect x="96" y="176" width="74" height="32" rx="16" fill="url(#gPowder)"/>
    <rect x="310" y="128" width="74" height="32" rx="16" fill="url(#gPowder)"/>
    <rect x="310" y="176" width="74" height="32" rx="16" fill="url(#gPowder)"/>
    <circle cx="133" cy="144" r="9" fill="#2F4FD8"/>
    <circle cx="133" cy="192" r="9" fill="#7E9BF6"/>
    <circle cx="347" cy="144" r="9" fill="#1B2E6B"/>
    <circle cx="347" cy="192" r="9" fill="#8FA3C8"/>
  </g>
  </g>
</svg>
