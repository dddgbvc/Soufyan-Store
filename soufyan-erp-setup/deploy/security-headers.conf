# =============================================================================
# ترويسات الأمان — تُضبط على الخادم لا في <meta>
# -----------------------------------------------------------------------------
# CSP موجودة في <meta> داخل index.html لتعمل حتى عند فتح الملف مباشرةً،
# لكن ثلاث توجيهات لا تعمل إلا كترويسة HTTP حقيقية:
#   • frame-ancestors  — تُتجاهَل تمامًا داخل <meta>
#   • HSTS
#   • X-Frame-Options
#
# اضبط أيضًا سرّ دوال الحافة قبل التشغيل الحقيقي:
#   supabase secrets set SETUP_ALLOWED_ORIGINS="https://setup.example.com"
# بدونه تسمح setup-invoice و setup-provision بعناوين التطوير المحلية وحدها.
# =============================================================================

# ---------------------------------------------------------------- nginx ------
# ضعها داخل server { } أو location / { }

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' https://tyfidwamnlraysqrfdgb.supabase.co; worker-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# ملاحظة: publickey-credentials-get لازمة لو فُعِّل مفتاح المرور (WebAuthn)
# على هذا النطاق. أضفها إلى Permissions-Policy عندئذٍ:
#   publickey-credentials-get=(self)


# ------------------------------------------------- Netlify / Cloudflare ------
# ضع المحتوى التالي في ملف اسمه `_headers` بجذر النشر.
#
# /*
#   Content-Security-Policy: default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' https://tyfidwamnlraysqrfdgb.supabase.co; worker-src 'none'; upgrade-insecure-requests
#   Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
#   X-Content-Type-Options: nosniff
#   X-Frame-Options: DENY
#   Referrer-Policy: strict-origin-when-cross-origin
#   Permissions-Policy: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Resource-Policy: same-origin


# ------------------------------------------------------------ التدرّج --------
# أثناء الهجرة يمكن البدء بوضع التقرير قبل الفرض:
#
#   Content-Security-Policy-Report-Only: <نفس القيمة>; report-uri /csp-report
#
# راقب التقارير أسبوعًا، ثم بدّل الاسم إلى Content-Security-Policy.
# هذه الصفحة اختُبرت تحت السياسة المفروضة مباشرةً (tests/security.mjs)،
# فوضع التقرير احتياط لمن يضيف نصوصًا خارجية لاحقًا.
