/* ---------- 2. الرموز اللونية ---------- */
:root{
  /* الأساسية */
  --deep:#14343F;   /* بترولي عميق  — اللون الرئيسي   */
  --teal:#2F6F6B;   /* مائي هادئ    — اللون الثانوي   */
  --mist:#9CC0BB;   /* مائي فاتح    — لون مساند       */
  --sand:#F2EDE4;   /* رملي دافئ    — الخلفية         */
  --gold:#C8A96A;   /* ذهبي مطفي    — لمسة التميّز    */
  --ink:#101E24;    /* حبري         — النصوص          */

  /* مشتقات */
  --sand-2:#E7DFD1;
  --surface-d:#1D4756;   /* سطح فاتح فوق الخلفية الداكنة */
  --surface-d2:#265463;  /* سطح أعلى درجة */
  --deep-80:rgba(20,52,63,.80);
  --deep-55:rgba(20,52,63,.55);
  --deep-12:rgba(20,52,63,.12);
  --sand-70:rgba(242,237,228,.70);
  --sand-45:rgba(242,237,228,.45);

  /* الخطوط */
  --display:'El Messiri', 'Cairo', serif;   /* العناوين والشعار */
  --body:'Cairo', system-ui, sans-serif;    /* المتن والواجهات */

  --r-sm:14px; --r:24px; --r-lg:40px;
}

/* ---------- 3. أساسيات لوحة الرسم ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#8b8b8b}
body{
  font-family:var(--body); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  display:flex; flex-direction:column; align-items:center; gap:48px; padding:48px 0;
}

/* كل عنصر [data-document-role="page"] = لوح تصميم واحد بمقاس ثابت */
[data-document-role="page"]{
  position:relative; overflow:hidden; flex:none;
  background:var(--sand); direction:rtl;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
}

/* ---------- 4. عناصر متكررة في الهوية ---------- */

/* الشعار النصي */
.wordmark{font-family:var(--display);font-weight:700;line-height:1;letter-spacing:0}
.latinmark{
  font-family:var(--body); font-weight:600; direction:ltr;
  letter-spacing:.42em; text-transform:uppercase;
}

/* نمط «الموجة» — الخلفية المميزة للعلامة */
.arc-bg{position:absolute;inset:0;pointer-events:none}

/* شريط معلومات التواصل */
.contact-strip{
  display:flex;align-items:center;justify-content:center;gap:28px;
  font-weight:600;letter-spacing:.01em;
}
.contact-strip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.num{direction:ltr;unicode-bidi:embed;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* رقاقة / شارة */
.chip{
  display:inline-flex;align-items:center;gap:10px;
  border-radius:999px;font-weight:600;line-height:1;
}

/* شبكة نقاط خفيفة — قوام هادئ للخلفيات */
.dots{
  position:absolute;inset:0;
  background-image:radial-gradient(currentColor 1.4px, transparent 1.5px);
  background-size:22px 22px; opacity:.10; pointer-events:none;
}

</style><style>

   ========================================================= */

/* ---------- الرمز المضمّن (يتلوّن بـ currentColor) ---------- */
.mark{fill:none;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;display:block}
.mark path{fill:none;stroke:currentColor}
.mark .acc{stroke:var(--gold)}

/* قفل الشعار: رمز + اسم */
.lockup{display:flex;align-items:center;gap:var(--lk-gap,18px)}
.lockup .badge{
  background:currentColor;border-radius:var(--lk-r,26px);
  width:var(--lk-size,96px);height:var(--lk-size,96px);
  display:grid;place-items:center;flex:none;
}
.lockup .badge .mark{width:74%;color:var(--lk-glyph,var(--sand))}
.lockup .names{display:flex;flex-direction:column;gap:var(--lk-gap2,6px)}
.lockup .names b{font-family:var(--display);font-weight:700;line-height:1;font-size:var(--lk-name,40px)}
.lockup .names span{
  font-weight:600;direction:ltr;letter-spacing:.36em;text-transform:uppercase;
  font-size:var(--lk-sub,13px);opacity:.72;
}

/* ---------- القوس المميّز — صدى لكأس الحرف «س» ---------- */
.arc{position:absolute;border-radius:50%;pointer-events:none}

/* ---------- الأعمدة المتدرّجة كفاصل زخرفي ---------- */
/* direction:ltr يضمن تصاعد الأعمدة نحو اليمين مثل الرمز تماماً */
.bars{display:flex;align-items:flex-end;gap:var(--bg-gap,9px);direction:ltr}
.bars i{display:block;width:var(--bw,12px);border-radius:99px;background:currentColor}
.bars i:nth-child(1){height:calc(var(--bh,44px)*.42)}
.bars i:nth-child(2){height:calc(var(--bh,44px)*.70)}
.bars i:nth-child(3){height:var(--bh,44px);background:var(--gold)}

/* ---------- رقاقات ---------- */
.pill{
  display:inline-flex;align-items:center;gap:12px;border-radius:999px;
  padding:14px 26px;font-weight:600;line-height:1;
  background:rgba(242,237,228,.10);
  border:1.5px solid rgba(242,237,228,.30);
  color:var(--sand);
}
.pill.solid{background:var(--sand);border-color:var(--sand);color:var(--deep)}
.pill.line{background:transparent;border:2px solid var(--deep-12);color:var(--deep)}
.pill.gold{background:rgba(200,169,106,.16);border-color:rgba(200,169,106,.55);color:var(--gold)}

/* أرقام ومصطلحات لاتينية داخل نص عربي — تُعزل حتى لا ينقلب ترتيبها */
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- أيقونات خطية موحّدة ---------- */
.ico,.ico *{fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- شريط تواصل سفلي ---------- */
.footer-bar{
  position:absolute;inset-inline:0;bottom:0;
  display:flex;align-items:center;justify-content:center;gap:26px;
  font-weight:600;
}

/* ---------- بطاقات ---------- */
.card{background:var(--sand);border-radius:var(--r-lg);position:relative;overflow:hidden}
.card.dark{background:var(--deep);color:var(--sand)}

/* ---------- ملصق دائري ---------- */
.sticker{border-radius:50%;display:grid;place-items:center;text-align:center;position:relative}
