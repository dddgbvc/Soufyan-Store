<meta charset="utf-8">
<title>مكتب سفيان للموبايل — ستوري إنستغرام</title>
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="../css/boards.css">
<style>
  .story{width:1080px;height:1920px;padding:96px;display:flex;flex-direction:column;
         background:var(--deep);color:var(--sand)}
  .story.light{background:var(--sand);color:var(--deep)}

  .halo{position:absolute;border-radius:50%;background:var(--teal);opacity:.22;filter:blur(80px)}
  .ghost{position:absolute;color:var(--sand);opacity:.05}

  h1{font-family:var(--display);font-weight:700;font-size:112px;line-height:1.18}
  h2{font-family:var(--display);font-weight:700;font-size:82px;line-height:1.2}
  .kicker{font-weight:700;letter-spacing:.14em;font-size:25px;color:var(--gold)}
  .lede{font-size:32px;line-height:1.65;opacity:.8}
  .sep{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}

  .cta{display:inline-flex;align-items:center;gap:16px;background:var(--gold);color:var(--deep);
       border-radius:999px;padding:30px 52px;font-size:34px;font-weight:700;line-height:1}
  .cta svg{width:38px;height:38px}

  /* ── أغلفة الهايلايت: 1080×1080 والدائرة الظاهرة في إنستغرام أصغر ── */
  .hl{width:1080px;height:1080px;background:var(--deep);display:grid;place-items:center}
  .hl-in{
    position:relative;width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:52px;
  }
  .hl svg.ico{width:250px;height:250px;color:var(--sand);stroke-width:3.2}
  .hl .cap{font-family:var(--display);font-weight:700;font-size:74px;color:var(--gold)}
  .hl.alt{background:var(--sand)}
  .hl.alt svg.ico{color:var(--deep)}
  .hl.alt .cap{color:var(--teal)}
</style>

<!-- ══════════════ ستوري 1 — ترحيبي ══════════════ -->
<div class="story" data-document-role="page" data-slug="story-1-welcome" data-label="ستوري ترحيبي">
  <div class="halo" style="width:900px;height:900px;inset-block-start:-360px;inset-inline-start:-320px"></div>
  <svg class="ghost" viewBox="48 62 144 116" style="width:1050px;inset-block-end:-190px;inset-inline-end:-230px">
    <g fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M180,134 C180,154 166,166 142,166 L60,166"/><path d="M133,92 L133,158"/>
      <path d="M84,108 L84,158"/><path d="M180,74 L180,140"/>
    </g>
  </svg>

  <div style="flex:1"></div>
  <div style="position:relative">
    <div class="badge" style="background:var(--sand);border-radius:40px;width:150px;height:150px;display:grid;place-items:center">
      <svg class="mark" viewBox="48 62 144 116" style="width:70%;color:var(--deep)"><path d="M180,134 C180,154 166,166 142,166 L60,166"/><path d="M133,92 L133,158"/><path d="M84,108 L84,158"/><path class="acc" d="M180,74 L180,140"/></svg>
    </div>
    <div class="kicker" style="margin-block-start:58px">مكتب سفيان للموبايل</div>
    <h1 style="margin-block-start:26px">شاشتك الجاية<br>تبدأ من هنا</h1>
    <p class="lede" style="margin-block-start:38px">هواتف أصلية · إكسسوارات موثوقة<br>باقات إنترنت — بمكان واحد.</p>
  </div>
  <div style="flex:1"></div>

  <div style="position:relative">
    <span class="cta">
      <svg class="ico" viewBox="0 0 64 64"><path d="M56 30c0 12-11 21-24 21a27 27 0 0 1-8-1L12 54l4-10a19 19 0 0 1-6-14c0-12 11-21 24-21s22 9 22 21z"/></svg>
      <span>اطلب عبر واتساب</span>
    </span>
    <div style="margin-block-start:44px;display:flex;align-items:center;gap:20px;font-size:28px;font-weight:600;opacity:.78">
      <span>سامراء — الحويش</span><span class="sep"></span><span class="ltr">0773 164 4450</span>
    </div>
  </div>
</div>

<!-- ══════════════ ستوري 2 — عرض ══════════════ -->

      <span style="font-size:34px;font-weight:600;opacity:.6">د.ع</span>

    <div style="margin-block-start:46px;display:flex;align-items:center;justify-content:space-between">
      <span class="cta">
        <svg class="ico" viewBox="0 0 64 64"><path d="M56 30c0 12-11 21-24 21a27 27 0 0 1-8-1L12 54l4-10a19 19 0 0 1-6-14c0-12 11-21 24-21s22 9 22 21z"/></svg>
        <span>اطلب الآن</span>
      </span>
      <span class="ltr" style="font-size:30px;font-weight:700;color:var(--teal)">0773 164 4450</span>
    </div>
  </div>
</div>
