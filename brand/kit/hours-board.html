<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الدوام — مكتب سفيان للموبايل</title>
<link rel="stylesheet" href="../logo.css">
<link rel="stylesheet" href="../kit.css">
<style>
  html,body{margin:0;padding:0;background:#D9D4C8}
  body{display:grid;place-items:center;min-height:100vh;padding:24px}
  .frame{box-shadow:0 8px 40px rgba(16,30,36,.18);border-radius:2px;overflow:hidden}
  .cap{font:500 13px "Thmanyah Sans",system-ui;color:#14343F;direction:rtl;margin-top:14px;text-align:center}
  .cap b{font-weight:700}.cap span{opacity:.6}
  @media print{body{padding:0;background:#fff}.frame{box-shadow:none}.cap{display:none}}
</style></head>
<body>
<div><div class="frame"><div class="ab" style="--w:800;--h:1200"><div class="pattern pattern--dots "></div><div class="hours stack"><div><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><rect x="16.75" y="49" width="16.5" height="30" rx="8.25" fill="#14343F"/><rect x="41.75" y="35" width="16.5" height="44" rx="8.25" fill="#14343F"/><rect x="66.75" y="21" width="16.5" height="58" rx="8.25" fill="#C8A96A"/></svg><div class="hours__name">مكتب سفيان للموبايل</div></div><div style="display:grid;align-content:center;justify-items:center"><div class="hours__label">الدوام</div><div class="hours__big">9:00</div><div style="width:64px;height:4px;background:#C8A96A;border-radius:4px;margin:22px 0"></div><div class="hours__big">22:00</div><div class="hours__days">يومياً — بلا عطلة</div></div><div class="hours__foot">سامراء — الحويش — الشارع الرئيسي</div></div></div></div>
<div class="cap"><b>لوحة الدوام</b> <span>· 20 × 30 سم</span></div></div>
</body></html>
