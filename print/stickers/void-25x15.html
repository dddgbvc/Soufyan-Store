<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ستيكر قابل للكسر — 25 × 15 مم</title>
<link rel="stylesheet" href="../assets/sufyan-print.css">
<style>
  @page { size: 25mm 15mm; margin: 0; }
  @media screen {
    body { margin: 0; }
    .sp-toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center;
      justify-content: center; padding: 12px; background: #14343F; color: #F2EDE4;
      font: 500 13px "Thmanyah Sans", system-ui, sans-serif; direction: rtl; }
    .sp-toolbar b { font-weight: 700; }
    .sp-toolbar span { opacity: .65; }
    .sp-toolbar button { font: 700 13px "Thmanyah Sans", system-ui, sans-serif; cursor: pointer;
      background: #C8A96A; color: #14343F; border: 0; border-radius: 999px; padding: 7px 18px; }
    .sp-toolbar a { color: #9CC0BB; }
  }
</style>
</head>
<body>
  <div class="sp-toolbar sp-noprint">
    <b>ستيكر قابل للكسر</b>
    <span>25 × 15 مم</span>
    <button onclick="window.print()">طباعة بالمقاس الحقيقي</button>
    <a href="../index.html">كل المطبوعات</a>
  </div>
  <div class="sp-stage">
      <div class="sp" data-kind="sticker.void" style="--sp-w:25;--sp-h:15"><div class="sp-void"><svg class="sp-mark sp-mark--sand" viewBox="0 0 100 100" aria-hidden="true"><rect x="16.75" y="49" width="16.5" height="30" rx="8.25"/><rect x="41.75" y="35" width="16.5" height="44" rx="8.25"/><rect x="66.75" y="21" width="16.5" height="58" rx="8.25"/></svg><div class="sp-void__word sp-latin">VOID</div><div class="sp-void__note">الكفالة تسقط عند النزع</div><div class="sp-void__serial sp-num">VD-004182</div></div></div>
      <div class="sp" data-kind="sticker.void" style="--sp-w:25;--sp-h:15"><div class="sp-void"><svg class="sp-mark sp-mark--sand" viewBox="0 0 100 100" aria-hidden="true"><rect x="16.75" y="49" width="16.5" height="30" rx="8.25"/><rect x="41.75" y="35" width="16.5" height="44" rx="8.25"/><rect x="66.75" y="21" width="16.5" height="58" rx="8.25"/></svg><div class="sp-void__word sp-latin">VOID</div><div class="sp-void__note">لا تنزع — الكفالة</div><div class="sp-void__serial sp-num">VD-004183</div></div></div>
  </div>
<script src="../assets/sufyan-print.js"></script>
</body>
</html>
