<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شارة دائرية — 40 × 40 مم</title>
<link rel="stylesheet" href="../assets/sufyan-print.css">
<style>
  @page { size: 40mm 40mm; margin: 0; }
  @media screen {
    body { margin: 0; }
    .sp-toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center;
      justify-content: center; padding: 12px; background: #14343F; color: #F2EDE4;
      font: 500 13px "Thmanyah Sans", system-ui, sans-serif; direction: rtl; }
    .sp-toolbar b { font-weight: 700; }
    .sp-toolbar span { opacity: .65; }
    .sp-toolbar button { font: 700 13px "Thmanyah Sans", system-ui, sans-serif; cursor: pointer;
      background: #C8A96A; color: #14343F; border: 0; border-radius: 999px; padding: 7px 18px; }
    .sp-toolbar a { color: #9CC0BB; }
  }
</style>
</head>
<body>
  <div class="sp-toolbar sp-noprint">
    <b>شارة دائرية</b>
    <span>40 × 40 مم</span>
    <button onclick="window.print()">طباعة بالمقاس الحقيقي</button>
    <a href="../index.html">كل المطبوعات</a>
  </div>
  <div class="sp-stage">
      <div class="sp" data-kind="sticker.badge" style="--sp-w:40;--sp-h:40"><div class="sp-badge" style="background:var(--sp-deep);color:var(--sp-gold)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/></svg><div class="sp-badge__text">كفالة سنة</div></div></div>
      <div class="sp" data-kind="sticker.badge" style="--sp-w:40;--sp-h:40"><div class="sp-badge" style="background:var(--sp-teal);color:var(--sp-sand)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg><div class="sp-badge__text">تم الفحص</div></div></div>
      <div class="sp" data-kind="sticker.badge" style="--sp-w:40;--sp-h:40"><div class="sp-badge" style="background:var(--sp-gold);color:var(--sp-deep)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.6-7 9-7 9z"/></svg><div class="sp-badge__text">شكراً لطلبك</div></div></div>
  </div>
<script src="../assets/sufyan-print.js"></script>
</body>
</html>
