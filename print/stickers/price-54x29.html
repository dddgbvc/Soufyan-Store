<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملصق السعر — 54 × 29 مم</title>
<link rel="stylesheet" href="../assets/sufyan-print.css">
<style>
  @page { size: 54mm 29mm; margin: 0; }
  @media screen {
    body { margin: 0; }
    .sp-toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center;
      justify-content: center; padding: 12px; background: #14343F; color: #F2EDE4;
      font: 500 13px "Thmanyah Sans", system-ui, sans-serif; direction: rtl; }
    .sp-toolbar b { font-weight: 700; }
    .sp-toolbar span { opacity: .65; }
    .sp-toolbar button { font: 700 13px "Thmanyah Sans", system-ui, sans-serif; cursor: pointer;
      background: #C8A96A; color: #14343F; border: 0; border-radius: 999px; padding: 7px 18px; }
    .sp-toolbar a { color: #9CC0BB; }
  }
</style>
</head>
<body>
  <div class="sp-toolbar sp-noprint">
    <b>ملصق السعر</b>
    <span>54 × 29 مم</span>
    <button onclick="window.print()">طباعة بالمقاس الحقيقي</button>
    <a href="../index.html">كل المطبوعات</a>
  </div>
  <div class="sp-stage">
      <div class="sp" data-kind="sticker.price" style="--sp-w:54;--sp-h:29"><div class="sp-price"><div><div class="sp-price__label">السعر</div><div class="sp-price__value"><span class="sp-num">385,000</span> <small>د.ع</small></div></div><svg class="sp-mark sp-mark--deep" viewBox="0 0 100 100" aria-hidden="true"><rect x="16.75" y="49" width="16.5" height="30" rx="8.25"/><rect x="41.75" y="35" width="16.5" height="44" rx="8.25"/><rect x="66.75" y="21" width="16.5" height="58" rx="8.25"/></svg></div></div>
      <div class="sp" data-kind="sticker.price" style="--sp-w:54;--sp-h:29"><div class="sp-price sp-price--dark"><div><div class="sp-price__label">السعر</div><div class="sp-price__value"><span class="sp-num">385,000</span> <small>د.ع</small></div></div><svg class="sp-mark sp-mark--sand" viewBox="0 0 100 100" aria-hidden="true"><rect x="16.75" y="49" width="16.5" height="30" rx="8.25"/><rect x="41.75" y="35" width="16.5" height="44" rx="8.25"/><rect x="66.75" y="21" width="16.5" height="58" rx="8.25"/></svg></div></div>
  </div>
<script src="../assets/sufyan-print.js"></script>
</body>
</html>
