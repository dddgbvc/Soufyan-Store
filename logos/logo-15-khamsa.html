<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 15 — الخماسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#FFFDF5;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Tajawal',sans-serif;font-weight:900;font-size:88px;line-height:1.15;
    color:#1F2937;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Tajawal',sans-serif;font-weight:500;font-size:28px;color:#F97316;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#0EA5E9;letter-spacing:.01em;white-space:nowrap}
  .rule{width:200px;height:3px;border-radius:2px;background:#F97316;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Tajawal',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#F97316;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 15 — الخماسية">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-90 100 100)" fill="none" stroke-width="20" stroke-linecap="round">
        <circle cx="100" cy="100" r="76" stroke="#EF4444" stroke-dasharray="76 401"/>
        <circle cx="100" cy="100" r="76" stroke="#F97316" stroke-dasharray="76 401" stroke-dashoffset="-95.5"/>
        <circle cx="100" cy="100" r="76" stroke="#FACC15" stroke-dasharray="76 401" stroke-dashoffset="-191"/>
        <circle cx="100" cy="100" r="76" stroke="#22C55E" stroke-dasharray="76 401" stroke-dashoffset="-286.5"/>
        <circle cx="100" cy="100" r="76" stroke="#0EA5E9" stroke-dasharray="76 401" stroke-dashoffset="-382"/>
      </g>
      <rect x="78" y="66" width="44" height="68" rx="12" fill="#1F2937"/>
      <rect x="92" y="74" width="16" height="4.5" rx="2.2" fill="#FFFDF5"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="chips"><span class="chip" style="background:#2563EB">الخطوط</span><span class="chip" style="background:#12B76A">الأرصدة</span><span class="chip" style="background:#F97316">الهواتف</span><span class="chip" style="background:#EC4899">الإنترنت</span><span class="chip" style="background:#F5B301">الصيانة</span></div>
  </div>
</div>
</body>
</html>
