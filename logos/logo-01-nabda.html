<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 01 — النبضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#FFF3F1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Changa',sans-serif;font-weight:800;font-size:88px;line-height:1.15;
    color:#2B0A0E;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Changa',sans-serif;font-weight:500;font-size:28px;color:#FF3B4E;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#FFB3B8;letter-spacing:.01em}
  .rule{width:200px;height:3px;border-radius:2px;background:#FF3B4E;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Changa',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#FF3B4E;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 01 — النبضة">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="92" fill="#FF3B4E"/>
      <path d="M34 100 H66 L80 66 L100 138 L116 100 H166" stroke="#FFFFFF" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="services"><span>الخطوط</span><i class="dot">·</i><span>الأرصدة</span><i class="dot">·</i><span>الهواتف</span><i class="dot">·</i><span>الإنترنت</span><i class="dot">·</i><span>الصيانة</span></div>
  </div>
</div>
</body>
</html>
