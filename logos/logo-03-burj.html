<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 03 — البرج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Alexandria',sans-serif;font-weight:800;font-size:82px;line-height:1.15;
    color:#111827;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Alexandria',sans-serif;font-weight:500;font-size:28px;color:#3B82F6;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#F59E0B;letter-spacing:.01em;white-space:nowrap}
  .rule{width:200px;height:3px;border-radius:2px;background:#3B82F6;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Alexandria',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#3B82F6;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 03 — البرج">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 216 200" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="24" y="130" width="24" height="46" rx="12" fill="#EF4444"/>
      <rect x="60" y="108" width="24" height="68" rx="12" fill="#F97316"/>
      <rect x="96" y="82" width="24" height="94" rx="12" fill="#FACC15"/>
      <rect x="132" y="54" width="24" height="122" rx="12" fill="#22C55E"/>
      <rect x="168" y="26" width="24" height="150" rx="12" fill="#3B82F6"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="chips"><span class="chip" style="background:#2563EB">الخطوط</span><span class="chip" style="background:#12B76A">الأرصدة</span><span class="chip" style="background:#F97316">الهواتف</span><span class="chip" style="background:#EC4899">الإنترنت</span><span class="chip" style="background:#F5B301">الصيانة</span></div>
  </div>
</div>
