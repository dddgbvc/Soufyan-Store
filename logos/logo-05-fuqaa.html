<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 05 — الفقاعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#FAF5FF;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:86px;line-height:1.15;
    color:#2E1065;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:500;font-size:28px;color:#8B5CF6;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#F0ABFC;letter-spacing:.01em;white-space:nowrap}
  .rule{width:200px;height:3px;border-radius:2px;background:#8B5CF6;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#8B5CF6;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 05 — الفقاعة">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M36 24 H164 A24 24 0 0 1 188 48 V126 A24 24 0 0 1 164 150 H96 L52 186 V150 H36 A24 24 0 0 1 12 126 V48 A24 24 0 0 1 36 24 Z" fill="#8B5CF6"/>

      <rect x="92" y="62" width="16" height="5" rx="2.5" fill="#8B5CF6"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="chips"><span class="chip">الخطوط</span><span class="chip">الأرصدة</span><span class="chip">الهواتف</span><span class="chip">الإنترنت</span><span class="chip">الصيانة</span></div>
  </div>
</div>
