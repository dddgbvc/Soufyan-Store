<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 11 — المربعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Cairo',sans-serif;font-weight:900;font-size:86px;line-height:1.15;
    color:#18181B;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Cairo',sans-serif;font-weight:500;font-size:28px;color:#EF4444;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#2563EB;letter-spacing:.01em;white-space:nowrap}
  .rule{width:200px;height:3px;border-radius:2px;background:#EF4444;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Cairo',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#EF4444;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 11 — المربعات">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="14" width="80" height="80" rx="22" fill="#EF4444"/>
      <circle cx="146" cy="54" r="40" fill="#FACC15"/>
      <rect x="14" y="106" width="80" height="80" rx="40" fill="#2563EB"/>
      <rect x="106" y="106" width="80" height="80" rx="22" fill="#22C55E"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="chips"><span class="chip" style="background:#2563EB">الخطوط</span><span class="chip" style="background:#12B76A">الأرصدة</span><span class="chip" style="background:#F97316">الهواتف</span><span class="chip" style="background:#EC4899">الإنترنت</span><span class="chip" style="background:#F5B301">الصيانة</span></div>
  </div>
</div>
</body>
</html>
