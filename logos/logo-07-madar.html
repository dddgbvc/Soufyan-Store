<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 07 — المدار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#F2FBFC;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Readex Pro',sans-serif;font-weight:700;font-size:84px;line-height:1.15;
    color:#083344;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Readex Pro',sans-serif;font-weight:500;font-size:28px;color:#06B6D4;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#A3E635;letter-spacing:.01em;white-space:nowrap}
  .rule{width:200px;height:3px;border-radius:2px;background:#06B6D4;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Readex Pro',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#06B6D4;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 07 — المدار">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="100" rx="92" ry="52" transform="rotate(-28 100 100)" stroke="#06B6D4" stroke-width="11" fill="none"/>
      <rect x="72" y="52" width="56" height="96" rx="15" fill="#083344"/>
      <rect x="90" y="62" width="20" height="5" rx="2.5" fill="#A3E635"/>
      <circle cx="166" cy="58" r="13" fill="#A3E635"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="services"><span>الخطوط</span><i class="dot">·</i><span>الأرصدة</span><i class="dot">·</i><span>الهواتف</span><i class="dot">·</i><span>الإنترنت</span><i class="dot">·</i><span>الصيانة</span></div>
  </div>
</div>
