<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>لوغو 10 — الملوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#FBF3E7;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Amiri',sans-serif;font-weight:700;font-size:96px;line-height:1.15;

  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#8C6A3F;letter-spacing:.01em}
  .rule{width:200px;height:3px;border-radius:2px;background:#C2410C;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Amiri',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#C2410C;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>

      <rect x="52" y="132" width="96" height="16" rx="8" fill="#C2410C"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="rule"></div><div class="services plain">الخطوط &nbsp;·&nbsp; الأرصدة &nbsp;·&nbsp; الهواتف &nbsp;·&nbsp; الإنترنت &nbsp;·&nbsp; الصيانة</div>
  </div>
</div>
