<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 04 — الشريحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#F1F5FF;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Almarai',sans-serif;font-weight:800;font-size:84px;line-height:1.15;
    color:#0B1B3B;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Almarai',sans-serif;font-weight:500;font-size:28px;color:#1D4ED8;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#FACC15;letter-spacing:.01em;white-space:nowrap}
  .rule{width:200px;height:3px;border-radius:2px;background:#1D4ED8;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Almarai',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#1D4ED8;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 04 — الشريحة">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M42 22 H126 L166 62 V166 A12 12 0 0 1 154 178 H42 A12 12 0 0 1 30 166 V34 A12 12 0 0 1 42 22 Z" fill="#1D4ED8"/>
      <rect x="60" y="78" width="76" height="72" rx="14" fill="#FACC15"/>
      <path d="M60 102 H136 M60 126 H136 M98 78 V150" stroke="#1D4ED8" stroke-width="7" stroke-linecap="round"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="services"><span>الخطوط</span><i class="dot">·</i><span>الأرصدة</span><i class="dot">·</i><span>الهواتف</span><i class="dot">·</i><span>الإنترنت</span><i class="dot">·</i><span>الصيانة</span></div>
  </div>
</div>
</body>
</html>
