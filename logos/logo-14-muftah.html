<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو 14 — المفتاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#FAFAFA;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:42px}
  .wordmark{font-family:'Rubik',sans-serif;font-weight:800;font-size:88px;line-height:1.15;
    color:#18181B;white-space:nowrap;letter-spacing:-.01em}
  .services{font-family:'Rubik',sans-serif;font-weight:500;font-size:28px;color:#FFC107;
    display:flex;align-items:center;gap:0;white-space:nowrap;line-height:1.4}
  .services .dot{font-style:normal;opacity:.5;padding:0 12px}
  .services.plain{display:block;color:#27272A;letter-spacing:.01em}
  .rule{width:200px;height:3px;border-radius:2px;background:#FFC107;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Rubik',sans-serif;font-weight:600;font-size:26px;color:#fff;
    background:#FFC107;padding:14px 24px 16px;border-radius:999px;line-height:1.25}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="لوغو 14 — المفتاح">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="180" height="180" rx="44" fill="#27272A"/>

      <rect x="76" y="52" width="24" height="6" rx="3" fill="#27272A"/>
      <path d="M128 92 A 24 24 0 1 0 152 116 L176 140 A 12 12 0 0 1 158 158 L134 134 A 24 24 0 0 0 128 92 Z" fill="#FFC107"/></svg>
    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="chips"><span class="chip">الخطوط</span><span class="chip">الأرصدة</span><span class="chip">الهواتف</span><span class="chip">الإنترنت</span><span class="chip">الصيانة</span></div>
  </div>
</div>
</body>
</html>
