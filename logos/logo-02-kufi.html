<!doctype html>
<html lang="ar" dir="rtl">

<title>لوغو 02 — الكوفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}
  .page{width:1080px;height:1080px;background:#F7F4EC;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

  .rule{width:200px;height:3px;border-radius:2px;background:#00A870;margin-bottom:-20px}
  .chips{display:flex;gap:13px;white-space:nowrap}
  .chip{font-family:'Reem Kufi',sans-serif;font-weight:600;font-size:26px;color:#fff;

    <div class="wordmark">مكتب سفيان للموبايل</div>

  </div>
