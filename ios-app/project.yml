# مشروع Xcode يُولَّد بـ XcodeGen:  brew install xcodegen && xcodegen generate
name: YaqootERP
options:
  bundleIdPrefix: iq.yaqoot
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # عنوان خادم ياقوت يُمرَّر وقت البناء (سرّ في GitHub) ولا يُحفظ في المستودع
    YQ_BASE_URL: ""
    YQ_APP_PROFILE: ""
    YQ_WIDGET_PROFILE: ""

targets:
  YaqootERP:
    type: application
    platform: iOS
    sources:
      - path: YaqootERP
      - path: Shared
    dependencies:
      - target: YaqootWidgets
    entitlements:
      path: YaqootERP/YaqootERP.entitlements
      properties:
        com.apple.security.application-groups: [group.iq.yaqoot.erp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: iq.yaqoot.erp
        PRODUCT_NAME: YaqootERP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: YaqootERP/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: $(YQ_APP_PROFILE)
    info:
      path: YaqootERP/Info.plist
      properties:
        CFBundleDisplayName: متابعة مكتب سفيان للموبايل
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [iq.yaqoot.erp.refresh]
        NSFaceIDUsageDescription: يستعمل التطبيق Face ID لفتح جلستك بسرعة بدل كتابة رمز PIN.
        NSLocalNetworkUsageDescription: يتصل التطبيق بأجهزة MikroTik وUISP داخل شبكة المكتب أو عبر VPN لعرض حالتها وإدارتها.
        NSCameraUsageDescription: لتصوير كشوفات المشتركين الورقية واستيرادها.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        YQBaseURL: $(YQ_BASE_URL)
        YQAppGroup: group.iq.yaqoot.erp
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: iq.yaqoot.erp
            CFBundleURLSchemes: [sufyan]

  # الودجت (الشاشة الرئيسية وشاشة القفل) والجزيرة الديناميكية
  YaqootWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: YaqootWidgets
      - path: Shared
    entitlements:
      path: YaqootWidgets/YaqootWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.iq.yaqoot.erp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: iq.yaqoot.erp.widgets
        PRODUCT_NAME: YaqootWidgets
        INFOPLIST_FILE: YaqootWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(YQ_WIDGET_PROFILE)
    info:
      path: YaqootWidgets/Info.plist
      properties:
        CFBundleDisplayName: مكتب سفيان
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        YQAppGroup: group.iq.yaqoot.erp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  YaqootERPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YaqootERPTests
    dependencies:
      - target: YaqootERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: iq.yaqoot.erp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/YaqootERP.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/YaqootERP
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  YaqootERP:
    build:
      targets:
        YaqootERP: all
        YaqootERPTests: [test]
    test:
      targets:
        - YaqootERPTests
      gatherCoverageData: true
    archive:
      config: Release
