/** EmployeeVerification — دورة OTP كاملة للموظف */
const EmployeeVerification = {
  open(emp){
    let otp = null, timer = null, endAt = 0, sent = false;
    const body = `<div class="email-line"><div class="mono email-val">${esc(emp.email)}</div>
        <span class="badge" data-tone="pending">${esc(t("st_pending"))}</span></div>
      <div data-stage><button type="button" class="btn btn-primary" data-send>${ico("mail")}<span class="btn-label">${esc(t("s12_send"))}</span></button>
      <p class="hint" style="margin-top:10px">${esc(t("s12_sendHint"))}</p></div>`;
    const m = Modal.open({
      title:t("s12_title2", { n:emp.name }), desc:t("s12_desc"), body,
      actions:[{ label:t("close"), variant:"btn-ghost" }],
      onMount(mm){
        const stage = $("[data-stage]", mm);
        const status = (tone, msg, busy) => {
          const el = $("[data-status]", mm); if(!el) return;
          el.dataset.tone = tone;
          el.innerHTML = (busy ? `<span class="spin"></span>` : tone === "ok" ? ico("check") : tone === "err" ? ico("alert") : ico("clock")) + `<span>${esc(msg)}</span>`;
          announce(msg);
        };
        const tick = () => {
          const el = $("[data-count]", mm); if(!el) return;
          const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
          el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
          const rs = $("[data-resend]", mm);
          if(left <= 0){ clearInterval(timer); if(otp){ otp.setState("expired"); status("err", t("s4_expired")); } if(rs) rs.disabled = false; }
          else if(rs) rs.disabled = left > CONFIG.otpTtl - 20;
        };
        const verify = async () => {
          if(!otp || otp.value().length < 6) return;
          otp.setState("verifying"); status("busy", t("s4_verifying"), true);
          try{
            const res = await OtpService.verify(emp.email, otp.value(), "employee:" + emp.id);
            if(res.ok){
              clearInterval(timer); otp.setState("verified"); otp.disable(true);
              Employees.setVerification(emp.id, { status:"verified", method: res.mode === "server" ? "server" : "local-demo", verifiedAt:nowISO() });
              status("ok", t("s12_verified"));
              Toast.show(t("s12_verifiedFor", { n:emp.name }), "ok");
              setTimeout(() => { Modal.close(); Wizard.renderStep(false);
                if(!emp.pinSet) setTimeout(() => EmployeeUI.pin(Employees.get(emp.id)), 320); }, 800);
            }else{
              otp.setState(res.reason === "expired" ? "expired" : "invalid");
              status("err", res.reason === "expired" ? t("s4_expired") : t("s4_invalid"));
              otp.clear(); otp.focusFirst();
            }
          }catch(_){ otp.setState("invalid"); status("err", t("s4_netFail")); }
        };
        const send = async (again) => {
          const btn = $("[data-send]", mm) || $("[data-resend]", mm);
          if(btn){ btn.disabled = true; btn.dataset.busy = "1"; }
          try{
            const res = await OtpService.send(emp.email, "employee:" + emp.id);
            Employees.setVerification(emp.id, { status:"sent", sentAt:nowISO() });
            endAt = Date.now() + (res.expiresIn || CONFIG.otpTtl) * 1000;
            stage.innerHTML = `${res.mode === "local" ? `<div class="demo-code">${ico("alert")}<div><b>${esc(t("s4_demoTitle"))}</b>
                <span class="mono demo-val">${esc(res.demoCode)}</span><p>${esc(t("s4_demoBody"))}</p></div></div>` : ""}
              <div data-otp-mount></div>
              <div class="otp-status" data-status data-tone="busy"></div>
              <div class="otp-meta"><span>${ico("clock")} ${esc(t("s4_expiresIn"))} <b class="countdown" data-count>--:--</b></span>
                <button type="button" class="btn btn-quiet btn-sm" data-resend disabled>${ico("refresh")}<span class="btn-label">${esc(t("s4_resend"))}</span></button></div>
              <button type="button" class="btn btn-primary" data-verify disabled>${ico("shieldCheck")}<span class="btn-label">${esc(t("s4_verify"))}</span></button>`;
            otp = new OtpInput({ mount:$("[data-otp-mount]", mm),
              onChange:v => { $("[data-verify]", mm).disabled = v.length < 6; }, onComplete:verify });
            status("busy", t("s4_waiting")); otp.focusFirst();
            clearInterval(timer); tick(); timer = setInterval(tick, 500);
            $("[data-verify]", mm).addEventListener("click", verify);
            $("[data-resend]", mm).addEventListener("click", () => send(true));
            if(again) Toast.show(t("s4_resent"), "ok");
          }catch(_){
            Toast.show(t("s4_sendFail"), "err");
            if(btn){ btn.disabled = false; btn.dataset.busy = ""; }
          }
        };
        $("[data-send]", mm).addEventListener("click", () => send(false));
      }
    });
    Modal._onClose = () => clearInterval(timer);
    return m;
  }
};

const TASKS = ["workspace", "store", "permissions", "inventory", "products", "defaults", "finalize"];
STEPS.push({
  id:"preparing", phase:3, svg:"preparing", hideBack:true, hideNext:true,
  title:() => t("s17_title"), lede:() => t("s17_lede"), eyebrow:() => t("s17_eyebrow"),
  body(){
    const st = SetupState.data.setupStatus.tasks || {};
    return `<div class="progress-line" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-bar><i></i></div>
      <p class="hint" data-prog-txt>${esc(t("s17_wait"))}</p>
      <ul class="tasks" data-tasks>${TASKS.map(k => `<li class="task" data-task="${k}" data-state="${st[k] || "pending"}">
        <span class="t-ico">${ico("clock")}</span><b>${esc(t("tk_" + k))}</b>
        <span class="t-tail"></span></li>`).join("")}</ul>
      <div data-fail hidden>${F.note(`<b data-fail-title></b><br><span data-fail-msg></span>`, "err")}
        <button type="button" class="btn btn-primary" data-retry style="margin-top:12px">${ico("refresh")}<span class="btn-label">${esc(t("retry"))}</span></button></div>`;
  },
  mount(root){
    const bar = $("[data-bar] i", root), barBox = $("[data-bar]", root), txt = $("[data-prog-txt]", root);
    const failBox = $("[data-fail]", root);
    const setTask = (k, s) => {
      const li = $(`[data-task="${k}"]`, root); if(!li) return;
      li.dataset.state = s;
      $(".t-ico", li).innerHTML = s === "complete" ? ico("check") : s === "processing" ? `<span class="spin"></span>`
        : s === "error" ? ico("alert") : ico("clock");
      const tasks = SetupState.data.setupStatus.tasks || {};
      tasks[k] = s; SetupState.data.setupStatus.tasks = tasks; SetupState.save();
    };
    const progress = () => {
      const done = TASKS.filter(k => (SetupState.data.setupStatus.tasks || {})[k] === "complete").length;
      const pct = Math.round(done / TASKS.length * 100);
      bar.style.width = pct + "%"; barBox.setAttribute("aria-valuenow", String(pct));
      txt.textContent = t("s17_prog", { d: fmtNum(done), n: fmtNum(TASKS.length) });
    };
    const run = async () => {
      failBox.hidden = true;
      SetupIllustration.setState("processing");
      for(const k of TASKS){
        if((SetupState.data.setupStatus.tasks || {})[k] === "complete") continue;
        setTask(k, "processing"); announce(t("tk_" + k));
        try{
          await SetupService.run(k, SetupState.data);
          setTask(k, "complete"); progress();
        }catch(err){
          setTask(k, "error");
          failBox.hidden = false;
          $("[data-fail-title]", failBox).textContent = t("s17_failT", { s: t("tk_" + k) });
          $("[data-fail-msg]", failBox).textContent = err && err.code === "no-server" ? t("s17_failNet")
            : (err && err.status ? t("s17_failHttp", { c: err.status }) : t("s17_failGen"));
          SetupIllustration.setState("error");
          announce(t("s17_failT", { s: t("tk_" + k) }));
          $("[data-retry]", failBox).focus();
          return;
        }
      }
      SetupState.data.setupStatus.completed = true;
      SetupState.data.setupStatus.completedAt = nowISO();
      SetupState.markComplete("preparing"); SetupState.saveNow();
      SetupIllustration.setState("success");
      await wait(reducedMotion() ? 100 : 700);
      Wizard.goTo(Wizard.indexOf("complete"), true);
    };
    $("[data-retry]", root).addEventListener("click", run);
    progress();
    setTimeout(run, reducedMotion() ? 60 : 420);
  }
});

/* ==========================================================================
   14) WebAuthn — أدوات ترميز فقط (التسجيل الحقيقي يتم عبر الخادم)
   ========================================================================== */
const PasskeyUtil = {
  b64uToBuf(s){
    const p = s.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(p + "=".repeat((4 - p.length % 4) % 4));
    const b = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b.buffer;
  },
  bufToB64u(b){
    const bytes = new Uint8Array(b); let s = "";
    for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  },
  decode(payload){
    const o = JSON.parse(JSON.stringify(payload.publicKey || payload));
    o.challenge = this.b64uToBuf(o.challenge);
    if(o.user && o.user.id) o.user.id = this.b64uToBuf(o.user.id);
    if(Array.isArray(o.excludeCredentials))
      o.excludeCredentials = o.excludeCredentials.map(c => Object.assign({}, c, { id:this.b64uToBuf(c.id) }));
    return o;
  },
  encode(cred){
    return { id:cred.id, type:cred.type, rawId:this.bufToB64u(cred.rawId), response:{
      clientDataJSON:this.bufToB64u(cred.response.clientDataJSON),
      attestationObject:this.bufToB64u(cred.response.attestationObject) } };
  }
};

/* ==========================================================================
   15) Wizard — التحكم بالتنقل والعرض
   ========================================================================== */
const Wizard = {
  i:0, cleanups:[], root:null,
  indexOf(id){ return STEPS.findIndex(s => s.id === id); },
  step(){ return STEPS[this.i]; },
  registerCleanup(fn){ this.cleanups.push(fn); },
  _runCleanups(){ this.cleanups.forEach(f => { try{ f(); }catch(_){ } }); this.cleanups = []; },

  init(){
    this.i = clamp(SetupState.data.currentStep || 0, 0, STEPS.length - 1);
    if(this.i === this.indexOf("preparing")) this.i = this.indexOf("review");   // لا نستأنف داخل التهيئة
    this.renderChrome();
    this.renderStep(false);
    document.addEventListener("keydown", e => {
      if(e.key === "Enter" && !e.shiftKey){
        const el = e.target;
        if(el && el.tagName === "INPUT" && el.type !== "file" && !el.closest("[data-tokens]") && !el.closest(".otp") && $("#modal").hidden){
          const nb = $("[data-next]"); if(nb && !nb.disabled){ e.preventDefault(); this.next(); }
        }
      }
    });
  },

  renderChrome(){
    $("#brandName").textContent = t("appName");
    $("#brandSub").textContent = t("appSub");
    document.title = t("appName") + " — " + t("appSub");
    $("#hActions").innerHTML = `
      <span class="mode-flag" data-mode="${HAS_SERVER ? "server" : "local"}" title="${esc(HAS_SERVER ? t("serverModeTip") : t("localModeTip"))}">
        ${ico(HAS_SERVER ? "shieldCheck" : "alert")}${esc(HAS_SERVER ? t("serverMode") : t("localMode"))}</span>
      <button class="icon-btn lang-btn" id="langBtn" aria-label="${esc(t("langToggle"))}">${LANG === "ar" ? "EN" : "ع"}</button>
      <button class="icon-btn" id="themeBtn" aria-label="${esc(t("themeToggle"))}"></button>
      <button class="icon-btn" id="resetBtn" aria-label="${esc(t("resetSetup"))}" title="${esc(t("resetSetup"))}">${ico("reset")}</button>`;
    $("#langBtn").addEventListener("click", () => Lang.toggle());
    $("#themeBtn").addEventListener("click", () => Theme.cycle());
    $("#resetBtn").addEventListener("click", () => this.confirmReset());
    Theme.apply(SetupState.data.preferences.theme);
    this.renderPhases();
  },

  renderPhases(){
    const cur = this.step().phase;
    $("#phases").innerHTML = PHASES.map((p, idx) => {
      const inPhase = STEPS.filter(s => s.phase === idx);
      const doneCount = inPhase.filter(s => SetupState.data.completedSteps.includes(s.id)).length;
      const state = idx < cur ? "done" : idx === cur ? "current" : "todo";
      const pct = idx < cur ? 100 : Math.round(doneCount / inPhase.length * 100);
      return `<div class="phase" data-state="${state}" aria-current="${idx === cur ? "step" : "false"}">
        <div class="phase-top">
          <span class="phase-dot">${state === "done" ? ico("check") : String(idx + 1).padStart(2, "0")}</span>
          <span class="phase-name">${esc(t(p.name))}</span>
        </div>
        <div class="phase-bar"><i class="phase-fill" style="width:${pct}%"></i></div>
      </div>`;
    }).join("");
  },

  renderNav(){
    const s = this.step();
    const canBack = !s.hideBack && this.i > 0;
    $("#navRow").innerHTML = `
      ${canBack ? `<button class="btn btn-ghost" data-back>${ico("prev")}<span class="btn-label">${esc(t("back"))}</span></button>` : ""}
      <span class="nav-spacer"></span>
      <span class="step-count">${t("stepOf", { a: fmtNum(this.i + 1), b: fmtNum(STEPS.length) })}</span>
      ${s.hideNext ? "" : `<button class="btn btn-primary${s.id === "welcome" || s.id === "review" ? " btn-lg" : ""}" data-next>
        <span class="btn-label">${esc(t(s.nextLabel || "next"))}</span>${ico(s.nextIcon || "next")}</button>`}`;
    const b = $("[data-back]"), n = $("[data-next]");
    if(b) b.addEventListener("click", () => this.back());
    if(n) n.addEventListener("click", () => this.next());
  },
  refreshNav(){ this.renderNav(); },

  async renderStep(animate = true){
    this._runCleanups();
    const s = this.step();
    const host = $("#stepHost");
    const html = `<section class="step" data-step="${s.id}"${animate ? ' data-enter="1"' : ""} aria-labelledby="stepTitle">
      <span class="step-eyebrow">${ico(PHASES[s.phase].icon)}${esc(t(PHASES[s.phase].name))} · ${esc(t("stepShort", { a: fmtNum(this.i + 1), b: fmtNum(STEPS.length) }))}</span>
      <h1 id="stepTitle" tabindex="-1">${esc(s.title())}</h1>
      <p class="lede">${esc(s.lede())}</p>
      <div class="step-body step-scroll">${s.body()}</div>
    </section>`;
    host.innerHTML = html;
    this.root = $(".step", host);
    if(s.section) bindFields(this.root, s.section);
    else bindFields(this.root, "preferences");
    if(s.mount) s.mount.call(s, this.root);
    this.renderNav(); this.renderPhases();
    SetupIllustration.show(s.svg, s.title());
    SetupState.data.currentStep = this.i;
    SetupState.data.maxStep = Math.max(SetupState.data.maxStep || 0, this.i);
    SetupState.save();
    if(animate) setTimeout(() => { const h = $("#stepTitle"); if(h) h.focus({ preventScroll:true }); }, 120);
    announce(s.title());
  },

  async next(){
    const s = this.step();
    const errs = s.validate ? s.validate.call(s, this.root) : {};
    if(!paintErrors(this.root, errs)) return;
    if(s.onNext){ const ok = await s.onNext.call(s, this.root); if(ok === false) return; }
    SetupState.markComplete(s.id);
    if(this.i < STEPS.length - 1) this.goTo(this.i + 1);
  },
  back(){ if(this.i > 0) this.goTo(this.i - 1); },

  goTo(idx, force){
    idx = clamp(idx, 0, STEPS.length - 1);
    if(idx === this.i) return;
    if(!force && idx > this.i){
      for(let k = this.i; k < idx; k++){
        if(!SetupState.data.completedSteps.includes(STEPS[k].id)){ Toast.show(t("errBlocked"), "err"); return; }
      }
    }
    const stepEl = $(".step");
    const go = () => { this.i = idx; this.renderStep(true); window.scrollTo({ top:0, behavior: reducedMotion() ? "auto" : "smooth" }); };
    if(stepEl && !reducedMotion()){ stepEl.dataset.leave = "1"; setTimeout(go, 180); } else go();
  },

  async confirmReset(){
    const ok = await Modal.confirm({ title:t("resetTitle"), body:t("resetBody"), confirmLabel:t("resetSetup"), danger:true });
    if(!ok) return;
    Secrets.ownerPassword = ""; Secrets.ownerPin = ""; Secrets.empPin = {};
    ["workspace","store","permissions","inventory","catalog","defaults","config","setup_completed"].forEach(k => LocalDB.del(k));
    SetupState.reset();
    this.i = 0; LANG = "ar"; Lang.set("ar"); Theme.apply("light");
    this.renderChrome(); this.renderStep(true);
    Toast.show(t("resetDone"), "ok");
  }
};

/* ==========================================================================
   16) الإقلاع
   ========================================================================== */
(function boot(){
  const restored = SetupState.load();
  LANG = (SetupState.data.preferences.language === "en") ? "en" : "ar";
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "en" ? "ltr" : "rtl";
  Theme.apply(SetupState.data.preferences.theme || "light");
  SetupIllustration.init($("#illus"));
  if(restored) Secrets.rehydrate();
  Wizard.init();
  if(restored && SetupState.data.completedSteps.length) setTimeout(() => Toast.show(t("restored"), "info"), 600);
  window.ERPSetup = { state:SetupState, wizard:Wizard, employees:Employees, permissions:Permissions,
    services:{ OtpService, SetupService }, config:CONFIG };
})();
</script>
