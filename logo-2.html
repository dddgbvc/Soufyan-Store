<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوغو ٢ — مكتب سفيان للموبايل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --petrol:#14343F;   /* بترولي عميق */
    --teal:#2F6F6B;     /* مائي هادئ */
    --gold:#C8A96A;     /* ذهبي مطفي */
    --sand:#F2EDE4;     /* رملي دافئ */
    --aqua:#9CC0BB;     /* مائي فاتح */
    --ink:#101E24;      /* حبري */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2a2a2e}

  .page{width:1080px;height:1080px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .sand{background:var(--sand)}
  .deep{background:var(--petrol)}

  .lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:44px}

  .wordmark{
    font-family:'El Messiri',serif;font-weight:700;font-size:96px;line-height:1.2;
    white-space:nowrap;color:var(--ink);
  }
  .deep .wordmark{color:var(--sand)}

  .services{
    font-family:'Cairo',sans-serif;font-weight:400;font-size:29px;line-height:1.4;
    white-space:nowrap;color:var(--teal);letter-spacing:.01em;margin-top:-16px;
  }
  .deep .services{color:var(--aqua)}
  .services .sep{color:var(--gold);padding:0 12px}
</style>
</head>
<body>

<!-- ====== صفحة ١ — الصيغة الرئيسية على الرملي ====== -->
<div class="page sand" data-document-role="page" data-label="الشعار الرئيسي">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="52" y="112" width="22" height="56" rx="11" fill="#9CC0BB"/>
      <rect x="92" y="76" width="22" height="92" rx="11" fill="#2F6F6B"/>
      <rect x="132" y="38" width="22" height="130" rx="11" fill="#14343F"/>
    </svg>

    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="services">الخطوط<span class="sep">·</span>الأرصدة<span class="sep">·</span>الهواتف<span class="sep">·</span>الإنترنت<span class="sep">·</span>الصيانة</div>
  </div>
</div>

<!-- ====== صفحة ٢ — على الخلفية البترولية ====== -->
<div class="page deep" data-document-role="page" data-label="الشعار على خلفية داكنة">
  <div class="lockup">
    <svg width="300" height="300" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="52" y="112" width="22" height="56" rx="11" fill="#9CC0BB"/>
      <rect x="92" y="76" width="22" height="92" rx="11" fill="#C8A96A"/>
      <rect x="132" y="38" width="22" height="130" rx="11" fill="#F2EDE4"/>
    </svg>

    <div class="wordmark">مكتب سفيان للموبايل</div>
    <div class="services">الخطوط<span class="sep">·</span>الأرصدة<span class="sep">·</span>الهواتف<span class="sep">·</span>الإنترنت<span class="sep">·</span>الصيانة</div>
  </div>
</div>

<!-- ====== صفحة ٣ — الأيقونة ====== -->
<div class="page sand" data-document-role="page" data-label="الأيقونة">
  <svg width="600" height="600" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="52" y="112" width="22" height="56" rx="11" fill="#9CC0BB"/>
    <rect x="92" y="76" width="22" height="92" rx="11" fill="#2F6F6B"/>
    <rect x="132" y="38" width="22" height="130" rx="11" fill="#14343F"/>
  </svg>
</div>

</body>
</html>
