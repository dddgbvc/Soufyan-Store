<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>محاكي الكاشير · مكتب سفيان للاتصالات</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/fonts.css">

<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/demo.css">
<link rel="stylesheet" href="styles/cashier.css">

<script>
(function () {
  try {
    var mode = localStorage.getItem("theme") || "auto";
    var resolved = mode === "auto"
      ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : mode;
    document.documentElement.dataset.theme = resolved === "dark" ? "dark" : "light";
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>
</head>
<body>

<div class="protocol-guard" id="protocolGuard">
  <div class="protocol-guard__card">
    <h1>شغّل المشروع عبر خادم محلي</h1>
    <p>
      وحدات JavaScript الحديثة لا تعمل عند فتح الملف مباشرة من القرص. نفّذ الأمر
      التالي في مجلد المشروع ثم افتح الرابط الذي يظهر لك.
    </p>
    <code>python3 customer-display/serve.py</code>
  </div>
</div>

<script>
if (location.protocol === "file:") {
  document.getElementById("protocolGuard").style.display = "grid";
}
</script>

<script type="module" src="js/demo/cashier.js"></script>
</body>
</html>
