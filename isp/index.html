/* ==========================================================================
   ١٥ — بيانات المزود التجريبي (modules/isp/providers/mock/data.ts)
   مجموعة بيانات حتمية: البذرة نفسها ⇒ البيانات نفسها، فتستقر الفحوصات
   ويبدو العرض متطابقاً على كل جهاز.
   ========================================================================== */
var MockData = (function () {
  /** mulberry32 — صغير وسريع ويكفي للبيانات التجريبية. */
  function makeRng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var FIRST_NAMES = [
    'أحمد', 'محمد', 'علي', 'حسين', 'عمر', 'مصطفى', 'يوسف', 'إبراهيم',
    'زينب', 'فاطمة', 'مريم', 'نور', 'سارة', 'رقية', 'هدى', 'آية'
  ];
  var FAMILY_NAMES = [
    'العبيدي', 'الجبوري', 'الدليمي', 'السامرائي', 'التكريتي', 'الحديثي',
    'الزيدي', 'الركابي', 'الخفاجي', 'الطائي'
  ];
  var GOVERNORATES = ['صلاح الدين', 'بغداد', 'نينوى', 'الأنبار', 'ديالى', 'كركوك'];
  var AREAS = ['الحويش', 'القادسية', 'الشهامة', 'الدور', 'بيجي', 'الضلوعية'];

  function pick(rng, list) {
    var index = Math.floor(rng() * list.length);
    // تحوّط: قد تعيد rng() قيمة على الحد نظرياً.
    var safe = Math.min(Math.max(index, 0), list.length - 1);
    var value = list[safe];
    if (value === undefined) throw new Error('Cannot pick from an empty list');
    return value;
  }

  function pad(n, width) { return String(n).padStart(width, '0'); }

  function isoOffsetDays(from, days) {
    return new Date(from.getTime() + days * 86400000).toISOString();
  }

  var PROVIDER_ID = 'mock';

  var PACKAGE_SEEDS = [
    { id: 'P-4M-30', name: 'home-4m', display: 'منزلي ٤ ميغا', down: 4, up: 2, days: 30, retail: 25000, wholesale: 19000, tech: 'pppoe' },
    { id: 'P-8M-30', name: 'home-8m', display: 'منزلي ٨ ميغا', down: 8, up: 4, days: 30, retail: 40000, wholesale: 31000, tech: 'pppoe' },
    { id: 'P-16M-30', name: 'home-16m', display: 'منزلي ١٦ ميغا', down: 16, up: 8, days: 30, retail: 65000, wholesale: 52000, tech: 'pppoe' },
    { id: 'P-F50-30', name: 'fiber-50', display: 'ألياف ٥٠ ميغا', down: 50, up: 25, days: 30, retail: 110000, wholesale: 88000, tech: 'ftth' },
    { id: 'P-F100-30', name: 'fiber-100', display: 'ألياف ١٠٠ ميغا', down: 100, up: 50, days: 30, retail: 175000, wholesale: 141000, tech: 'ftth' },
    { id: 'P-W10-90', name: 'wifi-10', display: 'لاسلكي ١٠ ميغا — ٣ أشهر', down: 10, up: 5, days: 90, retail: 150000, wholesale: 120000, tech: 'wireless' }
  ];

  function buildPackages(def, now) {
    var fetchedAt = now.toISOString();
    return PACKAGE_SEEDS.filter(function (seed) {
      return def.dataShape.technologies.indexOf(seed.tech) !== -1;
    }).map(function (seed) {
      return {
        id: PROVIDER_ID + ':' + seed.id,
        providerId: PROVIDER_ID,
        externalPackageId: seed.id,
        name: seed.name,
        displayName: seed.display,
        description: null,
        technology: seed.tech,
        // الواجهة القديمة ببساطة لا تنشر السرعات.
        downloadSpeed: def.dataShape.includeSpeeds ? seed.down : null,
        uploadSpeed: def.dataShape.includeSpeeds ? seed.up : null,
        duration: { value: seed.days, unit: 'day' },
        renewalSemantics: 'extend_from_expiry',
        retailPrice: Money.money(seed.retail, 'IQD'),
        wholesalePrice: def.dataShape.includeWholesale
          ? { value: Money.money(seed.wholesale, 'IQD'), origin: 'provider' }
          : { value: null, origin: 'unavailable' },
        currency: 'IQD',
        billingModel: 'prepaid',
        active: true,
        metadata: {},
        sync: Freshness.syncMeta('provider', fetchedAt, seed.id)
      };
    });
  }

  var STATUS_WEIGHTS = [
    { status: 'active', weight: 62 },
    { status: 'expiring', weight: 12 },
    { status: 'expired', weight: 14 },
    { status: 'suspended', weight: 8 },
    { status: 'pending', weight: 4 }
  ];

  function pickStatus(rng) {
    var total = STATUS_WEIGHTS.reduce(function (s, w) { return s + w.weight; }, 0);
    var roll = rng() * total;
    for (var i = 0; i < STATUS_WEIGHTS.length; i += 1) {
      roll -= STATUS_WEIGHTS[i].weight;
      if (roll <= 0) return STATUS_WEIGHTS[i].status;
    }
    return 'active';
  }

  function macFor(rng) {
    function byte() {
      return Math.floor(rng() * 256).toString(16).padStart(2, '0').toUpperCase();
    }
    return [byte(), byte(), byte(), byte(), byte(), byte()].join(':');
  }

  function buildMockDataset(def, seed, now, subscriberCount) {
    var at = now || new Date();
    var count = subscriberCount === undefined ? 48 : subscriberCount;
    var rng = makeRng(seed);
    var packages = buildPackages(def, at);
    var fetchedAt = at.toISOString();

    var subscribers = [];
    var subscriptions = [];
    var sessions = [];

    for (var i = 0; i < count; i += 1) {
      var externalId = 'SUB-' + pad(i + 1001, 5);
      var id = PROVIDER_ID + ':' + externalId;
      var fullName = pick(rng, FIRST_NAMES) + ' ' + pick(rng, FAMILY_NAMES);
      var status = pickStatus(rng);
      var pkg = packages.length > 0 ? pick(rng, packages) : null;
      var technology = (pkg && pkg.technology) || pick(rng, def.dataShape.technologies);
      var username = 'u' + pad(i + 1001, 5);

      // تاريخ الانتهاء يتبع الحالة حتى تكون فلاتر السجل ذات معنى.
      var daysToExpiry = status === 'expired'
        ? -Math.floor(rng() * 40) - 1
        : status === 'expiring'
          ? Math.floor(rng() * 5)
          : Math.floor(rng() * 28) + 5;

      var includeContact = def.dataShape.includeContactDetails;

      subscribers.push({
        id: id,
        providerId: PROVIDER_ID,
        externalSubscriberId: externalId,
        erpCustomerId: null,
        fullName: fullName,
        phoneNumber: includeContact ? '077' + pad(Math.floor(rng() * 10000000), 8) : null,
        alternatePhone: null,
        address: includeContact ? pick(rng, AREAS) + ' - محلة ' + (Math.floor(rng() * 40) + 1) : null,
        area: includeContact ? pick(rng, AREAS) : null,
        governorate: includeContact ? pick(rng, GOVERNORATES) : null,
        zone: null,
        towerId: def.dataShape.includeTower ? 'TWR-' + pad(Math.floor(rng() * 12) + 1, 2) : null,
        networkNodeId: technology === 'ftth' ? 'NODE-' + pad(Math.floor(rng() * 20) + 1, 3) : null,
        technology: technology,
        username: username,
        status: status,
        metadata: def.dataShape.includeTower ? { sector: 'S' + (Math.floor(rng() * 4) + 1) } : {},
        sync: Freshness.syncMeta('provider', fetchedAt, externalId),
        createdAt: isoOffsetDays(at, -Math.floor(rng() * 900) - 30),
        updatedAt: fetchedAt
      });

      subscriptions.push({
        id: id + ':sub',
        subscriberId: id,
        providerId: PROVIDER_ID,
        externalSubscriptionId: 'SUBS-' + pad(i + 1001, 5),
        packageId: pkg ? pkg.id : null,
        status: status === 'expired' ? 'expired'
          : status === 'suspended' ? 'suspended'
            : status === 'pending' ? 'pending' : 'active',
        startedAt: isoOffsetDays(at, daysToExpiry - ((pkg && pkg.duration) ? pkg.duration.value : 30)),
        expiresAt: isoOffsetDays(at, daysToExpiry),
        suspendedAt: status === 'suspended' ? isoOffsetDays(at, -Math.floor(rng() * 10)) : null,
        metadata: {},
        sync: Freshness.syncMeta('provider', fetchedAt, 'SUBS-' + pad(i + 1001, 5))
      });

      var online = status === 'active' && rng() > 0.35;
      sessions.push({
        id: id + ':session',
        subscriberId: id,
        online: online,
        username: username,
        macAddress: macFor(rng),
        ipAddress: online
          ? '10.' + Math.floor(rng() * 250) + '.' + Math.floor(rng() * 250) + '.' + Math.floor(rng() * 250)
          : null,
        ipClassification: online ? 'private' : null,
        startedAt: online ? isoOffsetDays(at, -rng() * 3) : null,
        uptimeSeconds: online ? Math.floor(rng() * 250000) : null,
        nasIdentifier: 'NAS-' + pad(Math.floor(rng() * 6) + 1, 2),
        vlan: technology === 'ftth' ? 'VLAN-' + (Math.floor(rng() * 400) + 100) : null,
        bytesIn: online ? Math.floor(rng() * 90000000000) : null,
        bytesOut: online ? Math.floor(rng() * 12000000000) : null,
        signal: def.dataShape.includeSignal
          ? { rssi: -Math.floor(rng() * 40) - 45, snr: Math.floor(rng() * 25) + 10 }
          : null,
        terminateCause: online ? null : pick(rng, ['User-Request', 'Idle-Timeout', 'NAS-Reboot']),
        sync: Freshness.syncMeta('provider', fetchedAt, externalId)
      });
    }

    var currentBalance = Money.money(3450000 + Math.floor(rng() * 500000), 'IQD');
    var wallet = {
      id: PROVIDER_ID + ':wallet',
      providerId: PROVIDER_ID,
      agentId: PROVIDER_ID + ':agent',
      currency: 'IQD',
      currentBalance: currentBalance,
      availableBalance: currentBalance,
      creditLimit: Money.money(1000000, 'IQD'),
      reservedAmount: null,
      lowBalanceThreshold: Money.money(500000, 'IQD'),
      lastSyncedAt: fetchedAt,
      sync: Freshness.syncMeta('provider', fetchedAt, 'wallet')
    };

    var walletTransactions = [];
    var running = currentBalance.amount;
    for (var t = 0; t < 25; t += 1) {
      var isRecharge = t % 7 === 0;
      var seedRow = PACKAGE_SEEDS[t % PACKAGE_SEEDS.length];
      var amount = isRecharge
        ? Money.money(500000, 'IQD')
        : Money.money(seedRow ? seedRow.wholesale : 30000, 'IQD');
      var before = running;
      running = isRecharge ? running - amount.amount : running + amount.amount;
      walletTransactions.push({
        id: PROVIDER_ID + ':tx:' + pad(t + 1, 4),
        walletId: wallet.id,
        providerTransactionId: 'TX-' + pad(90000 - t, 6),
        type: isRecharge ? 'recharge' : 'renewal',
        direction: isRecharge ? 'credit' : 'debit',
        amount: amount,
        balanceBefore: Money.money(running, 'IQD'),
        balanceAfter: Money.money(before, 'IQD'),
        referenceType: isRecharge ? null : 'subscription',
        referenceId: isRecharge ? null : 'SUB-' + pad(1001 + (t % count), 5),
        status: 'posted',
        metadata: {},
        createdAt: isoOffsetDays(at, -t * 0.7)
      });
    }

    return {
      packages: packages, subscribers: subscribers, subscriptions: subscriptions,
      sessions: sessions, wallet: wallet, walletTransactions: walletTransactions
    };
  }

  return { buildMockDataset: buildMockDataset, PACKAGE_SEEDS: PACKAGE_SEEDS };
})();

/* ==========================================================================
   ١٦ — محوّل المزود التجريبي (modules/isp/providers/mock/adapter.ts)

   أمران يجعلانه أكثر من مجرد بديل صوري:
    ١. لا يُركّب إلا الدوال التي يدعمها ملمحه. المزود «الأساسي» لا توجد لديه
       getCurrentSession إطلاقاً — فالعقد والواجهة يُختبَران على كائن أضيق
       فعلاً، لا على دالة تعيد "غير مدعوم".
    ٢. يحاكي المسارات المزعجة: إعادة الطلب بنفس المفتاح، والأعطال المحقونة،
       والمهلة الغامضة التي يجب أن تنتهي إلى REQUIRES_RECONCILIATION.
   ========================================================================== */
var MockAdapter = (function () {
  var DEMO_USERNAME = 'agent';
  var DEMO_PASSWORD = 'demo1234';
  var DEMO_OTP = '123456';

  var requestCounter = 0;
  function nextRequestId() {
    requestCounter += 1;
    return 'mock-req-' + Date.now().toString(36) + '-' + requestCounter;
  }

  function diagnostics(durationMs) {
    return {
      requestId: nextRequestId(),
      adapterKey: 'mock',
      durationMs: durationMs === undefined ? 12 : durationMs
    };
  }

  /**
   * جلسات المحاكاة على مستوى الوحدة لا داخل كل نسخة.
   * السبب: مُبدِّل الملمح يعيد بناء المحوّل بالكامل، ولو كانت الجلسة داخل
   * إغلاق النسخة لطُرد المشغّل عند كل تبديل ولم يُرَ ما هو المقصود أصلاً:
   * إعادةُ بناء اللوحة نفسها والجلسة قائمة. هذا خاص بالمحاكاة تماماً؛
   * مزودٌ حقيقي جلسته لدى الخادم لا هنا.
   */
  var sessions = {};      // sessionRef → { expiresAt }
  var pendingMfa = {};    // challengeId → { methodId }

  /** تجزئة ثابتة حتى يأخذ مفتاح الحماية من التكرار نفسه الحكم نفسه دائماً. */
  function hashKey(key) {
    var h = 2166136261;
    for (var i = 0; i < key.length; i += 1) {
      h ^= key.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 4294967296;
  }

  function createMockAdapter(options) {
    var opts = options || {};
    var profile = opts.profile || 'full';
    var definition = MockProfiles.MOCK_PROFILE_DEFINITIONS[profile];
    var seed = opts.seed === undefined ? 1404 : opts.seed;
    var failureRate = Math.min(Math.max(opts.failureRate === undefined ? 0 : opts.failureRate, 0), 1);
    var now = opts.now || function () { return new Date(); };
    var capabilities = definition.capabilities;

    var dataset = MockData.buildMockDataset(definition, seed, now());
    /** دفتر الحماية من التكرار: المفتاح المكرر يعيد النتيجة الأولى حرفياً. */
    var mutations = {};

    function requireSession(session) {
      if (!session || !Object.prototype.hasOwnProperty.call(sessions, session.sessionRef)) {
        throw Errors.ProviderError('CREDENTIALS_EXPIRED');
      }
    }

    function injectedFailure(key) {
      if (failureRate <= 0) return null;
      var roll = hashKey(key);
      if (roll >= failureRate) return null;
      // توزيع الرمية على تصنيف الأخطاء، بترجيحٍ نحو الغامضة حتى تُمارَس المطابقة.
      var bucket = Math.floor((roll / failureRate) * 4);
      var reasons = ['TIMEOUT', 'PROVIDER_UNAVAILABLE', 'RATE_LIMITED', 'UNKNOWN_RESULT'];
      return reasons[Math.min(bucket, reasons.length - 1)] || 'TIMEOUT';
    }

    /**
     * تغليف عملية تغيير بدفتر الحماية من التكرار وبحاقن الأعطال.
     * الأعطال الغامضة تصير REQUIRES_RECONCILIATION لا FAILED عادية، لأن
     * المزود قد يكون طبّق التغيير فعلاً.
     */
    function mutate(idempotencyKey, run) {
      if (Object.prototype.hasOwnProperty.call(mutations, idempotencyKey)) {
        return mutations[idempotencyKey].result;
      }

      var failure = injectedFailure(idempotencyKey);
      var result;

      if (failure === 'TIMEOUT' || failure === 'UNKNOWN_RESULT') {
        result = Result.needsReconciliation(
          failure,
          Errors.operatorMessage(failure),
          diagnostics(30000),
          'انقطع الاتصال بعد إرسال الطلب — يجب مطابقة الحركة مع المزود قبل إعادة المحاولة.',
          'MOCK-REF-' + idempotencyKey.slice(0, 8)
        );
      } else if (failure !== null) {
        result = Result.fail(failure, Errors.operatorMessage(failure), diagnostics());
      } else {
        result = Result.ok(run(), diagnostics());
      }

      mutations[idempotencyKey] = { result: result };
      return result;
    }

    function findSubscriber(externalId) {
      return dataset.subscribers.find(function (s) { return s.externalSubscriberId === externalId; });
    }
    function findSubscription(subscriberId) {
      return dataset.subscriptions.find(function (s) { return s.subscriberId === subscriberId; });
    }
    function replaceSubscription(updated) {
      dataset.subscriptions = dataset.subscriptions.map(function (s) {
        return s.id === updated.id ? updated : s;
      });
    }
    function replaceSubscriber(updated) {
      dataset.subscribers = dataset.subscribers.map(function (s) {
        return s.id === updated.id ? updated : s;
      });
    }

    function grantSession() {
      var sessionRef = 'mock-sess-' + Math.random().toString(36).slice(2, 12);
      var expiresAt = new Date(now().getTime() + 8 * 3600 * 1000).toISOString();
      sessions[sessionRef] = { expiresAt: expiresAt };
      return {
        state: 'AUTHENTICATED',
        sessionRef: sessionRef,
        expiresAt: expiresAt,
        agentDisplayName: 'وكيل العرض التجريبي'
      };
    }

    // -----------------------------------------------------------------------
    // الدوال المطلوبة
    // -----------------------------------------------------------------------
    var adapter = {
      key: 'mock',
      /** يقرؤه العرض فقط ليعرف أي ملمح يعمل الآن. */
      mockProfile: profile,
      mockProfileDefinition: definition,

      async getProviderProfile() {
        var timestamp = now().toISOString();
        return {
          id: 'mock',
          name: 'mock',
          displayName: 'مزود تجريبي — ' + definition.displayName,
          logoUrl: null,
          accentColor: '#5B6EFF',
          country: 'IQ',
          currency: 'IQD',
          timezone: 'Asia/Baghdad',
          status: 'active',
          adapterKey: 'mock',
          apiVersion: profile === 'legacy' ? 'v1' : 'v2',
          supportUrl: null,
          configuration: { profile: profile, seed: seed },
          createdAt: timestamp,
          updatedAt: timestamp
        };
      },

      async getCapabilities() { return capabilities; },

      async getAuthenticationRequirements() {
        return {
          methods: [{
            kind: 'agent_code',
            id: 'agent_code',
            label: 'رمز الوكيل وكلمة المرور',
            fields: [
              {
                key: 'username', type: 'text', label: 'رمز الوكيل', required: true,
                ltr: true, placeholder: DEMO_USERNAME,
                helpText: 'بيانات العرض التجريبي: agent / demo1234'
              },
              {
                key: 'password', type: 'password', label: 'كلمة المرور',
                required: true, secure: true, ltr: true
              }
            ],
            requiresSecondFactor: opts.requireMfa === true
          }],
          defaultMethodId: 'agent_code',
          sessionDurationSeconds: 8 * 3600,
          allowPersistentSession: true,
          helpUrl: null
        };
      },

      async authenticate(credentials, methodId) {
        if (methodId !== 'agent_code') {
          return {
            state: 'ERROR',
            reason: 'UNSUPPORTED_AUTH_METHOD',
            message: Errors.operatorMessage('UNSUPPORTED_AUTH_METHOD')
          };
        }
        if (credentials.username !== DEMO_USERNAME || credentials.password !== DEMO_PASSWORD) {
          return {
            state: 'ERROR',
            reason: 'INVALID_CREDENTIALS',
            message: Errors.operatorMessage('INVALID_CREDENTIALS')
          };
        }
        if (opts.requireMfa === true) {
          var challengeId = 'mfa-' + Math.random().toString(36).slice(2, 10);
          pendingMfa[challengeId] = { methodId: methodId };
          return {
            state: 'REQUIRES_MFA',
            challenge: {
              kind: 'otp',
              prompt: 'أدخل رمز التحقق المرسل إلى هاتف الوكيل (رمز العرض: 123456)',
              challengeId: challengeId,
              expiresAt: new Date(now().getTime() + 300000).toISOString(),
              fields: [{
                key: 'otp', type: 'otp', label: 'رمز التحقق', required: true,
                ltr: true, secure: true,
                validation: { pattern: '^[0-9]{6}$', message: 'الرمز مكوّن من ٦ أرقام.' }
              }]
            }
          };
        }
        return grantSession();
      },

      async getAuthenticationStatus(session) {
        var record = session ? sessions[session.sessionRef] : undefined;
        var checkedAt = now().toISOString();
        if (!record) {
          return {
            state: 'UNAUTHENTICATED', expiresAt: null,
            agentDisplayName: null, lastCheckedAt: checkedAt
          };
        }
        var expired = record.expiresAt !== null && Date.parse(record.expiresAt) <= now().getTime();
        return {
          state: expired ? 'EXPIRED' : 'AUTHENTICATED',
          expiresAt: record.expiresAt,
          agentDisplayName: 'وكيل العرض التجريبي',
          lastCheckedAt: checkedAt
        };
      },

      async logout(session) {
        if (session) delete sessions[session.sessionRef];
      }
    };

    // -----------------------------------------------------------------------
    // الدوال الاختيارية — تُركَّب فقط حيث يدعمها الملمح
    // -----------------------------------------------------------------------
    var can = function (key) { return Resolver.canPerform(capabilities, key); };

    if (opts.requireMfa === true) {
      adapter.submitSecondFactor = async function (challengeId, answers) {
        if (!Object.prototype.hasOwnProperty.call(pendingMfa, challengeId)) {
          return { state: 'ERROR', reason: 'AUTH_FAILED', message: Errors.operatorMessage('AUTH_FAILED') };
        }
        if (answers.otp !== DEMO_OTP) {
          return { state: 'ERROR', reason: 'REQUIRES_OTP', message: 'رمز التحقق غير صحيح.' };
        }
        delete pendingMfa[challengeId];
        return grantSession();
      };
    }

    adapter.testConnection = async function () {
      var latencyMs = 8 + Math.floor(hashKey(String(seed)) * 40);
      return Result.ok({ latencyMs: latencyMs }, diagnostics(latencyMs));
    };

    if (can('subscriberManagement')) {
      adapter.searchSubscribers = async function (session, query) {
        requireSession(session);
        var q = query || {};
        var text = (q.text || '').trim().toLowerCase();
        var filtered = dataset.subscribers.filter(function (s) {
          if (q.status && s.status !== q.status) return false;
          if (q.technology && s.technology !== q.technology) return false;
          if (q.username && s.username !== q.username) return false;
          if (q.phone && s.phoneNumber !== q.phone) return false;
          if (text.length === 0) return true;
          return s.fullName.toLowerCase().indexOf(text) !== -1
            || s.externalSubscriberId.toLowerCase().indexOf(text) !== -1
            || (!!s.username && s.username.toLowerCase().indexOf(text) !== -1)
            || (!!s.phoneNumber && s.phoneNumber.indexOf(text) !== -1)
            || (!!s.address && s.address.toLowerCase().indexOf(text) !== -1);
        });

        var limit = Math.min(q.limit === undefined ? 25 : q.limit, 100);
        var start = q.cursor ? (parseInt(q.cursor, 10) || 0) : 0;
        var items = filtered.slice(start, start + limit);
        var nextIndex = start + items.length;

        return Result.ok({
          items: items,
          nextCursor: nextIndex < filtered.length ? String(nextIndex) : null,
          total: filtered.length
        }, diagnostics());
      };

      adapter.getSubscriber = async function (session, externalSubscriberId) {
        requireSession(session);
        var found = findSubscriber(externalSubscriberId);
        if (!found) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        return Result.ok(found, diagnostics());
      };

      adapter.getSubscription = async function (session, externalSubscriberId) {
        requireSession(session);
        var subscriber = findSubscriber(externalSubscriberId);
        var subscription = subscriber ? findSubscription(subscriber.id) : undefined;
        if (!subscription) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        return Result.ok(subscription, diagnostics());
      };

      adapter.getPackages = async function (session) {
        requireSession(session);
        return Result.ok(dataset.packages, diagnostics());
      };
    }

    if (can('subscriberCreate')) {
      adapter.getSubscriberFormSchema = async function () {
        var fields = [
          { key: 'full_name', type: 'text', label: 'الاسم الكامل', required: true },
          { key: 'phone_number', type: 'tel', label: 'رقم الهاتف', required: true, ltr: true },
          {
            key: 'pppoe_username', type: 'text', label: 'اسم المستخدم', required: true, ltr: true,
            validation: { pattern: '^[a-z0-9_.-]{3,32}$', message: 'أحرف إنجليزية وأرقام فقط.' }
          },
          { key: 'mac_address', type: 'mac', label: 'عنوان MAC', required: false, ltr: true }
        ];
        if (definition.dataShape.includeTower) {
          fields.push({
            key: 'tower', type: 'select', label: 'البرج', required: true,
            options: Array.from({ length: 12 }, function (_, i) {
              return { value: 'TWR-' + String(i + 1).padStart(2, '0'), label: 'برج ' + (i + 1) };
            })
          });
        }
        fields.push({
          key: 'package_id', type: 'select', label: 'الباقة', required: true,
          options: dataset.packages.map(function (p) {
            return { value: p.externalPackageId, label: p.displayName };
          })
        });
        return { fields: fields };
      };

      adapter.createSubscriber = async function (session, values, idempotencyKey) {
        requireSession(session);
        return mutate(idempotencyKey, function () {
          var index = dataset.subscribers.length + 1001;
          var externalId = 'SUB-' + String(index).padStart(5, '0');
          var timestamp = now().toISOString();
          var created = {
            id: 'mock:' + externalId,
            providerId: 'mock',
            externalSubscriberId: externalId,
            erpCustomerId: null,
            fullName: String(values.full_name || 'مشترك جديد'),
            phoneNumber: values.phone_number ? String(values.phone_number) : null,
            alternatePhone: null, address: null, area: null, governorate: null, zone: null,
            towerId: values.tower ? String(values.tower) : null,
            networkNodeId: null,
            technology: definition.dataShape.technologies[0] || 'pppoe',
            username: values.pppoe_username ? String(values.pppoe_username) : null,
            status: 'pending',
            metadata: {},
            sync: Freshness.syncMeta('provider', timestamp, externalId),
            createdAt: timestamp,
            updatedAt: timestamp
          };
          dataset.subscribers = dataset.subscribers.concat([created]);
          dataset.subscriptions = dataset.subscriptions.concat([{
            id: created.id + ':sub',
            subscriberId: created.id,
            providerId: 'mock',
            externalSubscriptionId: 'SUBS-' + String(index).padStart(5, '0'),
            packageId: values.package_id ? 'mock:' + String(values.package_id) : null,
            status: 'pending',
            startedAt: null,
            expiresAt: null,
            suspendedAt: null,
            metadata: {},
            sync: Freshness.syncMeta('provider', timestamp, 'SUBS-' + String(index).padStart(5, '0'))
          }]);
          return created;
        });
      };
    }

    if (can('subscriberUpdate')) {
      adapter.updateSubscriber = async function (session, externalSubscriberId, values) {
        requireSession(session);
        var existing = findSubscriber(externalSubscriberId);
        if (!existing) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        var updated = Object.assign({}, existing, {
          fullName: values.full_name ? String(values.full_name) : existing.fullName,
          phoneNumber: values.phone_number ? String(values.phone_number) : existing.phoneNumber,
          updatedAt: now().toISOString()
        });
        replaceSubscriber(updated);
        return Result.ok(updated, diagnostics());
      };
    }

    if (can('renewal')) {
      adapter.planRenewal = async function (session, request) {
        requireSession(session);
        var subscriber = findSubscriber(request.subscriberId);
        var pkg = dataset.packages.find(function (p) { return p.externalPackageId === request.packageId; });
        if (!subscriber || !pkg) {
          return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        }
        var subscription = findSubscription(subscriber.id);
        var computed = Renewal.computeExpiry(
          pkg.renewalSemantics,
          subscription ? subscription.expiresAt : null,
          pkg.duration,
          now()
        );
        return Result.ok({
          semantics: pkg.renewalSemantics,
          currentExpiry: subscription ? subscription.expiresAt : null,
          // المزود القديم لا يعيد تاريخ الانتهاء الجديد — نقول ذلك بدل اختراع تاريخ.
          newExpiry: profile === 'legacy' ? null : computed.newExpiry,
          price: pkg.retailPrice,
          cost: pkg.wholesalePrice,
          explanation: profile === 'legacy'
            ? 'هذا المزود لا يُرجع تاريخ الانتهاء الجديد — يظهر بعد المزامنة.'
            : computed.explanation
        }, diagnostics());
      };

      adapter.renewSubscription = async function (session, request) {
        requireSession(session);
        var subscriber = findSubscriber(request.subscriberId);
        var pkg = dataset.packages.find(function (p) { return p.externalPackageId === request.packageId; });
        if (!subscriber || !pkg) {
          return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        }
        var subscription = findSubscription(subscriber.id);
        if (!subscription) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());

        var wholesale = pkg.wholesalePrice.value;
        if (wholesale && dataset.wallet.availableBalance.amount < wholesale.amount) {
          return Result.fail('INSUFFICIENT_FUNDS', Errors.operatorMessage('INSUFFICIENT_FUNDS'), diagnostics());
        }

        return mutate(request.idempotencyKey, function () {
          var computed = Renewal.computeExpiry(
            pkg.renewalSemantics, subscription.expiresAt, pkg.duration, now()
          );
          var renewed = Object.assign({}, subscription, {
            status: 'active',
            packageId: pkg.id,
            expiresAt: computed.newExpiry || subscription.expiresAt,
            suspendedAt: null,
            sync: Freshness.syncMeta('provider', now().toISOString(), subscription.externalSubscriptionId)
          });
          replaceSubscription(renewed);
          replaceSubscriber(Object.assign({}, subscriber, {
            status: 'active', updatedAt: now().toISOString()
          }));

          if (wholesale) {
            var before = dataset.wallet.currentBalance;
            var after = Money.money(before.amount - wholesale.amount, before.currency);
            dataset.wallet = Object.assign({}, dataset.wallet, {
              currentBalance: after, availableBalance: after
            });
            dataset.walletTransactions = [{
              id: 'mock:tx:' + request.idempotencyKey.slice(0, 8),
              walletId: dataset.wallet.id,
              providerTransactionId: 'TX-' + request.idempotencyKey.slice(0, 6).toUpperCase(),
              type: 'renewal',
              direction: 'debit',
              amount: wholesale,
              balanceBefore: before,
              balanceAfter: after,
              referenceType: 'subscription',
              referenceId: subscriber.externalSubscriberId,
              status: 'posted',
              metadata: {},
              createdAt: now().toISOString()
            }].concat(dataset.walletTransactions);
          }
          return renewed;
        });
      };
    }

    if (can('activation')) {
      adapter.activateSubscription = async function (session, request) {
        requireSession(session);
        var subscriber = findSubscriber(request.subscriberId);
        var subscription = subscriber ? findSubscription(subscriber.id) : undefined;
        if (!subscription) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        return mutate(request.idempotencyKey, function () {
          var activated = Object.assign({}, subscription, {
            status: 'active', startedAt: now().toISOString()
          });
          replaceSubscription(activated);
          if (subscriber) replaceSubscriber(Object.assign({}, subscriber, { status: 'active' }));
          return activated;
        });
      };
    }

    if (can('packageChange')) {
      adapter.getPackageChangeOptions = async function (session, subscriberId, targetPackageId) {
        requireSession(session);
        var subscriber = findSubscriber(subscriberId);
        var subscription = subscriber ? findSubscription(subscriber.id) : undefined;
        var current = dataset.packages.find(function (p) {
          return subscription && p.id === subscription.packageId;
        });
        var target = dataset.packages.find(function (p) { return p.externalPackageId === targetPackageId; });
        if (!target) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());

        var delta = current === undefined
          ? null
          : Money.money(target.retailPrice.amount - current.retailPrice.amount, target.currency);
        var isUpgrade = delta !== null && delta.amount > 0;

        return Result.ok([
          { timing: 'immediate', label: 'فوري', allowed: true, priceDelta: delta },
          {
            timing: 'next_cycle', label: 'مع الدورة القادمة', allowed: true,
            priceDelta: Money.money(0, target.currency)
          },
          {
            timing: 'prorated', label: 'محتسب بالتناسب',
            // هذا المزود لا يحتسب التخفيض بالتناسب — مثال على قاعدة يحددها
            // المزود ولا يجوز للنظام افتراضها.
            allowed: isUpgrade,
            reason: isUpgrade ? undefined : 'التناسب متاح عند الترقية فقط.',
            priceDelta: delta
          }
        ], diagnostics());
      };

      adapter.changePackage = async function (session, request) {
        requireSession(session);
        var subscriber = findSubscriber(request.subscriberId);
        var subscription = subscriber ? findSubscription(subscriber.id) : undefined;
        var target = dataset.packages.find(function (p) { return p.externalPackageId === request.packageId; });
        if (!subscription || !target) {
          return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        }
        return mutate(request.idempotencyKey, function () {
          var changed = Object.assign({}, subscription, {
            packageId: target.id,
            metadata: Object.assign({}, subscription.metadata, { packageChangeTiming: request.timing })
          });
          replaceSubscription(changed);
          return changed;
        });
      };
    }

    if (can('suspend')) {
      adapter.suspendSubscriber = async function (session, externalSubscriberId) {
        requireSession(session);
        var subscriber = findSubscriber(externalSubscriberId);
        var subscription = subscriber ? findSubscription(subscriber.id) : undefined;
        if (!subscription || !subscriber) {
          return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        }
        var suspended = Object.assign({}, subscription, {
          status: 'suspended', suspendedAt: now().toISOString()
        });
        replaceSubscription(suspended);
        replaceSubscriber(Object.assign({}, subscriber, { status: 'suspended' }));
        return Result.ok(suspended, diagnostics());
      };
    }

    if (can('resume')) {
      adapter.resumeSubscriber = async function (session, externalSubscriberId) {
        requireSession(session);
        var subscriber = findSubscriber(externalSubscriberId);
        var subscription = subscriber ? findSubscription(subscriber.id) : undefined;
        if (!subscription || !subscriber) {
          return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        }
        var resumed = Object.assign({}, subscription, { status: 'active', suspendedAt: null });
        replaceSubscription(resumed);
        replaceSubscriber(Object.assign({}, subscriber, { status: 'active' }));
        return Result.ok(resumed, diagnostics());
      };
    }

    if (can('sessionMonitoring')) {
      adapter.getCurrentSession = async function (session, externalSubscriberId) {
        requireSession(session);
        var subscriber = findSubscriber(externalSubscriberId);
        if (!subscriber) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        var found = dataset.sessions.find(function (s) { return s.subscriberId === subscriber.id; }) || null;
        return Result.ok(found, diagnostics());
      };
    }

    if (can('sessionHistory')) {
      adapter.getSessionHistory = async function (session, externalSubscriberId, limit) {
        requireSession(session);
        var subscriber = findSubscriber(externalSubscriberId);
        if (!subscriber) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        var current = dataset.sessions.filter(function (s) { return s.subscriberId === subscriber.id; });
        return Result.ok(current.slice(0, Math.max(1, limit)), diagnostics());
      };
    }

    if (can('disconnectSession')) {
      adapter.disconnectSession = async function (session, externalSubscriberId, idempotencyKey) {
        requireSession(session);
        var subscriber = findSubscriber(externalSubscriberId);
        if (!subscriber) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        return mutate(idempotencyKey, function () {
          dataset.sessions = dataset.sessions.map(function (s) {
            return s.subscriberId === subscriber.id
              ? Object.assign({}, s, { online: false, ipAddress: null, terminateCause: 'Admin-Reset' })
              : s;
          });
          return undefined;
        });
      };
    }

    if (can('macReset')) {
      adapter.resetMac = async function (session, externalSubscriberId, idempotencyKey) {
        requireSession(session);
        var subscriber = findSubscriber(externalSubscriberId);
        if (!subscriber) return Result.fail('NOT_FOUND', Errors.operatorMessage('NOT_FOUND'), diagnostics());
        return mutate(idempotencyKey, function () {
          dataset.sessions = dataset.sessions.map(function (s) {
            return s.subscriberId === subscriber.id ? Object.assign({}, s, { macAddress: null }) : s;
          });
          return undefined;
        });
      };
    }

    if (can('wallet')) {
      adapter.getWalletBalance = async function (session) {
        requireSession(session);
        return Result.ok(
          Object.assign({}, dataset.wallet, { lastSyncedAt: now().toISOString() }),
          diagnostics()
        );
      };
    }

    if (can('walletTransactions')) {
      adapter.getWalletTransactions = async function (session, limit) {
        requireSession(session);
        return Result.ok(dataset.walletTransactions.slice(0, Math.max(1, limit)), diagnostics());
      };
    }

    if (can('testAccounts')) {
      adapter.getTestAccountOptions = async function (session) {
        requireSession(session);
        // المدد تأتي من المزود — النظام لا يفترض ٢/٤/٢٤ ساعة (§11).
        return Result.ok([
          { durationHours: 3, label: '٣ ساعات' },
          { durationHours: 12, label: '١٢ ساعة' },
          { durationHours: 48, label: 'يومان' }
        ], diagnostics());
      };

      adapter.createTestAccount = async function (session, durationHours, idempotencyKey) {
        requireSession(session);
        return mutate(idempotencyKey, function () {
          var created = now();
          return {
            id: 'mock:test:' + idempotencyKey.slice(0, 8),
            providerId: 'mock',
            username: 'trial' + Math.floor(Math.random() * 90000 + 10000),
            createdAt: created.toISOString(),
            expiresAt: new Date(created.getTime() + durationHours * 3600000).toISOString(),
            cost: { value: Money.money(0, 'IQD'), origin: 'provider' },
            status: 'active',
            metadata: { durationHours: durationHours }
          };
        });
      };
    }

    if (can('tickets')) {
      adapter.getSupportTickets = async function (session) {
        requireSession(session);
        var timestamp = now().toISOString();
        return Result.ok([{
          id: 'mock:ticket:1',
          providerId: 'mock',
          externalTicketId: 'TK-4471',
          subscriberId: dataset.subscribers[3] ? dataset.subscribers[3].id : null,
          subject: 'انقطاع متكرر في الخدمة',
          status: 'open',
          priority: 'high',
          createdAt: timestamp,
          updatedAt: timestamp
        }], diagnostics());
      };
    }

    if (can('smsNotification')) {
      adapter.sendNotification = async function (session, request) {
        requireSession(session);
        if (request.channel !== 'sms') {
          return Result.fail('UNSUPPORTED_OPERATION', Errors.operatorMessage('UNSUPPORTED_OPERATION'), diagnostics());
        }
        return mutate(request.idempotencyKey, function () { return undefined; });
      };
    }

    if (can('reconciliation')) {
      adapter.reconcileTransactions = async function (session, since) {
        requireSession(session);
        var cutoff = Date.parse(since);
        var entries = dataset.walletTransactions
          .filter(function (t) { return Number.isNaN(cutoff) || Date.parse(t.createdAt) >= cutoff; })
          .map(function (t) {
            return {
              externalTransactionId: t.providerTransactionId || t.id,
              occurredAt: t.createdAt,
              amountMinor: t.amount.amount,
              currency: t.amount.currency,
              subscriberReference: t.referenceId,
              kind: t.type
            };
          });
        return Result.ok(entries, diagnostics());
      };
    }

    return adapter;
  }

  return { createMockAdapter: createMockAdapter };
})();

/* ==========================================================================
   ١٧ — محوّل Earthlink: حدٌّ معلن، لا تنفيذ
   (modules/isp/providers/earthlink/{capabilities,adapter}.ts)

   لم تتوفر وثائق رسمية عامة لواجهة وكلاء Earthlink العراق، والمواصفة (§1، §38)
   تمنع اختراع سلوك غير موثّق. لذلك كل قدرة معلنة `unknown` — تعرضها الواجهة
   «غير معروف» ولا تمنح أي عملية — والمصادقة تفشل مغلقةً برسالة عربية.
   المفاهيم أدناه مأخوذة من مواد الوكلاء *العامة* لا من واجهة برمجية موثّقة.
   ========================================================================== */
var EarthlinkAdapter = (function () {
  var EARTHLINK_CAPABILITIES = {
    subscriberManagement: {
      state: 'unknown',
      note: 'إدارة الحسابات مذكورة في مواد الوكلاء العامة، لكن لا توجد وثائق واجهة برمجية رسمية متاحة.',
      detail: { observedInPublicMaterial: true, apiDocumented: false }
    },
    activation: {
      state: 'unknown',
      note: 'تفعيل الاشتراكات مذكور في مواد الوكلاء العامة — بانتظار وثائق الواجهة البرمجية.',
      detail: { observedInPublicMaterial: true, apiDocumented: false }
    },
    renewal: {
      state: 'unknown',
      note: 'تجديد الاشتراكات مذكور في مواد الوكلاء العامة — بانتظار وثائق الواجهة البرمجية.',
      detail: { observedInPublicMaterial: true, apiDocumented: false }
    },
    wallet: {
      state: 'unknown',
      note: 'إدارة المدفوعات مذكورة في مواد الوكلاء العامة، دون تفاصيل عن محفظة عبر واجهة برمجية.',
      detail: { observedInPublicMaterial: true, apiDocumented: false }
    },
    tickets: {
      state: 'unknown',
      note: 'الدعم الفني مذكور في مواد الوكلاء العامة — لا توجد واجهة تذاكر موثّقة.',
      detail: { observedInPublicMaterial: true, apiDocumented: false }
    },
    towerManagement: {
      state: 'unknown',
      note: 'معلومات الأبراج/المواقع مذكورة ضمن طلبات الوكلاء — غير موثّقة برمجياً.',
      detail: { observedInPublicMaterial: true, apiDocumented: false }
    }
    // بقية القدرات مُغفلة عمداً: resolveManifest يملؤها بـ `unknown`، وهي
    // الحالة الصادقة عن واجهة برمجية غير موثّقة.
  };

  var EARTHLINK_INTEGRATION_STATUS = {
    implemented: false,
    reason: 'no_official_api_documentation',
    blockedOn: [
      'Official reseller/agent API documentation (endpoints, auth, payloads)',
      'Sandbox credentials for an agent account',
      'Documented package identifiers and pricing model',
      'Documented renewal semantics (period start/extension rules)'
    ]
  };

  function createEarthlinkAdapter() {
    var notConfigured = {
      state: 'ERROR',
      reason: 'UNSUPPORTED_AUTH_METHOD',
      message: 'تكامل هذا المزود غير مُفعّل بعد — بانتظار وثائق الواجهة البرمجية الرسمية وبيانات الوكيل.'
    };

    return {
      key: 'earthlink',

      async getProviderProfile() {
        var timestamp = new Date().toISOString();
        return {
          id: 'earthlink', name: 'earthlink', displayName: 'Earthlink',
          logoUrl: null, accentColor: null,
          country: 'IQ', currency: 'IQD', timezone: 'Asia/Baghdad',
          // `inactive` يُبقيه ظاهراً في قائمة المزودين وفي مصفوفة القدرات
          // بينما يمنع كل عملية.
          status: 'inactive',
          adapterKey: 'earthlink', apiVersion: null, supportUrl: null,
          configuration: { integration: EARTHLINK_INTEGRATION_STATUS },
          createdAt: timestamp, updatedAt: timestamp
        };
      },

      async getCapabilities() { return EARTHLINK_CAPABILITIES; },

      async getAuthenticationRequirements() {
        // لا طريقة دخول موثّقة، فلا تُخترع حقول. نافذة الدخول تعرض حالة
        // "غير مُفعّل" بدل استمارة وهمية.
        return {
          methods: [{
            kind: 'none', id: 'unconfigured', label: 'التكامل غير مُفعّل',
            description: 'يتطلب هذا المزود وثائق واجهة برمجية رسمية وبيانات وكيل قبل تفعيل الاتصال.',
            fields: [], requiresSecondFactor: false
          }],
          defaultMethodId: 'unconfigured',
          sessionDurationSeconds: null,
          allowPersistentSession: false,
          helpUrl: null
        };
      },

      async authenticate() { return notConfigured; },

      async getAuthenticationStatus() {
        return {
          state: 'UNAUTHENTICATED', expiresAt: null,
          agentDisplayName: null, lastCheckedAt: new Date().toISOString()
        };
      },

      async logout() { /* لا شيء يُبطَل: لا تُنشأ جلسة أصلاً. */ },

      async testConnection() {
        return {
          state: 'FAILED',
          reason: 'UNSUPPORTED_OPERATION',
          message: Errors.operatorMessage('UNSUPPORTED_OPERATION'),
          diagnostics: { requestId: 'earthlink-unconfigured', adapterKey: 'earthlink' }
        };
      }
    };
  }

  return {
    createEarthlinkAdapter: createEarthlinkAdapter,
    EARTHLINK_CAPABILITIES: EARTHLINK_CAPABILITIES,
    EARTHLINK_INTEGRATION_STATUS: EARTHLINK_INTEGRATION_STATUS
  };
})();

/* ==========================================================================
   ١٨ — إقلاع المحوّلات (modules/isp/providers/bootstrap.ts)
   إضافة مزود = سطر واحد هنا + مجلد تحت providers/. لا تتغير أي لوحة أو ودجة
   أو مكوّن مشتركين أو فوترة.

   الفرق عن نسخة Next: الملمح لم يعد متغير بيئة ISP_MOCK_PROFILE يحتاج إعادة
   تشغيل الخادم، بل مُبدِّل في الشريط العلوي — فيُرى إعادةُ بناء اللوحة حيّةً.
   ========================================================================== */
var Bootstrap = (function () {
  var bootstrapped = false;
  var settings = { profile: 'full', seed: 1404, failureRate: 0, requireMfa: false };

  function bootstrapAdapters() {
    if (bootstrapped) return;
    bootstrapped = true;

    if (!AdapterRegistry.hasAdapter('mock')) {
      AdapterRegistry.registerAdapter('mock', function () {
        return MockAdapter.createMockAdapter({
          profile: settings.profile,
          seed: settings.seed,
          failureRate: settings.failureRate,
          requireMfa: settings.requireMfa
        });
      });
    }
    if (!AdapterRegistry.hasAdapter('earthlink')) {
      AdapterRegistry.registerAdapter('earthlink', EarthlinkAdapter.createEarthlinkAdapter);
    }
  }

  function enabledAdapterKeys() {
    bootstrapAdapters();
    return AdapterRegistry.registeredAdapterKeys();
  }

  /** تغيير إعدادات المحاكاة يُسقط النسخ المبنيّة فيُعاد تركيبها بالملمح الجديد. */
  function configureMock(next) {
    Object.assign(settings, next);
    AdapterRegistry.resetAdapterInstances();
  }

  return {
    bootstrapAdapters: bootstrapAdapters,
    enabledAdapterKeys: enabledAdapterKeys,
    configureMock: configureMock,
    settings: settings
  };
})();

/* ==========================================================================
   ١٩ — خدمة المزودين (lib/isp/providerService.ts + providerSession.ts)

   كل ما تحتاجه الواجهة مُجمَّعاً هنا، فيبقى المسار بين الشاشة والمحوّل واحداً.
   لا شيء في هذا الملف يعيد بيانات دخول ولا رسالة خطأ خاماً من المزود.

   فرقٌ جوهري يجب قوله صراحةً: في نسخة Next تُرسَل بيانات الدخول إلى مسار
   خادم وتبقى جلسة المزود على الخادم ولا يرى المتصفح إلا مرجعاً معتماً.
   هنا لا خادم إطلاقاً — كل شيء في المتصفح. لذلك:
     • لا تُكتب بيانات الدخول ولا مرجع الجلسة في localStorage ولا
       sessionStorage ولا في عنوان الصفحة؛ كلها في الذاكرة وتزول بالتحديث.
     • هذا مقبول لأن المزود هنا محاكاة داخل الصفحة نفسها. مزودٌ حقيقي
       بمفتاح حقيقي يحتاج طبقة خادم — انظر README.
   ========================================================================== */
var ProviderService = (function () {
  /** جلسات المزودين — في الذاكرة فقط، لا تُخزَّن ولا تنجو من تحديث الصفحة. */
  var providerSessions = {};   // providerId → { sessionRef, providerId, expiresAt }
  var agentNames = {};         // providerId → اسم الوكيل المعروض
  var persistenceChoice = {};  // providerId → 'session_only' | 'remember'
  var pendingChallenges = {};  // challengeId → { providerId }

  function adapterFor(providerId) {
    return AdapterRegistry.getAdapter(providerId);
  }

  function getSession(providerId) {
    return providerSessions[providerId] || null;
  }

  function putSession(providerId, session, persistence, agentDisplayName) {
    providerSessions[providerId] = session;
    persistenceChoice[providerId] = persistence;
    agentNames[providerId] = agentDisplayName || null;
  }

  function dropSession(providerId) {
    delete providerSessions[providerId];
    delete agentNames[providerId];
    delete persistenceChoice[providerId];
  }

  async function listProviders() {
    var summaries = [];
    var keys = Bootstrap.enabledAdapterKeys();

    for (var i = 0; i < keys.length; i += 1) {
      var adapter = adapterFor(keys[i]);
      var provider = await adapter.getProviderProfile();
      var session = getSession(provider.id);

      var authState = 'UNAUTHENTICATED';
      var capabilities = {};

      if (session) {
        var status = await adapter.getAuthenticationStatus(session);
        authState = status.state;
        // القدرات لا معنى لها إلا لجلسة مُصادَقة، والواجهة يجب ألا تعرض
        // لوحةً قبل تمام الاكتشاف (§43).
        if (status.state === 'AUTHENTICATED') {
          capabilities = await adapter.getCapabilities(session);
        }
      }

      var requirements = await adapter.getAuthenticationRequirements();
      var requiresAuth = !requirements.methods.some(function (m) { return m.kind === 'none'; });

      summaries.push({
        provider: provider,
        authState: authState,
        agentDisplayName: agentNames[provider.id] || null,
        capabilities: capabilities,
        readOnly: Object.keys(capabilities).length > 0 && Resolver.isReadOnly(capabilities),
        requiresAuth: requiresAuth
      });
    }

    return summaries;
  }

  async function authRequirements(providerId) {
    return adapterFor(providerId).getAuthenticationRequirements();
  }

  function toLoginResult(outcome, providerId, persistence) {
    switch (outcome.state) {
      case 'AUTHENTICATED':
        putSession(providerId, {
          sessionRef: outcome.sessionRef,
          providerId: providerId,
          expiresAt: outcome.expiresAt
        }, persistence, outcome.agentDisplayName);
        return { kind: 'authenticated', agentDisplayName: outcome.agentDisplayName };
      case 'REQUIRES_MFA':
        pendingChallenges[outcome.challenge.challengeId] = { providerId: providerId };
        return { kind: 'mfa', challenge: outcome.challenge };
      case 'ERROR':
        return { kind: 'error', message: outcome.message, reason: outcome.reason };
      default:
        throw new Error('Unhandled auth outcome: ' + JSON.stringify(outcome));
    }
  }

  async function login(providerId, methodId, credentials, persistence) {
    var outcome = await adapterFor(providerId).authenticate(credentials, methodId);
    return toLoginResult(outcome, providerId, persistence);
  }

  async function submitSecondFactor(challengeId, answers) {
    var pending = pendingChallenges[challengeId];
    if (!pending) {
      return {
        kind: 'error', reason: 'AUTH_FAILED',
        message: 'انتهت صلاحية رمز التحقق — أعد تسجيل الدخول.'
      };
    }
    delete pendingChallenges[challengeId];

    var adapter = adapterFor(pending.providerId);
    if (typeof adapter.submitSecondFactor !== 'function') {
      return {
        kind: 'error', reason: 'UNSUPPORTED_AUTH_METHOD',
        message: 'التحقق بخطوتين غير مدعوم لدى هذا المزود.'
      };
    }
    var outcome = await adapter.submitSecondFactor(challengeId, answers);
    return toLoginResult(outcome, pending.providerId, 'session_only');
  }

  async function logout(providerId) {
    var session = getSession(providerId);
    if (session) await adapterFor(providerId).logout(session);
    dropSession(providerId);
  }

  /**
   * اكتشاف القدرات (§43): يعمل بعد الدخول وقبل رسم اللوحة. كل خطوة اختيارية،
   * وفشل واحدة لا يُجهض البقية — مزودٌ لديه باقات بلا محفظة يعطي لوحة صالحة.
   */
  async function discoverCapabilities(providerId) {
    var session = getSession(providerId);
    if (!session) return null;

    var adapter = adapterFor(providerId);
    var capabilities = await adapter.getCapabilities(session);

    var packagesLoaded = 0;
    if (typeof adapter.getPackages === 'function') {
      var pkgResult = await adapter.getPackages(session);
      if (Result.isSuccess(pkgResult)) packagesLoaded = pkgResult.data.length;
    }

    var walletLoaded = false;
    if (typeof adapter.getWalletBalance === 'function') {
      walletLoaded = Result.isSuccess(await adapter.getWalletBalance(session));
    }

    return {
      capabilities: capabilities,
      packagesLoaded: packagesLoaded,
      walletLoaded: walletLoaded,
      readOnly: Resolver.isReadOnly(capabilities)
    };
  }

  // -------------------------------------------------------------------------
  // لقطة اللوحة
  // -------------------------------------------------------------------------
  async function dashboardSnapshot(providerId) {
    var session = getSession(providerId);
    if (!session) return null;

    var adapter = adapterFor(providerId);
    var capabilities = await adapter.getCapabilities(session);
    var generatedAt = new Date().toISOString();

    var subscribers = null;
    var expiringSoon = null;
    var onlineNow = null;

    if (Resolver.canPerform(capabilities, 'subscriberManagement') && adapter.searchSubscribers) {
      var searchResult = await adapter.searchSubscribers(session, { limit: 100 });
      if (Result.isSuccess(searchResult)) {
        var items = searchResult.data.items;
        var byStatus = {};
        items.forEach(function (s) { byStatus[s.status] = (byStatus[s.status] || 0) + 1; });
        subscribers = {
          total: searchResult.data.total === null ? items.length : searchResult.data.total,
          active: byStatus.active || 0,
          byStatus: byStatus
        };

        // انتهاء الاشتراك يحتاج سجل الاشتراك، ولا يكشفه كل مزود.
        if (adapter.getSubscription) {
          var expiring = 0;
          for (var i = 0; i < items.length; i += 1) {
            var sub = await adapter.getSubscription(session, items[i].externalSubscriberId);
            if (!Result.isSuccess(sub)) continue;
            if (Renewal.isExpiringSoon(sub.data.expiresAt)) expiring += 1;
          }
          expiringSoon = expiring;
        }

        // لا تُعدّ الجلسات إلا حين يبلّغ عنها المزود فعلاً (§19).
        if (Resolver.canPerform(capabilities, 'sessionMonitoring') && adapter.getCurrentSession) {
          var online = 0;
          for (var j = 0; j < items.length; j += 1) {
            var s2 = await adapter.getCurrentSession(session, items[j].externalSubscriberId);
            if (Result.isSuccess(s2) && s2.data && s2.data.online) online += 1;
          }
          onlineNow = online;
        }
      }
    }

    var wallet = null;
    if (Resolver.canPerform(capabilities, 'wallet') && adapter.getWalletBalance) {
      var walletResult = await adapter.getWalletBalance(session);
      if (Result.isSuccess(walletResult)) wallet = walletResult.data;
    }

    var walletTransactions = null;
    if (Resolver.canPerform(capabilities, 'walletTransactions') && adapter.getWalletTransactions) {
      var txResult = await adapter.getWalletTransactions(session, 6);
      if (Result.isSuccess(txResult)) walletTransactions = txResult.data;
    }

    var tickets = null;
    if (Resolver.canPerform(capabilities, 'tickets') && adapter.getSupportTickets) {
      var ticketResult = await adapter.getSupportTickets(session);
      if (Result.isSuccess(ticketResult)) tickets = ticketResult.data;
    }

    var testAccountOptions = null;
    if (Resolver.canPerform(capabilities, 'testAccounts') && adapter.getTestAccountOptions) {
      var optionsResult = await adapter.getTestAccountOptions(session);
      if (Result.isSuccess(optionsResult)) testAccountOptions = optionsResult.data;
    }

    var reachable = false;
    var latencyMs = null;
    if (adapter.testConnection) {
      var probe = await adapter.testConnection(session);
      reachable = Result.isSuccess(probe);
      if (reachable) latencyMs = probe.data.latencyMs;
    }

    return {
      providerId: providerId,
      generatedAt: generatedAt,
      capabilities: capabilities,
      subscribers: subscribers,
      expiringSoon: expiringSoon,
      onlineNow: onlineNow,
      wallet: wallet,
      walletTransactions: walletTransactions,
      tickets: tickets,
      testAccountOptions: testAccountOptions,
      health: { reachable: reachable, latencyMs: latencyMs, checkedAt: generatedAt }
    };
  }

  // -------------------------------------------------------------------------
  // المشتركون
  // -------------------------------------------------------------------------
  async function searchSubscribers(providerId, query) {
    var session = getSession(providerId);
    if (!session) return null;

    var adapter = adapterFor(providerId);
    var capabilities = await adapter.getCapabilities(session);

    if (!Resolver.canPerform(capabilities, 'subscriberManagement') || !adapter.searchSubscribers) {
      return { items: [], total: 0, nextCursor: null, capabilities: capabilities };
    }

    var result = await adapter.searchSubscribers(session, query);
    if (!Result.isSuccess(result)) {
      return { items: [], total: 0, nextCursor: null, capabilities: capabilities };
    }
    return {
      items: result.data.items,
      total: result.data.total,
      nextCursor: result.data.nextCursor,
      capabilities: capabilities
    };
  }

  /**
   * ملف المشترك: كل جزء منه مشروط بقدرة. المزود الذي لا يراقب الجلسات لا
   * تُستدعى لديه getCurrentSession أصلاً — فالقسم لا يُرسم بدل أن يُرسم فارغاً.
   */
  async function subscriberDetail(providerId, externalSubscriberId) {
    var session = getSession(providerId);
    if (!session) return null;

    var adapter = adapterFor(providerId);
    var capabilities = await adapter.getCapabilities(session);
    var detail = {
      capabilities: capabilities,
      subscriber: null, subscription: null, session: null,
      packages: [], currentPackage: null
    };

    if (adapter.getSubscriber) {
      var subscriberResult = await adapter.getSubscriber(session, externalSubscriberId);
      if (Result.isSuccess(subscriberResult)) detail.subscriber = subscriberResult.data;
    }
    if (adapter.getSubscription) {

    if (adapter.getPackages) {

    }
    if (Resolver.canPerform(capabilities, 'sessionMonitoring') && adapter.getCurrentSession) {
      var netResult = await adapter.getCurrentSession(session, externalSubscriberId);
      if (Result.isSuccess(netResult)) detail.session = netResult.data;
    }

   * تنفيذ عملية على المحوّل مع فحص القدرة أولاً.
   * لا تُستدعى دالةٌ أبداً دون أن يكون محرك القدرات قد أذن بها — فحتى لو
   * تسرّب زر إلى الشاشة، الطبقة هنا ترفض.

    if (Result.isSuccess(result)) {
      return {
        ok: true, state: result.state, data: result.data,
        diagnostics: Errors.redact(result.diagnostics)
      };
    }
    return {
      ok: false, state: result.state, message: result.message,
      reconciliation: result.reconciliation,
      diagnostics: Errors.redact(result.diagnostics)
    };
  }

    listProviders: listProviders,
    authRequirements: authRequirements,
    login: login,
    submitSecondFactor: submitSecondFactor,
    logout: logout,
    discoverCapabilities: discoverCapabilities,
    dashboardSnapshot: dashboardSnapshot,
    searchSubscribers: searchSubscribers,
    subscriberDetail: subscriberDetail,
    runOperation: runOperation,
    newIdempotencyKey: newIdempotencyKey,
    toClientResult: toClientResult,
    getSession: getSession,

      Object.keys(providerSessions).forEach(dropSession);
    }
  };
})();
