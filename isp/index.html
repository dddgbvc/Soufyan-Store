/* ==========================================================================
   ٢٣ — نافذة الاتصال بالمزود (components/provider/ProviderLoginModal.tsx)
   عامّة عمداً: لا اسم مزود، ولا حقل خاص بمزود، ولا معالجة خطأ خاصة بمزود.
   المحوّل يعطي قائمة الطرق ومخطط الحقول، وهذه ترسمها بلغة ياقوت البصرية حتى
   لا يشعر المشغّل أنه غادر النظام إلى بوابة مورّد (§48).
   ========================================================================== */
var LoginModal = (function () {
  var el = D.el;
  var openOverlay = null;

  function close() {
    if (!openOverlay) return;
    document.removeEventListener('keydown', onKeydown, true);
    if (openOverlay.parentNode) openOverlay.parentNode.removeChild(openOverlay);
    openOverlay = null;
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  }

  var lastFocused = null;

  function onKeydown(event) {
    if (event.key === 'Escape') { event.stopPropagation(); close(); return; }
    if (event.key !== 'Tab' || !openOverlay) return;

    // حبس التركيز داخل النافذة: النافذة الطاغية يجب ألا تُترك خلفها الصفحة
    // قابلة للتنقل بلوحة المفاتيح.
    var focusable = openOverlay.querySelectorAll(
      'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])'
    );
    if (focusable.length === 0) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault(); first.focus();
    }
  }

  /**
   * @param provider ملخّص المزود
   * @param onAuthenticated يُستدعى بعد نجاح الدخول وتمام الاكتشاف
   */
  function open(provider, onAuthenticated) {
    close();
    lastFocused = document.activeElement;

    var state = {
      requirements: null,
      methodId: '',
      phase: 'credentials',   // credentials | mfa | discovering
      challenge: null,
      busy: false,
      remember: false
    };

    var bodyHost = el('div');
    var modal = el('div', {
      class: 'glass modal',
      role: 'dialog',
      'aria-modal': 'true',
      'aria-label': 'الاتصال بمزود ' + provider.provider.displayName,
      onclick: function (event) { event.stopPropagation(); }
    }, [
      // هوية ياقوت أولاً، وهوية المزود تابعة لها (§48)
      el('p', { class: 'modal-eyebrow', text: 'ياقوت ERP' }),
      el('div', { class: 'modal-head' }, [
        UI.providerBadge(
          provider.provider.displayName,
          provider.provider.logoUrl,
          provider.provider.accentColor
        ),
        el('button', {
          class: 'icon-close', type: 'button', 'aria-label': 'إغلاق', onclick: close
        }, '✕')
      ]),
      bodyHost
    ]);

    openOverlay = el('div', { class: 'overlay', onclick: close }, modal);
    document.body.appendChild(openOverlay);
    document.addEventListener('keydown', onKeydown, true);

    // هيكل التحميل ريثما يصل مخطط الحقول من المحوّل
    D.replace(bodyHost, el('div', { class: 'form' }, [
      el('div', { class: 'shimmer', style: { height: '40px' } }),
      el('div', { class: 'shimmer', style: { height: '40px' } })
    ]));

    ProviderService.authRequirements(provider.provider.id).then(function (requirements) {
      if (!openOverlay) return;
      state.requirements = requirements;
      state.methodId = requirements.defaultMethodId;
      renderBody();
    });

    function currentMethod() {
      if (!state.requirements) return null;
      return state.requirements.methods.find(function (m) { return m.id === state.methodId; })
        || state.requirements.methods[0] || null;
    }

    function renderBody() {
      var method = currentMethod();

      // مزودٌ بلا طريقة دخول موثّقة (محوّل غير مُفعّل) يجب أن يعرض حالته،
      // لا استمارة وهمية.
      if (method && method.kind === 'none') {
        D.replace(bodyHost, el('div', { class: 'form' }, [
          el('p', { class: 'state-hint', text: method.description || '' }),
          el('p', {
            class: 'field-help',
            style: {
              border: '1px solid var(--border)', borderRadius: '12px',
              background: 'var(--surface-2)', padding: '12px'
            },
            text: 'هذا المزود مُعرَّف في النظام لكن تكامله غير مُفعّل بعد. لن تظهر أي عملية عليه حتى تُضبط بيانات الاتصال الرسمية.'
          })
        ]));
        return;
      }

      var fields = (state.phase === 'mfa' && state.challenge)
        ? state.challenge.fields
        : (method ? method.fields : []);

      var form = DynamicForm.render(fields, {
        idPrefix: 'login-' + provider.provider.id,
        disabled: state.busy
      });

      var errorBox = el('p', { class: 'alert-box', role: 'alert', hidden: true });

      var submitButton = el('button', {
        class: 'btn btn--primary', type: 'submit', disabled: state.busy
      }, state.busy
        ? (state.phase === 'discovering' ? 'جارٍ اكتشاف الخدمات…' : 'جارٍ الاتصال…')
        : (state.phase === 'mfa' ? 'تأكيد الرمز' : 'تسجيل الدخول'));

      var formNode = el('form', {
        onsubmit: function (event) { event.preventDefault(); submit(form, errorBox, submitButton); }
      }, [
        // محدّد طريقة الدخول يظهر فقط عند وجود أكثر من طريقة (§47)
        (state.phase === 'credentials' && state.requirements.methods.length > 1)
          ? el('div', { class: 'method-row' }, state.requirements.methods.map(function (m) {
            return el('button', {
              class: 'method-pill', type: 'button',
              'aria-pressed': m.id === state.methodId ? 'true' : 'false',
              onclick: function () { state.methodId = m.id; renderBody(); }
            }, m.label);
          }))
          : null,

        (state.phase === 'mfa' && state.challenge)
          ? el('p', { class: 'state-hint', style: { marginBottom: '12px' }, text: state.challenge.prompt })
          : null,

        form.node,

        (state.phase === 'credentials' && state.requirements.allowPersistentSession)
          ? el('label', { class: 'check-row', style: { marginTop: '12px' } }, [
            el('input', {
              type: 'checkbox', checked: state.remember,
              onchange: function (event) { state.remember = event.target.checked; }
            }),
            Auth.SESSION_PERSISTENCE_LABELS.remember
          ])
          : null,

        errorBox,
        submitButton,

        el('p', { class: 'secure-note' }, [
          el('span', { class: 'secure-dot', 'aria-hidden': 'true' }),
          'اتصال آمن — بيانات الدخول لا تُحفظ في المتصفح ولا في عنوان الصفحة'
        ])
      ]);

      D.replace(bodyHost, formNode);
      form.focusFirst();
    }

    async function submit(form, errorBox, submitButton) {
      if (state.busy) return;

      var method = currentMethod();
      var fields = (state.phase === 'mfa' && state.challenge)
        ? state.challenge.fields
        : (method ? method.fields : []);

      var errors = DynamicForm.validateAll(fields, form.values);
      if (Object.keys(errors).length > 0) { form.showErrors(errors); return; }

      state.busy = true;
      form.setDisabled(true);
      submitButton.disabled = true;
      submitButton.textContent = 'جارٍ الاتصال…';
      errorBox.hidden = true;

      try {
        var result = (state.phase === 'mfa' && state.challenge)
          ? await ProviderService.submitSecondFactor(state.challenge.challengeId, form.values)
          : await ProviderService.login(
            provider.provider.id,
            state.methodId,
            form.values,
            state.remember ? 'remember' : 'session_only'
          );

        if (result.kind === 'error') {
          errorBox.textContent = result.message || 'تعذر إكمال الاتصال.';
          errorBox.hidden = false;
          return;
        }
        if (result.kind === 'mfa') {
          state.challenge = result.challenge;
          state.phase = 'mfa';
          state.busy = false;
          renderBody();
          return;
        }

        // مُصادَق: يُشغَّل اكتشاف الخدمات قبل رسم اللوحة (§43).
        state.phase = 'discovering';
        submitButton.textContent = 'جارٍ اكتشاف الخدمات…';
        await ProviderService.discoverCapabilities(provider.provider.id);
        close();
        onAuthenticated(provider.provider.id);
      } catch (error) {
        errorBox.textContent = Errors.operatorMessage('PROVIDER_UNAVAILABLE');
        errorBox.hidden = false;
      } finally {
        if (openOverlay) {
          state.busy = false;
          form.setDisabled(false);
          submitButton.disabled = false;
          submitButton.textContent = state.phase === 'mfa' ? 'تأكيد الرمز' : 'تسجيل الدخول';
        }
      }
    }
  }

  return { open: open, close: close };
})();

/* ==========================================================================
   ٢٤ — حالة التطبيق (components/isp/ProviderContext.tsx)
   سياق المزود مرئي في كل مكان (§45)، وتبديل المزود لا يُخرج المشغّل من
   ياقوت — تتغير البيانات المرتبطة بالمزود فقط.
   ========================================================================== */
var Store = (function () {
  var listeners = [];

  var state = {
    providers: [],
    loading: true,
    /** null = العرض المجمَّع لكل المزودين (§19). */
    selected: null,
    /** يأتي الدور من جلسة ياقوت في الإنتاج؛ العرض هنا يسمح بتجربته. */
    role: 'ADMIN',
    route: 'dashboard',
    snapshots: {},
    snapshotsLoading: false
  };

  function subscribe(fn) { listeners.push(fn); }
  function emit() { listeners.forEach(function (fn) { fn(state); }); }

  function connected() {
    return state.providers.filter(function (p) { return p.authState === 'AUTHENTICATED'; });
  }

  function active() {
    if (state.selected === null) return null;
    return state.providers.find(function (p) { return p.provider.id === state.selected; }) || null;
  }

  /** الشكل الذي يتوقعه مُحلِّل القدرات للتجميع. */
  function manifests() {
    return connected().map(function (p) {
      return {
        providerId: p.provider.id,
        providerName: p.provider.displayName,
        manifest: p.capabilities
      };
    });
  }

  /** نطاق التجميع: كل المتصلين في العرض المجمَّع، وواحدٌ في العرض المفرد. */
  function scope() {
    if (state.selected === null) return manifests();
    return manifests().filter(function (m) { return m.providerId === state.selected; });
  }

  /**
   * القدرات المؤثرة على اللوحة. في العرض المجمَّع تُعدّ القدرة موجودة إن
   * توفرت لدى أي مزود — ثم يوضّح تنويهُ التغطية لكل ودجة حدودَ الرقم.
   */
  function effectiveCapabilities() {
    var current = active();
    if (current) return current.capabilities;
    var merged = {};
    manifests().forEach(function (m) {
      Object.keys(m.manifest).forEach(function (key) {
        var decl = m.manifest[key];
        if (decl && (decl.state === 'supported' || decl.state === 'partial')) {
          merged[key] = { state: 'supported' };
        }
      });
    });
    return merged;
  }

  async function refresh() {
    state.loading = true;
    emit();
    try {
      state.providers = await ProviderService.listProviders();
    } catch (error) {
      state.providers = [];
    }
    // الهبوط على أول مزود متصل حتى يرى المشغّل بيانات لا قائمة اختيار.
    if (state.selected === null) {
      var firstConnected = state.providers.find(function (p) {
        return p.authState === 'AUTHENTICATED';
      });
      if (firstConnected) state.selected = firstConnected.provider.id;
    }
    state.loading = false;
    emit();
    await loadSnapshots();
  }

  /** لقطة لكل مزود متصل، حتى تملك أرقام العرض المجمَّع مصدراً حقيقياً. */
  async function loadSnapshots() {
    var targets = connected();
    if (targets.length === 0) {
      state.snapshots = {};
      emit();
      return;
    }
    state.snapshotsLoading = true;
    emit();

    var next = {};
    for (var i = 0; i < targets.length; i += 1) {
      try {
        var snapshot = await ProviderService.dashboardSnapshot(targets[i].provider.id);
        if (snapshot) next[targets[i].provider.id] = snapshot;
      } catch (error) {
        // مزودٌ عجز عن الرد لا يساهم بشيء؛ منطق التغطية يبلّغ عنه بدل
        // اختلاق صفر يبدو حقيقة.
      }
    }
    state.snapshots = next;
    state.snapshotsLoading = false;
    emit();
  }

  function select(id) {
    state.selected = id;
    emit();
  }

  function setRole(role) {
    state.role = role;
    emit();
  }

  return {
    state: state, subscribe: subscribe, emit: emit, refresh: refresh,
    loadSnapshots: loadSnapshots, select: select, setRole: setRole,
    connected: connected, active: active, manifests: manifests,
    scope: scope, effectiveCapabilities: effectiveCapabilities
  };
})();

/* ==========================================================================
   ٢٥ — السمة الفاتحة/الداكنة
   تتبع نظام الجهاز ما لم يختر المستخدم صراحةً. الاختيار محفوظ محلياً، وكل
   قراءة أو كتابة مغلّفة لأن المتصفح قد يمنع التخزين تماماً.
   ========================================================================== */
var Theme = (function () {
  var KEY = 'yaqoot-isp-theme';

  function stored() {
    try { return localStorage.getItem(KEY); } catch (error) { return null; }
  }
  function persist(value) {
    try { localStorage.setItem(KEY, value); } catch (error) { /* وضع خاص أو تخزين ممنوع */ }
  }
  function current() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function apply(value) {
    document.documentElement.setAttribute('data-theme', value);
    persist(value);
  }
  function init() {
    var saved = stored();
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  }
  function toggle() { apply(current() === 'dark' ? 'light' : 'dark'); }

  return { init: init, toggle: toggle, current: current };
})();

/* ==========================================================================
   ٢٦ — الهيكل والتوجيه (components/isp/Shell.tsx + app/isp/layout.tsx)
   ========================================================================== */
var Shell = (function () {
  var el = D.el;

  var ROUTES = [
    { id: 'dashboard', hash: '#/', label: 'اللوحة' },
    { id: 'subscribers', hash: '#/subscribers', label: 'المشتركون' },
    { id: 'capabilities', hash: '#/capabilities', label: 'قدرات المزودين' },
    { id: 'checks', hash: '#/checks', label: 'الفحوصات' }
  ];

  function authTone(state) {
    switch (state) {
      case 'AUTHENTICATED': return 'ok';
      case 'AUTHENTICATING': return 'info';
      case 'ERROR': return 'danger';
      case 'EXPIRED':
      case 'REQUIRES_REAUTH':
      case 'REQUIRES_MFA': return 'warn';
      default: return 'muted';
    }
  }

  function routeFromHash() {
    var hash = window.location.hash || '#/';
    var found = ROUTES.find(function (r) { return r.hash === hash; });
    return found ? found.id : 'dashboard';
  }

  // -------------------------------------------------------------------------
  // شريط أدوات المحاكاة — بديل متغير البيئة ISP_MOCK_PROFILE
  // -------------------------------------------------------------------------
  function simulationControl() {
    var options = MockProfiles.MOCK_PROFILES.map(function (key) {
      var def = MockProfiles.MOCK_PROFILE_DEFINITIONS[key];
      return el('option', {
        value: key,
        selected: Bootstrap.settings.profile === key
      }, def.displayName);
    });

    var select = el('select', {
      id: 'profile-select',
      class: 'select control-sm',
      title: 'يبدّل شكل المزود التجريبي — تُعاد اللوحة بناءً على القدرات الجديدة',
      onchange: async function (event) {
        Bootstrap.configureMock({ profile: event.target.value });
        // الجلسة تبقى قائمة عمداً (انظر التعليق في محوّل المحاكاة) حتى تُرى
        // اللوحة وهي تُعيد بناء نفسها بدل أن يُطرد المشغّل عند كل تبديل.
        await Store.refresh();
      }
    }, options);

    return el('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, [
      el('label', { class: 'sr-only', for: 'profile-select' }, 'ملمح المحاكاة'),
      select
    ]);
  }

  function roleControl() {
    var select = el('select', {
      id: 'role-select',
      class: 'select control-sm',
      title: 'الدور يأتي من جلسة ياقوت في الإنتاج — هنا لتجربة أثر الصلاحيات',
      onchange: function (event) { Store.setRole(event.target.value); }
    }, ['CASHIER', 'MANAGER', 'ADMIN'].map(function (role) {
      return el('option', {
        value: role, selected: Store.state.role === role
      }, Widgets.ROLE_LABELS[role]);
    }));

    return el('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, [
      el('label', { class: 'sr-only', for: 'role-select' }, 'دور المستخدم'),
      select
    ]);
  }

  function providerSelector() {
    var select = el('select', {
      id: 'provider-select',
      class: 'select control-sm',
      onchange: function (event) {
        Store.select(event.target.value === '__all__' ? null : event.target.value);
      }
    }, [
      el('option', {
        value: '__all__', selected: Store.state.selected === null
      }, 'كل المزودين'),
      Store.state.providers.map(function (p) {
        return el('option', {
          value: p.provider.id,
          selected: Store.state.selected === p.provider.id
        }, p.provider.displayName);
      })
    ]);

    return el('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, [
      el('label', { class: 'sr-only', for: 'provider-select' }, 'اختر المزود'),
      select
    ]);
  }

  function providerChip(p) {
    var isConnected = p.authState === 'AUTHENTICATED';
    return el('div', { class: 'provider-chip' }, [
      UI.providerBadge(p.provider.displayName, p.provider.logoUrl, p.provider.accentColor),
      UI.badge(Auth.AUTH_STATE_LABELS[p.authState], {
        tone: authTone(p.authState), dot: true, pulse: isConnected
      }),
      p.readOnly ? UI.badge('قراءة فقط', { tone: 'warn' }) : null,
      isConnected
        ? el('button', {
          class: 'linkish linkish--muted', type: 'button',
          onclick: async function () {
            await ProviderService.logout(p.provider.id);
            if (Store.state.selected === p.provider.id) Store.state.selected = null;
            await Store.refresh();
          }
        }, 'قطع الاتصال')
        : el('button', {
          class: 'linkish linkish--primary', type: 'button',
          onclick: function () {
            LoginModal.open(p, async function (providerId) {
              await Store.refresh();
              Store.select(providerId);
            });
          }
        }, 'اتصال')
    ]);
  }

  function header() {
    return el('header', { class: 'glass site-header' }, [
      el('div', { class: 'wrap' }, [
        el('div', { class: 'header-row' }, [
          el('span', { class: 'brand' }, ['ياقوت ', el('span', { text: 'الإنترنت' })]),
          el('nav', { class: 'nav', 'aria-label': 'أقسام الوحدة' }, ROUTES.map(function (route) {
            return el('a', {
              href: route.hash,
              'aria-current': Store.state.route === route.id ? 'page' : null
            }, route.label);
          })),
          el('div', { class: 'header-tools' }, [
            simulationControl(),
            roleControl(),
            providerSelector(),
            Store.state.loading ? UI.badge('جارٍ التحميل…', { tone: 'muted' }) : null,
            el('button', {
              class: 'btn btn--icon', type: 'button',
              'aria-label': 'تبديل السمة الفاتحة والداكنة',
              onclick: function (event) {
                Theme.toggle();
                event.currentTarget.textContent = Theme.current() === 'dark' ? '☀' : '☾';
              }
            }, Theme.current() === 'dark' ? '☀' : '☾')
          ])
        ]),

        // شريط حالة الاتصال بكل مزود
        el('div', { class: 'provider-strip' }, [
          Store.state.providers.map(providerChip),
          (Store.state.providers.length === 0 && !Store.state.loading)
            ? el('span', { class: 'field-help', text: 'لا يوجد مزودون مُسجّلون.' })
            : null
        ])
      ])
    ]);
  }

  var viewHost = el('div');

  function render() {
    var root = document.getElementById('app');
    D.replace(root, [
      header(),
      el('main', {}, el('div', { class: 'wrap' }, [
        (Store.connected().length === 0 && !Store.state.loading && Store.state.route !== 'checks')
          ? UI.glass('notice', 'لم يتم الاتصال بأي مزود بعد. اختر مزوداً من الشريط أعلاه وسجّل الدخول ليبدأ اكتشاف الخدمات المتاحة.')
          : null,
        viewHost
      ]))
    ]);
    renderView();
  }

  function renderView() {
    switch (Store.state.route) {
      case 'subscribers': Views.subscribers(viewHost); break;
      case 'capabilities': Views.capabilities(viewHost); break;
      case 'checks': Views.checks(viewHost); break;
      default: Views.dashboard(viewHost);
    }
  }

  function init() {
    Theme.init();
    Bootstrap.bootstrapAdapters();
    Store.state.route = routeFromHash();

    window.addEventListener('hashchange', function () {
      Store.state.route = routeFromHash();
      render();
    });

    Store.subscribe(render);
    render();
    Store.refresh();
  }

  return { init: init, render: render, ROUTES: ROUTES };
})();

/* ==========================================================================
   ٢٧ — طابور المطابقة المحلي
   كل عملية تنتهي إلى REQUIRES_RECONCILIATION تُسجَّل هنا. هذا ما تعدّه ودجة
   "بانتظار المطابقة": في الإنتاج مصدرها جدول isp_reconciliation في ياقوت،
   وهنا سجلٌّ في الذاكرة لنفس الغرض — أن تبقى العملية الغامضة مرئية بدل أن
   تُبتلع كفشلٍ عادي يُعاد تلقائياً.
   ========================================================================== */
var ReconciliationQueue = (function () {
  var entries = [];

  function record(context, result) {
    entries.unshift({
      at: new Date().toISOString(),
      operation: context.operation,
      subscriber: context.subscriber || null,
      providerId: context.providerId,
      message: result.message,
      note: result.reconciliation ? result.reconciliation.note : null,
      externalReference: result.reconciliation ? result.reconciliation.externalReference : null
    });
  }

  return {
    record: record,
    all: function () { return entries; },
    count: function () { return entries.length; }
  };
})();

/* ==========================================================================
   ٢٨ — الشاشات
   ========================================================================== */
var Views = {};

/* --------------------------------------------------------------------------
   اللوحة (app/isp/Dashboard.tsx)
   لا ترسم اللوحة شيئاً من عندها: كل بطاقة تأتي من سجل الودجات بعد ترشيحها
   ببيان القدرات النشط (§15). لا يوجد في هذه الدالة أي شرط على اسم مزود،
   وإضافة مزود لا تتطلب تعديلها.
   -------------------------------------------------------------------------- */
Views.dashboard = function (host) {
  var el = D.el;
  var state = Store.state;

  if (state.loading || (state.snapshotsLoading && Object.keys(state.snapshots).length === 0)) {
    D.replace(host, el('div', { class: 'widget-grid' },
      Array.from({ length: 6 }, function () { return UI.loadingCard(); })));
    return;
  }

  if (Store.connected().length === 0) { D.replace(host, []); return; }

  var scope = Store.scope();
  var active = Store.active();
  var capabilities = Store.effectiveCapabilities();
  var widgets = Widgets.resolveWidgets(capabilities, state.role);
  var activeSnapshot = active ? state.snapshots[active.provider.id] : undefined;

  function metric(field, capability) {
    return Resolver.aggregateMetric(scope, capability, function (providerId) {
      var snap = state.snapshots[providerId];
      if (!snap) return null;
      if (field === 'subscribersActive') return snap.subscribers ? snap.subscribers.active : null;
      if (field === 'expiringSoon') return snap.expiringSoon;
      return snap.onlineNow;
    });
  }

  function breakdownFor(agg) {
    return state.selected === null ? UI.providerBreakdown(agg.breakdown, agg.qualifier) : null;
  }

  // -- مُصيّرات الودجات، مفتاحها widgetId من السجل ---------------------------
  var renderers = {
    'active-subscribers': function (definition) {
      var agg = metric('subscribersActive', 'subscriberManagement');
      return UI.widgetCard({
        title: definition.title,
        body: [UI.metricValue(D.num(agg.total), 'مشترك'), breakdownFor(agg)]
      });
    },

    'expiring-soon': function (definition) {
      var agg = metric('expiringSoon', 'subscriberManagement');
      return UI.widgetCard({
        title: definition.title,
        footer: 'خلال ٧ أيام',
        body: [
          UI.metricValue(D.num(agg.total), 'اشتراك', agg.total > 0 ? 'warn' : 'default'),
          breakdownFor(agg)
        ]
      });
    },

    'online-sessions': function (definition) {
      var agg = metric('onlineNow', 'sessionMonitoring');
      return UI.widgetCard({
        title: definition.title,
        // §19: لا يُقدَّم عدد اتصالٍ مجمَّع كأنه كامل بينما عجز مزود عن
        // التبليغ عن الجلسات الحيّة.
        footer: agg.complete ? null : 'المزودون الذين يوفرون بيانات جلسات مباشرة فقط',
        body: [
          UI.metricValue(D.num(agg.total), 'متصل', 'ok'),
          breakdownFor(agg),
          agg.coverage.notReporting.length > 0
            ? el('p', {
              class: 'muted-note',
              text: 'لا يوفرها: ' + agg.coverage.notReporting.map(function (p) {
                return p.providerName;
              }).join('، ')
            })
            : null
        ]
      });
    },

    'wallet-balance': function (definition) {
      var wallet = activeSnapshot ? activeSnapshot.wallet : null;
      var freshness = (wallet && wallet.lastSyncedAt)
        ? Freshness.classifyFreshness({
          owner: 'provider', fetchedAt: wallet.lastSyncedAt,
          externalReference: null, syncStatus: 'ok'
        })
        : null;
      var low = !!wallet && wallet.lowBalanceThreshold !== null
        && wallet.availableBalance.amount <= wallet.lowBalanceThreshold.amount;

      return UI.widgetCard({
        title: definition.title,
        freshness: freshness,
        tone: low ? 'alert' : 'default',
        footer: state.selected === null ? 'اختر مزوداً لعرض رصيده' : null,
        body: wallet
          ? [
            UI.currencyValue(wallet.availableBalance, 'lg'),
            low ? el('div', { style: { marginTop: '4px' } },
              UI.badge('الرصيد قارب على الحد الأدنى', { tone: 'warn' })) : null,
            wallet.creditLimit ? el('p', { class: 'muted-note' }, [
              'حد الائتمان: ', UI.currencyValue(wallet.creditLimit, 'sm')
            ]) : null
          ]
          : UI.metricValue(null)
      });
    },

    'provider-health': function (definition) {
      var health = activeSnapshot ? activeSnapshot.health : null;
      return UI.widgetCard({
        title: definition.title,
        footer: (health && health.latencyMs !== null)
          ? 'زمن الاستجابة ' + health.latencyMs + 'ms' : null,
        body: UI.badge((health && health.reachable) ? 'الاتصال سليم' : 'غير معروف', {
          tone: (health && health.reachable) ? 'ok' : 'muted',
          dot: true, pulse: !!(health && health.reachable)
        })
      });
    },

    'reconciliation-queue': function (definition) {
      var count = ReconciliationQueue.count();
      var latest = ReconciliationQueue.all()[0];
      return UI.widgetCard({
        title: definition.title,
        tone: count > 0 ? 'alert' : 'default',
        footer: latest ? latest.note : 'عمليات تحتاج مراجعة بشرية',
        body: UI.metricValue(D.num(count), 'عملية', count > 0 ? 'warn' : 'default')
      });
    },

    'test-accounts': function (definition) {
      var options = (activeSnapshot && activeSnapshot.testAccountOptions) || [];
      if (!active) {
        return UI.widgetCard({
          title: definition.title,
          footer: 'اختر مزوداً لإنشاء حساب تجريبي',
          body: UI.metricValue(null)
        });
      }

      var output = el('div', { class: 'widget-foot', style: { marginTop: '6px' } });
      // المدد تأتي من المزود؛ النظام لا يفترضها (§11).
      var durationSelect = el('select', { class: 'select control-sm', 'aria-label': 'مدة الحساب التجريبي' },
        options.map(function (option) {
          return el('option', { value: String(option.durationHours) }, option.label);
        }));

      var button = el('button', {
        class: 'btn btn--sm', type: 'button',
        onclick: async function () {
          button.disabled = true;
          D.replace(output, 'جارٍ الإنشاء…');
          var hours = Number(durationSelect.value);
          var result = await ProviderService.runOperation(
            active.provider.id, 'testAccounts', 'createTestAccount',
            [hours, ProviderService.newIdempotencyKey()]
          );
          button.disabled = false;

          if (Result.isSuccess(result)) {
            D.replace(output, [
              el('span', { text: 'اسم المستخدم: ' }), UI.ltr(result.data.username),
              el('span', { text: ' — ينتهي ' + D.dateTimeLabel(result.data.expiresAt) })
            ]);
            return;
          }
          if (result.state === 'REQUIRES_RECONCILIATION') {
            ReconciliationQueue.record(
              { operation: 'إنشاء حساب تجريبي', providerId: active.provider.id }, result);
            Store.emit();
          }
          D.replace(output, el('span', { style: { color: 'var(--danger)' }, text: result.message }));
        }
      }, 'إنشاء');

      return UI.widgetCard({
        title: definition.title,
        body: [
          el('div', { class: 'btn-row' }, [durationSelect, button]),
          output
        ]
      });
    },

    'support-tickets': function (definition) {
      var tickets = (activeSnapshot && activeSnapshot.tickets) || [];
      if (tickets.length === 0) {
        return UI.widgetCard({
          title: definition.title,
          footer: state.selected === null ? 'اختر مزوداً لعرض تذاكره' : 'لا تذاكر مفتوحة',
          body: UI.metricValue(state.selected === null ? null : 0, 'تذكرة')
        });
      }
      return UI.widgetCard({
        title: definition.title,
        footer: D.num(tickets.length) + ' تذكرة مفتوحة',
        body: el('ul', { class: 'mini-list' }, tickets.slice(0, 4).map(function (ticket) {
          return el('li', { class: 'mini-row' }, [
            el('span', { class: 'mini-label', text: ticket.subject }),
            UI.badge(ticket.priority === 'high' ? 'عالية' : 'عادية', {
              tone: ticket.priority === 'high' ? 'warn' : 'muted'
            })
          ]);
        }))
      });
    },

    'wallet-movements': function (definition) {
      var rows = (activeSnapshot && activeSnapshot.walletTransactions) || [];
      if (rows.length === 0) {
        return UI.widgetCard({
          title: definition.title,
          footer: state.selected === null ? 'اختر مزوداً لعرض حركاته' : 'لا حركات',
          body: UI.metricValue(null)
        });
      }
      var TYPE_LABELS = {
        recharge: 'شحن', renewal: 'تجديد', activation: 'تفعيل',
        package_change: 'تغيير باقة', refund: 'إرجاع', adjustment: 'تسوية',
        commission: 'عمولة', fee: 'رسوم', unknown: 'غير معروف'
      };
      return UI.widgetCard({
        title: definition.title,
        footer: [UI.originNote('provider')],
        body: el('ul', { class: 'mini-list' }, rows.slice(0, 5).map(function (tx) {
          return el('li', { class: 'mini-row' }, [
            el('span', { class: 'mini-label' }, [
              (TYPE_LABELS[tx.type] || tx.type) + ' · ',
              D.dateTimeLabel(tx.createdAt)
            ]),
            el('span', {
              style: { color: tx.direction === 'debit' ? 'var(--danger)' : 'var(--ok)' }
            }, [tx.direction === 'debit' ? '−' : '+', UI.currencyValue(tx.amount, 'sm')])
          ]);
        }))
      });
    },

    'daily-revenue': function (definition) { return ledgerWidget(definition, false); },
    'provider-cost': function (definition) { return ledgerWidget(definition, false); },
    'profit': function (definition) { return ledgerWidget(definition, true); },

    'recent-renewals': function (definition) {
      // مملوكة لدفاتر ياقوت: هذه النسخة بلا خادم ولا قاعدة بيانات، فتقول ذلك.
      return UI.widgetCard({
        title: definition.title,
        footer: [UI.originNote('erp'), el('span', { text: ' — يتطلب اتصالاً بدفاتر ياقوت' })],
        body: UI.metricValue(null)
      });
    }
  };

  /**
   * ودجات الدفاتر تقرأ من دفتر ياقوت (RPC اسمه isp_dashboard) في الإنتاج.
   * بلا اتصال بالدفاتر تُعرض "غير متاح" لا صفراً — الصفر يُقرأ "لا مبيعات
   * اليوم" وهو كذبة مختلفة تماماً.
   */
  function ledgerWidget(definition, isProfit) {
    return UI.widgetCard({
      title: definition.title,
      footer: [UI.originNote('erp'), el('span', { text: ' — يتطلب اتصالاً بدفاتر ياقوت' })],
      // الربح بكلفة مجهولة = إيرادٌ بعنوان خاطئ؛ profit() تعيد null فيُعرض «—».
      body: UI.currencyValue(isProfit ? Money.profit(Money.money(0, 'IQD'), null) : null, 'lg')
    });
  }

  var grid = el('div', { class: 'widget-grid' }, widgets.map(function (resolved) {
    var definition = resolved.definition;
    var span = Widgets.WIDGET_SPAN[definition.size];

    if (!resolved.enabled) {
      var missing = resolved.gate.missing[0];
      return el('div', { class: span }, UI.unsupportedCapabilityCard(
        definition.title,
        missing
          ? CapabilityKeys.CAPABILITY_META[missing].unsupportedHint
          : (resolved.gate.reason || 'غير مدعوم.')
      ));
    }

    var renderer = renderers[definition.widgetId];
    var card = renderer
      ? renderer(definition)
      : UI.widgetCard({
        title: definition.title, footer: definition.description, body: UI.metricValue(null)
      });
    return el('div', { class: span }, card);
  }));

  D.replace(host, [
    el('h1', { class: 'page-title', text: 'لوحة وحدة الإنترنت' }),
    el('p', {
      class: 'page-sub',
      text: active
        ? active.provider.displayName + ' — ' + D.num(widgets.length) + ' ودجة ظاهرة بحسب القدرات المعلنة'
        : 'عرض مجمَّع لكل المزودين المتصلين — الأرقام تُقيَّد بتغطية كل مقياس'
    }),
    grid
  ]);
};

/* --------------------------------------------------------------------------
   سجل المشتركين (app/isp/subscribers/page.tsx)
   مجموعة الأعمدة مشتقّة من قدرات المزود لا مكتوبة يدوياً: مزودٌ بلا مراقبة
   جلسات ليس لديه عمود IP إطلاقاً، ومزودٌ قديم لا يعيد بيانات اتصال ليس لديه
   عمود هاتف.
   -------------------------------------------------------------------------- */
Views.subscribers = (function () {
  var el = D.el;

  var view = {
    text: '',
    status: '',
    technology: '',
    rows: [],
    total: null,
    loading: false,
    error: null,
    selectedId: null,
    debounce: null,
    requestSeq: 0
  };

  function columnsFor(capabilities, hasTower, hasSession) {
    var columns = [
      { key: 'name', label: 'الاسم', render: function (s) { return s.fullName; } },
      { key: 'external', label: 'رقم المشترك', render: function (s) { return UI.ltr(s.externalSubscriberId); } },
      { key: 'status', label: 'الحالة', render: function (s) { return UI.statusBadge(s.status); } }
    ];

    // اسم المستخدم موجود فقط حيث يُنمذجه المزود.
    if (Resolver.canPerform(capabilities, 'pppoe') || Resolver.canPerform(capabilities, 'ftth')) {
      columns.push({
        key: 'username', label: 'اسم المستخدم',
        render: function (s) { return UI.ltr(s.username); }
      });
    }

    columns.push({
      key: 'technology', label: 'التقنية',
      render: function (s) { return UI.ltr(s.technology ? s.technology.toUpperCase() : null); }
    });

    // بيانات الاتصال غائبة عن الواجهات القديمة — فلا عمود فارغ حينها.
    columns.push({
      key: 'phone', label: 'الهاتف',
      render: function (s) { return UI.ltr(s.phoneNumber); }
    });

    if (hasTower) {
      columns.push({ key: 'tower', label: 'البرج', render: function (s) { return UI.ltr(s.towerId); } });
    }
    // عمود الاتصال المباشر لا يُرسم إلا حيث يبلّغ المزود عن الجلسات (§19).
    if (hasSession) {
      columns.push({
        key: 'online', label: 'الاتصال',
        render: function (s) {
          var net = view.sessions ? view.sessions[s.externalSubscriberId] : null;
          if (!net) return UI.ltr(null);
          return UI.badge(net.online ? 'متصل' : 'غير متصل', {
            tone: net.online ? 'ok' : 'muted', dot: true, pulse: net.online
          });
        }
      });
    }
    return columns;
  }

  async function load(host) {
    var active = Store.active();
    if (!active) { view.rows = []; view.total = null; return; }

    var seq = view.requestSeq += 1;
    view.loading = true;
    view.error = null;
    paint(host);

    try {
      var query = { limit: 50 };
      if (view.text.trim()) query.text = view.text.trim();
      if (view.status) query.status = view.status;
      if (view.technology) query.technology = view.technology;

      var result = await ProviderService.searchSubscribers(active.provider.id, query);
      if (seq !== view.requestSeq) return;  // وصل ردٌّ أقدم بعد أحدث منه

      if (!result) {
        view.error = 'انتهت جلسة المزود.';
        view.rows = [];
      } else {
        view.rows = result.items;
        view.total = result.total;

        // حالة الاتصال تُجلب فقط حين يبلّغ عنها المزود.
        view.sessions = null;
        if (Resolver.canPerform(active.capabilities, 'sessionMonitoring')) {
          var map = {};
          for (var i = 0; i < result.items.length; i += 1) {
            var netResult = await ProviderService.runOperation(
              active.provider.id, 'sessionMonitoring', 'getCurrentSession',
              [result.items[i].externalSubscriberId]
            );
            if (Result.isSuccess(netResult)) map[result.items[i].externalSubscriberId] = netResult.data;
          }
          if (seq !== view.requestSeq) return;
          view.sessions = map;
        }
      }
    } catch (error) {
      view.error = Errors.operatorMessage('PROVIDER_UNAVAILABLE');
      view.rows = [];
    } finally {
      if (seq === view.requestSeq) {
        view.loading = false;
        paint(host);
      }
    }
  }

  function filtersBar(host) {
    var active = Store.active();
    var capabilities = active ? active.capabilities : {};

    var search = el('input', {
      id: 'sub-search', type: 'search', class: 'input',
      placeholder: 'ابحث بالاسم أو الرقم أو اسم المستخدم…',
      value: view.text,
      oninput: function (event) {
        view.text = event.target.value;
        // تهدئة حتى لا تُقصف واجهة المزود مع كل ضغطة مفتاح.
        clearTimeout(view.debounce);
        view.debounce = setTimeout(function () { load(host); }, 250);
      }
    });

    var statusSelect = el('select', {
      id: 'sub-status', class: 'select control-sm', value: view.status,
      onchange: function (event) { view.status = event.target.value; load(host); }
    }, [
      el('option', { value: '', selected: view.status === '' }, 'كل الحالات'),
      Types.SUBSCRIBER_STATUSES.map(function (s) {
        return el('option', { value: s, selected: view.status === s }, Types.SUBSCRIBER_STATUS_LABELS[s]);
      })
    ]);

    var techSelect = el('select', {
      id: 'sub-tech', class: 'select control-sm',
      onchange: function (event) { view.technology = event.target.value; load(host); }
    }, [
      el('option', { value: '', selected: view.technology === '' }, 'كل التقنيات'),
      // التقنيات المعروضة هي ما يعلنه المزود، لا قائمة ثابتة.
      Types.TECHNOLOGIES.filter(function (t) { return Resolver.canPerform(capabilities, t); })
        .map(function (t) {
          return el('option', { value: t, selected: view.technology === t }, t.toUpperCase());
        })
    ]);

    return UI.glass('filters', [
      el('label', { class: 'sr-only', for: 'sub-search' }, 'بحث'),
      el('div', { class: 'grow' }, search),
      el('label', { class: 'sr-only', for: 'sub-status' }, 'الحالة'),
      statusSelect,
      el('label', { class: 'sr-only', for: 'sub-tech' }, 'التقنية'),
      techSelect
    ]);
  }

  function table(host) {
    var active = Store.active();
    var hasTower = view.rows.some(function (r) { return r.towerId !== null; });
    var hasSession = !!(active && Resolver.canPerform(active.capabilities, 'sessionMonitoring'));
    var columns = columnsFor(active ? active.capabilities : {}, hasTower, hasSession);

    if (view.error) {
      return UI.glass('', UI.errorState(view.error, function () { load(host); }), 'flat');
    }
    if (view.loading) {
      return UI.glass('', el('div', { style: { padding: '16px' } },
        Array.from({ length: 6 }, function () {
          return el('div', { class: 'shimmer', style: { height: '36px', marginBottom: '8px' } });
        })), 'flat');
    }
    if (view.rows.length === 0) {
      return UI.glass('', UI.emptyState('لا توجد نتائج مطابقة', 'جرّب تعديل البحث أو الفلاتر.'), 'flat');
    }

    return UI.glass('table-wrap thin-scroll', el('table', { class: 'table' }, [
      el('thead', {}, el('tr', {}, columns.map(function (column) {
        return el('th', { scope: 'col', text: column.label });
      }))),
      el('tbody', {}, view.rows.map(function (subscriber) {
        return el('tr', {
          class: view.selectedId === subscriber.externalSubscriberId ? 'is-selected' : null
        }, columns.map(function (column, index) {
          // العمود الأول يحمل الزر: صفٌّ كامل قابل للنقر لا يُعلن نفسه
          // لقارئ الشاشة، وزرٌّ صريح يفعل.
          if (index === 0) {
            return el('td', {}, el('button', {
              class: 'row-button', type: 'button',
              onclick: function () {
                view.selectedId = subscriber.externalSubscriberId;
                Drawer.open(subscriber.externalSubscriberId, function () { load(host); });
                paint(host);
              }
            }, subscriber.fullName));
          }
          return el('td', {}, column.render(subscriber));
        }));
      }))
    ]), 'flat');
  }

  function paint(host) {
    var active = Store.active();

    if (Store.state.loading) {
      D.replace(host, el('p', { class: 'page-sub', text: 'جارٍ التحميل…' }));
      return;
    }
    if (Store.state.selected === null) {
      D.replace(host, UI.glass('', UI.emptyState(
        'اختر مزوداً',
        'سجل المشتركين خاص بكل مزود — اختر مزوداً من الشريط أعلاه.'
      )));
      return;
    }
    if (active && !Resolver.canPerform(active.capabilities, 'subscriberManagement')) {
      D.replace(host, UI.glass('', UI.emptyState(
        'سجل المشتركين غير متاح',
        CapabilityKeys.CAPABILITY_META.subscriberManagement.unsupportedHint
      )));
      return;
    }

    D.replace(host, [
      el('h1', { class: 'page-title', text: 'المشتركون' }),
      el('p', {
        class: 'page-sub',
        text: (view.total === null ? '' : D.num(view.total) + ' مشترك')
          + ((active && active.readOnly) ? ' — هذا المزود للقراءة فقط' : '')
      }),
      filtersBar(host),
      table(host)
    ]);
  }

  return function (host) {
    paint(host);
    var active = Store.active();
    if (active && Resolver.canPerform(active.capabilities, 'subscriberManagement')) {
      if (view.rows.length === 0 && !view.loading) load(host);
    } else {
      view.rows = [];
      view.total = null;
    }
  };
})();

/* --------------------------------------------------------------------------
   لوحة ملف المشترك — إضافة على نسخة Next (كانت فيها مُهيّأة في طبقتَي المجال
   وSQL بلا واجهة). كل زر فيها مشروط بقدرة، وكل عملية تمرّ عبر
   ProviderService.runOperation الذي يعيد فحص القدرة قبل الاستدعاء.
   هنا يظهر عملياً ما تحميه المواصفة: مفتاح حماية من التكرار واحد لكل نيّة،
   ونتيجة غامضة تصير مطابقةً لا فشلاً يُعاد.
   -------------------------------------------------------------------------- */
var Drawer = (function () {
  var el = D.el;
  var host = null;
  var scrim = null;
  var lastFocused = null;

  function close() {
    document.removeEventListener('keydown', onKeydown, true);
    if (host && host.parentNode) host.parentNode.removeChild(host);
    if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
    host = null;
    scrim = null;
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  }

  function onKeydown(event) {
    if (event.key === 'Escape') { event.stopPropagation(); close(); }
  }

  function kv(term, value) {
    return [el('dt', { text: term }), el('dd', {}, value)];
  }

  function open(externalSubscriberId, onChanged) {
    var active = Store.active();
    if (!active) return;

    close();
    lastFocused = document.activeElement;

    scrim = el('div', { class: 'drawer-scrim', onclick: close });
    host = el('aside', {
      class: 'glass drawer',
      role: 'dialog', 'aria-modal': 'true', 'aria-label': 'ملف المشترك'
    }, el('div', { class: 'shimmer', style: { height: '160px' } }));

    document.body.appendChild(scrim);
    document.body.appendChild(host);
    document.addEventListener('keydown', onKeydown, true);

    ProviderService.subscriberDetail(active.provider.id, externalSubscriberId)
      .then(function (detail) {
        if (!host) return;
        if (!detail || !detail.subscriber) {
          D.replace(host, UI.errorState(Errors.operatorMessage('NOT_FOUND'), close));
          return;
        }
        render(detail, onChanged, null);
      });
  }

  /**
   * @param notice نتيجة آخر عملية. تُمرَّر عبر إعادة الرسم عمداً: بعد نجاح
   *        عملية يُعاد تحميل الملف كاملاً، ولولا ذلك لمُحيت رسالة النتيجة
   *        في اللحظة نفسها التي تظهر فيها.
   */
  function render(detail, onChanged, notice) {
    var active = Store.active();
    var capabilities = detail.capabilities;
    var subscriber = detail.subscriber;
    var subscription = detail.subscription;
    var net = detail.session;
    var can = function (key) { return Resolver.canPerform(capabilities, key); };

    var freshness = Freshness.classifyFreshness(subscriber.sync);
    var days = subscription ? Renewal.daysUntil(subscription.expiresAt) : null;

    var TONE_COLOR = { ok: 'var(--ok)', warn: 'var(--warn)', danger: 'var(--danger)' };

    function noticeNodes(value) {
      if (!value) return null;
      return [
        el('p', { style: { color: TONE_COLOR[value.tone] || 'var(--text)' }, text: value.text }),
        value.note ? el('p', { class: 'field-help', text: value.note }) : null,
        value.reference
          ? el('p', { class: 'field-help' }, ['المرجع: ', UI.ltr(value.reference)])
          : null
      ];
    }

    var feedback = el('div', { style: { marginTop: '12px' } }, noticeNodes(notice));

    /**
     * تنفيذ عملية وعرض نتيجتها.
     * @param idempotencyKey يُولَّد مرة واحدة لكل نيّة ويُعاد استخدامه عند
     *        إعادة المحاولة، فيعيد المحوّل النتيجة الأولى بدل خصمٍ ثانٍ.
     */
    async function run(label, capability, method, args, options) {
      var o = options || {};
      D.replace(feedback, el('p', { class: 'field-help', text: 'جارٍ التنفيذ…' }));

      var result = await ProviderService.runOperation(
        active.provider.id, capability, method, args
      );

      if (Result.isSuccess(result)) {
        if (onChanged) onChanged();
        Store.loadSnapshots();
        // يُعاد تحميل الملف حتى تعكس البطاقة الحالة الجديدة لا القديمة، وتُحمل
        // رسالة النتيجة معها فلا تُمحى بإعادة الرسم.
        var refreshed = await ProviderService.subscriberDetail(
          active.provider.id, subscriber.externalSubscriberId);
        var done = { tone: 'ok', text: o.successText || (label + ' — تم') };
        if (host && refreshed && refreshed.subscriber) render(refreshed, onChanged, done);
        else D.replace(feedback, noticeNodes(done));
        return;
      }

      if (result.state === 'REQUIRES_RECONCILIATION') {
        // §25: نتيجة غامضة لا تصير فشلاً عادياً — قد يكون المزود نفّذها وخصم.
        ReconciliationQueue.record({
          operation: label,
          subscriber: subscriber.externalSubscriberId,
          providerId: active.provider.id
        }, result);
        Store.emit();
        D.replace(feedback, noticeNodes({
          tone: 'warn',
          text: result.message,
          note: result.reconciliation ? result.reconciliation.note : null,
          reference: result.reconciliation ? result.reconciliation.externalReference : null
        }));
        return;
      }

      D.replace(feedback, noticeNodes({ tone: 'danger', text: result.message }));
    }

    // --- قسم التجديد ---------------------------------------------------------
    function renewalSection() {
      if (!can('renewal') || detail.packages.length === 0) return null;

      var planBox = el('div', { class: 'field-help', style: { marginTop: '8px' } });
      var packageSelect = el('select', { class: 'select control-sm', 'aria-label': 'الباقة' },
        detail.packages.map(function (p) {
          return el('option', {
            value: p.externalPackageId,
            selected: detail.currentPackage && detail.currentPackage.id === p.id
          }, p.displayName);
        }));

      // مفتاح واحد لكل نيّة تجديد: تغيير الباقة نيّة جديدة، وإعادة الضغط
      // على "تنفيذ" ليست كذلك.
      var intent = { key: null, packageId: null };

      var planButton = el('button', {
        class: 'btn btn--sm', type: 'button',
        onclick: async function () {
          var packageId = packageSelect.value;
          var result = await ProviderService.runOperation(
            active.provider.id, 'renewal', 'planRenewal',
            [{ subscriberId: subscriber.externalSubscriberId, packageId: packageId,
               idempotencyKey: 'plan' }]
          );
          if (!Result.isSuccess(result)) {
            D.replace(planBox, el('span', { style: { color: 'var(--danger)' }, text: result.message }));
            return;
          }
          var plan = result.data;
          intent.key = ProviderService.newIdempotencyKey();
          intent.packageId = packageId;

          D.replace(planBox, [
            el('div', {}, [
              'السعر: ', UI.currencyValue(plan.price, 'sm'),
              el('span', { text: ' · ' }),
              'الكلفة: ', UI.currencyValue(plan.cost.value, 'sm'),
              el('span', { text: ' ' }), UI.originNote(plan.cost.origin)
            ]),
            el('div', { style: { marginTop: '4px' } }, [
              'الانتهاء الجديد: ',
              // مزودٌ لا يعيد التاريخ يُقال عنه ذلك، ولا يُخترع له تاريخ.
              plan.newExpiry ? D.dateLabel(plan.newExpiry) : 'يحدده المزود'
            ]),
            el('div', { style: { marginTop: '4px' } }, [
              UI.badge(Renewal.RENEWAL_SEMANTICS_LABELS[plan.semantics] || plan.semantics,
                { tone: 'info' })
            ]),
            el('p', { style: { marginTop: '4px' }, text: plan.explanation })
          ]);
          executeButton.disabled = false;
        }
      }, 'احسب خطة التجديد');

      var executeButton = el('button', {
        class: 'btn btn--sm', type: 'button', disabled: true,
        onclick: function () {
          run('التجديد', 'renewal', 'renewSubscription', [{
            subscriberId: subscriber.externalSubscriberId,
            packageId: intent.packageId,
            idempotencyKey: intent.key
          }], { successText: 'نُفِّذ التجديد' });
        }
      }, 'نفّذ التجديد');

      return el('div', {}, [
        el('h3', { class: 'section-head', text: 'التجديد' }),
        el('div', { class: 'btn-row' }, [packageSelect, planButton, executeButton]),
        planBox
      ]);
    }

    // --- بقية العمليات، كلٌّ خلف قدرته --------------------------------------
    function actionButtons() {
      var buttons = [];

      if (can('activation') && subscription && subscription.status === 'pending') {
        buttons.push(el('button', {
          class: 'btn btn--sm', type: 'button',
          onclick: function () {
            run('التفعيل', 'activation', 'activateSubscription', [{
              subscriberId: subscriber.externalSubscriberId,
              packageId: detail.currentPackage ? detail.currentPackage.externalPackageId : '',
              idempotencyKey: ProviderService.newIdempotencyKey()
            }]);
          }
        }, 'تفعيل'));
      }

      if (can('suspend') && subscriber.status !== 'suspended') {
        buttons.push(el('button', {
          class: 'btn btn--sm', type: 'button',
          onclick: function () {
            run('الإيقاف المؤقت', 'suspend', 'suspendSubscriber', [subscriber.externalSubscriberId]);
          }
        }, 'إيقاف مؤقت'));
      }

      if (can('resume') && subscriber.status === 'suspended') {
        buttons.push(el('button', {
          class: 'btn btn--sm', type: 'button',
          onclick: function () {
            run('إعادة التشغيل', 'resume', 'resumeSubscriber', [subscriber.externalSubscriberId]);
          }
        }, 'إعادة تشغيل'));
      }

      if (can('disconnectSession') && net && net.online) {
        buttons.push(el('button', {
          class: 'btn btn--sm', type: 'button',
          onclick: function () {
            run('قطع الجلسة', 'disconnectSession', 'disconnectSession',
              [subscriber.externalSubscriberId, ProviderService.newIdempotencyKey()]);
          }
        }, 'قطع الجلسة'));
      }

      if (can('macReset')) {
        buttons.push(el('button', {
          class: 'btn btn--sm', type: 'button',
          onclick: function () {
            run('تصفير MAC', 'macReset', 'resetMac',
              [subscriber.externalSubscriberId, ProviderService.newIdempotencyKey()]);
          }
        }, 'تصفير MAC'));
      }

      if (buttons.length === 0) return null;
      return el('div', {}, [
        el('h3', { class: 'section-head', text: 'العمليات المتاحة لدى هذا المزود' }),
        el('div', { class: 'btn-row' }, buttons)
      ]);
    }

    function networkSection() {
      // لا يُرسم القسم أصلاً حين لا يبلّغ المزود عن الجلسات — لا صندوق فارغ.
      if (!can('sessionMonitoring')) return null;
      if (!net) {
        return el('div', {}, [
          el('h3', { class: 'section-head', text: 'الجلسة الحالية' }),
          el('p', { class: 'field-help', text: 'لا توجد جلسة مسجَّلة لهذا المشترك.' })
        ]);
      }
      return el('div', {}, [
        el('h3', { class: 'section-head', text: 'الجلسة الحالية' }),
        el('dl', { class: 'kv' }, [
          kv('الحالة', UI.badge(net.online ? 'متصل' : 'غير متصل', {
            tone: net.online ? 'ok' : 'muted', dot: true, pulse: net.online
          })),
          // عنوان IP يُعرض فقط حيث يُصنَّف؛ publicIp قدرة مستقلة.
          can('publicIp') ? kv('العنوان', UI.ltr(net.ipAddress)) : [],
          kv('MAC', UI.ltr(net.macAddress)),
          kv('مدة الاتصال', el('span', { text: D.uptimeLabel(net.uptimeSeconds) })),
          kv('تنزيل / رفع', el('span', {
            text: D.bytesLabel(net.bytesIn) + ' / ' + D.bytesLabel(net.bytesOut)
          })),
          net.vlan ? kv('VLAN', UI.ltr(net.vlan)) : [],
          // بيانات الإشارة للشبكات اللاسلكية فقط.
          (can('signalData') && net.signal)
            ? kv('الإشارة', UI.ltr('RSSI ' + net.signal.rssi + ' dBm · SNR ' + net.signal.snr + ' dB'))
            : [],
          (!net.online && net.terminateCause) ? kv('سبب الانقطاع', UI.ltr(net.terminateCause)) : []
        ])
      ]);
    }

    D.replace(host, [
      el('div', { class: 'detail-head' }, [
        el('div', {}, [
          el('h2', { text: subscriber.fullName }),
          el('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '6px' } }, [
            UI.statusBadge(subscriber.status),
            UI.syncStatus(freshness)
          ])
        ]),
        el('button', { class: 'icon-close', type: 'button', 'aria-label': 'إغلاق', onclick: close }, '✕')
      ]),

      el('dl', { class: 'kv' }, [
        kv('رقم المشترك', UI.ltr(subscriber.externalSubscriberId)),
        kv('اسم المستخدم', UI.ltr(subscriber.username)),
        kv('التقنية', UI.ltr(subscriber.technology ? subscriber.technology.toUpperCase() : null)),
        subscriber.phoneNumber ? kv('الهاتف', UI.ltr(subscriber.phoneNumber)) : [],
        subscriber.address ? kv('العنوان', el('span', { text: subscriber.address })) : [],
        subscriber.governorate ? kv('المحافظة', el('span', { text: subscriber.governorate })) : [],
        subscriber.towerId ? kv('البرج', UI.ltr(subscriber.towerId)) : [],
        subscriber.networkNodeId ? kv('عقدة الشبكة', UI.ltr(subscriber.networkNodeId)) : []
      ]),

      subscription ? el('div', {}, [
        el('h3', { class: 'section-head', text: 'الاشتراك' }),
        el('dl', { class: 'kv' }, [
          kv('الحالة', el('span', {
            text: Types.SUBSCRIPTION_STATUS_LABELS[subscription.status] || subscription.status
          })),
          kv('الباقة', el('span', {
            text: detail.currentPackage ? detail.currentPackage.displayName : '—'
          })),
          // السرعات تظهر فقط حين ينشرها المزود؛ الواجهة القديمة لا تنشرها.
          (detail.currentPackage && detail.currentPackage.downloadSpeed !== null)
            ? kv('السرعة', UI.ltr(detail.currentPackage.downloadSpeed + '/' +
              detail.currentPackage.uploadSpeed + ' Mbps'))
            : [],
          detail.currentPackage ? kv('السعر', UI.currencyValue(detail.currentPackage.retailPrice, 'sm')) : [],
          detail.currentPackage ? kv('الكلفة', el('span', {}, [
            UI.currencyValue(detail.currentPackage.wholesalePrice.value, 'sm'),
            el('span', { text: ' ' }),
            UI.originNote(detail.currentPackage.wholesalePrice.origin)
          ])) : [],
          kv('ينتهي في', el('span', {}, [
            D.dateLabel(subscription.expiresAt),
            days === null ? null : el('span', {
              class: 'field-help',
              text: days >= 0 ? ' (بعد ' + days + ' يوم)' : ' (منتهٍ منذ ' + Math.abs(days) + ' يوم)'
            })
          ]))
        ])
      ]) : null,

      networkSection(),
      renewalSection(),
      actionButtons(),
      feedback
    ]);
  }

  return { open: open, close: close };
})();

/* --------------------------------------------------------------------------
   مصفوفة قدرات المزودين (app/isp/capabilities/page.tsx)
   عرض المدير لما يعلنه كل مزود متصل بالضبط. الضغط على أي خانة يكشف ملاحظة
   المحوّل والدوال التي تقف خلف القدرة — فـ"غير مدعوم" قابلة للتفسير دائماً.
   -------------------------------------------------------------------------- */
Views.capabilities = (function () {
  var el = D.el;
  var GROUPS = ['subscribers', 'financial', 'network', 'provisioning', 'notifications', 'technology'];
  var selectedCell = null;

  function detailPanel(providers, host) {
    if (!selectedCell) return null;
    var provider = providers.find(function (p) { return p.provider.id === selectedCell.providerId; });
    if (!provider) return null;

    var capability = selectedCell.capability;
    var declaration = Resolver.declarationOf(provider.capabilities, capability);
    var methods = Contract.methodsFor(capability);

    return UI.glass('detail', [
      el('div', { class: 'detail-head' }, [
        el('div', {}, [
          el('h2', { text: CapabilityKeys.CAPABILITY_META[capability].label }),
          el('p', { class: 'page-sub', style: { marginBottom: '0' }, text: provider.provider.displayName })
        ]),
        el('button', {
          class: 'icon-close', type: 'button', 'aria-label': 'إغلاق التفاصيل',
          onclick: function () { selectedCell = null; paint(host); }
        }, '✕')
      ]),
      el('dl', { class: 'detail-grid' }, [
        el('div', {}, [
          el('dt', { class: 'detail-term', text: 'الحالة المعلنة' }),
          el('dd', { class: 'detail-desc' },
            UI.capabilityBadge(capability, declaration.state, declaration.note))
        ]),
        el('div', {}, [
          el('dt', { class: 'detail-term', text: 'دوال المحوّل المرتبطة' }),
          el('dd', { class: 'detail-desc ltr', dir: 'ltr' },
            methods.length > 0
              ? methods.map(function (m) { return m + '()'; }).join(', ')
              : '—')
        ]),
        el('div', { class: 'full' }, [
          el('dt', { class: 'detail-term', text: 'ملاحظة المحوّل' }),
          el('dd', {
            class: 'detail-desc',
            style: { color: 'var(--text-2)' },
            text: declaration.note || CapabilityKeys.CAPABILITY_META[capability].unsupportedHint
          })
        ]),
        (declaration.detail && Object.keys(declaration.detail).length > 0)
          ? el('div', { class: 'full' }, [
            el('dt', { class: 'detail-term', text: 'تفاصيل إضافية' }),
            el('dd', {}, el('pre', {
              class: 'code', text: JSON.stringify(declaration.detail, null, 2)
            }))
          ])
          : null
      ])
    ]);
  }

  function paint(host) {
    var providers = Store.state.providers;

    if (Store.state.loading) {
      D.replace(host, el('p', { class: 'page-sub', text: 'جارٍ التحميل…' }));
      return;
    }
    if (providers.length === 0) {
      D.replace(host, UI.glass('', UI.emptyState(
        'لا يوجد مزودون مُسجّلون',
        'سجّل محوّل مزود في قسم «إقلاع المحوّلات» ليظهر هنا.'
      )));
      return;
    }

    var table = el('table', { class: 'table' }, [
      el('thead', {}, el('tr', {}, [
        el('th', { class: 'matrix-key', scope: 'col' }, 'القدرة'),
        providers.map(function (p) {
          return el('th', { scope: 'col' }, UI.providerBadge(
            p.provider.displayName, p.provider.logoUrl, p.provider.accentColor));
        })
      ])),
      el('tbody', {}, GROUPS.map(function (group) {
        return [
          el('tr', { class: 'matrix-group' }, el('td', {
            colspan: providers.length + 1,
            text: CapabilityKeys.CAPABILITY_GROUP_LABELS[group]
          })),
          CapabilityKeys.capabilitiesInGroup(group).map(function (capability) {
            return el('tr', {}, [
              el('td', {
                class: 'matrix-key',
                text: CapabilityKeys.CAPABILITY_META[capability].label
              }),
              providers.map(function (p) {
                var declaration = Resolver.declarationOf(p.capabilities, capability);
                return el('td', {}, el('button', {
                  class: 'cell-button', type: 'button',
                  'aria-label': CapabilityKeys.CAPABILITY_META[capability].label + ' — ' +
                    p.provider.displayName,
                  onclick: function () {
                    selectedCell = { providerId: p.provider.id, capability: capability };
                    paint(host);
                  }
                }, UI.capabilityBadge(capability, declaration.state, declaration.note)));
              })
            ]);
          })
        ];
      }))
    ]);

    D.replace(host, [
      el('h1', { class: 'page-title', text: 'قدرات المزودين' }),
      el('p', {
        class: 'page-sub',
        text: 'ما يعلنه كل محوّل بعد اكتشاف الخدمات. اضغط أي خانة لعرض تفاصيلها. القدرات لا تظهر إلا بعد الاتصال بالمزود.'
      }),
      UI.glass('table-wrap thin-scroll', table, 'flat'),
      detailPanel(providers, host)
    ]);
  }

  return function (host) { paint(host); };
})();

/* ==========================================================================
   ٢٩ — الفحوصات داخل الصفحة
   نسخة Next تُشغّل ١٠٠ فحص وحدة عبر vitest. لا vitest هنا ولا خطوة بناء،
   لكن الخصائص التي تحميها تلك الفحوصات هي جوهر المحرك — فبقيت، تعمل في
   المتصفح نفسه على الكود نفسه الذي يُشغّل الواجهة.
   افتح «الفحوصات» من الشريط العلوي، أو #/checks مباشرة.
   ========================================================================== */
var Checks = (function () {
  var NOW = new Date('2026-06-15T10:00:00.000Z');

  function eq(a, b) { return a === b; }
  function sameList(a, b) {
    return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
  }
  function throws(fn, pattern) {
    try { fn(); } catch (error) {
      return pattern ? pattern.test(String(error && error.message)) : true;
    }
    return false;
  }

  function suite(title, cases) { return { title: title, cases: cases }; }

  /** كل حالة: [الاسم، دالة تعيد true أو نصَّ سبب الفشل]. */
  function make(name, fn) { return { name: name, fn: fn }; }

  // -------------------------------------------------------------------------
  function moneySuite() {
    return suite('النقود — لا حساب مالي عبر عدد عشري', [
      make('يدور الدينار (بلا وحدة صغرى) ذهاباً وإياباً', function () {
        var v = Money.fromMajor(25000, 'IQD');
        return v.amount === 25000 && Money.toMajor(v) === 25000;
      }),
      make('يدور الدولار بخانتين بلا انزلاق عشري', function () {
        var v = Money.fromMajor('25.50', 'USD');
        return v.amount === 2550 && Money.toMajor(v) === 25.5;
      }),
      make('يجمع ويطرح بالوحدات الصغرى', function () {
        return Money.add(Money.money(1000, 'IQD'), Money.money(500, 'IQD')).amount === 1500
          && Money.subtract(Money.money(1000, 'IQD'), Money.money(1500, 'IQD')).amount === -500;
      }),
      make('يرفض خلط العملات بدل الدمج الصامت', function () {
        return throws(function () {
          Money.add(Money.money(1000, 'IQD'), Money.money(10, 'USD'));
        }, /Currency mismatch/);
      }),
      make('يرفض مبلغاً غير منتهٍ', function () {
        return throws(function () { Money.money(Number.NaN, 'IQD'); })
          && throws(function () { Money.fromMajor('abc', 'IQD'); });
      }),
      make('يعرض النقود LTR بأرقام لاتينية', function () {
        var formatted = Money.formatMoney(Money.money(1750000, 'IQD'));
        return formatted.indexOf('IQD') !== -1 && /1[,.]750[,.]000/.test(formatted);
      }),
      make('الربح null حين تكون الكلفة مجهولة', function () {

  async function contractCases() {
    var cases = [];

    MockProfiles.MOCK_PROFILES.forEach(function (profile) {
      cases.push(make('mock/' + profile + ' يحقق العقد', async function () {
        var adapter = MockAdapter.createMockAdapter({ profile: profile });
        var capabilities = await adapter.getCapabilities(null);
        var violations = Contract.validateAdapter(adapter, capabilities);
        return violations.length === 0 || violations[0].message;
      }));
    });

    MockProfiles.MOCK_PROFILES.forEach(function (profile) {
      cases.push(make('mock/' + profile + ' ينفّذ ما يعلنه بالضبط', async function () {
        var adapter = MockAdapter.createMockAdapter({ profile: profile });
        var capabilities = await adapter.getCapabilities(null);
        for (var i = 0; i < CapabilityKeys.CAPABILITY_KEYS.length; i += 1) {
          var capability = CapabilityKeys.CAPABILITY_KEYS[i];
          var methods = Contract.methodsFor(capability);
          if (methods.length === 0) continue;
          if (!Resolver.canPerform(capabilities, capability)) continue;
          for (var m = 0; m < methods.length; m += 1) {
            if (!Contract.implementsMethod(adapter, methods[m])) {
              return profile + ' يعلن ' + capability + ' وينقصه ' + methods[m] + '()';
            }
          }
        }
        return true;
      }));
    });

    cases.push(make('المزود الأساسي لا يملك دوال جلسات ولا محفظة إطلاقاً', function () {
      // ليست "تعيد غير مدعوم" — الدالة غير موجودة، فلا تستطيع الواجهة استدعاءها سهواً.
      var adapter = MockAdapter.createMockAdapter({ profile: 'basic' });
      return adapter.getCurrentSession === undefined
        && adapter.getWalletBalance === undefined
        && adapter.disconnectSession === undefined
        && typeof adapter.searchSubscribers === 'function';
    }));

    cases.push(make('مزود القراءة فقط لا يكشف أي دالة تغيير', function () {
      var adapter = MockAdapter.createMockAdapter({ profile: 'readonly' });
      return adapter.renewSubscription === undefined
        && adapter.changePackage === undefined
        && adapter.createSubscriber === undefined
        && adapter.disconnectSession === undefined
        && adapter.resetMac === undefined
        // …والقراءة تعمل.
        && typeof adapter.searchSubscribers === 'function'
        && typeof adapter.getWalletBalance === 'function';
    }));

    cases.push(make('كل محوّل ينفّذ الدوال المطلوبة كلها', function () {
      var adapters = [
        MockAdapter.createMockAdapter(),
        EarthlinkAdapter.createEarthlinkAdapter()
      ];
      return adapters.every(function (adapter) {
        return Contract.REQUIRED_ADAPTER_METHODS.every(function (method) {
          return typeof adapter[method] === 'function';
        });
      });
    }));

    cases.push(make('محوّل Earthlink حدٌّ صادق وخامل', async function () {
      // لا وثائق رسمية ⇒ لا يدّعي شيئاً ولا يمنح شيئاً (§1، §38).
      var adapter = EarthlinkAdapter.createEarthlinkAdapter();
      var capabilities = await adapter.getCapabilities(null);
      var grantsNothing = CapabilityKeys.CAPABILITY_KEYS.every(function (capability) {
        return Resolver.canPerform(capabilities, capability) === false;
      });
      var outcome = await adapter.authenticate({}, 'unconfigured');
      var profile = await adapter.getProviderProfile();
      return grantsNothing
        && outcome.state === 'ERROR'
        && profile.status === 'inactive'
        && Contract.validateAdapter(adapter, capabilities).length === 0;
    }));

    cases.push(make('يرصد قدرةً معلنة بلا دالة خلفها', function () {
      // محوّل غير صادق عمداً: يدّعي تغيير الباقة ولا ينفّذ شيئاً.
      var adapter = MockAdapter.createMockAdapter({ profile: 'basic' });
      var violations = Contract.validateAdapter(adapter, { packageChange: { state: 'supported' } });
      return violations.length > 0
        && violations[0].kind === 'capability_without_method'
        && violations[0].capability === 'packageChange';
    }));

    cases.push(make('قائمة الدوال الاختيارية بلا تكرار', function () {
      return new Set(Contract.OPTIONAL_ADAPTER_METHODS).size
        === Contract.OPTIONAL_ADAPTER_METHODS.length;
    }));

    return suite('عقد المحوّل — لا زر بلا دالة خلفه', cases);
  }

          && Result.isSuccess(byText)
          && byText.data.items.length === 1
          && byText.data.items[0].externalSubscriberId === 'SUB-01005';
      }),
      make('نفس مفتاح الحماية من التكرار لا يخصم مرتين', async function () {
        // §21/§34: إعادة الطلب بالمفتاح نفسه تعيد النتيجة الأولى حرفياً.
        var c = await connect({ profile: 'full', seed: 4242 });
        var before = await c.adapter.getWalletBalance(c.session);
        var key = 'fixed-idempotency-key-1';
        var request = { subscriberId: 'SUB-01001', packageId: 'P-8M-30', idempotencyKey: key };

        var first = await c.adapter.renewSubscription(c.session, request);
        var second = await c.adapter.renewSubscription(c.session, request);
        var after = await c.adapter.getWalletBalance(c.session);

        if (!Result.isSuccess(first) || !Result.isSuccess(second)) return 'فشل التجديد الأول';
        var debited = before.data.currentBalance.amount - after.data.currentBalance.amount;
        return first.data.expiresAt === second.data.expiresAt
          && first.diagnostics.requestId === second.diagnostics.requestId
          && debited === 31000;   // كلفة جملة واحدة لا اثنتين
      }),
      make('النتيجة الغامضة تصير مطابقةً لا فشلاً', async function () {
        // بحقن أعطال كامل، يجب أن تظهر REQUIRES_RECONCILIATION ولا ينجح شيء.
        var c = await connect({ profile: 'full', seed: 77, failureRate: 1 });
        var states = [];
        for (var i = 0; i < 24; i += 1) {
          var result = await c.adapter.createTestAccount(c.session, 3, 'amb-key-' + i);
          states.push(result.state);
        }
        var hasReconciliation = states.indexOf('REQUIRES_RECONCILIATION') !== -1;
        var noSuccess = states.indexOf('SUCCESS') === -1;
        return (hasReconciliation && noSuccess) || states.join(',');
      }),
      make('المزود القديم لا يخترع تاريخ انتهاء جديداً', async function () {
        var c = await connect({ profile: 'legacy' });
        var plan = await c.adapter.planRenewal(c.session, {
          subscriberId: 'SUB-01001', packageId: 'P-8M-30', idempotencyKey: 'plan'
        });
        return Result.isSuccess(plan)
          && plan.data.newExpiry === null
          && plan.data.explanation.indexOf('لا يُرجع') !== -1;
      }),
      make('المزود بلا سعر جملة يعلن مصدر الكلفة «غير متاح»', async function () {
        var c = await connect({ profile: 'basic' });
        var packages = await c.adapter.getPackages(c.session);
        return Result.isSuccess(packages)
          && packages.data.every(function (p) {
            return p.wholesalePrice.value === null && p.wholesalePrice.origin === 'unavailable';
          });
      }),
      make('المزود اللاسلكي وحده يعطي بيانات إشارة', async function () {
        var wireless = await connect({ profile: 'wireless' });
        var full = await connect({ profile: 'full' });
        var w = await wireless.adapter.getCurrentSession(wireless.session, 'SUB-01001');
        var f = await full.adapter.getCurrentSession(full.session, 'SUB-01001');
        return Result.isSuccess(w) && Result.isSuccess(f)
          && w.data.signal !== null && f.data.signal === null;
      })
    ]);
  }

  async function run() {
    var suites = [
      moneySuite(), renewalSuite(), capabilitySuite(), aggregationSuite(),
      widgetSuite(), freshnessSuite(), errorSuite(),
      await contractCases(), await mockSuite()
    ];

    var results = [];
    for (var s = 0; s < suites.length; s += 1) {
      var current = suites[s];
      var cases = [];
      for (var c = 0; c < current.cases.length; c += 1) {
        var entry = current.cases[c];
        var outcome;
        try {
          outcome = await entry.fn();
        } catch (error) {
          outcome = 'استثناء: ' + (error && error.message ? error.message : String(error));
        }
        cases.push({
          name: entry.name,
          pass: outcome === true,
          detail: outcome === true ? null : String(outcome)
        });
      }
      results.push({ title: current.title, cases: cases });
    }
    return results;
  }

  return { run: run };
})();

/* --------------------------------------------------------------------------
   شاشة الفحوصات
   -------------------------------------------------------------------------- */
Views.checks = (function () {
  var el = D.el;
  var cache = null;
  var running = false;

  function paint(host) {
    if (running) {
      D.replace(host, [
        el('h1', { class: 'page-title', text: 'الفحوصات' }),
        el('p', { class: 'page-sub', text: 'جارٍ تشغيل الفحوصات على الكود نفسه الذي يُشغّل الواجهة…' }),
        UI.glass('', el('div', { style: { padding: '16px' } },
          Array.from({ length: 8 }, function () {
            return el('div', { class: 'shimmer', style: { height: '20px', marginBottom: '8px' } });
          })), 'flat')
      ]);
      return;
    }

    if (!cache) { D.replace(host, el('p', { class: 'page-sub', text: 'جارٍ التحضير…' })); return; }

    var total = 0;
    var failed = 0;
    cache.forEach(function (suite) {
      suite.cases.forEach(function (c) {
        total += 1;
        if (!c.pass) failed += 1;
      });
    });

    D.replace(host, [
      el('h1', { class: 'page-title', text: 'الفحوصات' }),
      el('p', {
        class: 'page-sub',
        text: 'الخصائص التي تحميها فحوصات vitest في نسخة Next، مُشغَّلة هنا في المتصفح على الكود نفسه الذي يرسم الشاشات.'
      }),
      UI.glass('summary-row', [
        UI.badge(D.num(total - failed) + ' من ' + D.num(total) + ' فحص ناجح', {
          tone: failed === 0 ? 'ok' : 'danger', dot: true
        }),
        failed > 0 ? UI.badge(D.num(failed) + ' فشل', { tone: 'danger' }) : null,
        el('button', {
          class: 'btn btn--sm', type: 'button',
          onclick: function () { cache = null; start(host); }
        }, 'أعد التشغيل')
      ]),
      UI.glass('', cache.map(function (suite) {
        return el('div', {}, [
          el('div', { class: 'check-suite', text: suite.title }),
          el('ul', { class: 'check-list' }, suite.cases.map(function (c) {
            return el('li', { class: 'check-item' }, [
              el('span', {
                class: 'check-mark ' + (c.pass ? 'check-mark--pass' : 'check-mark--fail'),
                text: c.pass ? 'PASS' : 'FAIL'
              }),
              el('span', {}, [
                el('span', { text: c.name }),
                c.detail ? el('div', { class: 'check-detail', text: c.detail }) : null
              ])
            ]);
          }))
        ]);
      }), 'flat')
    ]);
  }

  function start(host) {
    running = true;
    paint(host);
    Checks.run().then(function (results) {
      cache = results;
      running = false;
      // النتائج متاحة أيضاً لأي تشغيل آلي خارجي (Playwright مثلاً).
      window.__ispChecks = results;
      paint(host);
    });
  }

  return function (host) {
    if (cache || running) { paint(host); return; }
    start(host);
  };
})();

/* ==========================================================================
   ٣٠ — الإقلاع
   ========================================================================== */
Shell.init();
</script>
