<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ياقوت — وحدة مزودي الإنترنت</title>
<meta name="description" content="محرك إدارة مشتركي الإنترنت متعدد المزودين — نسخة فانيلا بلا أطر عمل ولا خطوة بناء.">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   رموز التصميم — مصدر واحد لكل لون وظل في الوحدة (§30).
   منقولة حرفياً من app/globals.css في نسخة Next، والأساس من واجهة متجر
   سفيان القائمة (index.html) حتى تبدو الوحدة جزءاً أصيلاً من ياقوت.
   ========================================================================== */
:root{
  --font-display:'El Messiri', system-ui, sans-serif;
  --font-body:'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;

  --radius:18px;
  --ease:cubic-bezier(.22,1,.36,1);

  /* هوية ياقوت — نفس قيم المتجر */
  --primary:#5b6eff;
  --cta:#ffa94d;

  /* ألوان الحالة: مشتقة لا عشوائية */
  --ok:#3ddc84;
  --warn:#ffb020;
  --danger:#ff6b6b;
  --info:#4dabf7;
  --muted:#8b93a7;
}

/* فاتح افتراضي (نفس لوحة المتجر) */
:root,
:root[data-theme='light']{
  --bg:#f6f5f2;
  --surface:#ffffff;
  --surface-2:#f0efea;
  --text:#1b1e28;
  --text-2:#5d6373;
  --border:#e3e1da;

  --shadow:0 2px 8px rgba(20,22,28,.06), 0 12px 32px rgba(20,22,28,.10);
  --glow:0 0 0 1px rgba(91,110,255,.30), 0 8px 26px rgba(91,110,255,.16);

  /* طبقات الزجاج السائل */
  --glass-bg:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-specular:rgba(255,255,255,.90);
  --glass-tint:rgba(91,110,255,.04);
}

:root[data-theme='dark']{
  --bg:#14161c;
  --surface:#1e212b;
  --surface-2:#262a37;
  --text:#edeff7;
  --text-2:#9aa0b4;
  --border:#2e3342;

  --shadow:0 4px 14px rgba(0,0,0,.35), 0 14px 40px rgba(0,0,0,.28);
  --glow:0 0 0 1px rgba(91,110,255,.35), 0 8px 30px rgba(91,110,255,.18);

  --glass-bg:rgba(30,33,43,.66);
  --glass-border:rgba(255,255,255,.08);
  --glass-specular:rgba(255,255,255,.14);
  --glass-tint:rgba(91,110,255,.06);
}

/* يتبع نظام الجهاز ما لم يختر المستخدم صراحةً */
@media (prefers-color-scheme: dark){
  :root:not([data-theme='light']){
    --bg:#14161c;
    --surface:#1e212b;
    --surface-2:#262a37;
    --text:#edeff7;
    --text-2:#9aa0b4;
    --border:#2e3342;

    --shadow:0 4px 14px rgba(0,0,0,.35), 0 14px 40px rgba(0,0,0,.28);
    --glow:0 0 0 1px rgba(91,110,255,.35), 0 8px 30px rgba(91,110,255,.18);

    --glass-bg:rgba(30,33,43,.66);
    --glass-border:rgba(255,255,255,.08);
    --glass-specular:rgba(255,255,255,.14);
    --glass-tint:rgba(91,110,255,.06);
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  transition:background .4s var(--ease), color .4s var(--ease);
}
h1,h2,h3{font-family:var(--font-display); line-height:1.3; margin:0}
h1{font-size:1.5rem}
h2{font-size:1.15rem}
p{margin:0}
button{font-family:inherit; font-size:inherit; cursor:pointer; color:inherit}
input,select,textarea{font-family:inherit; font-size:1rem; color:inherit}
table{border-collapse:collapse}
:focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:6px}

/* --------------------------------------------------------------------------
   المعرّفات التقنية داخل صفحة عربية (§28).
   اسم المستخدم و MAC و IP ورقم العملية تُقرأ من اليسار لليمين دائماً.
   -------------------------------------------------------------------------- */
.ltr{direction:ltr; unicode-bidi:isolate; font-family:var(--font-mono); text-align:start}
/* أرقام جدولية حتى لا ترقص الأعمدة المالية بين التحديثات */
.tnum{font-variant-numeric:tabular-nums; font-family:var(--font-mono)}

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* --------------------------------------------------------------------------
   سطح الزجاج السائل. النسبة المستهدفة: ٧٠٪ وظيفي، ٢٠٪ زجاج، ١٠٪ حركة (§16).
   الضبابية خفيفة عمداً خلف البيانات الكثيفة حتى تبقى مقروءة.
   -------------------------------------------------------------------------- */
.glass{
  position:relative;
  background:linear-gradient(180deg, var(--glass-tint), transparent 42%), var(--glass-bg);
  backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
/* حافة ضوئية مضبوطة — خط واحد أعلى البطاقة لا توهج كامل */
.glass::before{
  content:''; position:absolute; inset-inline:12px; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--glass-specular), transparent);
  pointer-events:none; border-radius:inherit;
}
/* داخل الجداول نخفض الضبابية: الوضوح أهم من الزخرفة (قاعدة ١٥) */
.glass--flat{
  backdrop-filter:none; -webkit-backdrop-filter:none;
  background:var(--surface);
}

.shimmer{position:relative; overflow:hidden; background:var(--surface-2); border-radius:8px}
.shimmer::after{
  content:''; position:absolute; inset:0; transform:translateX(100%);
  background:linear-gradient(90deg, transparent, var(--glass-specular), transparent);
  animation:shimmer 1.6s infinite;
}
@keyframes shimmer{100%{transform:translateX(-100%)}}
@keyframes status-pulse{0%,100%{opacity:1} 50%{opacity:.45}}
@keyframes pop-in{from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none}}
@keyframes fade-in{from{opacity:0} to{opacity:1}}
/* اللوحة مثبَّتة على حافة بداية القراءة (يمين الصفحة العربية) فتدخل منها */
@keyframes slide-in{from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none}}

.thin-scroll{scrollbar-width:thin; scrollbar-color:var(--border) transparent}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* ============ الهيكل العام ============ */
.wrap{max-width:1200px; margin-inline:auto; padding-inline:16px; width:100%}
.site-header{
  position:sticky; top:0; z-index:40;
  border-radius:0; border-inline:0; border-top:0;
}
.header-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-block:12px}
.brand{font-family:var(--font-display); font-weight:700; font-size:1.1rem; white-space:nowrap}
.brand span{color:var(--primary)}
.nav{display:flex; gap:4px; flex-wrap:wrap}
.nav a{
  border-radius:10px; padding:6px 12px; font-size:.875rem; text-decoration:none;
  color:var(--text-2); transition:background .25s var(--ease), color .25s var(--ease);
}
.nav a:hover{color:var(--text)}
.nav a[aria-current='page']{background:var(--surface-2); color:var(--text)}
.header-tools{display:flex; align-items:center; gap:8px; margin-inline-start:auto; flex-wrap:wrap}

.provider-strip{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  border-top:1px solid var(--border); padding-block:8px 10px;
}
.provider-chip{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  border:1px solid var(--border); border-radius:999px; padding:4px 10px;
  background:color-mix(in srgb, var(--surface) 55%, transparent);
}
.linkish{background:none; border:0; padding:0; font-size:.75rem; text-decoration:underline}
.linkish--muted{color:var(--muted)}
.linkish--primary{color:var(--primary)}

main{padding-block:22px 56px}

/* ============ عناصر التحكم ============ */
.input,.select{
  width:100%; border:1px solid var(--border); background:var(--surface-2);
  border-radius:12px; padding:9px 12px; font-size:.9rem;
  outline:none; transition:border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.input:focus,.select:focus{border-color:var(--primary); box-shadow:var(--glow)}
.select{padding-inline-end:28px}
.field{display:flex; flex-direction:column; gap:6px}
.field-label{font-size:.85rem; color:var(--text-2)}
.field-req{color:var(--danger); margin-inline-start:4px}
.field-error{font-size:.75rem; color:var(--danger)}
.field-help{font-size:.75rem; color:var(--muted)}
.control-sm{padding:6px 10px; font-size:.8rem; width:auto; min-width:120px}

.btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  border-radius:12px; padding:8px 16px; font-size:.875rem; font-weight:500;
  transition:transform .25s var(--ease), background .25s var(--ease), opacity .2s;
}
.btn:hover{background:color-mix(in srgb, var(--primary) 8%, var(--surface-2))}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.btn--primary{background:var(--primary); border-color:var(--primary); color:#fff; width:100%; padding-block:11px; font-weight:600}
.btn--primary:hover{background:color-mix(in srgb, var(--primary) 88%, #000)}
.btn--sm{padding:5px 11px; font-size:.78rem; border-radius:10px}
.btn--icon{
  width:38px; height:38px; padding:0; display:grid; place-items:center;
  border-radius:11px; flex:none; font-size:1rem;
}
.btn--icon:active{transform:rotate(180deg) scale(.9)}
.btn-row{display:flex; flex-wrap:wrap; gap:8px}

/* ============ الشارات ============ */
.badge{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  border-radius:999px; padding:2px 10px; font-size:.75rem; font-weight:500;
  color:var(--tone); background:var(--tone-bg);
}
.badge-dot{width:6px; height:6px; border-radius:999px; background:var(--tone); flex:none}
.badge-dot--pulse{animation:status-pulse 2s ease-in-out infinite}
.tone-ok{--tone:var(--ok); --tone-bg:color-mix(in srgb, var(--ok) 14%, transparent)}
.tone-warn{--tone:var(--warn); --tone-bg:color-mix(in srgb, var(--warn) 16%, transparent)}
.tone-danger{--tone:var(--danger); --tone-bg:color-mix(in srgb, var(--danger) 14%, transparent)}
.tone-info{--tone:var(--info); --tone-bg:color-mix(in srgb, var(--info) 14%, transparent)}
.tone-muted{--tone:var(--text-2); --tone-bg:var(--surface-2)}
.tone-primary{--tone:var(--primary); --tone-bg:color-mix(in srgb, var(--primary) 12%, transparent)}

.provider-badge{display:inline-flex; align-items:center; gap:8px}
.provider-logo{
  display:grid; place-items:center; width:24px; height:24px; flex:none;
  overflow:hidden; border:1px solid var(--border); border-radius:7px;
  background:var(--surface-2); font-size:10px; font-weight:700;
}
.provider-logo img{width:100%; height:100%; object-fit:contain}
.provider-name{font-weight:500; font-size:.875rem}

/* ============ اللوحة ============ */
.page-title{margin-bottom:2px}
.page-sub{color:var(--text-2); font-size:.875rem; margin-bottom:18px}

.widget-grid{display:grid; grid-template-columns:1fr; gap:16px}
@media (min-width:720px){ .widget-grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1080px){ .widget-grid{grid-template-columns:repeat(4,1fr)} }
.span-lg{grid-column:span 1}
@media (min-width:720px){ .span-lg{grid-column:span 2} }
.span-xl{grid-column:1 / -1}

.widget{
  display:flex; flex-direction:column; gap:8px; padding:18px; height:100%;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease);
}
.widget:hover{transform:translateY(-3px)}
.widget--alert{box-shadow:var(--shadow), 0 0 0 1px var(--warn)}
.widget--off{opacity:.7}
.widget-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.widget-title{font-size:.875rem; font-weight:500; color:var(--text-2); font-family:var(--font-body)}
.widget-body{flex:1; min-width:0}
.widget-foot{font-size:.75rem; color:var(--muted)}

.metric{display:flex; align-items:baseline; gap:6px}
.metric-value{font-size:1.85rem; font-weight:600; font-variant-numeric:tabular-nums; font-family:var(--font-mono)}
.metric-suffix{font-size:.85rem; color:var(--text-2)}
.money{font-family:var(--font-mono); font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}
.money--lg{font-size:1.6rem; font-weight:600}
.money--sm{font-size:.85rem}
.money--none{color:var(--muted)}

.breakdown{display:flex; flex-direction:column; gap:2px; margin-top:6px}
.breakdown-row{display:flex; justify-content:space-between; gap:10px; font-size:.75rem; color:var(--text-2)}
.breakdown-note{margin-top:4px; font-size:.7rem; color:var(--warn)}
.muted-note{margin-top:4px; font-size:.7rem; color:var(--muted)}

.mini-list{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.mini-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:.8rem}
.mini-row + .mini-row{border-top:1px solid var(--border); padding-top:8px}
.mini-label{color:var(--text-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============ الحالات ============ */
.state{display:flex; flex-direction:column; align-items:center; gap:8px; padding:40px 24px; text-align:center}
.state-title{font-weight:500}
.state-title--danger{color:var(--danger)}
.state-hint{max-width:420px; font-size:.875rem; color:var(--text-2)}
.notice{
  margin-bottom:20px; padding:14px 16px; font-size:.875rem; color:var(--text-2);
}
.alert-box{
  margin-top:12px; border-radius:12px; padding:8px 12px; font-size:.875rem;
  color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, transparent);
}

/* ============ الجداول ============ */
.table-wrap{overflow-x:auto}
.table{width:100%; min-width:640px; font-size:.875rem}
.table th{padding:12px; text-align:start; font-weight:500; color:var(--text-2); border-bottom:1px solid var(--border)}
.table td{padding:10px 12px; border-bottom:1px solid var(--border)}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .2s var(--ease)}
.table tbody tr:hover{background:var(--surface-2)}
.table tbody tr.is-selected{background:color-mix(in srgb, var(--primary) 8%, transparent)}
.row-button{
  background:none; border:1px solid transparent; border-radius:8px;
  padding:2px 8px; font-size:.8rem; color:var(--primary); text-decoration:underline;
}
.matrix-group td{
  background:var(--surface-2); padding:6px 12px; font-size:.75rem;
  font-weight:600; color:var(--text-2); border-bottom:1px solid var(--border);
}
.matrix-key{position:sticky; inset-inline-start:0; background:var(--surface); z-index:1}
.cell-button{background:none; border:0; padding:0; cursor:pointer}

.filters{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px; margin-bottom:16px}
.filters .grow{flex:1; min-width:200px}

.detail{margin-top:16px; padding:18px}
.detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.detail-grid{display:grid; gap:14px; margin-top:16px; font-size:.875rem}
@media (min-width:640px){ .detail-grid{grid-template-columns:repeat(2,1fr)} }
.detail-grid .full{grid-column:1 / -1}
.detail-term{font-size:.75rem; color:var(--muted)}
.detail-desc{margin-top:4px}
pre.code{
  margin:4px 0 0; padding:8px 10px; border-radius:10px; background:var(--surface-2);
  font-size:.75rem; overflow-x:auto; direction:ltr; unicode-bidi:isolate;
  font-family:var(--font-mono); white-space:pre-wrap;
}

/* ============ النوافذ ============ */
.overlay{
  position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px;
  background:rgba(10,12,18,.55); animation:fade-in .2s var(--ease);
  overflow-y:auto;
}
.modal{width:100%; max-width:440px; padding:24px; animation:pop-in .3s var(--ease)}
.modal-eyebrow{font-size:.75rem; letter-spacing:.02em; color:var(--muted)}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px}
.icon-close{
  display:grid; place-items:center; width:32px; height:32px; flex:none;
  border:1px solid var(--border); border-radius:999px; background:var(--surface-2);
}
.form{display:flex; flex-direction:column; gap:14px; margin-top:20px}
.method-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.method-pill{border:1px solid var(--border); border-radius:999px; padding:4px 12px; font-size:.75rem; color:var(--text-2); background:none}
.method-pill[aria-pressed='true']{border-color:var(--primary); color:var(--primary)}
.check-row{display:flex; align-items:center; gap:8px; font-size:.875rem; color:var(--text-2)}
.check-row input{width:16px; height:16px; accent-color:var(--primary)}
.secure-note{
  display:flex; align-items:center; justify-content:center; gap:6px;
  margin-top:12px; font-size:.75rem; color:var(--muted); text-align:center;
}
.secure-dot{width:6px; height:6px; border-radius:999px; background:var(--ok); flex:none}

/* ============ لوحة تفاصيل المشترك ============ */
.drawer{
  position:fixed; inset-block:0; inset-inline-start:0; z-index:45;
  width:min(460px, 100%); overflow-y:auto; border-radius:0; border-block:0;
  border-inline-start:0; padding:20px; animation:slide-in .3s var(--ease);
}
.drawer-scrim{position:fixed; inset:0; z-index:44; background:rgba(10,12,18,.4); animation:fade-in .2s var(--ease)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.85rem; margin-top:14px}
.kv dt{color:var(--muted); font-size:.75rem; align-self:center}
.kv dd{margin:0; text-align:start}
.section-head{
  margin:20px 0 8px; font-size:.75rem; font-weight:600; color:var(--text-2);
  text-transform:none; letter-spacing:.02em;
}

/* ============ الفحوصات ============ */
.check-list{display:flex; flex-direction:column; gap:0; margin:0; padding:0; list-style:none}
.check-item{display:flex; align-items:flex-start; gap:10px; padding:9px 14px; font-size:.85rem; border-bottom:1px solid var(--border)}
.check-item:last-child{border-bottom:0}
.check-mark{font-family:var(--font-mono); font-weight:600; flex:none; width:44px}
.check-mark--pass{color:var(--ok)}
.check-mark--fail{color:var(--danger)}
.check-detail{color:var(--muted); font-size:.75rem; margin-top:2px}
.check-suite{padding:10px 14px; background:var(--surface-2); font-size:.78rem; font-weight:600; color:var(--text-2)}
.summary-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:14px; margin-bottom:16px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* eslint-env browser */
'use strict';
/* ==========================================================================
   ياقوت — محرك مزودي الإنترنت | نسخة فانيلا
   ملف واحد. بلا React، بلا Next، بلا Tailwind، بلا خطوة بناء، بلا اعتماديات.
   منقول من yaqoot-isp-engine (Next 15 + TypeScript) مع الحفاظ على البنية:
   نواة عامة ← محرك القدرات ← سجل الودجات ← محوّلات المزودين ← الواجهة.
   لا يوجد في هذا الملف أي  if (provider === '...')  — الواجهة تسأل محرك
   القدرات دائماً، لا اسم المزود.
   ========================================================================== */

/* ==========================================================================
   ١ — النواة: النقود (modules/isp/core/money.ts)
   المبلغ عدد صحيح بالوحدات الصغرى حتى لا يمرّ أي حساب مالي عبر عدد عشري.
   الدينار العراقي أُسّه صفر عملياً، لكن المحرك لا يفترض ذلك — قد يفوتر مزود
   بالدولار (أُسّه ٢).
   ========================================================================== */
var Money = (function () {
  var CURRENCY_EXPONENT = { IQD: 0, USD: 2, EUR: 2, JOD: 3 };

  function exponentOf(currency) {
    var exp = CURRENCY_EXPONENT[String(currency).toUpperCase()];
    return exp === undefined ? 2 : exp;
  }

  function money(amount, currency) {
    if (!Number.isFinite(amount)) {
      throw new TypeError('Money amount must be finite, received ' + String(amount));
    }
    return { amount: Math.round(amount), currency: String(currency).toUpperCase() };
  }

  /** بناء مبلغ من وحدة كبرى (عمود numeric في قاعدة البيانات مثلاً). */
  function fromMajor(value, currency) {
    var n = typeof value === 'string' ? Number(value) : value;
    if (!Number.isFinite(n)) {
      throw new TypeError('Cannot read a money value from ' + JSON.stringify(value));
    }
    return money(n * Math.pow(10, exponentOf(currency)), currency);
  }

  function toMajor(m) {
    return m.amount / Math.pow(10, exponentOf(m.currency));
  }

  function assertSameCurrency(a, b) {
    if (a.currency !== b.currency) {
      // الدمج الصامت للعملات هو الطريق الأقصر لدفتر حسابات خاطئ. نرفض.
      throw new TypeError('Currency mismatch: ' + a.currency + ' vs ' + b.currency);
    }
  }

  function add(a, b) {
    assertSameCurrency(a, b);
    return { amount: a.amount + b.amount, currency: a.currency };
  }

  function subtract(a, b) {
    assertSameCurrency(a, b);
    return { amount: a.amount - b.amount, currency: a.currency };
  }

  function compare(a, b) {
    assertSameCurrency(a, b);
    return a.amount - b.amount;
  }

  /** عرض بأرقام لاتينية داخل عزل LTR — §28. */
  function formatMoney(m, locale) {
    var exp = exponentOf(m.currency);
    var formatted = new Intl.NumberFormat(locale || 'ar-IQ', {
      minimumFractionDigits: exp,
      maximumFractionDigits: exp,
      numberingSystem: 'latn'
    }).format(toMajor(m));
    return formatted + ' ' + m.currency;
  }

  /**
   * الربح لا معنى له إلا بمعرفة الطرفين. كلفة مجهولة ⇒ null،
   * ولا تُعرض أبداً كـ "ربح = سعر البيع" (§5، القاعدة ٤).
   */
  function profit(retail, cost) {
    if (cost === null || cost === undefined) return null;
    return subtract(retail, cost);
  }

  return {
    exponentOf: exponentOf, money: money, fromMajor: fromMajor, toMajor: toMajor,
    add: add, subtract: subtract, compare: compare,
    isZero: function (m) { return m.amount === 0; },
    isNegative: function (m) { return m.amount < 0; },
    formatMoney: formatMoney, profit: profit
  };
})();

/* ==========================================================================
   ٢ — النواة: نضارة البيانات (modules/isp/core/freshness.ts)
   القاعدة ١٣: لا تجعل بياناتٍ خارجية قديمة تبدو لحظية أبداً.
   ========================================================================== */
var Freshness = (function () {
  var LIVE_WINDOW_SECONDS = 10;   // تحتها تُعرض القيمة كأنها مباشرة
  var STALE_AFTER_SECONDS = 300;  // فوقها تُوسم صراحةً بأنها قديمة

  function arabicDuration(seconds) {
    if (seconds < 60) return seconds + ' ثانية';
    var minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + ' دقيقة';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' ساعة';
    return Math.floor(hours / 24) + ' يوم';
  }

  function classifyFreshness(sync, now, online) {
    var at = now || new Date();
    var reachable = online === undefined ? true : online;

    if (sync.syncStatus === 'error') {
      return { level: 'error', label: 'خطأ في المزامنة', ageSeconds: null };
    }
    // بيانات ياقوت مرجعية محلياً؛ لا تكون "قديمة" أبداً.
    if (sync.owner === 'yaqoot') {
      return { level: 'live', label: 'بيانات محلية', ageSeconds: 0 };
    }
    if (sync.fetchedAt === null || sync.fetchedAt === undefined || sync.syncStatus === 'never') {
      return { level: 'offline', label: 'غير مُزامن', ageSeconds: null };
    }

    var fetched = Date.parse(sync.fetchedAt);
    if (Number.isNaN(fetched)) {
      return { level: 'error', label: 'خطأ في المزامنة', ageSeconds: null };
    }

    var ageSeconds = Math.max(0, Math.floor((at.getTime() - fetched) / 1000));

    if (!reachable) {
      return {
        level: 'offline',
        label: 'غير متصل — آخر مزامنة قبل ' + arabicDuration(ageSeconds),
        ageSeconds: ageSeconds
      };
    }
    if (sync.syncStatus === 'stale' || ageSeconds > STALE_AFTER_SECONDS) {
      return { level: 'stale', label: 'مُزامن قبل ' + arabicDuration(ageSeconds), ageSeconds: ageSeconds };
    }
    if (ageSeconds <= LIVE_WINDOW_SECONDS) {
      return { level: 'live', label: 'مباشر', ageSeconds: ageSeconds };
    }
    return { level: 'fresh', label: 'مُزامن قبل ' + arabicDuration(ageSeconds), ageSeconds: ageSeconds };
  }

  function syncMeta(owner, fetchedAt, externalReference, syncStatus) {
    return {
      owner: owner,
      fetchedAt: fetchedAt === undefined ? null : fetchedAt,
      externalReference: externalReference === undefined ? null : externalReference,
      syncStatus: syncStatus || (fetchedAt ? 'ok' : 'never')
    };
  }

  return {
    classifyFreshness: classifyFreshness,
    syncMeta: syncMeta,
    arabicDuration: arabicDuration,
    /** للسجلات التي يملكها ياقوت وحده (الفواتير، الديون المحلية). */
    YAQOOT_OWNED: { owner: 'yaqoot', fetchedAt: null, externalReference: null, syncStatus: 'ok' }
  };
})();

/* ==========================================================================
   ٣ — النواة: تصنيف الأخطاء (modules/isp/core/errors.ts)
   جمهوران منفصلان عمداً: رسالة عربية آمنة للمشغّل، وتشخيص للمدير فقط.
   ========================================================================== */
var Errors = (function () {
  var PROVIDER_ERROR_REASONS = [
    'TIMEOUT', 'AUTH_FAILED', 'INVALID_CREDENTIALS', 'ACCOUNT_LOCKED', 'REQUIRES_MFA',
    'REQUIRES_OTP', 'CREDENTIALS_EXPIRED', 'RATE_LIMITED', 'PROVIDER_UNAVAILABLE',
    'MALFORMED_RESPONSE', 'DUPLICATE_REQUEST', 'PARTIAL_SUCCESS', 'UNKNOWN_RESULT',
    'STALE_DATA', 'UNSUPPORTED_OPERATION', 'VALIDATION_FAILED', 'NOT_FOUND',
    'INSUFFICIENT_FUNDS', 'UNSUPPORTED_AUTH_METHOD'
  ];

  /** نصوص المشغّل — مبهمة عمداً عن تفاصيل المزود (§44). */
  var OPERATOR_MESSAGES = {
    TIMEOUT: 'تأخر رد مزود الخدمة. حاول مرة أخرى بعد قليل.',
    AUTH_FAILED: 'تعذر التحقق من الاتصال بمزود الخدمة.',
    INVALID_CREDENTIALS: 'بيانات الدخول غير صحيحة.',
    ACCOUNT_LOCKED: 'الحساب موقوف مؤقتاً لدى مزود الخدمة.',
    REQUIRES_MFA: 'يحتاج الحساب تحققاً بخطوتين لإكمال الدخول.',
    REQUIRES_OTP: 'أدخل رمز التحقق المرسل إليك.',
    CREDENTIALS_EXPIRED: 'انتهت صلاحية بيانات الدخول — سجّل الدخول من جديد.',
    RATE_LIMITED: 'طلبات كثيرة خلال وقت قصير. انتظر قليلاً ثم أعد المحاولة.',
    PROVIDER_UNAVAILABLE: 'تعذر الاتصال بمزود الخدمة حالياً. تحقق من الاتصال أو حاول مرة أخرى.',
    MALFORMED_RESPONSE: 'وصل رد غير مفهوم من مزود الخدمة. تم تسجيل الحالة للمراجعة.',
    DUPLICATE_REQUEST: 'هذه العملية منفّذة مسبقاً.',
    PARTIAL_SUCCESS: 'نُفِّذ جزء من العملية فقط. راجع التفاصيل.',
    UNKNOWN_RESULT: 'نتيجة العملية غير مؤكدة — بانتظار المطابقة.',
    STALE_DATA: 'البيانات المعروضة قديمة ولم تُحدَّث من مزود الخدمة.',
    UNSUPPORTED_OPERATION: 'هذه العملية غير مدعومة لدى مزود الخدمة المحدد.',
    VALIDATION_FAILED: 'تحقق من الحقول المدخلة.',
    NOT_FOUND: 'لا يوجد سجل مطابق لدى مزود الخدمة.',
    INSUFFICIENT_FUNDS: 'رصيد المحفظة لا يكفي لإتمام العملية.',
    UNSUPPORTED_AUTH_METHOD: 'طريقة الدخول هذه غير مدعومة في هذا الإصدار.'
  };

  function operatorMessage(reason) {
    return OPERATOR_MESSAGES[reason];
  }

  /** أسبابٌ قد تكون العملية فيها نُفِّذت فعلاً لدى المزود ⇒ مطابقة لا إعادة محاولة. */
  var AMBIGUOUS_REASONS = ['TIMEOUT', 'UNKNOWN_RESULT', 'MALFORMED_RESPONSE', 'PARTIAL_SUCCESS'];

  function isAmbiguousOutcome(reason) {
    return AMBIGUOUS_REASONS.indexOf(reason) !== -1;
  }

  function ProviderError(reason, options) {
    var opts = options || {};
    var error = new Error(operatorMessage(reason));
    error.name = 'ProviderError';
    error.reason = reason;
    error.providerCode = opts.providerCode;
    error.httpStatus = opts.httpStatus;
    return error;
  }

  /** مفاتيح لا يجوز أن تصل قيمتها إلى سجلّ أو إلى المتصفح (§35). */
  var SECRET_KEY_PATTERN =
    /(pass(word)?|secret|token|api[_-]?key|authorization|cookie|pin|credential|private[_-]?key|otp)/i;

  /** إخفاء متكرر للقيم السرية — يوازي scrub_secrets() في طبقة SQL. */
  function redact(value, depth) {
    var d = depth || 0;
    if (d > 6) return '[…]';
    if (value === null || typeof value !== 'object') return value;
    if (Array.isArray(value)) return value.map(function (v) { return redact(v, d + 1); });

    var out = {};
    Object.keys(value).forEach(function (key) {
      out[key] = SECRET_KEY_PATTERN.test(key) ? '[REDACTED]' : redact(value[key], d + 1);
    });
    return out;
  }

  return {
    PROVIDER_ERROR_REASONS: PROVIDER_ERROR_REASONS,
    operatorMessage: operatorMessage,
    isAmbiguousOutcome: isAmbiguousOutcome,
    ProviderError: ProviderError,
    redact: redact
  };
})();

/* ==========================================================================
   ٤ — النواة: مغلّف نتيجة العملية (modules/isp/core/result.ts)
   الحالة الأهم REQUIRES_RECONCILIATION: قد تكون العملية نُفِّذت لدى المزود
   بينما فشل الحفظ عندنا — تُوقَف للمطابقة البشرية ولا تُعاد آلياً.
   ========================================================================== */
var Result = (function () {
  var OPERATION_STATES = [
    'PENDING', 'PROCESSING', 'SUCCESS', 'FAILED', 'REQUIRES_RECONCILIATION', 'CANCELLED'
  ];
  var TERMINAL_STATES = ['SUCCESS', 'CANCELLED', 'REQUIRES_RECONCILIATION'];

  function isTerminal(state) { return TERMINAL_STATES.indexOf(state) !== -1; }

  /** إعادة المحاولة العمياء آمنة فقط من FAILED أو من حالتَي ما قبل الإرسال. */
  function isRetryable(state) {
    return state === 'FAILED' || state === 'PENDING' || state === 'PROCESSING';
  }

  function isSuccess(r) { return r.state === 'SUCCESS'; }

  function ok(data, diagnostics) {
    return { state: 'SUCCESS', data: data, diagnostics: diagnostics };
  }

  function fail(reason, message, diagnostics, state) {
    return { state: state || 'FAILED', reason: reason, message: message, diagnostics: diagnostics };
  }

  /** "قد يكون طلبنا وصل والمزود نفّذه": لا يُعاد آلياً أبداً. */
  function needsReconciliation(reason, message, diagnostics, note, externalReference) {
    return {
      state: 'REQUIRES_RECONCILIATION',
      reason: reason,
      message: message,
      diagnostics: diagnostics,
      reconciliation: { note: note, externalReference: externalReference }
    };
  }

  return {
    OPERATION_STATES: OPERATION_STATES, TERMINAL_STATES: TERMINAL_STATES,
    isTerminal: isTerminal, isRetryable: isRetryable, isSuccess: isSuccess,
    ok: ok, fail: fail, needsReconciliation: needsReconciliation
  };
})();

/* ==========================================================================
   ٧ — محرك القدرات: البيان (modules/isp/capabilities/manifest.ts)
   القدرة ليست قيمة منطقية (§20): "قابل للضبط" و"غير معروف" حالتان أصيلتان.
   ========================================================================== */
var Manifest = (function () {
  var CAPABILITY_STATES = ['supported', 'unsupported', 'partial', 'configurable', 'unknown'];

  var CAPABILITY_STATE_LABELS = {
    supported: 'مدعوم',
    unsupported: 'غير مدعوم',
    partial: 'مدعوم جزئياً',
    configurable: 'قابل للضبط',
    unknown: 'غير معروف'
  };

  var UNKNOWN = { state: 'unknown' };

  /**
   * كل مفتاح لم يذكره المحوّل يصير `unknown` صراحةً، فلا يواجه ما بعده
   * قيمة غائبة. الإغفال ليس كعدم الدعم: الإغفال يعني أن الاكتشاف لم يخبرنا بعد.
   */
  function resolveManifest(manifest) {
    var out = {};
    CapabilityKeys.CAPABILITY_KEYS.forEach(function (key) {
      out[key] = manifest[key] || UNKNOWN;
    });
    return out;
  }

  /** اختصار لبناء بيان من قيم منطقية داخل المحوّل. */
  function declare(flags) {
    var out = {};
    Object.keys(flags).forEach(function (key) {
      var value = flags[key];
      if (value === undefined) return;
      out[key] = typeof value === 'boolean'
        ? { state: value ? 'supported' : 'unsupported' }
        : value;
    });
    return out;
  }

  return {
    CAPABILITY_STATES: CAPABILITY_STATES,
    CAPABILITY_STATE_LABELS: CAPABILITY_STATE_LABELS,
    resolveManifest: resolveManifest,
    declare: declare
  };
})();

/* ==========================================================================
   ٨ — محرك القدرات: المُحلِّل (modules/isp/capabilities/resolver.ts)
   المكان الوحيد الذي يقرر ما يجوز للواجهة عرضه.
   القاعدة ١١: لا تعرض عمليةً لا يستطيع المزود المتصل تنفيذها.
   القاعدة ١٤: لا يتسرب كود خاص بمزود إلى مكوّن عام — الجميع يسأل هذه الوحدة.
   ========================================================================== */
var Resolver = (function () {
  /** الحالات التي يستطيع فيها المزود التنفيذ فعلاً. */
  var ACTIONABLE_STATES = ['supported', 'partial'];
  /** الحالات التي توجد فيها قيمة ما — من المزود أو من إعدادات ياقوت. */
  var DATA_STATES = ['supported', 'partial', 'configurable'];

  /** هل يستطيع المزود تنفيذ العملية؟ يقود الأزرار وسير العمل. */
  function canPerform(manifest, key) {
    var decl = manifest[key];
    return !!decl && ACTIONABLE_STATES.indexOf(decl.state) !== -1;
  }

  /** هل توجد قيمة لعرضها؟ يقود الودجات والأعمدة والبطاقات. */
  function hasData(manifest, key) {
    var decl = manifest[key];
    return !!decl && DATA_STATES.indexOf(decl.state) !== -1;
  }

  function stateOf(manifest, key) {
    var decl = manifest[key];
    return decl ? decl.state : 'unknown';
  }

  function declarationOf(manifest, key) {
    return manifest[key] || { state: 'unknown' };
  }

  /**
   * بوابة ودجة/شاشة خلف مجموعة قدرات: كلها يجب أن تحمل بيانات، وأول
   * قدرة ناقصة هي من يوفّر نص "بطاقة القدرة الفارغة" (§17).
   */
  function gate(manifest, required) {
    var missing = (required || []).filter(function (k) { return !hasData(manifest, k); });
    if (missing.length === 0) return { allowed: true, missing: [], reason: null };
    var first = missing[0];
    return {
      allowed: false,
      missing: missing,
      reason: first ? CapabilityKeys.CAPABILITY_META[first].unsupportedHint : null
    };
  }

  /** عمليات تُغيّر الحالة. إن لم يكن أيٌّ منها متاحاً فالاتصال للقراءة فقط (§3). */
  var MUTATING_CAPABILITIES = [
    'subscriberCreate', 'subscriberUpdate', 'activation', 'renewal', 'packageChange',
    'suspend', 'resume', 'disconnectSession', 'macReset', 'walletRecharge', 'testAccounts'
  ];

  function isReadOnly(manifest) {
    return !MUTATING_CAPABILITIES.some(function (k) { return canPerform(manifest, k); });
  }

  // -------------------------------------------------------------------------
  // التجميع عبر عدة مزودين (§19)
  // -------------------------------------------------------------------------

  function coverageFor(providers, key) {
    var reporting = [], notReporting = [], unknown = [];

    providers.forEach(function (p) {
      var ref = { providerId: p.providerId, providerName: p.providerName };
      var state = stateOf(p.manifest, key);
      if (state === 'unknown') unknown.push(ref);
      else if (DATA_STATES.indexOf(state) !== -1) reporting.push(ref);
      else notReporting.push(ref);
    });

    return {
      key: key,
      reporting: reporting,
      notReporting: notReporting,
      unknown: unknown,
      complete: providers.length > 0 && reporting.length === providers.length
    };
  }

  /** الحالة المجمّعة عبر المزودين — ما يعرضه رأس المصفوفة وعرض "كل المزودين". */
  function aggregateState(providers, key) {
    if (providers.length === 0) return 'unknown';
    var states = providers.map(function (p) { return stateOf(p.manifest, key); });
    var every = function (s) { return states.every(function (x) { return x === s; }); };
    if (every('supported')) return 'supported';
    if (every('unsupported')) return 'unsupported';
    if (every('unknown')) return 'unknown';
    // أي خليط — بما فيه مدعوم+غير مدعوم — هو بصدق "مدعوم جزئياً".
    return 'partial';
  }

  /**
   * تجميع مقياس لكل مزود دون الكذب على التغطية (§19).
   * المزود العاجز عن التبليغ يُستبعد من المجموع ويُسمّى في notReporting،
   * فتستطيع البطاقة أن تقول "المزودون الذين يوفرون هذه البيانات فقط"
   * بدل مجموعٍ يبتلع الغائبين بصمت.
   */
  function aggregateMetric(providers, key, valueOf) {
    var coverage = coverageFor(providers, key);
    var breakdown = [];

    coverage.reporting.forEach(function (ref) {
      var value = valueOf(ref.providerId);
      if (value === null || value === undefined) return;
      breakdown.push({ providerId: ref.providerId, providerName: ref.providerName, value: value });
    });

    var total = breakdown.reduce(function (sum, c) { return sum + c.value; }, 0);
    // ناقص إن عجز مزود عن التبليغ، أو بلّغ بلا شيء وهو مفترضٌ أن يبلّغ.
    var complete = coverage.complete && breakdown.length === coverage.reporting.length;

    return {
      total: total,
      breakdown: breakdown,
      coverage: coverage,
      complete: complete,
      qualifier: complete ? null : 'المزودون الذين يوفرون هذه البيانات فقط'
    };
  }

  return {
    canPerform: canPerform, hasData: hasData, stateOf: stateOf, declarationOf: declarationOf,
    gate: gate, isReadOnly: isReadOnly, resolve: Manifest.resolveManifest,
    coverageFor: coverageFor, aggregateState: aggregateState, aggregateMetric: aggregateMetric
  };
})();

/* ==========================================================================
   ٩ — حساب تواريخ الانتهاء (modules/isp/subscriptions/renewal.ts)
   القاعدة ٣: لا تجديد مبرمَج بثلاثين يوماً. لا توجد مدة افتراضية في هذا
   الملف إطلاقاً — الباقة بلا مدة لا يجدّدها النظام، ويقول ذلك بدل التخمين.
   ========================================================================== */
var Renewal = (function () {
  function addDuration(base, duration) {
    var next = new Date(base.getTime());
    switch (duration.unit) {
      case 'hour': next.setUTCHours(next.getUTCHours() + duration.value); return next;
      case 'day': next.setUTCDate(next.getUTCDate() + duration.value); return next;
      case 'week': next.setUTCDate(next.getUTCDate() + duration.value * 7); return next;
      case 'month': next.setUTCMonth(next.getUTCMonth() + duration.value); return next;
      case 'year': next.setUTCFullYear(next.getUTCFullYear() + duration.value); return next;
      default: throw new Error('Unhandled duration unit: ' + String(duration.unit));
    }
  }

  function startOfNextMonth(from) {
    return new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth() + 1, 1, 0, 0, 0, 0));
  }

  function computeExpiry(semantics, currentExpiry, duration, now) {
    var at = now || new Date();

    if (semantics === 'provider_defined') {
      return {
        newExpiry: null,
        explanation: 'المزود هو من يحدد تاريخ الانتهاء الجديد بعد تنفيذ التجديد.',
        deferredToProvider: true
      };
    }
    if (duration === null || duration === undefined) {
      return {
        newExpiry: null,
        explanation: 'هذه الباقة بلا مدة محددة — يحدد المزود تاريخ الانتهاء.',
        deferredToProvider: true
      };
    }

    var current = currentExpiry ? new Date(currentExpiry) : null;
    var currentValid = current !== null && !Number.isNaN(current.getTime());

    switch (semantics) {
      case 'extend_from_expiry': {
        // يمتد من تاريخ الانتهاء القائم ولو كان في الماضي، فلا يُحاسَب
        // المشترك على أيام لم يستلمها.
        var base = currentValid ? current : at;
        return {
          newExpiry: addDuration(base, duration).toISOString(),
          explanation: currentValid
            ? 'يُضاف طول الباقة إلى تاريخ الانتهاء الحالي.'
            : 'لا يوجد تاريخ انتهاء سابق — تُحتسب المدة من الآن.',
          deferredToProvider: false
        };
      }
      case 'start_from_now':
        return {
          newExpiry: addDuration(at, duration).toISOString(),
          explanation: 'تبدأ المدة من لحظة التجديد.',
          deferredToProvider: false
        };
      case 'calendar_month':
        return {
          newExpiry: startOfNextMonth(currentValid && current > at ? current : at).toISOString(),
          explanation: 'تنتهي الباقة مع بداية الشهر التالي حسب دورة المزود.',
          deferredToProvider: false
        };
      case 'fixed_cycle': {
        // الدورة الثابتة تتقدم دائماً من تاريخ الانتهاء الحالي، فيبقى
        // المشترك على يوم فوترة المزود نفسه.
        var fixedBase = currentValid ? current : at;
        return {
          newExpiry: addDuration(fixedBase, duration).toISOString(),
          explanation: 'دورة فوترة ثابتة — يبقى يوم التجديد كما هو.',
          deferredToProvider: false
        };
      }
      default:
        throw new Error('Unhandled renewal semantics: ' + String(semantics));
    }
  }

  /** الأيام المتبقية. القيمة السالبة ذات معنى (منتهٍ) ويعتمد عليها المستدعي. */
  function daysUntil(expiry, now) {
    if (expiry === null || expiry === undefined) return null;
    var at = Date.parse(expiry);
    if (Number.isNaN(at)) return null;
    return Math.ceil((at - (now || new Date()).getTime()) / 86400000);
  }

  var EXPIRING_SOON_DAYS = 7;

  function isExpiringSoon(expiry, now) {
    var days = daysUntil(expiry, now);
    return days !== null && days >= 0 && days <= EXPIRING_SOON_DAYS;
  }

  var RENEWAL_SEMANTICS_LABELS = {
    extend_from_expiry: 'تمديد من تاريخ الانتهاء',
    start_from_now: 'يبدأ من الآن',
    fixed_cycle: 'دورة ثابتة',
    calendar_month: 'شهر تقويمي',
    provider_defined: 'يحددها المزود'
  };

  return {
    computeExpiry: computeExpiry, daysUntil: daysUntil,
    EXPIRING_SOON_DAYS: EXPIRING_SOON_DAYS, isExpiringSoon: isExpiringSoon,
    RENEWAL_SEMANTICS_LABELS: RENEWAL_SEMANTICS_LABELS
  };
})();

      requiredCapabilities: ['walletTransactions'],
      dataSource: 'walletTransactions', refreshInterval: 300,
      minimumRole: 'MANAGER', showWhenUnsupported: false
    }
  ];

  /**
   * ما الذي تعرضه اللوحة. الأسبقية من الأعلى:
   *   ١. الصلاحية (الدور) — ودجة فوق دور المستخدم لا تظهر أبداً
   *   ٢. القدرة — قيود المزود تتجاوز تفضيلات المستخدم (§18)
   *   ٣. تفضيل المستخدم — إخفاء/ترتيب
   */
  function resolveWidgets(manifest, role, preferences) {
    var prefs = preferences || {};
    var hidden = prefs.hidden || [];
    var order = prefs.order || [];
    var resolved = [];

    WIDGETS.forEach(function (definition) {
      if (ROLE_RANK[role] < ROLE_RANK[definition.minimumRole]) return;
      if (hidden.indexOf(definition.widgetId) !== -1) return;

      var g = Resolver.gate(manifest, definition.requiredCapabilities);

      // غير مدعومة ولا تستحق الشرح ⇒ الودجة ببساطة غير موجودة.
      if (!g.allowed && !definition.showWhenUnsupported) return;

      resolved.push({ definition: definition, gate: g, enabled: g.allowed });
    });

    return resolved.sort(function (a, b) {
      var ai = order.indexOf(a.definition.widgetId);
      var bi = order.indexOf(b.definition.widgetId);
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
      return b.definition.priority - a.definition.priority;
    });
  }

  /** أصناف الشبكة لكل مقاس — سطح مكتب ٤ أعمدة، لوحي ٢، هاتف ١ (§18). */
  var WIDGET_SPAN = { sm: '', md: '', lg: 'span-lg', xl: 'span-xl' };

  return {
    WIDGETS: WIDGETS, resolveWidgets: resolveWidgets, WIDGET_SPAN: WIDGET_SPAN,
    ROLE_RANK: ROLE_RANK, ROLE_LABELS: ROLE_LABELS
  };
})();

/* ==========================================================================
   ١٢ — عقد المحوّل (modules/isp/providers/core/adapter.ts + contract.ts)
   العقد الذي يُبقي محرك القدرات صادقاً: قدرةٌ معلنة "مدعومة" وعدٌ بأن الواجهة
   ستعرض زراً لها. إن لم تكن خلف الوعد دالة، يحصل المستخدم على زرٍّ ينفجر —
   وهو "الزر الوهمي" الذي تمنعه المواصفة (§2). validateAdapter تجعل ذلك
   فشلَ فحصٍ لا عطلَ إنتاج.
   ========================================================================== */
var Contract = (function () {
  var REQUIRED_ADAPTER_METHODS = [
    'getProviderProfile', 'getCapabilities', 'getAuthenticationRequirements',
    'authenticate', 'getAuthenticationStatus', 'logout'
  ];

  var OPTIONAL_ADAPTER_METHODS = [
    'submitSecondFactor', 'refreshSession', 'revokeSession', 'getAgent', 'getPackages',
    'searchSubscribers', 'getSubscriber', 'getSubscriberFormSchema', 'createSubscriber',
    'updateSubscriber', 'getSubscription', 'planRenewal', 'activateSubscription',
    'renewSubscription', 'getPackageChangeOptions', 'changePackage', 'suspendSubscriber',
    'resumeSubscriber', 'getCurrentSession', 'getSessionHistory', 'disconnectSession',
    'resetMac', 'getWalletBalance', 'getWalletTransactions', 'getTestAccountOptions',
    'createTestAccount', 'getSupportTickets', 'sendNotification', 'reconcileTransactions',
    'testConnection'
  ];

  var CAPABILITY_METHODS = {
    subscriberManagement: ['searchSubscribers', 'getSubscriber'],
    subscriberCreate: ['createSubscriber', 'getSubscriberFormSchema'],
    subscriberUpdate: ['updateSubscriber'],
    activation: ['activateSubscription'],
    renewal: ['renewSubscription', 'planRenewal'],
    packageChange: ['changePackage', 'getPackageChangeOptions'],
    suspend: ['suspendSubscriber'],
    resume: ['resumeSubscriber'],
    wallet: ['getWalletBalance'],
    walletTransactions: ['getWalletTransactions'],
    sessionMonitoring: ['getCurrentSession'],
    sessionHistory: ['getSessionHistory'],
    disconnectSession: ['disconnectSession'],
    macReset: ['resetMac'],
    testAccounts: ['createTestAccount', 'getTestAccountOptions'],
    tickets: ['getSupportTickets'],
    reconciliation: ['reconcileTransactions'],
    smsNotification: ['sendNotification'],
    whatsappNotification: ['sendNotification'],
    emailNotification: ['sendNotification']
  };

  function implementsMethod(adapter, method) {
    return typeof adapter[method] === 'function';
  }

  /**
   * @param strict عند التفعيل يبلّغ أيضاً عن دوال منفّذة بلا قدرة معلنة. ليست
   *        خطأً بذاتها، لكنها غالباً قدرةٌ نُسيت، فالفحوصات تعمل بالوضع الصارم.
   */
  function validateAdapter(adapter, manifest, strict) {
    var violations = [];

    REQUIRED_ADAPTER_METHODS.forEach(function (method) {
      if (typeof adapter[method] !== 'function') {
        violations.push({
          kind: 'missing_required_method',
          method: method,
          message: 'Adapter "' + adapter.key + '" does not implement required method ' + method + '().'
        });
      }
    });

    Object.keys(CAPABILITY_METHODS).forEach(function (capability) {
      var methods = CAPABILITY_METHODS[capability];
      var declared = Resolver.canPerform(manifest, capability);
      var missing = methods.filter(function (m) { return !implementsMethod(adapter, m); });

      if (declared && missing.length > 0) {
        violations.push({
          kind: 'capability_without_method',
          capability: capability,
          method: missing.join(', '),
          message: 'Adapter "' + adapter.key + '" declares "' + capability +
            '" as usable but does not implement ' +
            missing.map(function (m) { return m + '()'; }).join(', ') +
            '. Declare the capability unsupported, or implement the method.'
        });
      }

      if (strict && !declared && missing.length === 0 && methods.length > 0) {
        violations.push({
          kind: 'method_without_capability',
          capability: capability,
          method: methods.join(', '),
          message: 'Adapter "' + adapter.key + '" implements ' +
            methods.map(function (m) { return m + '()'; }).join(', ') +
            ' but does not declare "' + capability + '" as supported, so the UI will hide it.'
        });
      }
    });

    return violations;
  }

  /** أي دوال محوّل تقف خلف قدرة — يستخدمها التفصيل في مصفوفة القدرات (§20). */
  function methodsFor(capability) {
    return CAPABILITY_METHODS[capability] || [];
  }

  function assertValidAdapter(adapter, manifest) {
    var violations = validateAdapter(adapter, manifest);
    if (violations.length > 0) {
      throw new Error('Adapter contract violated:\n' +
        violations.map(function (v) { return '  - ' + v.message; }).join('\n'));
    }
  }

  return {
    REQUIRED_ADAPTER_METHODS: REQUIRED_ADAPTER_METHODS,
    OPTIONAL_ADAPTER_METHODS: OPTIONAL_ADAPTER_METHODS,
    implementsMethod: implementsMethod,
    validateAdapter: validateAdapter,
    methodsFor: methodsFor,
    assertValidAdapter: assertValidAdapter
  };
})();

/* ==========================================================================
   ١٣ — سجل المحوّلات (modules/isp/providers/core/registry.ts)
   تسجيل مزود جديد هو كامل سطح التكامل: ابنِ محوّلاً، أعلن قدراته، سجّله هنا.
   لا تتغير أي لوحة ولا ودجة ولا مكوّن مشتركين.
   ========================================================================== */
var AdapterRegistry = (function () {
  var factories = {};
  var instances = {};

  function registerAdapter(key, factory) {
    if (Object.prototype.hasOwnProperty.call(factories, key)) {
      throw new Error('Adapter "' + key + '" is already registered.');
    }
    factories[key] = factory;
  }

  function getAdapter(key) {
    if (instances[key]) return instances[key];
    var factory = factories[key];
    if (!factory) {
      throw new Error('Unknown adapter "' + key + '". Registered: ' +
        (Object.keys(factories).join(', ') || '(none)') + '.');
    }
    var adapter = factory();
    instances[key] = adapter;
    return adapter;
  }

  return {
    registerAdapter: registerAdapter,
    getAdapter: getAdapter,
    hasAdapter: function (key) { return Object.prototype.hasOwnProperty.call(factories, key); },
    registeredAdapterKeys: function () { return Object.keys(factories); },
    resetAdapterInstances: function () { instances = {}; },
    clearRegistry: function () { factories = {}; instances = {}; }
  };
})();
