<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="تجربة جهاز 24 — نظام إدارة تجارب الأجهزة داخل ERP مركز سفيان للهواتف">
<title>تجربة جهاز 24 🕰️ — Trial24</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>

<!-- ═══════ مكتبة الأيقونات (SVG داخلي — بلا اعتماديات خارجية) ═══════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18.5h2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9.5 12l1.8 1.8 3.4-3.6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 003.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H8a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V8a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M8 2v4a4 4 0 004 4 4 4 0 014 4v4M16 2v4a4 4 0 01-4 4 4 4 0 00-4 4v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 7h12l1 14H5z"/><path d="M9 10V6a3 3 0 016 0v4"/></symbol>
    <symbol id="i-return" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-extend" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2M8 3.5a10 10 0 018 0"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0114 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18 21a7 7 0 00-2-4.9"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow-back" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M3 21l1.6-4.4A8.5 8.5 0 1112 20.5a8.4 8.4 0 01-4.3-1.2z"/><path d="M9 9.5c.3 2.5 3 5.2 5.5 5.5.6.1 1.5-.6 1.5-1.3l-1.7-.9-1 1a6.6 6.6 0 01-2.6-2.6l1-1-.9-1.7c-.7 0-1.4.9-1.3 1.5z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7.5 4"/><path d="M3 3v4h4M12 8v4.5l3 1.5"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13l2.5 8v6H3v-6z"/></symbol>
  </defs>
</svg>

<div class="app">
  <!-- ═══════ الشريط الجانبي ═══════ -->
  <aside class="rail glass glass--liquid">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">🕰️</div>
      <div class="brand__text">
        <div class="brand__name">تجربة جهاز 24</div>
        <div class="brand__sub">مركز سفيان — ERP</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="التنقل الرئيسي">
      <button class="nav__item" data-route="dashboard"><svg class="icon"><use href="#i-dashboard"/></svg><span>لوحة المعلومات</span></button>
      <button class="nav__item" data-route="new"><svg class="icon"><use href="#i-plus"/></svg><span>تجربة جديدة</span></button>
      <button class="nav__item" data-route="devices"><svg class="icon"><use href="#i-device"/></svg><span>الأجهزة</span></button>
      <button class="nav__item" data-route="analytics" data-perm="analytics.view"><svg class="icon"><use href="#i-chart"/></svg><span>التحليلات</span></button>
      <button class="nav__item" data-route="audit" data-perm="audit.view"><svg class="icon"><use href="#i-shield"/></svg><span>سجل التدقيق</span></button>
      <button class="nav__item" data-route="settings" data-perm="settings.manage"><svg class="icon"><use href="#i-settings"/></svg><span>الإعدادات</span></button>
    </nav>

    <div class="rail__foot">
      <div class="clockchip" id="clockChip" data-state="sync" title="ساعة الخادم — كل المدد تُحسب منها">
        <span class="clockchip__dot"></span>
        <span class="clockchip__time" id="clockTime">--:--:--</span>
      </div>
      <button class="btn btn--sm" id="userBtn">
        <svg class="icon icon--sm"><use href="#i-user"/></svg>
        <span id="userName">…</span>
      </button>
    </div>
  </aside>

  <!-- ═══════ المحتوى ═══════ -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar__title" id="pageTitle">لوحة المعلومات</h1>
      <div class="topbar__spacer"></div>
      <button class="btn btn--icon btn--ghost" id="themeBtn" title="تبديل السمة" aria-label="تبديل السمة">
        <svg class="icon"><use href="#i-moon"/></svg>
      </button>
      <button class="btn btn--icon btn--ghost" id="bellBtn" title="الإشعارات" aria-label="الإشعارات" style="position:relative">
        <svg class="icon"><use href="#i-bell"/></svg>
        <span class="nav__badge" id="bellBadge" hidden style="position:absolute;top:-2px;inset-inline-end:-2px;margin:0"></span>
      </button>
      <button class="btn btn--primary btn--sm" id="newTrialBtn">
        <svg class="icon icon--sm"><use href="#i-plus"/></svg>
        <span>تجربة جديدة</span>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="stack">
        <div class="skeleton" style="height:120px"></div>
        <div class="skeleton" style="height:200px"></div>
      </div>
    </main>
  </div>
</div>

<div id="overlayRoot"></div>
<div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
