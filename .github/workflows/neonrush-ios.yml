# NEON RUSH 3D — Unity iOS build (Xcode project) → UNSIGNED IPA on macOS, for signing with ESign.
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   UNITY_LICENSE   contents of your Unity .ulf licence file (Unity Personal works)
#   UNITY_EMAIL     Unity account e-mail
#   UNITY_PASSWORD  Unity account password
# No signing secrets are used: the IPA is unsigned.
name: NeonRush iOS

on:
  workflow_dispatch:
  push:
    branches: [claude/ecstatic-planck-g7wzcy]
    paths:
      - 'NeonRush3D/**'
      - '.github/workflows/neonrush-ios.yml'

permissions:
  contents: read

concurrency:
  group: neonrush-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check Unity licence secrets
    runs-on: ubuntu-latest
    steps:
      - env:
          L: ${{ secrets.UNITY_LICENSE }}
          E: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$L" ] || missing="$missing UNITY_LICENSE"
          [ -n "$E" ] || missing="$missing UNITY_EMAIL"
          [ -n "$P" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — Unity cannot be activated, so the iOS build cannot run."
            exit 1
          fi
          echo "Unity licence secrets present."

  xcode:
    name: Unity iOS build → Xcode project
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: NeonRush3D/Library
          key: Library-NeonRush-iOS-${{ hashFiles('NeonRush3D/Packages/manifest.json', 'NeonRush3D/ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: NeonRush3D
          targetPlatform: iOS
          buildName: NeonRush
          buildsPath: build
          versioning: None
          buildMethod: NeonRush.EditorTools.NeonRushBuild.BuildIOSCommandLine
      - name: Verify iOS export (ProMotion, IL2CPP, ARM64, bundle id)
        run: |
          set -e
          X=build/iOS/NeonRush
          sudo chown -R "$(id -u)" "$X" NeonRush3D || true
          test -d "$X/Unity-iPhone.xcodeproj" && echo "OK  Xcode project"
          test -d "$X/Il2CppOutputProject" && echo "OK  IL2CPP"
          grep -A1 CADisableMinimumFrameDurationOnPhone "$X/Info.plist" | grep -q true && echo "OK  ProMotion (CADisableMinimumFrameDurationOnPhone)"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.sufyan.neonrush" "$X/Unity-iPhone.xcodeproj/project.pbxproj" && echo "OK  com.sufyan.neonrush"
          grep -q 'ARCHS = arm64' "$X/Unity-iPhone.xcodeproj/project.pbxproj" && echo "OK  arm64"
          grep -q "appleEnableProMotion: 1" NeonRush3D/ProjectSettings/ProjectSettings.asset && echo "OK  appleEnableProMotion: 1"
      - name: Pack Xcode project (keeps executable bits)
        run: tar -C build/iOS -czf NeonRush-Xcode.tar.gz NeonRush && ls -lh NeonRush-Xcode.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: neonrush-xcode
          path: NeonRush-Xcode.tar.gz

  ipa:
    name: Xcode archive → unsigned IPA (macOS)
    needs: xcode
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neonrush-xcode
          path: .
      - name: Unpack Xcode project
        run: mkdir -p xcode && tar -xzf NeonRush-Xcode.tar.gz -C xcode --strip-components=1
      - name: Build unsigned IPA
        run: |
          chmod +x NeonRush3D/BuildTools/make_ipa.sh
          sw_vers; xcodebuild -version
          NeonRush3D/BuildTools/make_ipa.sh "$GITHUB_WORKSPACE/xcode"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonRush-iOS-v1.0.0
          path: |
            NeonRush3D/Builds/iOS/NeonRush-iOS-v1.0.0.ipa
            NeonRush3D/Builds/iOS/work/*.log
