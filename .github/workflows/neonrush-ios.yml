# NEON RUSH 3D — tests, iOS Xcode export (Linux) and IPA (macOS).
# Manual trigger only. Required repository secrets (Settings › Secrets and variables › Actions):
#   UNITY_LICENSE   contents of your Unity .ulf licence file (Personal is fine)
#   UNITY_EMAIL     Unity account e-mail
#   UNITY_PASSWORD  Unity account password
# Optional signing secrets (otherwise an UNSIGNED IPA is produced, ready for ESign):
#   IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64, IOS_EXPORT_METHOD (ad-hoc | development | enterprise)
name: NeonRush iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: EditMode + PlayMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: NeonRush3D/Library
          key: Library-NeonRush-${{ hashFiles('NeonRush3D/Packages/manifest.json', 'NeonRush3D/ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: NeonRush3D
          testMode: all
          artifactsPath: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neonrush-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  xcode:
    name: Export iOS Xcode project
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: NeonRush3D/Library
          key: Library-NeonRush-iOS-${{ hashFiles('NeonRush3D/Packages/manifest.json', 'NeonRush3D/ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: NeonRush3D
          targetPlatform: iOS
          buildName: NeonRush
          buildsPath: build
          buildMethod: NeonRush.EditorTools.NeonRushBuild.BuildIOSCommandLine
      - uses: actions/upload-artifact@v4
        with:
          name: neonrush-xcode
          path: build/iOS/NeonRush

  ipa:
    name: Archive + IPA (macOS)
    needs: xcode
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neonrush-xcode
          path: xcode
      - name: Decode signing files (only if provided)
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ]; then
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
            echo "NR_P12_PATH=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"
            echo "NR_PROFILE_PATH=$RUNNER_TEMP/app.mobileprovision" >> "$GITHUB_ENV"
          fi
      - name: Build IPA
        env:
          NR_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          NR_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          chmod +x NeonRush3D/BuildTools/make_ipa.sh
          NeonRush3D/BuildTools/make_ipa.sh "$GITHUB_WORKSPACE/xcode"
      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/app.mobileprovision"
      - uses: actions/upload-artifact@v4
        with:
          name: NeonRush-iOS-v1.0.0
          path: NeonRush3D/Builds/iOS/NeonRush-iOS-v1.0.0.ipa
